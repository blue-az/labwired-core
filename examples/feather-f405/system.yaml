# LabWired - Feather-STM32F405 Example System Configuration
name: "feather-f405-example"
chip: "../../configs/chips/stm32f405.yaml"
external_devices: []
board_io:
  - id: "led2_pa5"
    kind: "led"
    peripheral: "gpioa"
    pin: 5
    signal: "output"
    active_high: true
  - id: "button_user_pc13"
    kind: "button"
    peripheral: "gpioc"
    pin: 13
    signal: "input"
    active_high: true
