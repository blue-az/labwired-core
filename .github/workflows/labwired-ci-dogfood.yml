name: LabWired CI ingest dogfood

on:
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/labwired-ci-dogfood.yml"
      - "examples/ci/dummy-max-steps.yaml"
      - "tests/fixtures/uart-ok-thumbv7m.elf"
      - "configs/systems/ci-fixture-uart1.yaml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  dogfood:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC claims
        run: |
          set -euo pipefail
          token="$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://api.labwired.com" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')"
          payload="$(echo "$token" | cut -d. -f2)"
          pad=$(( (4 - ${#payload} % 4) % 4 ))
          padded_payload="${payload}$(printf '=%.0s' $(seq 1 $pad 2>/dev/null))"
          python3 -c "import base64, json; claims = json.loads(base64.urlsafe_b64decode('$padded_payload')); [print(k, '=', claims.get(k)) for k in ('repository', 'repository_visibility', 'aud', 'ref', 'sha', 'job_workflow_ref')]"
          echo "--- raw POST to /v1/ci/runs ---"
          curl -s -o /tmp/ci_runs_resp.json -w "HTTP:%{http_code}\n" -X POST https://api.labwired.com/v1/ci/runs \
            -H "Content-Type: application/json" -H "Authorization: Bearer $token" \
            -d '{"status":"pass","tests_passed":1,"tests_failed":0,"cli_version":"debug"}'
          cat /tmp/ci_runs_resp.json

      - name: Run LabWired
        id: labwired
        uses: w1ne/labwired-action@main
        with:
          script: examples/ci/dummy-max-steps.yaml
          version: v0.19.2

      - name: Assert the run was actually ingested
        run: |
          set -euo pipefail
          echo "status=${{ steps.labwired.outputs.status }}"
          echo "report_url=${{ steps.labwired.outputs.report_url }}"
          if [ -z "${{ steps.labwired.outputs.report_url }}" ]; then
            echo "::error::report_url output is empty — the upload to LabWired did not land."
            exit 1
          fi
