  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SCL_LOW_PERIOD
    bit_range:
    - 8
    - 0
    description: This register is used to configure for how long SCL remains low in master mode, in I2C module clock cycles.
  side_effects: null
- id: CTR
  address_offset: 4
  size: 32
  access: READ_WRITE
  reset_value: 523
  fields:
  - name: SDA_FORCE_OUT
    bit_range:
    - 0
    - 0
    description: '0: direct output; 1: open drain output.'
  - name: SCL_FORCE_OUT
    bit_range:
    - 1
    - 1
    description: '0: direct output; 1: open drain output.'
  - name: SAMPLE_SCL_LEVEL
    bit_range:
    - 2
    - 2
    description: 'This register is used to select the sample mode. 1: sample SDA data on the SCL low level. 0: sample SDA data on the SCL high level.'
  - name: RX_FULL_ACK_LEVEL
    bit_range:
    - 3
    - 3
    description: This register is used to configure the ACK value that need to sent by master when the rx_fifo_cnt has reached the threshold.
  - name: MS_MODE
    bit_range:
    - 4
    - 4
    description: Set this bit to configure the module as an I2C Master. Clear this bit to configure the module as an I2C Slave.
  - name: TRANS_START
    bit_range:
    - 5
    - 5
    description: Set this bit to start sending the data in txfifo.
  - name: TX_LSB_FIRST
    bit_range:
    - 6
    - 6
    description: 'This bit is used to control the sending mode for data needing to be sent. 1: send data from the least significant bit; 0: send data from the most significant bit.'
  - name: RX_LSB_FIRST
    bit_range:
    - 7
    - 7
    description: 'This bit is used to control the storage mode for received data. 1: receive data from the least significant bit; 0: receive data from the most significant bit.'
  - name: CLK_EN
    bit_range:
    - 8
    - 8
    description: Reserved
  - name: ARBITRATION_EN
    bit_range:
    - 9
    - 9
    description: This is the enable bit for arbitration_lost.
  - name: FSM_RST
    bit_range:
    - 10
    - 10
    description: This register is used to reset the scl FMS.
  - name: CONF_UPGATE
    bit_range:
    - 11
    - 11
    description: synchronization bit
  - name: SLV_TX_AUTO_START_EN
    bit_range:
    - 12
    - 12
    description: This is the enable bit for slave to send data automatically
  - name: ADDR_10BIT_RW_CHECK_EN
    bit_range:
    - 13
    - 13
    description: This is the enable bit to check if the r/w bit of 10bit addressing consists with I2C protocol
  - name: ADDR_BROADCASTING_EN
    bit_range:
    - 14
    - 14
    description: This is the enable bit to support the 7bit general call function.
  side_effects: null
- id: SR
  address_offset: 8
  size: 32
  access: READ_WRITE
  reset_value: 49152
  fields:
  - name: RESP_REC
    bit_range:
    - 0
    - 0
    description: 'The received ACK value in master mode or slave mode. 0: ACK, 1: NACK.'
  - name: SLAVE_RW
    bit_range:
    - 1
    - 1
    description: 'When in slave mode, 1: master reads from slave; 0: master writes to slave.'
  - name: ARB_LOST
    bit_range:
    - 3
    - 3
    description: When the I2C controller loses control of SCL line, this register changes to 1.
  - name: BUS_BUSY
    bit_range:
    - 4
    - 4
    description: '1: the I2C bus is busy transferring data; 0: the I2C bus is in idle state.'
  - name: SLAVE_ADDRESSED
    bit_range:
    - 5
    - 5
    description: When configured as an I2C Slave, and the address sent by the master is equal to the address of the slave, then this bit will be of high level.
  - name: RXFIFO_CNT
    bit_range:
    - 13
    - 8
    description: This field represents the amount of data needed to be sent.
  - name: STRETCH_CAUSE
    bit_range:
    - 15
    - 14
    description: 'The cause of stretching SCL low in slave mode. 0:  stretching SCL low at the beginning of I2C read data state. 1: stretching SCL low when I2C Tx FIFO is empty in slave mode. 2: stretching SCL low when I2C Rx FIFO is full in slave mode.'
  - name: TXFIFO_CNT
    bit_range:
    - 23
    - 18
    description: This field stores the amount of received data in RAM.
  - name: SCL_MAIN_STATE_LAST
    bit_range:
    - 26
    - 24
    description: 'This field indicates the states of the I2C module state machine. 0: Idle; 1: Address shift; 2: ACK address; 3: Rx data; 4: Tx data; 5: Send ACK; 6: Wait ACK'
  - name: SCL_STATE_LAST
    bit_range:
    - 30
    - 28
    description: 'This field indicates the states of the state machine used to produce SCL. 0: Idle; 1: Start; 2: Negative edge; 3: Low; 4: Positive edge; 5: High; 6: Stop'
  side_effects: null
