peripheral: RCC
version: 0.1.0
registers:
- id: RCC_CR
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 99
  fields:
  - name: HSION
    bit_range:
    - 8
    - 8
    description: |-
      HSI16 clock enable
      Set and cleared by software.
      Cleared by hardware to stop the HSI16 oscillator when entering Stop, Standby or Shutdown mode.
      Set by hardware to force the HSI16 oscillator ON when STOPWUCK=1 or HSIASFS = 1 when leaving Stop modes, or in case of failure of the HSE crystal oscillator.
      This bit is set by hardware if the HSI16 is used directly or indirectly as system clock.
  - name: HSIKERON
    bit_range:
    - 9
    - 9
    description: |-
      HSI16 always enable for peripheral kernels.
      Set and cleared by software to force HSI16 ON even in Stop modes. The HSI16 can only feed USARTs and I<sup>2</sup>Cs peripherals configured with HSI16 as kernel clock. Keeping the HSI16 ON in Stop mode allows to avoid slowing down the communication speed because of the HSI16 startup time. This bit has no effect on HSION value.
  - name: HSIRDY
    bit_range:
    - 10
    - 10
    description: "HSI16 clock ready flag\nSet by hardware to indicate that HSI16 oscillator is stable. This bit is set only when HSI16 is enabled by software by setting HSION. \nNote: Once the HSION bit is cleared, HSIRDY goes low after 6 HSI16 clock cycles."
  - name: HSEON
    bit_range:
    - 16
    - 16
    description: |-
      HSE clock enable
      Set and cleared by software.
      Cleared by hardware to stop the HSE oscillator when entering Stop, Standby or Shutdown mode. This bit cannot be reset if the HSE oscillator is used directly or indirectly as the system clock.
  - name: HSERDY
    bit_range:
    - 17
    - 17
    description: "HSE clock ready flag\nSet by hardware to indicate that the HSE oscillator is stable. \nNote: Once the HSEON bit is cleared, HSERDY goes low after 6 HSE clock cycles."
  - name: HSEBYP
    bit_range:
    - 18
    - 18
    description: |-
      HSE crystal oscillator bypass
      Set and cleared by software to bypass the oscillator with an external clock. The external clock must be enabled with the HSEON bit set, to be used by the device. The HSEBYP bit can be written only if the HSE oscillator is disabled.
  - name: CSSON
    bit_range:
    - 19
    - 19
    description: |-
      Clock security system enable
      Set by software to enable the clock security system. When CSSON is set, the clock detector is enabled by hardware when the HSE oscillator is ready, and disabled by hardware if a HSE clock failure is detected. This bit is set only and is cleared by reset.
  - name: PLLON
    bit_range:
    - 24
    - 24
    description: |-
      Main PLL enable
      Set and cleared by software to enable the main PLL.
      Cleared by hardware when entering Stop, Standby or Shutdown mode. This bit cannot be reset if the PLL clock is used as the system clock.
  - name: PLLRDY
    bit_range:
    - 25
    - 25
    description: |-
      Main PLL clock ready flag
      Set by hardware to indicate that the main PLL is locked.
  side_effects: null
- id: RCC_ICSCR
  address_offset: 4
  size: 32
  access: READ_WRITE
  reset_value: 1073741824
  fields:
  - name: HSICAL
    bit_range:
    - 23
    - 16
    description: |-
      HSI16 clock calibration
      These bits are initialized at startup with the factory-programmed HSI16 calibration trim value. When HSITRIM is written, HSICAL is updated with the sum of HSITRIM and the factory trim value.
  - name: HSITRIM
    bit_range:
    - 30
    - 24
    description: |-
      HSI16 clock trimming
      These bits provide an additional user-programmable trimming value that is added to the HSICAL[7:0] bits. It can be programmed to adjust to variations in voltage and temperature that influence the frequency of the HSI16.
      The default value is 16, which, when added to the HSICAL value, should trim the HSI16 to 16 MHz � 1 %.
  side_effects: null
- id: RCC_CFGR
  address_offset: 8
  size: 32
  access: READ_WRITE
  reset_value: 5
  fields:
  - name: SW
    bit_range:
    - 1
    - 0
    description: |-
      System clock switch
      Set and cleared by software to select system clock source (SYSCLK).
      Configured by hardware to force HSI16 oscillator selection when exiting stop and standby modes or in case of failure of the HSE oscillator.
  - name: SWS
    bit_range:
    - 3
    - 2
    description: |-
      System clock switch status
      Set and cleared by hardware to indicate which clock source is used as system clock.
  - name: HPRE
    bit_range:
    - 7
    - 4
    description: |-
      AHB prescaler
      Set and cleared by software to control the division factor of the AHB clock.
      Note: Depending on the device voltage range, the software has to set correctly these bits to ensure that the system frequency does not exceed the maximum allowed frequency (for more details please refer to Section 6.1.5: Dynamic voltage scaling management). After a write operation to these bits and before decreasing the voltage range, this register must be read to be sure that the new value has been taken into account.
      0xxx: SYSCLK not divided
  - name: PPRE1
    bit_range:
    - 10
    - 8
    description: |-
      APB1 prescaler
      Set and cleared by software to control the division factor of the APB1 clock (PCLK1).
      0xx: HCLK not divided
  - name: PPRE2
    bit_range:
    - 13
    - 11
    description: |-
      APB2 prescaler
      Set and cleared by software to control the division factor of the APB2 clock (PCLK2).
      0xx: HCLK not divided
  - name: MCOSEL
    bit_range:
    - 27
    - 24
    description: "Microcontroller clock output \nSet and cleared by software.\nOthers: Reserved\nNote: This clock output may have some truncated cycles at startup or during MCO clock source switching."
  - name: MCOPRE
    bit_range:
    - 30
    - 28
    description: |-
      Microcontroller clock output prescaler
      These bits are set and cleared by software.
      It is highly recommended to change this prescaler before MCO output is enabled.
      Others: not allowed
  side_effects: null
- id: RCC_PLLCFGR
  address_offset: 12
  size: 32
  access: READ_WRITE
  reset_value: 4096
  fields:
  - name: PLLSRC
    bit_range:
    - 1
    - 0
    description: |-
      Main PLL entry clock source
      Set and cleared by software to select PLL clock source. These bits can be written only when PLL is disabled.
      In order to save power, when no PLL is used, the value of PLLSRC should be 00.
  - name: PLLM
    bit_range:
    - 7
    - 4
    description: |-
      Division factor for the main PLL input clock
      Set and cleared by software to divide the PLL input clock before the VCO. These bits can be written only when all PLLs are disabled.
      VCO input frequency = PLL input clock frequency / PLLM with 1 <= PLLM <= 16
      ...
      Note: The software has to set these bits correctly to ensure that the VCO input frequency is within the range defined in the device datasheet.
  - name: PLLN
    bit_range:
    - 14
    - 8
    description: "Main PLL multiplication factor for VCO\nSet and cleared by software to control the multiplication factor of the VCO. These bits can be written only when the PLL is disabled. \nVCO output frequency = VCO input frequency x PLLN with 8 =< PLLN =< 127\n...\n...\nNote: The software has to set correctly these bits to assure that the VCO output frequency is within the range defined in the device datasheet."
  - name: PLLPEN
    bit_range:
    - 16
    - 16
    description: |-
      Main PLL PLL “P” clock output enable
      Set and reset by software to enable the PLL “P” clock output of the PLL.
      In order to save power, when the PLL “P” clock output of the PLL is not used, the value of PLLPEN should be 0.
  - name: PLLP
    bit_range:
    - 17
    - 17
    description: |-
      Main PLL division factor for PLL “P” clock.
      Set and cleared by software to control the frequency of the main PLL output clock PLL “P” clock. These bits can be written only if PLL is disabled.
      When the PLLPDIV[4:0] is set to “00000”PLL “P” output clock frequency = VCO frequency / PLLP with PLLP =7, or 17
      Note: The software has to set these bits correctly not to exceed 170 MHz on this domain.
  - name: PLLQEN
    bit_range:
    - 20
    - 20
    description: |-
      Main PLL “Q” clock output enable
      Set and reset by software to enable the PLL “Q” clock output of the PLL.
      In order to save power, when the PLL “Q” clock output of the PLL is not used, the value of PLLQEN should be 0.
  - name: PLLQ
    bit_range:
    - 22
    - 21
    description: |-
      Main PLL division factor for PLL “Q” clock.
      Set and cleared by software to control the frequency of the main PLL output clock PLL “Q” clock. This output can be selected for USB, RNG, SAI (48 MHz clock). These bits can be written only if PLL is disabled.
      PLL “Q” output clock frequency = VCO frequency / PLLQ with PLLQ = 2, 4, 6, or 8
      Note: The software has to set these bits correctly not to exceed 170 MHz on this domain.
  - name: PLLREN
    bit_range:
    - 24
    - 24
    description: |-
      PLL “R” clock output enable
      Set and reset by software to enable the PLL “R” clock output of the PLL (used as system clock).
      This bit cannot be written when PLL “R” clock output of the PLL is used as System Clock.
      In order to save power, when the PLL “R” clock output of the PLL is not used, the value of PLLREN should be 0.
  - name: PLLR
    bit_range:
    - 26
    - 25
    description: |-
      Main PLL division factor for PLL “R” clock (system clock)
      Set and cleared by software to control the frequency of the main PLL output clock PLLCLK. This output can be selected as system clock. These bits can be written only if PLL is disabled.
      PLL “R” output clock frequency = VCO frequency / PLLR with PLLR = 2, 4, 6, or 8
      Note: The software has to set these bits correctly not to exceed 170 MHz on this domain.
  - name: PLLPDIV
    bit_range:
    - 31
    - 27
    description: |-
      Main PLLP division factor
      Set and cleared by software to control the PLL “P” frequency. PLL “P” output clock frequency = VCO frequency / PLLPDIV.
      ....
  side_effects: null
- id: RCC_CIER
  address_offset: 24
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LSIRDYIE
    bit_range:
    - 0
    - 0
    description: |-
      LSI ready interrupt enable
      Set and cleared by software to enable/disable interrupt caused by the LSI oscillator stabilization.
  - name: LSERDYIE
    bit_range:
    - 1
    - 1
    description: |-
      LSE ready interrupt enable
      Set and cleared by software to enable/disable interrupt caused by the LSE oscillator stabilization.
  - name: HSIRDYIE
    bit_range:
    - 3
    - 3
    description: |-
      HSI16 ready interrupt enable
      Set and cleared by software to enable/disable interrupt caused by the HSI16 oscillator stabilization.
  - name: HSERDYIE
    bit_range:
    - 4
    - 4
    description: |-
      HSE ready interrupt enable
      Set and cleared by software to enable/disable interrupt caused by the HSE oscillator stabilization.
  - name: PLLRDYIE
    bit_range:
    - 5
    - 5
    description: |-
      PLL ready interrupt enable
      Set and cleared by software to enable/disable interrupt caused by PLL lock.
  - name: LSECSSIE
    bit_range:
    - 9
    - 9
    description: |-
      LSE clock security system interrupt enable
      Set and cleared by software to enable/disable interrupt caused by the clock security system on LSE.
  - name: HSI48RDYIE
    bit_range:
    - 10
    - 10
    description: "HSI48 ready interrupt enable \nSet and cleared by software to enable/disable interrupt caused by the internal HSI48 oscillator."
  side_effects: null
- id: RCC_CIFR
  address_offset: 28
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LSIRDYF
    bit_range:
    - 0
    - 0
    description: |-
      LSI ready interrupt flag
      Set by hardware when the LSI clock becomes stable and LSIRDYDIE is set.
      Cleared by software setting the LSIRDYC bit.
  - name: LSERDYF
    bit_range:
    - 1
    - 1
    description: |-
      LSE ready interrupt flag
      Set by hardware when the LSE clock becomes stable and LSERDYDIE is set.
      Cleared by software setting the LSERDYC bit.
  - name: HSIRDYF
    bit_range:
    - 3
    - 3
    description: |-
      HSI16 ready interrupt flag
      Set by hardware when the HSI16 clock becomes stable and HSIRDYDIE is set in a response to setting the HSION (refer to Clock control register (RCC_CR)). When HSION is not set but the HSI16 oscillator is enabled by the peripheral through a clock request, this bit is not set and no interrupt is generated.
      Cleared by software setting the HSIRDYC bit.
  - name: HSERDYF
    bit_range:
    - 4
    - 4
    description: |-
      HSE ready interrupt flag
      Set by hardware when the HSE clock becomes stable and HSERDYDIE is set.
      Cleared by software setting the HSERDYC bit.
  - name: PLLRDYF
    bit_range:
    - 5
    - 5
    description: |-
      PLL ready interrupt flag
      Set by hardware when the PLL locks and PLLRDYDIE is set.
      Cleared by software setting the PLLRDYC bit.
  - name: CSSF
    bit_range:
    - 8
    - 8
    description: |-
      Clock security system interrupt flag
      Set by hardware when a failure is detected in the HSE oscillator.
      Cleared by software setting the CSSC bit.
  - name: LSECSSF
    bit_range:
    - 9
    - 9
    description: |-
      LSE Clock security system interrupt flag
      Set by hardware when a failure is detected in the LSE oscillator.
      Cleared by software setting the LSECSSC bit.
  - name: HSI48RDYF
    bit_range:
    - 10
    - 10
    description: "HSI48 ready interrupt flag \nSet by hardware when the HSI48 clock becomes stable and HSI48RDYIE is set in a response to setting the HSI48ON (refer to Clock recovery RC register (RCC_CRRCR)). \nCleared by software setting the HSI48RDYC bit."
  side_effects: null
- id: RCC_CICR
  address_offset: 32
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LSIRDYC
    bit_range:
    - 0
    - 0
    description: |-
      LSI ready interrupt clear
      This bit is set by software to clear the LSIRDYF flag.
  - name: LSERDYC
    bit_range:
    - 1
    - 1
    description: |-
      LSE ready interrupt clear
      This bit is set by software to clear the LSERDYF flag.
  - name: HSIRDYC
    bit_range:
    - 3
    - 3
    description: |-
      HSI16 ready interrupt clear
      This bit is set software to clear the HSIRDYF flag.
  - name: HSERDYC
    bit_range:
    - 4
    - 4
    description: |-
      HSE ready interrupt clear
      This bit is set by software to clear the HSERDYF flag.
  - name: PLLRDYC
    bit_range:
    - 5
    - 5
    description: |-
      PLL ready interrupt clear
      This bit is set by software to clear the PLLRDYF flag.
  - name: CSSC
    bit_range:
    - 8
    - 8
    description: |-
      Clock security system interrupt clear
      This bit is set by software to clear the CSSF flag.
  - name: LSECSSC
    bit_range:
    - 9
    - 9
    description: |-
      LSE Clock security system interrupt clear
      This bit is set by software to clear the LSECSSF flag.
  - name: HSI48RDYC
    bit_range:
    - 10
    - 10
    description: "HSI48 oscillator ready interrupt clear \nThis bit is set by software to clear the HSI48RDYF flag."
  side_effects: null
