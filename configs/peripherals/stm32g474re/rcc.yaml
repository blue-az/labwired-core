- id: RCC_BDCR
  address_offset: 144
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LSEON
    bit_range:
    - 0
    - 0
    description: |-
      LSE oscillator enable
      Set and cleared by software.
  - name: LSERDY
    bit_range:
    - 1
    - 1
    description: |-
      LSE oscillator ready
      Set and cleared by hardware to indicate when the external 32 kHz oscillator is stable. After the LSEON bit is cleared, LSERDY goes low after 6 external low-speed oscillator clock cycles.
  - name: LSEBYP
    bit_range:
    - 2
    - 2
    description: |-
      LSE oscillator bypass
      Set and cleared by software to bypass oscillator in debug mode. This bit can be written only when the external 32 kHz oscillator is disabled (LSEON=0 and LSERDY=0).
  - name: LSEDRV
    bit_range:
    - 4
    - 3
    description: "LSE oscillator drive capability\nSet by software to modulate the LSE oscillator’s drive capability. \nThe oscillator is in Xtal mode when it is not in bypass mode."
  - name: LSECSSON
    bit_range:
    - 5
    - 5
    description: |-
      CSS on LSE enable
      Set by software to enable the Clock Security System on LSE (32 kHz oscillator).
      LSECSSON must be enabled after the LSE oscillator is enabled (LSEON bit enabled) and ready (LSERDY flag set by hardware), and after the RTCSEL bit is selected.
      Once enabled this bit cannot be disabled, except after a LSE failure detection (LSECSSD
      =1). In that case the software MUST disable the LSECSSON bit.
  - name: LSECSSD
    bit_range:
    - 6
    - 6
    description: |-
      CSS on LSE failure Detection
      Set by hardware to indicate when a failure has been detected by the Clock Security System
      on the external 32 kHz oscillator (LSE).
  - name: RTCSEL
    bit_range:
    - 9
    - 8
    description: |-
      RTC clock source selection
      Set by software to select the clock source for the RTC. Once the RTC clock source has been selected, it cannot be changed anymore unless the RTC domain is reset, or unless a failure is detected on LSE (LSECSSD is set). The BDRST bit can be used to reset them.
  - name: RTCEN
    bit_range:
    - 15
    - 15
    description: |-
      RTC clock enable
      Set and cleared by software.
  - name: BDRST
    bit_range:
    - 16
    - 16
    description: |-
      RTC domain software reset
      Set and cleared by software.
  - name: LSCOEN
    bit_range:
    - 24
    - 24
    description: |-
      Low speed clock output enable
      Set and cleared by software.
  - name: LSCOSEL
    bit_range:
    - 25
    - 25
    description: |-
      Low speed clock output selection
      Set and cleared by software.
  side_effects: null
- id: RCC_CSR
  address_offset: 148
  size: 32
  access: READ_WRITE
  reset_value: 201326592
  fields:
  - name: LSION
    bit_range:
    - 0
    - 0
    description: |-
      LSI oscillator enable
      Set and cleared by software.
  - name: LSIRDY
    bit_range:
    - 1
    - 1
    description: |-
      LSI oscillator ready
      Set and cleared by hardware to indicate when the LSI oscillator is stable. After the LSION bit is cleared, LSIRDY goes low after 3 LSI oscillator clock cycles. This bit can be set even if LSION = 0 if the LSI is requested by the Clock Security System on LSE, by the Independent Watchdog or by the RTC.
  - name: RMVF
    bit_range:
    - 23
    - 23
    description: |-
      Remove reset flag
      Set by software to clear the reset flags.
  - name: OBLRSTF
    bit_range:
    - 25
    - 25
    description: |-
      Option byte loader reset flag
      Set by hardware when a reset from the Option Byte loading occurs.
      Cleared by writing to the RMVF bit.
  - name: PINRSTF
    bit_range:
    - 26
    - 26
    description: |-
      Pin reset flag
      Set by hardware when a reset from the NRST pin occurs.
      Cleared by writing to the RMVF bit.
  - name: BORRSTF
    bit_range:
    - 27
    - 27
    description: |-
      BOR flag
      Set by hardware when a BOR occurs.
      Cleared by writing to the RMVF bit.
  - name: SFTRSTF
    bit_range:
    - 28
    - 28
    description: |-
      Software reset flag
      Set by hardware when a software reset occurs.
      Cleared by writing to the RMVF bit.
  - name: IWDGRSTF
    bit_range:
    - 29
    - 29
    description: |-
      Independent window watchdog reset flag
      Set by hardware when an independent watchdog reset domain occurs.
      Cleared by writing to the RMVF bit.
  - name: WWDGRSTF
    bit_range:
    - 30
    - 30
    description: |-
      Window watchdog reset flag
      Set by hardware when a window watchdog reset occurs.
      Cleared by writing to the RMVF bit.
  - name: LPWRRSTF
    bit_range:
    - 31
    - 31
    description: |-
      Low-power reset flag
      Set by hardware when a reset occurs due to illegal Stop, Standby or Shutdown mode entry.
      Cleared by writing to the RMVF bit.
