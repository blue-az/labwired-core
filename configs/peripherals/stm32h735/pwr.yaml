  - name: WKUPPUPD1
    bit_range:
    - 17
    - 16
    description: |-
      Wakeup pin pull
                    configuration
  - name: WKUPPUPD2
    bit_range:
    - 19
    - 18
    description: |-
      Wakeup pin pull
                    configuration
  - name: WKUPPUPD3
    bit_range:
    - 21
    - 20
    description: |-
      Wakeup pin pull
                    configuration
  - name: WKUPPUPD4
    bit_range:
    - 23
    - 22
    description: |-
      Wakeup pin pull
                    configuration
  - name: WKUPPUPD5
    bit_range:
    - 25
    - 24
    description: |-
      Wakeup pin pull
                    configuration
  - name: WKUPPUPD6
    bit_range:
    - 27
    - 26
    description: |-
      Wakeup pin pull configuration for
                    WKUP(truncate(n/2)-7) These bits define the I/O pad
                    pull configuration used when WKUPEN(truncate(n/2)-7)
                    = 1. The associated GPIO port pull configuration
                    shall be set to the same value or to 00. The Wakeup
                    pin pull configuration is kept in Standby
                    mode.
