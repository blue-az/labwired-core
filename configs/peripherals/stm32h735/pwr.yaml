                    pin.
  - name: WKUPP3
    bit_range:
    - 10
    - 10
    description: |-
      Wakeup pin polarity bit for WKUPn-7
                    These bits define the polarity used for event
                    detection on WKUPn-7 external wakeup
                    pin.
  - name: WKUPP4
    bit_range:
    - 11
    - 11
    description: |-
      Wakeup pin polarity bit for WKUPn-7
                    These bits define the polarity used for event
                    detection on WKUPn-7 external wakeup
                    pin.
  - name: WKUPP5
    bit_range:
    - 12
    - 12
    description: |-
      Wakeup pin polarity bit for WKUPn-7
                    These bits define the polarity used for event
