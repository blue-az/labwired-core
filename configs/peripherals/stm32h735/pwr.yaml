  - name: WKUPF3
    bit_range:
    - 2
    - 2
    description: |-
      Wakeup pin WKUPF flag. This bit is set
                    by hardware and cleared only by a Reset pin or by
                    setting the WKUPCn+1 bit in the PWR wakeup clear
