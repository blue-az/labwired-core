peripheral: SDHOST
version: 0.1.0
registers:
- id: CTRL
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: CONTROLLER_RESET
    bit_range:
    - 0
    - 0
    description: To reset controller, firmware should set this bit. This bit is auto-cleared after two AHB and two sdhost_cclk_in clock cycles.
  - name: FIFO_RESET
    bit_range:
    - 1
    - 1
    description: 'To reset FIFO, firmware should set bit to 1. This bit is auto-cleared after completion of reset operation. Note: FIFO pointers will be out of reset after 2 cycles of system clocks in addition to synchronization delay (2 cycles of card clock), after the fifo_reset is cleared.'
  - name: DMA_RESET
    bit_range:
    - 2
    - 2
    description: To reset DMA interface, firmware should set bit to 1. This bit is auto-cleared after two AHB clocks.
  - name: INT_ENABLE
    bit_range:
    - 4
    - 4
    description: 'Global interrupt enable/disable bit. 0: Disable; 1: Enable.'
  - name: READ_WAIT
    bit_range:
    - 6
    - 6
    description: For sending read-wait to SDIO cards.
  - name: SEND_IRQ_RESPONSE
    bit_range:
    - 7
    - 7
    description: Bit automatically clears once response is sent. To wait for MMC card interrupts, host issues CMD40 and waits for interrupt response from MMC card(s). In the meantime, if host wants SD/MMC to exit waiting for interrupt state, it can set this bit, at which time SD/MMC command state-machine sends CMD40 response on bus and returns to idle state.
  - name: ABORT_READ_DATA
    bit_range:
    - 8
    - 8
    description: After a suspend-command is issued during a read-operation, software polls the card to find when the suspend-event occurred. Once the suspend-event has occurred, software sets the bit which will reset the data state machine that is waiting for the next block of data. This bit is automatically cleared once the data state machine is reset to idle.
  - name: SEND_CCSD
    bit_range:
    - 9
    - 9
    description: 'When set, SD/MMC sends CCSD to the CE-ATA device. Software sets this bit only if the current command is expecting CCS (that is, RW_BLK), and if interrupts are enabled for the CE-ATA device. Once the CCSD pattern is sent to the device, SD/MMC automatically clears the SDHOST_SEND_CCSD bit. It also sets the Command Done (CD) bit  in the SDHOST_RINTSTS_REG register, and generates an interrupt for the host, in case the Command Done interrupt is not masked. NOTE: Once the SDHOST_SEND_CCSD bit is set, it takes two card clock cycles to drive the CCSD on the CMD line. Due to this, within the boundary conditions the CCSD may be sent to the CE-ATA device, even if the device has signalled CCS.'
  - name: SEND_AUTO_STOP_CCSD
    bit_range:
    - 10
    - 10
    description: Always Set SDHOST_SEND_AUTO_STOP_CCSD and SDHOST_SEND_CCSD bits together; SDHOST_SEND_AUTO_STOP_CCSD should not be set independently of send_ccsd. When set, SD/MMC automatically sends an internally-generated STOP command (CMD12) to the CE-ATA device. After sending this internally-generated STOP command, the Auto Command Done (ACD) bit in SDHOST_RINTSTS_REG is set and an interrupt is generated for the host, in case the ACD interrupt is not masked. After sending the Command Completion Signal Disable (CCSD), SD/MMC automatically clears the  SDHOST_SEND_AUTO_STOP_CCSD bit.
  - name: CEATA_DEVICE_INTERRUPT_STATUS
    bit_range:
    - 11
    - 11
    description: Software should appropriately write to this bit after the power-on reset or any other reset to the CE-ATA device. After reset, the CE-ATA device's interrupt is usually disabled (nIEN = 1). If the host enables the CE-ATA device's interrupt, then software should set this bit.
  side_effects: null
- id: CLKDIV
  address_offset: 8
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: CLK_DIVIDER0
    bit_range:
    - 7
    - 0
    description: Clock divider0 value. Clock divisor is 2*n, where n = 0 bypasses the divider (divisor of 1). For example, a value of 1 means divided by 2*1 = 2, a value of 0xFF means divided by 2*255 = 510, and so on.
  - name: CLK_DIVIDER1
    bit_range:
    - 15
    - 8
    description: Clock divider1 value. Clock divisor is 2*n, where n = 0 bypasses the divider (divisor of 1). For example, a value of 1 means divided by 2*1 = 2, a value of 0xFF means divided by 2*255 = 510, and so on.
  - name: CLK_DIVIDER2
    bit_range:
    - 23
    - 16
    description: Clock divider2 value. Clock divisor is 2*n, where n = 0 bypasses the divider (divisor of 1). For example, a value of 1 means divided by 2*1 = 2, a value of 0xFF means divided by 2*255 = 510, and so on.
  - name: CLK_DIVIDER3
    bit_range:
    - 31
    - 24
    description: Clock divider3 value. Clock divisor is 2*n, where n = 0 bypasses the divider (divisor of 1). For example, a value of 1 means divided by 2*1 = 2, a value of 0xFF means divided by 2*255 = 510, and so on.
  side_effects: null
- id: CLKSRC
  address_offset: 12
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: CLKSRC
    bit_range:
    - 3
    - 0
    description: 'Clock divider source for two SD cards is supported. Each card has two bits assigned to it. For example, bit[1:0] are assigned for card 0, bit[3:2] are assigned for card 1. Card 0 maps and internally routes clock divider[0:3] outputs to cclk_out[1:0] pins, depending on bit value. 00 : Clock divider 0; 01 : Clock divider 1; 10 : Clock divider 2; 11 : Clock divider 3.'
  side_effects: null
- id: CLKENA
  address_offset: 16
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: CCLK_ENABLE
    bit_range:
    - 1
    - 0
    description: 'Clock-enable control for two SD card clocks and one MMC card clock is supported. One bit per card. 0: Clock disabled; 1: Clock enabled.'
  - name: LP_ENABLE
    bit_range:
    - 17
    - 16
    description: 'Disable clock when the card is in IDLE state. One bit per card. 0: clock disabled; 1: clock enabled.'
  side_effects: null
- id: TMOUT
  address_offset: 20
  size: 32
  access: READ_WRITE
  reset_value: 4294967104
  fields:
  - name: RESPONSE_TIMEOUT
    bit_range:
    - 7
    - 0
    description: Response timeout value. Value is specified in terms of number of card output clocks, i.e., sdhost_cclk_out.
  - name: DATA_TIMEOUT
    bit_range:
    - 31
    - 8
    description: 'Value for card data read timeout. This value is also used for data starvation by host timeout. The timeout counter is started only after the card clock is stopped. This value is specified in number of card output clocks, i.e. sdhost_cclk_out of the selected card. NOTE: The software timer should be used if the timeout value is in the order of 100 ms. In this case, read data timeout interrupt needs to be disabled.'
  side_effects: null
- id: CTYPE
  address_offset: 24
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: CARD_WIDTH4
    bit_range:
    - 1
    - 0
    description: 'One bit per card indicates if card is 1-bit or 4-bit mode. 0: 1-bit mode; 1: 4-bit mode. Bit[1:0] correspond to card[1:0] respectively.'
  - name: CARD_WIDTH8
    bit_range:
    - 17
    - 16
    description: 'One bit per card indicates if card is in 8-bit mode. 0: Non 8-bit mode; 1: 8-bit mode. Bit[17:16] correspond to card[1:0] respectively.'
  side_effects: null
- id: BLKSIZ
  address_offset: 28
  size: 32
  access: READ_WRITE
  reset_value: 512
  fields:
  - name: BLOCK_SIZE
    bit_range:
    - 15
    - 0
    description: Block size.
  side_effects: null
- id: BYTCNT
  address_offset: 32
  size: 32
  access: READ_WRITE
  reset_value: 512
  fields:
  - name: BYTE_COUNT
    bit_range:
    - 31
    - 0
    description: Number of bytes to be transferred, should be an integral multiple of Block Size for block transfers. For data transfers of undefined byte lengths, byte count should be set to 0. When byte count is set to 0, it is the responsibility of host to explicitly send stop/abort command to terminate data transfer.
  side_effects: null
- id: INTMASK
  address_offset: 36
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: INT_MASK
    bit_range:
    - 15
    - 0
    description: 'These bits used to mask unwanted interrupts. A value of 0 masks interrupt, and a value of 1 enables the interrupt. Bit 15 (EBE): End-bit error/no CRC error; Bit 14 (ACD): Auto command done; Bit 13 (SBE/BCI): Rx Start Bit Error; Bit 12 (HLE): Hardware locked write error; Bit 11 (FRUN): FIFO underrun/overrun error; Bit 10 (HTO): Data starvation-by-host timeout; Bit 9 (DRTO): Data read timeout; Bit 8 (RTO): Response timeout; Bit 7 (DCRC): Data CRC error; Bit 6 (RCRC): Response CRC error; Bit 5 (RXDR): Receive FIFO data request; Bit 4 (TXDR): Transmit FIFO data request; Bit 3 (DTO): Data transfer over; Bit 2 (CD): Command done; Bit 1 (RE): Response error; Bit 0 (CD): Card detect.'
  - name: SDIO_INT_MASK
    bit_range:
    - 17
    - 16
    description: SDIO interrupt mask, one bit for each card. Bit[17:16] correspond to card[15:0] respectively. When masked, SDIO interrupt detection for that card is disabled. 0 masks an interrupt, and 1 enables an interrupt.
  side_effects: null
- id: CMDARG
  address_offset: 40
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: CMDARG
    bit_range:
    - 31
    - 0
    description: Value indicates command argument to be passed to the card.
  side_effects: null
- id: CMD
  address_offset: 44
  size: 32
  access: READ_WRITE
  reset_value: 536870912
  fields:
  - name: INDEX
    bit_range:
    - 5
    - 0
    description: Command index.
  - name: RESPONSE_EXPECT
    bit_range:
    - 6
    - 6
    description: '0: No response expected from card; 1: Response expected from card.'
  - name: RESPONSE_LENGTH
    bit_range:
    - 7
    - 7
    description: '0: Short response expected from card; 1: Long response expected from card.'
  - name: CHECK_RESPONSE_CRC
    bit_range:
    - 8
    - 8
    description: '0: Do not check; 1: Check response CRC. Some of command responses do not return valid CRC bits. Software should disable CRC checks for those commands in order to disable CRC checking by controller.'
  - name: DATA_EXPECTED
    bit_range:
    - 9
    - 9
    description: '0: No data transfer expected; 1: Data transfer expected.'
  - name: READ_WRITE
    bit_range:
    - 10
    - 10
    description: '0: Read from card; 1: Write to card. Don''t care if no data is expected from card.'
  - name: TRANSFER_MODE
    bit_range:
    - 11
    - 11
    description: 'Block data transfer command; 1: Stream data transfer command. Don''t care if no data expected.'
  - name: SEND_AUTO_STOP
    bit_range:
    - 12
    - 12
    description: '0: No stop command is sent at the end of data transfer; 1: Send stop command at the end of data transfer.'
  - name: WAIT_PRVDATA_COMPLETE
    bit_range:
    - 13
    - 13
    description: '0: Send command at once, even if previous data transfer has not completed; 1: Wait for previous data transfer to complete before sending Command. The SDHOST_WAIT_PRVDATA_COMPLETE] = 0 option is typically used to query status of card during data transfer or to stop current data transfer. SDHOST_CARD_NUMBERr should be same as in previous command.'
  - name: STOP_ABORT_CMD
    bit_range:
    - 14
    - 14
    description: '0: Neither stop nor abort command can stop current data transfer. If abort is sent to function-number currently selected or not in data-transfer mode, then bit should be set to 0; 1: Stop or abort command intended to stop current data transfer in progress. When open-ended or predefined data transfer is in progress, and host issues stop or abort command to stop data transfer, bit should be set so that command/data state-machines of CIU can return correctly to idle state.'
  - name: SEND_INITIALIZATION
    bit_range:
    - 15
    - 15
    description: '0: Do not send initialization sequence (80 clocks of 1) before sending this command; 1: Send initialization sequence before sending this command. After powered on, 80 clocks must be sent to card for initialization before sending any commands to card. Bit should be set while sending first command to card so that controller will initialize clocks before sending command to card.'
  - name: CARD_NUMBER
    bit_range:
    - 20
    - 16
    description: Card number in use. Represents physical slot number of card being accessed. In SD-only mode, up to two cards are supported.
  - name: UPDATE_CLOCK_REGISTERS_ONLY
    bit_range:
    - 21
    - 21
    description: '0: Normal command sequence; 1: Do not send commands, just update clock register value into card clock domain. Following register values are transferred into card clock domain: CLKDIV, CLRSRC, and CLKENA. Changes card clocks (change frequency, truncate off or on, and set low-frequency mode). This is provided in order to change clock frequency or stop clock without having to send command to cards. During normal command sequence, when sdhost_update_clock_registers_only = 0, following control registers are transferred from BIU to CIU: CMD, CMDARG, TMOUT, CTYPE, BLKSIZ, and BYTCNT. CIU uses new register values for new command sequence to card(s). When bit is set, there are no Command Done interrupts because no command is sent to SD_MMC_CEATA cards.'
  - name: READ_CEATA_DEVICE
    bit_range:
    - 22
    - 22
    description: 'Read access flag. 0: Host is not performing read access (RW_REG or RW_BLK)towards CE-ATA device; 1: Host is performing read access (RW_REG or RW_BLK) towards CE-ATA device. Software should set this bit to indicate that CE-ATA device is being accessed for read transfer. This bit is used to disable read data timeout indication while performing CE-ATA read transfers. Maximum value of I/O transmission delay can be no less than 10 seconds. SD/MMC should not indicate read data timeout while waiting for data from CE-ATA device.'
  - name: CCS_EXPECTED
    bit_range:
    - 23
    - 23
    description: 'Expected Command Completion Signal (CCS) configuration. 0: Interrupts are not enabled in CE-ATA device (nIEN = 1 in ATA control register), or command does not expect CCS from device; 1: Interrupts are enabled in CE-ATA device (nIEN = 0), and RW_BLK command expects command completion signal from CE-ATA device. If the command expects Command Completion Signal (CCS) from the CE-ATA device, the software should set this control bit. SD/MMC sets Data Transfer Over (DTO) bit in RINTSTS register and generates interrupt to host if Data Transfer Over interrupt is not masked.'
  - name: USE_HOLE
    bit_range:
    - 29
    - 29
    description: 'Use Hold Register. 0: CMD and DATA sent to card bypassing HOLD Register; 1: CMD and DATA sent to card through the HOLD Register.'
  - name: START_CMD
    bit_range:
    - 31
    - 31
    description: Start command. Once command is served by the CIU, this bit is automatically cleared. When this bit is set, host should not attempt to write to any command registers. If a write is attempted, hardware lock error is set in raw interrupt register. Once command is sent and a response is received from SD_MMC_CEATA cards, Command Done bit is set in the raw interrupt Register.
  side_effects: null
