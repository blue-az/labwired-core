    - 0
    description: 'Hardware reset. 1: Active mode; 0: Reset. These bits cause the cards to enter pre-idle state, which requires them to be re-initialized. SDHOST_RST_CARD_RESET[0] should be set to 1''b0 to reset card0, SDHOST_RST_CARD_RESET[1] should be set to 1''b0 to reset card1.'
