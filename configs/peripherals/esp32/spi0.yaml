  - name: USR_MOSI_HIGHPART
    bit_range:
    - 25
    - 25
    description: 'write-data phase only access to high-part of the buffer spi_w8~spi_w15. 1: enable 0: disable.'
  - name: USR_DUMMY_IDLE
    bit_range:
