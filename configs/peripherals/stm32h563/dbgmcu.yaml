  reset_value: 65539
  fields:
  - name: AP_PRESENT
    bit_range:
    - 15
    - 0
    description: "Bit n identifies whether access port AP n is present in device \nBit n = 0: APn absent \nBit n = 1: APn present"
  - name: AP_ENABLED
    bit_range:
    - 31
    - 16
    description: "Bit n identifies whether access port AP n is open (can be accessed via the debug port) or locked (debug access to the AP is blocked) \nBit n = 0: APn locked\nBit n = 1: APn enabled"
  side_effects: null
