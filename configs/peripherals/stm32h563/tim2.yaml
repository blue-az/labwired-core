peripheral: TIM2
version: 0.1.0
registers:
- id: TIM2_CR1
  address_offset: 0
  size: 16
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: CEN
    bit_range:
    - 0
    - 0
    description: |-
      Counter enable
      Note: External clock, gated mode and encoder mode can work only if the CEN bit has been previously set by software. However trigger mode can set the CEN bit automatically by hardware.
      CEN is cleared automatically in one-pulse mode, when an update event occurs.
  - name: UDIS
    bit_range:
    - 1
    - 1
    description: |-
      Update disable
      This bit is set and cleared by software to enable/disable UEV event generation.
      Counter overflow/underflow
      Setting the UG bit
      Update generation through the slave mode controller
      Buffered registers are then loaded with their preload values.
  - name: URS
    bit_range:
    - 2
    - 2
    description: |-
      Update request source
      This bit is set and cleared by software to select the UEV event sources.
      Counter overflow/underflow
      Setting the UG bit
      Update generation through the slave mode controller
  - name: OPM
    bit_range:
    - 3
    - 3
    description: One-pulse mode
  - name: DIR
    bit_range:
    - 4
    - 4
    description: |-
      Direction
      Note: This bit is read only when the timer is configured in Center-aligned mode or Encoder mode.
  - name: CMS
    bit_range:
    - 6
    - 5
    description: |-
      Center-aligned mode selection
      Note: It is not allowed to switch from edge-aligned mode to center-aligned mode as long as the counter is enabled (CEN=1)
  - name: ARPE
    bit_range:
    - 7
    - 7
    description: Auto-reload preload enable
  - name: CKD
    bit_range:
    - 9
    - 8
    description: |-
      Clock division
      This bit-field indicates the division ratio between the timer clock (tim_ker_ck) frequency and sampling clock used by the digital filters (tim_etr_in, tim_tix),
  - name: UIFREMAP
    bit_range:
    - 11
    - 11
    description: UIF status bit remapping
  - name: DITHEN
    bit_range:
    - 12
    - 12
    description: |-
      Dithering Enable
      Note: The DITHEN bit can only be modified when CEN bit is reset.
  side_effects: null
- id: TIM2_CR2
  address_offset: 4
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: CCDS
    bit_range:
    - 3
    - 3
    description: Capture/compare DMA selection
  - name: MMS1
    bit_range:
    - 6
    - 4
    description: |-
      Master mode selection
      These bits allow to select the information to be sent in master mode to slave timers for synchronization (tim_trgo). The combination is as follows:
      tim_trgo, except if the master/slave mode is selected (see the MSM bit description in TIMx_SMCR register).
      Others: Reserved
      Note: The clock of the slave timer or ADC must be enabled prior to receive events from the master timer, and must not be changed on-the-fly while triggers are received from the master timer.
  - name: TI1S
    bit_range:
    - 7
    - 7
    description: tim_ti1 selection
  - name: MMS2
    bit_range:
    - 25
    - 25
    description: |-
      Master mode selection
      These bits allow to select the information to be sent in master mode to slave timers for synchronization (tim_trgo). The combination is as follows:
      tim_trgo, except if the master/slave mode is selected (see the MSM bit description in TIMx_SMCR register).
      Others: Reserved
      Note: The clock of the slave timer or ADC must be enabled prior to receive events from the master timer, and must not be changed on-the-fly while triggers are received from the master timer.
  side_effects: null
- id: TIM2_SMCR
  address_offset: 8
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SMS
    bit_range:
    - 2
    - 0
    description: |-
      Slave mode selection
      When external signals are selected the active edge of the trigger signal (tim_trgi) is linked to the polarity selected on the external input (see Input Control register and Control Register description.
      Note: The gated mode must not be used if tim_ti1f_ed is selected as the trigger input (TS=00100). Indeed, tim_ti1f_ed outputs 1 pulse for each transition on tim_ti1f, whereas the gated mode checks the level of the trigger signal.
      Note: The clock of the slave peripherals (timer, ADC, ...) receiving the tim_trgo signal must be enabled prior to receive events from the master timer, and the clock frequency (prescaler) must not be changed on-the-fly while triggers are received from the master timer.
  - name: OCCS
    bit_range:
    - 3
    - 3
    description: |-
      OCREF clear selection
      This bit is used to select the OCREF clear source
      Note: If the OCREF clear selection feature is not supported, this bit is reserved and forced by hardware to '0'. .
  - name: TS
    bit_range:
    - 6
    - 4
    description: |-
      Trigger selection (see bits 21:20 for TS[4:3])
      This bit-field selects the trigger input to be used to synchronize the counter.
      Others: Reserved
      See  for product specific implementation details.
      Note: These bits must be changed only when they are not used (e.g. when SMS=000) to avoid wrong edge detections at the transition.
  - name: MSM
    bit_range:
    - 7
    - 7
    description: Master/Slave mode
  - name: ETF
    bit_range:
    - 11
    - 8
    description: |-
      External trigger filter
      This bit-field then defines the frequency used to sample tim_etrp signal and the length of the digital filter applied to tim_etrp. The digital filter is made of an event counter in which N consecutive events are needed to validate a transition on the output:
  - name: ETPS
    bit_range:
    - 13
    - 12
    description: |-
      External trigger prescaler
      External trigger signal tim_etrp frequency must be at most 1/4 of tim_ker_ck frequency. A prescaler can be enabled to reduce tim_etrp frequency. It is useful when inputting fast external clocks on tim_etr_in.
  - name: ECE
    bit_range:
    - 14
    - 14
    description: |-
      External clock enable
      This bit enables External clock mode 2.
      Note: Setting the ECE bit has the same effect as selecting external clock mode 1 with tim_trgi connected to tim_etrf (SMS=111 and TS=00111).
      It is possible to simultaneously use external clock mode 2 with the following slave modes: reset mode, gated mode and trigger mode. Nevertheless, tim_trgi must not be connected to tim_etrf in this case (TS bits must not be 00111).
      If external clock mode 1 and external clock mode 2 are enabled at the same time, the external clock input is tim_etrf.
  - name: ETP
    bit_range:
    - 15
    - 15
    description: |-
      External trigger polarity
      This bit selects whether tim_etr_in or tim_etr_in is used for trigger operations
  - name: SMS_2
    bit_range:
    - 16
    - 16
    description: |-
      Slave mode selection
      When external signals are selected the active edge of the trigger signal (tim_trgi) is linked to the polarity selected on the external input (see Input Control register and Control Register description.
      Note: The gated mode must not be used if tim_ti1f_ed is selected as the trigger input (TS=00100). Indeed, tim_ti1f_ed outputs 1 pulse for each transition on tim_ti1f, whereas the gated mode checks the level of the trigger signal.
      Note: The clock of the slave peripherals (timer, ADC, ...) receiving the tim_trgo signal must be enabled prior to receive events from the master timer, and the clock frequency (prescaler) must not be changed on-the-fly while triggers are received from the master timer.
  - name: TS_2
    bit_range:
    - 21
    - 20
    description: |-
      Trigger selection (see bits 21:20 for TS[4:3])
      This bit-field selects the trigger input to be used to synchronize the counter.
      Others: Reserved
      See  for product specific implementation details.
      Note: These bits must be changed only when they are not used (e.g. when SMS=000) to avoid wrong edge detections at the transition.
  - name: SMSPE
    bit_range:
    - 24
    - 24
    description: |-
      SMS preload enable
      This bit selects whether the SMS[3:0] bitfield is preloaded
  - name: SMSPS
    bit_range:
    - 25
    - 25
    description: |-
      SMS preload source
      This bit selects whether the events that triggers the SMS[3:0] bitfield transfer from preload to active
  side_effects: null
- id: TIM2_DIER
  address_offset: 12
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: UIE
    bit_range:
    - 0
    - 0
    description: Update interrupt enable
  - name: CC1IE
    bit_range:
    - 1
    - 1
    description: Capture/Compare 1 interrupt enable
  - name: CC2IE
    bit_range:
    - 2
    - 2
    description: Capture/Compare 2 interrupt enable
  - name: CC3IE
    bit_range:
    - 3
    - 3
    description: Capture/Compare 3 interrupt enable
  - name: CC4IE
    bit_range:
    - 4
    - 4
    description: Capture/Compare 4 interrupt enable
  - name: TIE
    bit_range:
    - 6
    - 6
    description: Trigger interrupt enable
  - name: UDE
    bit_range:
    - 8
    - 8
    description: Update DMA request enable
  - name: CC1DE
    bit_range:
    - 9
    - 9
    description: Capture/Compare 1 DMA request enable
  - name: CC2DE
    bit_range:
    - 10
    - 10
    description: Capture/Compare 2 DMA request enable
  - name: CC3DE
    bit_range:
    - 11
    - 11
    description: Capture/Compare 3 DMA request enable
  - name: CC4DE
    bit_range:
    - 12
    - 12
    description: Capture/Compare 4 DMA request enable
  - name: TDE
    bit_range:
    - 14
    - 14
    description: Trigger DMA request enable
  - name: IDXIE
    bit_range:
    - 20
    - 20
    description: Index interrupt enable
  - name: DIRIE
    bit_range:
    - 21
    - 21
    description: Direction change interrupt enable
  - name: IERRIE
    bit_range:
    - 22
    - 22
    description: Index error interrupt enable
  - name: TERRIE
    bit_range:
    - 23
    - 23
    description: Transition error interrupt enable
  side_effects: null
- id: TIM2_SR
  address_offset: 16
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: UIF
    bit_range:
    - 0
    - 0
    description: |-
      Update interrupt flag
      This bit is set by hardware on an update event. It is cleared by software.
      At overflow or underflow and if UDIS=0 in the TIMx_CR1 register.
      When CNT is reinitialized by software using the UG bit in TIMx_EGR register, if URS=0 and UDIS=0 in the TIMx_CR1 register.
      When CNT is reinitialized by a trigger event (refer to the synchro control register description), if URS=0 and UDIS=0 in the TIMx_CR1 register.
  - name: CC1IF
    bit_range:
    - 1
    - 1
    description: |-
      Capture/compare 1 interrupt flag
      This flag is set by hardware. It is cleared by software (input capture or output compare mode) or by reading the TIMx_CCR1 register (input capture mode only).
      If channel CC1 is configured as output: this flag is set when the content of the counter TIMx_CNT matches the content of the TIMx_CCR1 register. When the content of TIMx_CCR1 is greater than the content of TIMx_ARR, the CC1IF bit goes high on the counter overflow (in up-counting and up/down-counting modes) or underflow (in downcounting mode). There are 3 possible options for flag setting in center-aligned mode, refer to the CMS bits in the TIMx_CR1 register for the full description.
      If channel CC1 is configured as input: this bit is set when counter value has been captured in TIMx_CCR1 register (an edge has been detected on IC1, as per the edge sensitivity defined with the CC1P and CC1NP bits setting, in TIMx_CCER).
  - name: CC2IF
    bit_range:
    - 2
    - 2
    description: |-
      Capture/Compare 2 interrupt flag
      Refer to CC1IF description
  - name: CC3IF
    bit_range:
    - 3
    - 3
    description: |-
      Capture/Compare 3 interrupt flag
      Refer to CC1IF description
  - name: CC4IF
    bit_range:
    - 4
    - 4
    description: |-
      Capture/Compare 4 interrupt flag
      Refer to CC1IF description
  - name: TIF
    bit_range:
    - 6
    - 6
    description: |-
      Trigger interrupt flag
      This flag is set by hardware on the TRG trigger event (active edge detected on tim_trgi input when the slave mode controller is enabled in all modes but gated mode. It is set when the counter starts or stops when gated mode is selected. It is cleared by software.
  - name: CC1OF
    bit_range:
    - 9
    - 9
    description: |-
      Capture/Compare 1 overcapture flag
      This flag is set by hardware only when the corresponding channel is configured in input capture mode. It is cleared by software by writing it to '0'.
  - name: CC2OF
    bit_range:
    - 10
    - 10
    description: |-
      Capture/compare 2 overcapture flag
      refer to CC1OF description
  - name: CC3OF
    bit_range:
    - 11
    - 11
    description: |-
      Capture/Compare 3 overcapture flag
      refer to CC1OF description
  - name: CC4OF
    bit_range:
    - 12
    - 12
    description: |-
      Capture/Compare 4 overcapture flag
      refer to CC1OF description
  - name: IDXF
    bit_range:
    - 20
    - 20
    description: |-
      Index interrupt flag
      This flag is set by hardware when an index event is detected. It is cleared by software by
      writing it to '0'.
  - name: DIRF
    bit_range:
    - 21
    - 21
    description: |-
      Direction change interrupt flag
      This flag is set by hardware when the direction changes in encoder mode (DIR bit value in
      TIMx_CR is changing). It is cleared by software by writing it to '0'.
  - name: IERRF
    bit_range:
    - 22
    - 22
    description: |-
      Index error interrupt flag
      This flag is set by hardware when an index error is detected. It is cleared by software by
      writing it to '0'.
  - name: TERRF
    bit_range:
    - 23
    - 23
    description: |-
      Transition error interrupt flag
      This flag is set by hardware when a transition error is detected in encoder mode. It is cleared
      by software by writing it to '0'.
  side_effects: null
- id: TIM2_EGR
  address_offset: 20
  size: 16
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: UG
    bit_range:
    - 0
    - 0
    description: |-
      Update generation
      This bit can be set by software, it is automatically cleared by hardware.
  - name: CC1G
    bit_range:
    - 1
    - 1
    description: |-
      Capture/compare 1 generation
      This bit is set by software in order to generate an event, it is automatically cleared by hardware.
      If channel CC1 is configured as output:
      CC1IF flag is set, Corresponding interrupt or DMA request is sent if enabled.
      If channel CC1 is configured as input:
      The current value of the counter is captured in TIMx_CCR1 register. The CC1IF flag is set, the corresponding interrupt or DMA request is sent if enabled. The CC1OF flag is set if the CC1IF flag was already high.
  - name: CC2G
    bit_range:
    - 2
    - 2
    description: |-
      Capture/compare 2 generation
      Refer to CC1G description
  - name: CC3G
    bit_range:
    - 3
    - 3
    description: |-
      Capture/compare 3 generation
      Refer to CC1G description
  - name: CC4G
    bit_range:
    - 4
    - 4
    description: |-
      Capture/compare 4 generation
      Refer to CC1G description
  - name: TG
    bit_range:
    - 6
    - 6
    description: |-
      Trigger generation
      This bit is set by software in order to generate an event, it is automatically cleared by hardware.
  side_effects: null
- id: TIM2_CCMR1_Input
  address_offset: 24
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: CC1S
    bit_range:
    - 1
    - 0
    description: |-
      Capture/Compare 1 selection
      This bit-field defines the direction of the channel (input/output) as well as the used input.
      Note: CC1S bits are writable only when the channel is OFF (CC1E = 0 in TIMx_CCER).
  - name: IC1PSC
    bit_range:
    - 3
    - 2
    description: |-
      Input capture 1 prescaler
      This bit-field defines the ratio of the prescaler acting on CC1 input (tim_ic1). The prescaler is reset as soon as CC1E=0 (TIMx_CCER register).
  - name: IC1F
    bit_range:
    - 7
    - 4
    description: |-
      Input capture 1 filter
      This bit-field defines the frequency used to sample tim_ti1 input and the length of the digital filter applied to tim_ti1. The digital filter is made of an event counter in which N consecutive events are needed to validate a transition on the output:
  - name: CC2S
    bit_range:
    - 9
    - 8
    description: |-
      Capture/compare 2 selection
      This bit-field defines the direction of the channel (input/output) as well as the used input.
      Note: CC2S bits are writable only when the channel is OFF (CC2E = 0 in TIMx_CCER).
  - name: IC2PSC
    bit_range:
    - 11
    - 10
    description: Input capture 2 prescaler
  - name: IC2F
    bit_range:
    - 15
    - 12
    description: Input capture 2 filter
  side_effects: null
- id: TIM2_CCMR1_Output
  address_offset: 24
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: CC1S
    bit_range:
    - 1
    - 0
    description: |-
      Capture/Compare 1 selection
      This bit-field defines the direction of the channel (input/output) as well as the used input.
      Note: CC1S bits are writable only when the channel is OFF (CC1E = 0 in TIMx_CCER).
  - name: OC1FE
    bit_range:
    - 2
    - 2
    description: |-
      Output compare 1 fast enable
      This bit decreases the latency between a trigger event and a transition on the timer output. It must be used in one-pulse mode (OPM bit set in TIMx_CR1 register), to have the output pulse starting as soon as possible after the starting trigger.
  - name: OC1PE
    bit_range:
    - 3
    - 3
    description: |-
      Output compare 1 preload enable
      Note: The PWM mode can be used without validating the preload register only in one-pulse mode (OPM bit set in TIMx_CR1 register). Else the behavior is not guaranteed.
  - name: OC1M1
    bit_range:
    - 6
    - 4
    description: |-
      Output compare 1 mode
      These bits define the behavior of the output reference signal tim_oc1ref from which tim_oc1 is derived. tim_oc1ref is active high whereas tim_oc1 active level depends on CC1P bit.
      Note: In PWM mode, the tim_ocref_clr level changes only when the result of the comparison changes or when the output compare mode switches from 'frozen' mode to 'PWM' mode.
  - name: OC1CE
    bit_range:
    - 7
    - 7
    description: Output compare 1 clear enable
  - name: CC2S
    bit_range:
    - 9
    - 8
    description: |-
      Capture/Compare 2 selection
      This bit-field defines the direction of the channel (input/output) as well as the used input.
      Note: CC2S bits are writable only when the channel is OFF (CC2E = 0 in TIMx_CCER).
  - name: OC2FE
    bit_range:
    - 10
    - 10
    description: Output compare 2 fast enable
  - name: OC2PE
    bit_range:
    - 11
    - 11
    description: Output compare 2 preload enable
  - name: OC2M1
    bit_range:
    - 14
    - 12
    description: |-
      Output compare 2 mode
      refer to OC1M description on bits 6:4
  - name: OC2CE
    bit_range:
    - 15
    - 15
    description: Output compare 2 clear enable
  - name: OC1M2
    bit_range:
    - 16
    - 16
    description: |-
      Output compare 1 mode
      These bits define the behavior of the output reference signal tim_oc1ref from which tim_oc1 is derived. tim_oc1ref is active high whereas tim_oc1 active level depends on CC1P bit.
      Note: In PWM mode, the tim_ocref_clr level changes only when the result of the comparison changes or when the output compare mode switches from 'frozen' mode to 'PWM' mode.
  - name: OC2M2
    bit_range:
    - 24
    - 24
    description: |-
      Output compare 2 mode
      refer to OC1M description on bits 6:4
  side_effects: null
