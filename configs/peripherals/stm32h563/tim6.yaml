peripheral: TIM6
version: 0.1.0
registers:
- id: TIM6_CR1
  address_offset: 0
  size: 16
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: CEN
    bit_range:
    - 0
    - 0
    description: |-
      Counter enable
      CEN is cleared automatically in one-pulse mode, when an update event occurs.
  - name: UDIS
    bit_range:
    - 1
    - 1
    description: |-
      Update disable
      This bit is set and cleared by software to enable/disable UEV event generation.
      Counter overflow/underflow
      Setting the UG bit
      Update generation through the slave mode controller
      Buffered registers are then loaded with their preload values.
  - name: URS
    bit_range:
    - 2
    - 2
    description: |-
      Update request source
      This bit is set and cleared by software to select the UEV event sources.
      Counter overflow/underflow
      Setting the UG bit
      Update generation through the slave mode controller
  - name: OPM
    bit_range:
    - 3
    - 3
    description: One-pulse mode
  - name: ARPE
    bit_range:
    - 7
    - 7
    description: Auto-reload preload enable
  - name: UIFREMAP
    bit_range:
    - 11
    - 11
    description: UIF status bit remapping
  - name: DITHEN
    bit_range:
    - 12
    - 12
    description: |-
      Dithering enable
      Note: The DITHEN bit can only be modified when CEN bit is reset.
  side_effects: null
- id: TIM6_CR2
  address_offset: 4
  size: 16
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: MMS
    bit_range:
    - 6
    - 4
    description: |-
      Master mode selection
      These bits are used to select the information to be sent in master mode to slave timers for synchronization (TRGO). The combination is as follows:
      Note: The clock of the slave timer or he peripheral receiving the tim_trgo must be enabled prior to receive events from the master timer, and must not be changed on-the-fly while triggers are received from the master timer.
  side_effects: null
- id: TIM6_DIER
  address_offset: 12
  size: 16
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: UIE
    bit_range:
    - 0
    - 0
    description: Update interrupt enable
  - name: UDE
    bit_range:
    - 8
    - 8
    description: Update DMA request enable
  side_effects: null
- id: TIM6_SR
  address_offset: 16
  size: 16
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: UIF
    bit_range:
    - 0
    - 0
    description: |-
      Update interrupt flag
      This bit is set by hardware on an update event. It is cleared by software.
      On counter overflow if UDIS = 0 in the TIMx_CR1 register.
      When CNT is reinitialized by software using the UG bit in the TIMx_EGR register, if URS = 0 and UDIS = 0 in the TIMx_CR1 register.
  side_effects: null
- id: TIM6_EGR
  address_offset: 20
  size: 16
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: UG
    bit_range:
    - 0
    - 0
    description: |-
      Update generation
      This bit can be set by software, it is automatically cleared by hardware.
  side_effects: null
- id: TIM6_CNT
  address_offset: 36
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: CNT
    bit_range:
    - 15
    - 0
    description: |-
      Counter value
      Non-dithering mode (DITHEN = 0)
      The register holds the counter value.
      Dithering mode (DITHEN = 1)
      The register only holds the non-dithered part in CNT[15:0]. The fractional part is not available.
  - name: UIFCPY
    bit_range:
    - 31
    - 31
    description: |-
      UIF copy
      This bit is a read-only copy of the UIF bit of the TIMx_ISR register. If the UIFREMAP bit in TIMx_CR1 is reset, bit 31 is reserved and read as 0.
  side_effects: null
- id: TIM6_PSC
  address_offset: 40
  size: 16
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: PSC
    bit_range:
    - 15
    - 0
    description: |-
      Prescaler value
      The counter clock frequency ftim_cnt_ck is equal to ftim_psc_ck / (PSC[15:0] + 1).
      PSC contains the value to be loaded into the active prescaler register at each update event.
      (including when the counter is cleared through UG bit of TIMx_EGR register.
  side_effects: null
- id: TIM6_ARR
  address_offset: 44
  size: 32
  access: READ_WRITE
  reset_value: 65535
  fields:
  - name: ARR
    bit_range:
    - 19
    - 0
    description: |-
      Auto-reload value
      ARR is the value to be loaded into the actual auto-reload register.
      Refer to  for more details about ARR update and behavior.
      The counter is blocked while the auto-reload value is null.
      Non-dithering mode (DITHEN = 0)
      The register holds the auto-reload value in ARR[15:0]. The ARR[19:16] bits are reserved.
      Dithering mode (DITHEN = 1)
      The register holds the integer part in ARR[19:4]. The ARR[3:0] bitfield contains the dithered part.
  side_effects: null
interrupts:
  TIM6: 49
timing: null
