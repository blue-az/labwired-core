- id: USART_CR2
  address_offset: 4
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SLVEN
    bit_range:
    - 0
    - 0
    description: |-
      Synchronous Slave mode enable
      When the SLVEN bit is set, the Synchronous slave mode is enabled.
      Note: When SPI slave mode is not supported, this bit is reserved and must be kept at reset value. Refer to .
  - name: DIS_NSS
    bit_range:
    - 3
    - 3
    description: |-
      When the DIS_NSS bit is set, the NSS pin input is ignored.
      Note: When SPI slave mode is not supported, this bit is reserved and must be kept at reset value. Refer to .
  - name: ADDM7
    bit_range:
    - 4
    - 4
    description: |-
      7-bit Address Detection/4-bit Address Detection
      This bit is for selection between 4-bit address detection or 7-bit address detection.
      This bit can only be written when the USART is disabled (UE=0)
      Note: In 7-bit and 9-bit data modes, the address detection is done on 6-bit and 8-bit address (ADD[5:0] and ADD[7:0]) respectively.
  - name: LBDL
    bit_range:
    - 5
    - 5
    description: |-
      LIN break detection length
      This bit is for selection between 11 bit or 10 bit break detection.
      This bit can only be written when the USART is disabled (UE=0).
      Note: If LIN mode is not supported, this bit is reserved and must be kept at reset value. Refer to .
  - name: LBDIE
    bit_range:
    - 6
    - 6
    description: |-
      LIN break detection interrupt enable
      Break interrupt mask (break detection using break delimiter).
      Note: If LIN mode is not supported, this bit is reserved and must be kept at reset value. Refer to .
  - name: LBCL
    bit_range:
    - 8
    - 8
    description: |-
      Last bit clock pulse
      This bit is used to select whether the clock pulse associated with the last data bit transmitted (MSB) has to be output on the SCLK pin in Synchronous mode.
      The last bit is the 7th or 8th or 9th data bit transmitted depending on the 7 or 8 or 9 bit format selected by the M bit in the USART_CR1 register.
      This bit can only be written when the USART is disabled (UE=0).
      Note: If Synchronous mode is not supported, this bit is reserved and must be kept at reset value. Refer to .
  - name: CPHA
    bit_range:
    - 9
    - 9
    description: |-
      Clock phase
      This bit is used to select the phase of the clock output on the SCLK pin in Synchronous mode. It works in conjunction with the CPOL bit to produce the desired clock/data relationship (see  and )
      This bit can only be written when the USART is disabled (UE=0).
      Note: If Synchronous mode is not supported, this bit is reserved and must be kept at reset value. Refer to .
  - name: CPOL
    bit_range:
    - 10
    - 10
    description: |-
      Clock polarity
      This bit enables the user to select the polarity of the clock output on the SCLK pin in Synchronous mode. It works in conjunction with the CPHA bit to produce the desired clock/data relationship
      This bit can only be written when the USART is disabled (UE=0).
      Note: If Synchronous mode is not supported, this bit is reserved and must be kept at reset value. Refer to .
  - name: CLKEN
    bit_range:
    - 11
    - 11
    description: |-
      Clock enable
      This bit enables the user to enable the SCLK pin.
      This bit can only be written when the USART is disabled (UE=0).
      Note: If neither Synchronous mode nor Smartcard mode is supported, this bit is reserved and must be kept at reset value. Refer to .
      In Smartcard mode, in order to provide correctly the SCLK clock to the smartcard, the steps below must be respected:
      UE = 0
      SCEN = 1
      GTPR configuration
      CLKEN= 1
      UE = 1
  - name: STOP
    bit_range:
    - 13
    - 12
    description: |-
      stop bits
      These bits are used for programming the stop bits.
      This bitfield can only be written when the USART is disabled (UE=0).
  - name: LINEN
    bit_range:
    - 14
    - 14
    description: |-
      LIN mode enable
      This bit is set and cleared by software.
      The LIN mode enables the capability to send LIN synchronous breaks (13 low bits) using the SBKRQ bit in the USART_CR1 register, and to detect LIN Sync breaks.
      This bitfield can only be written when the USART is disabled (UE=0).
      Note: If the USART does not support LIN mode, this bit is reserved and must be kept at reset value. Refer to .
  - name: SWAP
    bit_range:
    - 15
    - 15
    description: |-
      Swap TX/RX pins
      This bit is set and cleared by software.
      This bitfield can only be written when the USART is disabled (UE=0).
  - name: RXINV
    bit_range:
    - 16
    - 16
    description: |-
      RX pin active level inversion
      This bit is set and cleared by software.
      This enables the use of an external inverter on the RX line.
      This bitfield can only be written when the USART is disabled (UE=0).
  - name: TXINV
    bit_range:
    - 17
    - 17
    description: |-
      TX pin active level inversion
      This bit is set and cleared by software.
      This enables the use of an external inverter on the TX line.
      This bitfield can only be written when the USART is disabled (UE=0).
  - name: DATAINV
    bit_range:
    - 18
    - 18
    description: |-
      Binary data inversion
      This bit is set and cleared by software.
      This bitfield can only be written when the USART is disabled (UE=0).
  - name: MSBFIRST
    bit_range:
    - 19
    - 19
    description: |-
      Most significant bit first
      This bit is set and cleared by software.
      This bitfield can only be written when the USART is disabled (UE=0).
  - name: ABREN
    bit_range:
    - 20
    - 20
    description: |-
      Auto baud rate enable
      This bit is set and cleared by software.
      Note: If the USART does not support the auto baud rate feature, this bit is reserved and must be kept at reset value. Refer to .
  - name: ABRMOD
    bit_range:
    - 22
    - 21
    description: |-
      Auto baud rate mode
      These bits are set and cleared by software.
      This bitfield can only be written when ABREN = 0 or the USART is disabled (UE=0).
      Note: If DATAINV=1 and/or MSBFIRST=1 the patterns must be the same on the line, for example 0xAA for MSBFIRST)
      If the USART does not support the auto baud rate feature, this bit is reserved and must be kept at reset value. Refer to .
  - name: RTOEN
    bit_range:
    - 23
    - 23
    description: |-
      Receiver timeout enable
      This bit is set and cleared by software.
      When this feature is enabled, the RTOF flag in the USART_ISR register is set if the RX line is idle (no reception) for the duration programmed in the RTOR (receiver timeout register).
      Note: If the USART does not support the Receiver timeout feature, this bit is reserved and must be kept at reset value. Refer to .
  - name: ADD
    bit_range:
    - 31
    - 24
    description: |-
      Address of the USART node
      These bits give the address of the USART node in Mute mode or a character code to be recognized in low-power or Run mode:
      In Mute mode: they are used in multiprocessor communication to wakeup from Mute mode with 4-bit/7-bit address mark detection. The MSB of the character sent by the transmitter should be equal to 1. In 4-bit address mark detection, only ADD[3:0] bits are used.
      In low-power mode: they are used for wake up from low-power mode on character match.
      When WUS[1:0] is programmed to 0b00 (WUF active on address match), the wakeup from low-power mode is performed when the received character corresponds to the character programmed through ADD[6:0] or ADD[3:0] bitfield (depending on ADDM7 bit), and WUF interrupt is enabled by setting WUFIE bit. The MSB of the character sent by transmitter should be equal to 1.
      In Run mode with Mute mode inactive (for example, end-of-block detection in ModBus protocol): the whole received character (8 bits) is compared to ADD[7:0] value and CMF flag is set on match. An interrupt is generated if the CMIE bit is set.
      These bits can only be written when the reception is disabled (RE = 0) or when the USART is disabled (UE = 0).
  side_effects: null
- id: USART_CR3
  address_offset: 8
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: EIE
    bit_range:
    - 0
    - 0
    description: |-
      Error interrupt enable
      Error Interrupt Enable Bit is required to enable interrupt generation in case of a framing error, overrun error noise flag or SPI slave underrun error (FE=1 or ORE=1 or NE=1or UDR = 1 in the USART_ISR register).
  - name: IREN
    bit_range:
    - 1
    - 1
    description: |-
      IrDA mode enable
      This bit is set and cleared by software.
      This bit can only be written when the USART is disabled (UE=0).
      Note: If IrDA mode is not supported, this bit is reserved and must be kept at reset value. Refer to .
  - name: IRLP
    bit_range:
    - 2
    - 2
    description: |-
      IrDA low-power
      This bit is used for selecting between normal and low-power IrDA modes
      This bit can only be written when the USART is disabled (UE=0).
      Note: If IrDA mode is not supported, this bit is reserved and must be kept at reset value. Refer to .
  - name: HDSEL
    bit_range:
    - 3
    - 3
    description: |-
      Half-duplex selection
      Selection of Single-wire Half-duplex mode
      This bit can only be written when the USART is disabled (UE=0).
  - name: NACK
    bit_range:
    - 4
    - 4
    description: |-
      Smartcard NACK enable
      This bitfield can only be written when the USART is disabled (UE=0).
      Note: If the USART does not support Smartcard mode, this bit is reserved and must be kept at reset value. Refer to .
  - name: SCEN
    bit_range:
    - 5
    - 5
    description: |-
      Smartcard mode enable
      This bit is used for enabling Smartcard mode.
      This bitfield can only be written when the USART is disabled (UE=0).
      Note: If the USART does not support Smartcard mode, this bit is reserved and must be kept at reset value. Refer to .
  - name: DMAR
    bit_range:
    - 6
    - 6
    description: |-
      DMA enable receiver
      This bit is set/reset by software
  - name: DMAT
    bit_range:
    - 7
    - 7
    description: |-
      DMA enable transmitter
      This bit is set/reset by software
  - name: RTSE
    bit_range:
    - 8
    - 8
    description: |-
      RTS enable
      This bit can only be written when the USART is disabled (UE=0).
      Note: If the hardware flow control feature is not supported, this bit is reserved and must be kept at reset value. Refer to .
  - name: CTSE
    bit_range:
    - 9
    - 9
    description: |-
      CTS enable
      This bit can only be written when the USART is disabled (UE=0)
      Note: If the hardware flow control feature is not supported, this bit is reserved and must be kept at reset value. Refer to .
  - name: CTSIE
    bit_range:
    - 10
    - 10
    description: |-
      CTS interrupt enable
      Note: If the hardware flow control feature is not supported, this bit is reserved and must be kept at reset value. Refer to .
  - name: ONEBIT
    bit_range:
    - 11
    - 11
    description: |-
      One sample bit method enable
      This bit enables the user to select the sample method. When the one sample bit method is selected the noise detection flag (NE) is disabled.
      This bit can only be written when the USART is disabled (UE=0).
  - name: OVRDIS
    bit_range:
    - 12
    - 12
    description: |-
      Overrun Disable
      This bit is used to disable the receive overrun detection.
      the ORE flag is not set and the new received data overwrites the previous content of the USART_RDR register. When FIFO mode is enabled, the RXFIFO is bypassed and data are written directly in USART_RDR register. Even when FIFO management is enabled, the RXNE flag is to be used.
      This bit can only be written when the USART is disabled (UE=0).
      Note: This control bit enables checking the communication flow w/o reading the data
  - name: DDRE
    bit_range:
    - 13
    - 13
    description: |-
      DMA Disable on Reception Error
      This bit can only be written when the USART is disabled (UE=0).
      Note: The reception errors are: parity error, framing error or noise error.
  - name: DEM
    bit_range:
    - 14
    - 14
    description: |-
      Driver enable mode
      This bit enables the user to activate the external transceiver control, through the DE signal.
      This bit can only be written when the USART is disabled (UE=0).
      Note: If the Driver Enable feature is not supported, this bit is reserved and must be kept at reset value. .
  - name: DEP
    bit_range:
    - 15
    - 15
    description: |-
      Driver enable polarity selection
      This bit can only be written when the USART is disabled (UE=0).
      Note: If the Driver Enable feature is not supported, this bit is reserved and must be kept at reset value. Refer to .
  - name: SCARCNT
    bit_range:
    - 19
    - 17
    description: |-
      Smartcard auto-retry count
      This bitfield specifies the number of retries for transmission and reception in Smartcard mode.
      In Transmission mode, it specifies the number of automatic retransmission retries, before generating a transmission error (FE bit set).
      In Reception mode, it specifies the number or erroneous reception trials, before generating a reception error (RXNE/RXFNE and PE bits set).
      This bitfield must be programmed only when the USART is disabled (UE=0).
      When the USART is enabled (UE=1), this bitfield may only be written to 0x0, in order to stop retransmission.
      Note: If Smartcard mode is not supported, this bit is reserved and must be kept at reset value. Refer to .
  - name: WUS0
    bit_range:
    - 20
    - 20
    description: |-
      Wakeup from low-power mode interrupt flag selection
      This bitfield specifies the event which activates the WUF (Wakeup from low-power mode flag).
      This bitfield can only be written when the USART is disabled (UE=0).
      Note: If the USART does not support the wakeup from Stop feature, this bit is reserved and must be kept at reset value. Refer to page 2297.
  - name: WUS1
    bit_range:
    - 21
    - 21
    description: |-
      Wakeup from low-power mode interrupt flag selection
      This bitfield specifies the event which activates the WUF (Wakeup from low-power mode flag).
      This bitfield can only be written when the USART is disabled (UE=0).
      Note: If the USART does not support the wakeup from Stop feature, this bit is reserved and must be kept at reset value. Refer to page 2297.
  - name: WUFIE
    bit_range:
    - 22
    - 22
    description: |-
      Wakeup from low-power mode interrupt enable
      This bit is set and cleared by software.
      Note: WUFIE must be set before entering in low-power mode.
      If the USART does not support the wakeup from Stop feature, this bit is reserved and must be kept at reset value. Refer to page 2297.
  - name: TXFTIE
    bit_range:
    - 23
    - 23
    description: |-
      TXFIFO threshold interrupt enable
      This bit is set and cleared by software.
  - name: TCBGTIE
    bit_range:
    - 24
    - 24
    description: |-
      Transmission Complete before guard time, interrupt enable
      This bit is set and cleared by software.
      Note: If the USART does not support the Smartcard mode, this bit is reserved and must be kept at reset value. Refer to .
  - name: RXFTCFG
    bit_range:
    - 27
    - 25
    description: |-
      Receive FIFO threshold configuration
      Remaining combinations: Reserved
  - name: RXFTIE
    bit_range:
    - 28
    - 28
    description: |-
      RXFIFO threshold interrupt enable
      This bit is set and cleared by software.
  - name: TXFTCFG
    bit_range:
    - 31
    - 29
    description: |-
      TXFIFO threshold configuration
      Remaining combinations: Reserved
  side_effects: null
- id: USART_BRR
  address_offset: 12
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: BRR
    bit_range:
    - 15
    - 0
    description: |-
      USART baud rate
      BRR[15:4]
      BRR[15:4] correspond to USARTDIV[15:4]
      BRR[3:0]
      When OVER8 = 0, BRR[3:0] = USARTDIV[3:0].
      When OVER8 = 1:
      BRR[2:0] = USARTDIV[3:0] shifted 1 bit to the right.
      BRR[3] must be kept cleared.
  side_effects: null
- id: USART_GTPR
  address_offset: 16
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: PSC
    bit_range:
    - 7
    - 0
    description: |-
      Prescaler value
      PSC[7:0] = IrDA Normal and Low-power baud rate
      This bitfield is used for programming the prescaler for dividing the USART source clock to achieve the low-power frequency:
      The source clock is divided by the value given in the register (8 significant bits):
      ...
      PSC[4:0]: Prescaler value
      This bitfield is used for programming the prescaler for dividing the USART source clock to provide the Smartcard clock.
      The value given in the register (5 significant bits) is multiplied by 2 to give the division factor of the source clock frequency:
      ...
      This bitfield can only be written when the USART is disabled (UE=0).
      Note: Bits [7:5] must be kept cleared if Smartcard mode is used.
      This bitfield is reserved and forced by hardware to '0' when the Smartcard and IrDA modes are not supported. Refer to .
  - name: GT
    bit_range:
    - 15
    - 8
    description: |-
      Guard time value
      This bitfield is used to program the Guard time value in terms of number of baud clock periods.
      This is used in Smartcard mode. The Transmission Complete flag is set after this guard time value.
      This bitfield can only be written when the USART is disabled (UE=0).
      Note: If Smartcard mode is not supported, this bit is reserved and must be kept at reset value. Refer to .
  side_effects: null
- id: USART_RTOR
  address_offset: 20
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: RTO
    bit_range:
    - 23
    - 0
    description: |-
      Receiver timeout value
      This bitfield gives the Receiver timeout value in terms of number of bit duration.
      In Standard mode, the RTOF flag is set if, after the last received character, no new start bit is detected for more than the RTO value.
      In Smartcard mode, this value is used to implement the CWT and BWT. See Smartcard chapter for more details. In the standard, the CWT/BWT measurement is done starting from the start bit of the last received character.
      Note: This value must only be programmed once per received character.
  - name: BLEN
    bit_range:
    - 31
    - 24
    description: |-
      Block Length
      This bitfield gives the Block length in Smartcard T=1 Reception. Its value equals the number of information characters + the length of the Epilogue Field (1-LEC/2-CRC)1.
      Examples:
      BLEN = 0 0 information characters + LEC
      BLEN = 1 0 information characters + CRC
      BLEN = 255 254 information characters + CRC (total 256 characters))
      In Smartcard mode, the Block length counter is reset when TXE=0 (TXFE = 0 in case FIFO mode is enabled).
      This bitfield can be used also in other modes. In this case, the Block length counter is reset when RE=0 (receiver disabled) and/or when the EOBCF bit is written to 1.
      Note: This value can be programmed after the start of the block reception (using the data from the LEN character in the Prologue Field). It must be programmed only once per received block.
  side_effects: null
- id: USART_RQR
  address_offset: 24
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: ABRRQ
    bit_range:
    - 0
    - 0
    description: |-
      auto baud rate request
      Writing 1 to this bit resets the ABRF and ABRE flags in the USART_ISR and requests an automatic baud rate measurement on the next received data frame.
      Note: If the USART does not support the auto baud rate feature, this bit is reserved and must be kept at reset value. Refer to .
  - name: SBKRQ
    bit_range:
    - 1
    - 1
    description: |-
      Send break request
      Writing 1 to this bit sets the SBKF flag and request to send a BREAK on the line, as soon as the transmit machine is available.
      Note: When the application needs to send the break character following all previously inserted data, including the ones not yet transmitted, the software should wait for the TXE flag assertion before setting the SBKRQ bit.
  - name: MMRQ
    bit_range:
    - 2
    - 2
    description: |-
      Mute mode request
      Writing 1 to this bit puts the USART in Mute mode and resets the RWU flag.
  - name: RXFRQ
    bit_range:
    - 3
    - 3
    description: |-
      Receive data flush request
      Writing 1 to this bit empties the entire receive FIFO i.e. clears the bit RXFNE.
      This enables to discard the received data without reading them, and avoid an overrun condition.
  - name: TXFRQ
    bit_range:
    - 4
    - 4
    description: |-
      Transmit data flush request
      When FIFO mode is disabled, writing '1' to this bit sets the TXE flag. This enables to discard the transmit data. This bit must be used only in Smartcard mode, when data have not been sent due to errors (NACK) and the FE flag is active in the USART_ISR register. If the USART does not support Smartcard mode, this bit is reserved and must be kept at reset value.
      When FIFO is enabled, TXFRQ bit is set to flush the whole FIFO. This sets the TXFE flag (Transmit FIFO empty, bit 23 in the USART_ISR register). Flushing the Transmit FIFO is supported in both UART and Smartcard modes.
      Note: In FIFO mode, the TXFNF flag is reset during the flush request until TxFIFO is empty in order to ensure that no data are written in the data register.
  side_effects: null
- id: USART_ISR_enabled
  address_offset: 28
  size: 32
  access: READ_WRITE
  reset_value: 192
  fields:
  - name: PE
    bit_range:
    - 0
    - 0
    description: |-
      Parity error
      This bit is set by hardware when a parity error occurs in Reception mode. It is cleared by software, writing 1 to the PECF in the USART_ICR register.
      An interrupt is generated if PEIE = 1 in the USART_CR1 register.
      Note: This error is associated with the character in the USART_RDR.
  - name: FE
    bit_range:
    - 1
    - 1
    description: |-
      Framing error
      This bit is set by hardware when a de-synchronization, excessive noise or a break character is detected. It is cleared by software, writing 1 to the FECF bit in the USART_ICR register.
      When transmitting data in Smartcard mode, this bit is set when the maximum number of transmit attempts is reached without success (the card NACKs the data frame).
      An interrupt is generated if EIE = 1 in the USART_CR1 register.
      Note: This error is associated with the character in the USART_RDR.
  - name: NE
    bit_range:
    - 2
    - 2
    description: |-
      Noise detection flag
      This bit is set by hardware when noise is detected on a received frame. It is cleared by software, writing 1 to the NFCF bit in the USART_ICR register.
      Note: This bit does not generate an interrupt as it appears at the same time as the RXFNE bit which itself generates an interrupt. An interrupt is generated when the NE flag is set during multi buffer communication if the EIE bit is set.
      When the line is noise-free, the NE flag can be disabled by programming the ONEBIT bit to 1 to increase the USART tolerance to deviations (Refer to Tolerance of the USART receiver to clock deviation on page 2317).
      This error is associated with the character in the USART_RDR.
  - name: ORE
    bit_range:
    - 3
    - 3
    description: |-
      Overrun error
      This bit is set by hardware when the data currently being received in the shift register is
      ready to be transferred into the USART_RDR register while RXFF = 1. It is cleared by a software, writing 1 to the ORECF, in the USART_ICR register.
      An interrupt is generated if RXFNEIE=1 or EIE = 1 in the USART_CR1 register.
      Note: When this bit is set, the USART_RDR register content is not lost but the shift register is overwritten. An interrupt is generated if the ORE flag is set during multi buffer communication if the EIE bit is set.
      This bit is permanently forced to 0 (no overrun detection) when the bit OVRDIS is set in the USART_CR3 register.
  - name: IDLE
    bit_range:
    - 4
    - 4
    description: |-
      Idle line detected
      This bit is set by hardware when an Idle Line is detected. An interrupt is generated if IDLEIE=1 in the USART_CR1 register. It is cleared by software, writing 1 to the IDLECF in the USART_ICR register.
      Note: The IDLE bit is not set again until the RXFNE bit has been set (i.e. a new idle line occurs).
      If Mute mode is enabled (MME=1), IDLE is set if the USART is not mute (RWU=0), whatever the Mute mode selected by the WAKE bit. If RWU=1, IDLE is not set.
  - name: RXFNE
    bit_range:
    - 5
    - 5
    description: |-
      RXFIFO not empty
      RXFNE bit is set by hardware when the RXFIFO is not empty, meaning that data can be read from the USART_RDR register. Every read operation from the USART_RDR frees a location in the RXFIFO.
      RXFNE is cleared when the RXFIFO is empty. The RXFNE flag can also be cleared by writing 1 to the RXFRQ in the USART_RQR register.
      An interrupt is generated if RXFNEIE=1 in the USART_CR1 register.
  - name: TC
    bit_range:
    - 6
    - 6
    description: |-
      Transmission complete
      This bit indicates that the last data written in the USART_TDR has been transmitted out of the shift register. The TC flag behaves as follows:
      When TDN = 0, the TC flag is set when the transmission of a frame containing data is complete and when TXE/TXFE is set.
      When TDN is equal to the number of data in the TXFIFO, the TC flag is set when TXFIFO is empty and TDN is reached.
      When TDN is greater than the number of data in the TXFIFO, TC remains cleared until the TXFIFO is filled again to reach the programmed number of data to be transferred.
      When TDN is less than the number of data in the TXFIFO, TC is set when TDN is reached even if the TXFIFO is not empty.
      An interrupt is generated if TCIE=1 in the USART_CR1 register.
      TC bit is cleared by software by writing 1 to the TCCF in the USART_ICR register or by writing to the USART_TDR register.
  - name: TXFNF
    bit_range:
    - 7
    - 7
    description: |-
      TXFIFO not full
      TXFNF is set by hardware when TXFIFO is not full meaning that data can be written in the USART_TDR. Every write operation to the USART_TDR places the data in the TXFIFO. This flag remains set until the TXFIFO is full. When the TXFIFO is full, this flag is cleared indicating that data can not be written into the USART_TDR.
      An interrupt is generated if the TXFNFIE bit =1 in the USART_CR1 register.
      Note: The TXFNF is kept reset during the flush request until TXFIFO is empty. After sending the flush request (by setting TXFRQ bit), the flag TXFNF should be checked prior to writing in TXFIFO (TXFNF and TXFE is set at the same time).
      This bit is used during single buffer transmission.
  - name: LBDF
    bit_range:
    - 8
    - 8
    description: |-
      LIN break detection flag
      This bit is set by hardware when the LIN break is detected. It is cleared by software, by writing 1 to the LBDCF in the USART_ICR.
      An interrupt is generated if LBDIE = 1 in the USART_CR2 register.
      Note: If the USART does not support LIN mode, this bit is reserved and kept at reset value. Refer to .
  - name: CTSIF
    bit_range:
    - 9
    - 9
    description: |-
      CTS interrupt flag
      This bit is set by hardware when the nCTS input toggles, if the CTSE bit is set. It is cleared by software, by writing 1 to the CTSCF bit in the USART_ICR register.
      An interrupt is generated if CTSIE=1 in the USART_CR3 register.
      Note: If the hardware flow control feature is not supported, this bit is reserved and kept at reset value.
  - name: CTS
    bit_range:
    - 10
    - 10
    description: |-
      CTS flag
      This bit is set/reset by hardware. It is an inverted copy of the status of the nCTS input pin.
      Note: If the hardware flow control feature is not supported, this bit is reserved and kept at reset value.
  - name: RTOF
    bit_range:
    - 11
    - 11
    description: |-
      Receiver timeout
      This bit is set by hardware when the timeout value, programmed in the RTOR register has lapsed, without any communication. It is cleared by software, writing 1 to the RTOCF bit in the USART_ICR register.
      An interrupt is generated if RTOIE=1 in the USART_CR2 register.
      In Smartcard mode, the timeout corresponds to the CWT or BWT timings.
      Note: If a time equal to the value programmed in RTOR register separates 2 characters, RTOF is not set. If this time exceeds this value + 2 sample times (2/16 or 2/8, depending on the oversampling method), RTOF flag is set.
      The counter counts even if RE = 0 but RTOF is set only when RE = 1. If the timeout has already elapsed when RE is set, then RTOF is set.
      If the USART does not support the Receiver timeout feature, this bit is reserved and kept at reset value.
  - name: EOBF
    bit_range:
    - 12
    - 12
    description: |-
      End of block flag
      This bit is set by hardware when a complete block has been received (for example T=1 Smartcard mode). The detection is done when the number of received bytes (from the start of the block, including the prologue) is equal or greater than BLEN + 4.
      An interrupt is generated if EOBIE = 1 in the USART_CR1 register.
      It is cleared by software, writing 1 to EOBCF in the USART_ICR register.
      Note: If Smartcard mode is not supported, this bit is reserved and kept at reset value. Refer to .
  - name: UDR
    bit_range:
    - 13
    - 13
    description: |-
      SPI slave underrun error flag
      In Slave transmission mode, this flag is set when the first clock pulse for data transmission appears while the software has not yet loaded any value into USART_TDR. This flag is reset by setting UDRCF bit in the USART_ICR register.
      Note: If the USART does not support the SPI slave mode, this bit is reserved and kept at reset value. Refer to .
  - name: ABRE
    bit_range:
    - 14
    - 14
    description: |-
      Auto baud rate error
      This bit is set by hardware if the baud rate measurement failed (baud rate out of range or character comparison failed)
      It is cleared by software, by writing 1 to the ABRRQ bit in the USART_RQR register.
      Note: If the USART does not support the auto baud rate feature, this bit is reserved and kept at reset value.
  - name: ABRF
    bit_range:
    - 15
    - 15
    description: |-
      Auto baud rate flag
      This bit is set by hardware when the automatic baud rate has been set (RXFNE is also set, generating an interrupt if RXFNEIE = 1) or when the auto baud rate operation was completed without success (ABRE=1) (ABRE, RXFNE and FE are also set in this case)
      It is cleared by software, in order to request a new auto baud rate detection, by writing 1 to the ABRRQ in the USART_RQR register.
      Note: If the USART does not support the auto baud rate feature, this bit is reserved and kept at reset value.
  - name: BUSY
    bit_range:
    - 16
    - 16
    description: |-
      Busy flag
      This bit is set and reset by hardware. It is active when a communication is ongoing on the RX line (successful start bit detected). It is reset at the end of the reception (successful or not).
  - name: CMF
    bit_range:
    - 17
    - 17
    description: |-
      Character match flag
      This bit is set by hardware, when a the character defined by ADD[7:0] is received. It is cleared by software, writing 1 to the CMCF in the USART_ICR register.
      An interrupt is generated if CMIE=1in the USART_CR1 register.
  - name: SBKF
    bit_range:
    - 18
    - 18
    description: |-
      Send break flag
      This bit indicates that a send break character was requested. It is set by software, by writing 1 to the SBKRQ bit in the USART_CR3 register. It is automatically reset by hardware during the stop bit of break transmission.
  - name: RWU
    bit_range:
    - 19
    - 19
    description: |-
      Receiver wakeup from Mute mode
      This bit indicates if the USART is in Mute mode. It is cleared/set by hardware when a wakeup/mute sequence is recognized. The Mute mode control sequence (address or IDLE) is selected by the WAKE bit in the USART_CR1 register.
      When wakeup on IDLE mode is selected, this bit can only be set by software, writing 1 to the MMRQ bit in the USART_RQR register.
      Note: If the USART does not support the wakeup from Stop feature, this bit is reserved and kept at reset value. Refer to .
  - name: WUF
    bit_range:
    - 20
    - 20
    description: |-
      Wakeup from low-power mode flag
      This bit is set by hardware, when a wakeup event is detected. The event is defined by the WUS bitfield. It is cleared by software, writing a 1 to the WUCF in the USART_ICR register.
      An interrupt is generated if WUFIE=1 in the USART_CR3 register.
      Note: When UESM is cleared, WUF flag is also cleared.
      If the USART does not support the wakeup from Stop feature, this bit is reserved and kept at reset value. Refer to .
  - name: TEACK
    bit_range:
    - 21
    - 21
    description: |-
      Transmit enable acknowledge flag
      This bit is set/reset by hardware, when the Transmit Enable value is taken into account by the USART.
      It can be used when an idle frame request is generated by writing TE=0, followed by TE=1 in the USART_CR1 register, in order to respect the TE=0 minimum period.
  - name: REACK
    bit_range:
    - 22
    - 22
    description: |-
      Receive enable acknowledge flag
      This bit is set/reset by hardware, when the Receive Enable value is taken into account by the USART.
      It can be used to verify that the USART is ready for reception before entering low-power mode.
      Note: If the USART does not support the wakeup from Stop feature, this bit is reserved and kept at reset value. Refer to .
  - name: TXFE
    bit_range:
    - 23
    - 23
    description: |-
      TXFIFO Empty
      This bit is set by hardware when TXFIFO is Empty. When the TXFIFO contains at least one data, this flag is cleared. The TXFE flag can also be set by writing 1 to the bit TXFRQ (bit 4) in the USART_RQR register.
      An interrupt is generated if the TXFEIE bit =1 (bit 30) in the USART_CR1 register.
  - name: RXFF
    bit_range:
    - 24
    - 24
    description: |-
      RXFIFO Full
      This bit is set by hardware when the number of received data corresponds to RXFIFO size + 1 (RXFIFO full + 1 data in the USART_RDR register.
      An interrupt is generated if the RXFFIE bit =1 in the USART_CR1 register.
  - name: TCBGT
    bit_range:
    - 25
    - 25
    description: |-
      Transmission complete before guard time flag
      This bit is set when the last data written in the USART_TDR has been transmitted correctly out of the shift register.
      It is set by hardware in Smartcard mode, if the transmission of a frame containing data is complete and if the smartcard did not send back any NACK. An interrupt is generated if TCBGTIE=1 in the USART_CR3 register.
      This bit is cleared by software, by writing 1 to the TCBGTCF in the USART_ICR register or by a write to the USART_TDR register.
      Note: If the USART does not support the Smartcard mode, this bit is reserved and kept at reset value. If the USART supports the Smartcard mode and the Smartcard mode is enabled, the TCBGT reset value is '1'. Refer to on page 2297.
  - name: RXFT
    bit_range:
    - 26
    - 26
    description: |-
      RXFIFO threshold flag
      This bit is set by hardware when the threshold programmed in RXFTCFG in USART_CR3 register is reached. This means that there are (RXFTCFG1) data in the Receive FIFO and one data in the USART_RDR register. An interrupt is generated if the RXFTIE bit =1 (bit 27) in the USART_CR3 register.
      Note: When the RXFTCFG threshold is configured to '101', RXFT flag is set if 16 data are available i.e. 15 data in the RXFIFO and 1 data in the USART_RDR. Consequently, the 17th received data does not cause an overrun error. The overrun error occurs after receiving the 18th data.
  - name: TXFT
    bit_range:
    - 27
    - 27
    description: |-
      TXFIFO threshold flag
      This bit is set by hardware when the TXFIFO reaches the threshold programmed in TXFTCFG of USART_CR3 register i.e. the TXFIFO contains TXFTCFG empty locations. An interrupt is generated if the TXFTIE bit =1 (bit 31) in the USART_CR3 register.
  side_effects: null
- id: USART_ISR_disabled
  address_offset: 28
  size: 32
  access: READ_ONLY
  reset_value: 192
  fields:
  - name: PE
    bit_range:
    - 0
    - 0
    description: "Parity error\n\tThis bit is set by hardware when a parity error occurs in Reception mode. It is cleared by software, writing 1 to the PECF in the USART_ICR register.\n\tAn interrupt is generated if PEIE = 1 in the USART_CR1 register.\n\tNote: This error is associated with the character in the USART_RDR."
  - name: FE
    bit_range:
    - 1
    - 1
    description: "Framing error\n\tThis bit is set by hardware when a de-synchronization, excessive noise or a break character is detected. It is cleared by software, writing 1 to the FECF bit in the USART_ICR register.\n\tWhen transmitting data in Smartcard mode, this bit is set when the maximum number of transmit attempts is reached without success (the card NACKs the data frame).\n\tAn interrupt is generated if EIE = 1 in the USART_CR1 register.\n\tNote: This error is associated with the character in the USART_RDR."
  - name: NE
    bit_range:
    - 2
    - 2
    description: "Noise detection flag\n\tThis bit is set by hardware when noise is detected on a received frame. It is cleared by software, writing 1 to the NFCF bit in the USART_ICR register.\n\tNote: This bit does not generate an interrupt as it appears at the same time as the RXNE bit which itself generates an interrupt. An interrupt is generated when the NE flag is set during multi buffer communication if the EIE bit is set.\n\tWhen the line is noise-free, the NE flag can be disabled by programming the ONEBIT bit to 1 to increase the USART tolerance to deviations (Refer to Tolerance of the USART receiver to clock deviation on page 2317).\n\tThis error is associated with the character in the USART_RDR."
  - name: ORE
    bit_range:
    - 3
    - 3
    description: "Overrun error\n\tThis bit is set by hardware when the data currently being received in the shift register is\n\tready to be transferred into the USART_RDR register while RXNE=1. It is cleared by a software, writing 1 to the ORECF, in the USART_ICR register.\n\tAn interrupt is generated if RXNEIE=1 or EIE = 1 in the USART_CR1 register.\n\tNote: When this bit is set, the USART_RDR register content is not lost but the shift register is overwritten. An interrupt is generated if the ORE flag is set during multi buffer communication if the EIE bit is set.\n\tThis bit is permanently forced to 0 (no overrun detection) when the bit OVRDIS is set in the USART_CR3 register."
  - name: IDLE
    bit_range:
    - 4
    - 4
    description: "Idle line detected\n\tThis bit is set by hardware when an Idle Line is detected. An interrupt is generated if IDLEIE=1 in the USART_CR1 register. It is cleared by software, writing 1 to the IDLECF in the USART_ICR register.\n\tNote: The IDLE bit is not set again until the RXNE bit has been set (i.e. a new idle line occurs).\n\tIf Mute mode is enabled (MME=1), IDLE is set if the USART is not mute (RWU=0), whatever the Mute mode selected by the WAKE bit. If RWU=1, IDLE is not set."
  - name: RXNE
    bit_range:
    - 5
    - 5
    description: "Read data register not empty\n\tRXNE bit is set by hardware when the content of the USART_RDR shift register has been transferred to the USART_RDR register. It is cleared by reading from the USART_RDR register. The RXNE flag can also be cleared by writing 1 to the RXFRQ in the USART_RQR register.\n\tAn interrupt is generated if RXNEIE=1 in the USART_CR1 register."
  - name: TC
    bit_range:
    - 6
    - 6
    description: "Transmission complete\n\tThis bit indicates that the last data written in the USART_TDR has been transmitted out of the shift register. The TC flag is set when the transmission of a frame containing data is complete and when TXE is set.\n\tAn interrupt is generated if TCIE=1 in the USART_CR1 register.\n\tTC bit is cleared by software by writing 1 to the TCCF in the USART_ICR register or by writing to the USART_TDR register."
  - name: TXE
    bit_range:
    - 7
    - 7
    description: "Transmit data register empty\n\tTXE is set by hardware when the content of the USART_TDR register has been transferred into the shift register. It is cleared by writing to the USART_TDR register. The TXE flag can also be set by writing 1 to the TXFRQ in the USART_RQR register, in order to discard the data (only in Smartcard T=0 mode, in case of transmission failure).\n\tAn interrupt is generated if the TXEIE bit =1 in the USART_CR1 register."
  - name: LBDF
    bit_range:
    - 8
    - 8
    description: "LIN break detection flag\n\tThis bit is set by hardware when the LIN break is detected. It is cleared by software, by writing 1 to the LBDCF in the USART_ICR.\n\tAn interrupt is generated if LBDIE = 1 in the USART_CR2 register.\n\tNote: If the USART does not support LIN mode, this bit is reserved and kept at reset value. Refer to ."
  - name: CTSIF
    bit_range:
    - 9
    - 9
    description: "CTS interrupt flag\n\tThis bit is set by hardware when the nCTS input toggles, if the CTSE bit is set. It is cleared by software, by writing 1 to the CTSCF bit in the USART_ICR register.\n\tAn interrupt is generated if CTSIE=1 in the USART_CR3 register.\n\tNote: If the hardware flow control feature is not supported, this bit is reserved and kept at reset value."
  - name: CTS
    bit_range:
    - 10
    - 10
    description: "CTS flag\n\tThis bit is set/reset by hardware. It is an inverted copy of the status of the nCTS input pin.\n\tNote: If the hardware flow control feature is not supported, this bit is reserved and kept at reset value."
  - name: RTOF
    bit_range:
    - 11
    - 11
    description: "Receiver timeout\n\tThis bit is set by hardware when the timeout value, programmed in the RTOR register has lapsed, without any communication. It is cleared by software, writing 1 to the RTOCF bit in the USART_ICR register.\n\tAn interrupt is generated if RTOIE=1 in the USART_CR2 register.\n\tIn Smartcard mode, the timeout corresponds to the CWT or BWT timings.\n\tNote: If a time equal to the value programmed in RTOR register separates 2 characters, RTOF is not set. If this time exceeds this value + 2 sample times (2/16 or 2/8, depending on the oversampling method), RTOF flag is set.\n\tThe counter counts even if RE = 0 but RTOF is set only when RE = 1. If the timeout has already elapsed when RE is set, then RTOF is set.\n\tIf the USART does not support the Receiver timeout feature, this bit is reserved and kept at reset value."
  - name: EOBF
    bit_range:
    - 12
    - 12
    description: "End of block flag\n\tThis bit is set by hardware when a complete block has been received (for example T=1 Smartcard mode). The detection is done when the number of received bytes (from the start of the block, including the prologue) is equal or greater than BLEN + 4.\n\tAn interrupt is generated if EOBIE = 1 in the USART_CR1 register.\n\tIt is cleared by software, writing 1 to EOBCF in the USART_ICR register.\n\tNote: If Smartcard mode is not supported, this bit is reserved and kept at reset value. Refer to ."
  - name: UDR
    bit_range:
    - 13
    - 13
    description: "SPI slave underrun error flag\n\tIn Slave transmission mode, this flag is set when the first clock pulse for data transmission appears while the software has not yet loaded any value into USART_TDR. This flag is reset by setting UDRCF bit in the USART_ICR register.\n\tNote: If the USART does not support the SPI slave mode, this bit is reserved and kept at reset value. Refer to ."
  - name: ABRE
    bit_range:
    - 14
    - 14
    description: "Auto baud rate error\n\tThis bit is set by hardware if the baud rate measurement failed (baud rate out of range or character comparison failed)\n\tIt is cleared by software, by writing 1 to the ABRRQ bit in the USART_RQR register.\n\tNote: If the USART does not support the auto baud rate feature, this bit is reserved and kept at reset value."
  - name: ABRF
    bit_range:
    - 15
    - 15
    description: "Auto baud rate flag\n\tThis bit is set by hardware when the automatic baud rate has been set (RXNE is also set, generating an interrupt if RXNEIE = 1) or when the auto baud rate operation was completed without success (ABRE=1) (ABRE, RXNE and FE are also set in this case)\n\tIt is cleared by software, in order to request a new auto baud rate detection, by writing 1 to the ABRRQ in the USART_RQR register.\n\tNote: If the USART does not support the auto baud rate feature, this bit is reserved and kept at reset value."
  - name: BUSY
    bit_range:
    - 16
    - 16
    description: "Busy flag\n\tThis bit is set and reset by hardware. It is active when a communication is ongoing on the RX line (successful start bit detected). It is reset at the end of the reception (successful or not)."
  - name: CMF
    bit_range:
    - 17
    - 17
    description: "Character match flag\n\tThis bit is set by hardware, when a the character defined by ADD[7:0] is received. It is cleared by software, writing 1 to the CMCF in the USART_ICR register.\n\tAn interrupt is generated if CMIE=1in the USART_CR1 register."
  - name: SBKF
    bit_range:
    - 18
    - 18
    description: "Send break flag\n\tThis bit indicates that a send break character was requested. It is set by software, by writing 1 to the SBKRQ bit in the USART_CR3 register. It is automatically reset by hardware during the stop bit of break transmission."
  - name: RWU
    bit_range:
    - 19
    - 19
    description: "Receiver wakeup from Mute mode\n\tThis bit indicates if the USART is in Mute mode. It is cleared/set by hardware when a wakeup/mute sequence is recognized. The Mute mode control sequence (address or IDLE) is selected by the WAKE bit in the USART_CR1 register.\n\tWhen wakeup on IDLE mode is selected, this bit can only be set by software, writing 1 to the MMRQ bit in the USART_RQR register.\n\tNote: If the USART does not support the wakeup from Stop feature, this bit is reserved and kept at reset value. Refer to ."
  - name: WUF
    bit_range:
    - 20
    - 20
    description: "Wakeup from low-power mode flag\n\tThis bit is set by hardware, when a wakeup event is detected. The event is defined by the WUS bitfield. It is cleared by software, writing a 1 to the WUCF in the USART_ICR register.\n\tAn interrupt is generated if WUFIE=1 in the USART_CR3 register.\n\tNote: When UESM is cleared, WUF flag is also cleared.\n\tIf the USART does not support the wakeup from Stop feature, this bit is reserved and kept at reset value. Refer to ."
  - name: TEACK
    bit_range:
    - 21
    - 21
    description: "Transmit enable acknowledge flag\n\tThis bit is set/reset by hardware, when the Transmit Enable value is taken into account by the USART.\n\tIt can be used when an idle frame request is generated by writing TE=0, followed by TE=1 in the USART_CR1 register, in order to respect the TE=0 minimum period."
  - name: REACK
    bit_range:
    - 22
    - 22
    description: "Receive enable acknowledge flag\n\tThis bit is set/reset by hardware, when the Receive Enable value is taken into account by the USART.\n\tIt can be used to verify that the USART is ready for reception before entering low-power mode.\n\tNote: If the USART does not support the wakeup from Stop feature, this bit is reserved and kept at reset value. Refer to ."
  - name: TCBGT
    bit_range:
    - 25
    - 25
    description: "Transmission complete before guard time flag\n\tThis bit is set when the last data written in the USART_TDR has been transmitted correctly out of the shift register.\n\tIt is set by hardware in Smartcard mode, if the transmission of a frame containing data is complete and if the smartcard did not send back any NACK. An interrupt is generated if TCBGTIE=1 in the USART_CR3 register.\n\tThis bit is cleared by software, by writing 1 to the TCBGTCF in the USART_ICR register or by a write to the USART_TDR register.\n\tNote: If the USART does not support the Smartcard mode, this bit is reserved and kept at reset value. If the USART supports the Smartcard mode and the Smartcard mode is enabled, the TCBGT reset value is '1'. Refer to on page 2297."
  side_effects: null
- id: USART_ICR
  address_offset: 32
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: PECF
    bit_range:
    - 0
    - 0
    description: |-
      Parity error clear flag
      Writing 1 to this bit clears the PE flag in the USART_ISR register.
  - name: FECF
    bit_range:
    - 1
    - 1
    description: |-
      Framing error clear flag
      Writing 1 to this bit clears the FE flag in the USART_ISR register.
  - name: NECF
    bit_range:
    - 2
    - 2
    description: |-
      Noise detected clear flag
      Writing 1 to this bit clears the NE flag in the USART_ISR register.
  - name: ORECF
    bit_range:
    - 3
    - 3
    description: |-
      Overrun error clear flag
      Writing 1 to this bit clears the ORE flag in the USART_ISR register.
  - name: IDLECF
    bit_range:
    - 4
    - 4
    description: |-
      Idle line detected clear flag
      Writing 1 to this bit clears the IDLE flag in the USART_ISR register.
  - name: TXFECF
    bit_range:
    - 5
    - 5
    description: |-
      TXFIFO empty clear flag
      Writing 1 to this bit clears the TXFE flag in the USART_ISR register.
  - name: TCCF
    bit_range:
    - 6
    - 6
    description: |-
      Transmission complete clear flag
      Writing 1 to this bit clears the TC flag in the USART_ISR register.
  - name: TCBGTCF
    bit_range:
    - 7
    - 7
    description: |-
      Transmission complete before Guard time clear flag
      Writing 1 to this bit clears the TCBGT flag in the USART_ISR register.
  - name: LBDCF
    bit_range:
    - 8
    - 8
    description: |-
      LIN break detection clear flag
      Writing 1 to this bit clears the LBDF flag in the USART_ISR register.
      Note: If LIN mode is not supported, this bit is reserved and must be kept at reset value. Refer to .
  - name: CTSCF
    bit_range:
    - 9
    - 9
    description: |-
      CTS clear flag
      Writing 1 to this bit clears the CTSIF flag in the USART_ISR register.
      Note: If the hardware flow control feature is not supported, this bit is reserved and must be kept at reset value. Refer to .
  - name: RTOCF
    bit_range:
    - 11
    - 11
    description: |-
      Receiver timeout clear flag
      Writing 1 to this bit clears the RTOF flag in the USART_ISR register.
      Note: If the USART does not support the Receiver timeout feature, this bit is reserved and must be kept at reset value. Refer to page 2297.
  - name: EOBCF
    bit_range:
    - 12
    - 12
    description: |-
      End of block clear flag
      Writing 1 to this bit clears the EOBF flag in the USART_ISR register.
      Note: If the USART does not support Smartcard mode, this bit is reserved and must be kept at reset value. Refer to .
  - name: UDRCF
    bit_range:
    - 13
    - 13
    description: |-
      SPI slave underrun clear flag
      Writing 1 to this bit clears the UDRF flag in the USART_ISR register.
      Note: If the USART does not support SPI slave mode, this bit is reserved and must be kept at reset value. Refer to
  - name: CMCF
    bit_range:
    - 17
    - 17
    description: |-
      Character match clear flag
      Writing 1 to this bit clears the CMF flag in the USART_ISR register.
  - name: WUCF
    bit_range:
    - 20
    - 20
    description: |-
      Wakeup from low-power mode clear flag
      Writing 1 to this bit clears the WUF flag in the USART_ISR register.
      Note: If the USART does not support the wakeup from Stop feature, this bit is reserved and must be kept at reset value. Refer to page 2297.
  side_effects: null
- id: USART_RDR
  address_offset: 36
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: RDR
    bit_range:
    - 8
    - 0
    description: |-
      Receive data value
      Contains the received data character.
      The RDR register provides the parallel interface between the input shift register and the internal bus (see ).
      When receiving with the parity enabled, the value read in the MSB bit is the received parity bit.
  side_effects: null
- id: USART_TDR
  address_offset: 40
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TDR
    bit_range:
    - 8
    - 0
    description: |-
      Transmit data value
      Contains the data character to be transmitted.
      The USART_TDR register provides the parallel interface between the internal bus and the output shift register (see ).
      When transmitting with the parity enabled (PCE bit set to 1 in the USART_CR1 register), the value written in the MSB (bit 7 or bit 8 depending on the data length) has no effect because it is replaced by the parity.
      Note: This register must be written only when TXE/TXFNF=1.
  side_effects: null
- id: USART_PRESC
  address_offset: 44
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: PRESCALER
    bit_range:
    - 3
    - 0
    description: |-
      Clock prescaler
      The USART input clock can be divided by a prescaler factor:
      Remaining combinations: Reserved
      Note: When PRESCALER is programmed with a value different of the allowed ones, programmed prescaler value is equal to '1011' i.e. input clock divided by 256.
  side_effects: null
interrupts:
  USART3: 60
  USART1: 58
timing: null
