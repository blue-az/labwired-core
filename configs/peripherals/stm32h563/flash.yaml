- id: FLASH_NSOBKCFGR
  address_offset: 64
  size: 32
  access: READ_WRITE
  reset_value: 33488896
  fields:
  - name: LOCK
    bit_range:
    - 0
    - 0
    description: |-
      OBKCFGR lock option configuration bit
      This bit locks the FLASH_NSOBKCFGR register. The correct write sequence to FLASH_NSOBKKEYR register unlocks this bit. If a wrong sequence is executed, or if the unlock sequence to FLASH_NSOBKKEYR is performed twice, this bit remains locked until the next system reset. LOCK can be set by programming it to 1. When set to 1, a new unlock sequence is mandatory to unlock it. When LOCK changes from 0 to 1, the other bits of FLASH_NSCR register do not change.
  - name: SWAP_SECT_REQ
    bit_range:
    - 1
    - 1
    description: |-
      OBK swap sector request bit
      When set, all the OBKs which have not been updated in the alternate sector is copied from current sector to alternate one.
      The SWAP_OFFSET value must be a certain minimum value in order for the swap to be launched in OBK-HDPLdifferent 0. Minimum value is 16 for OBK-HDPL=1, 144 for OBK-HDPL=2 and192 for OBK-HDPL=3.
  - name: ALT_SECT
    bit_range:
    - 2
    - 2
    description: |-
      alternate sector bit
      This bit must not change while filling the write buffer, otherwise an error (OBKERR) is generated
  - name: ALT_SECT_ERASE
    bit_range:
    - 3
    - 3
    description: |-
      alternate sector erase bit
      When ALT_SECT bit is set, use this bit to generate an erase command for the OBK alternate sector. It is set only by Software and cleared when the OBK swap operation is completed or an error occurs (PGSERR). It is reseted at the same time as BUSY bit.
  - name: SWAP_OFFSET
    bit_range:
    - 24
    - 16
    description: |-
      Key index (offset /16 bits) pointing for next swap.
      0x01 means that only the first OBK data (128 bits) is copied from current to alternate OBK sector
      0x02 means that the two first OBK data is copied
  side_effects: null
