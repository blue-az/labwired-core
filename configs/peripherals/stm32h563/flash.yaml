    bit_range:
    - 22
    - 22
    description: |-
      ECC fail bank for corrected ECC error
      It indicates which bank is concerned by ECC error
  - name: SYSF_ECC
    bit_range:
    - 23
    - 23
    description: |-
      ECC fail for corrected ECC error in system flash memory
      It indicates if system flash memory is concerned by ECC error.
  - name: OTP_ECC
    bit_range:
    - 24
    - 24
    description: |-
      OTP ECC error bit
      This bit is set to 1 when one single ECC correction occurred during the last successful read operation from the read-only/ OTP area. The address of the ECC error is available in ADDR_ECC bitfield.
  - name: ECCCIE
    bit_range:
    - 25
    - 25
    description: |-
      ECC single correction error interrupt enable bit
      When ECCCIE bit is set to 1, an interrupt is generated when an ECC single correction error occurs during a read operation.
  - name: ECCC
    bit_range:
    - 30
    - 30
    description: |-
      ECC correction set by hardware when single ECC error has been detected and corrected.
      Cleared by writing 1.
  side_effects: null
- id: FLASH_ECCDETR
  address_offset: 260
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: ADDR_ECC
    bit_range:
    - 15
    - 0
    description: "ECC error address\nWhen an ECC error occurs (double detection) during a read operation, the ADDR_ECC contains the address that generated the error. \nADDR_ECC is reset when the flag error is reset. \nThe flash interface programs the address in this register only when no ECC error flags are set. This means that only the first address that generated an double ECC error is saved.\nThe address in ADDR_ECC is relative to the flash memory area where the error occurred (user flash memory, system flash memory, data area, read-only/OTP area)."
  - name: OBK_ECC
    bit_range:
    - 20
    - 20
    description: ECC fail double ECC error in flash OB Keys storage area. It indicates the OBK storage concerned by ECC error.
  - name: EDATA_ECC
    bit_range:
    - 21
    - 21
    description: |-
      ECC fail double ECC error in flash high-cycle data area
      It indicates if flash high-cycle data area is concerned by ECC error.
  - name: BK_ECC
    bit_range:
    - 22
    - 22
    description: |-
      ECC fail bank for double ECC error
      It indicates which bank is concerned by ECC error
  - name: SYSF_ECC
    bit_range:
    - 23
    - 23
    description: |-
      ECC fail for double ECC error in system flash memory
      It indicates if system flash memory is concerned by ECC error.
  - name: OTP_ECC
    bit_range:
    - 24
    - 24
    description: |-
      OTP ECC error bit
      This bit is set to 1 when double ECC detection occurred during the last read operation from the read-only/ OTP area. The address of the ECC error is available in ADDR_ECC bitfield.
  - name: ECCD
    bit_range:
    - 31
    - 31
    description: |-
      ECC detection
      Set by hardware when two ECC error has been detected.
      When this bit is set, a NMI is generated.
      Cleared by writing 1. Needs to be cleared in order to detect subsequent double ECC errors.
  side_effects: null
- id: FLASH_ECCDR
  address_offset: 264
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: DATA_ECC
    bit_range:
    - 15
    - 0
    description: |-
      ECC error data
      When an double detection ECC error occurs on special areas with 6-bit ECC on 16-bit data (data area, read-only/OTP area), the failing data is read to this register.
      By checking if it is possible to determine whether the failure was on a real data, or due to access to uninitialized memory.
