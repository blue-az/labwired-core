peripheral: FLASH
version: 0.1.0
registers:
- id: FLASH_ACR
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 19
  fields:
  - name: LATENCY
    bit_range:
    - 3
    - 0
    description: |-
      Read latency
      These bits are used to control the number of wait states used during read operations on both nonvolatile memory banks. The application software has to program them to the correct value depending on the embedded flash memory interface frequency and voltage conditions.
      ...
      Note: No check is performed by hardware to verify that the configuration is correct.
  - name: WRHIGHFREQ
    bit_range:
    - 5
    - 4
    description: "Flash signal delay \nThese bits are used to control the delay between nonvolatile memory signals during programming operations. Application software has to program them to the correct value depending on the embedded flash memory interface frequency. Please refer to Table44 for details.\nNote: No check is performed to verify that the configuration is correct. \nNote: Two WRHIGHFREQ values can be selected for some frequencies."
  - name: PRFTEN
    bit_range:
    - 8
    - 8
    description: |-
      Prefetch enable. When bit value is modified, user must read back ACR register to be sure PRFTEN has been taken into account.
      Bits used to control the prefetch.
  side_effects: null
- id: FLASH_NSKEYR
  address_offset: 4
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: NSKEY
    bit_range:
    - 31
    - 0
    description: Non-volatile memory non-secure configuration access unlock key
  side_effects: null
- id: FLASH_SECKEYR
  address_offset: 8
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SECKEY
    bit_range:
    - 31
    - 0
    description: Non-volatile memory secure configuration access unlock key
  side_effects: null
- id: FLASH_OPTKEYR
  address_offset: 12
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: OPTKEY
    bit_range:
    - 31
    - 0
    description: FLASH option bytes control access unlock key
  side_effects: null
- id: FLASH_NSOBKKEYR
  address_offset: 16
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: NSOBKKEY
    bit_range:
    - 31
    - 0
    description: FLASH non-secure option bytes keys control access unlock key
  side_effects: null
- id: FLASH_SECOBKKEYR
  address_offset: 20
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SECOBKKEY
    bit_range:
    - 31
    - 0
    description: FLASH secure option bytes keys control access unlock key
  side_effects: null
- id: FLASH_OPSR
  address_offset: 24
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: ADDR_OP
    bit_range:
    - 19
    - 0
    description: Interrupted operation address
  - name: DATA_OP
    bit_range:
    - 21
    - 21
    description: |-
      Flash high-cycle data area operation interrupted
      It indicates if flash high-cycle data area is concerned by operation.
  - name: BK_OP
    bit_range:
    - 22
    - 22
    description: |-
      Interrupted operation bank
      It indicates which bank was concerned by operation.
  - name: SYSF_OP
    bit_range:
    - 23
    - 23
    description: "Operation in system flash memory interrupted \nIndicates that reset interrupted an ongoing operation in system flash."
  - name: OTP_OP
    bit_range:
    - 24
    - 24
    description: |-
      OTP operation interrupted
      Indicates that reset interrupted an ongoing operation in OTP area (or OBKeys area).
  - name: CODE_OP
    bit_range:
    - 31
    - 29
    description: Flash memory operation code
  side_effects: null
- id: FLASH_OPTCR
  address_offset: 28
  size: 32
  access: READ_WRITE
  reset_value: 1
  fields:
  - name: OPTLOCK
    bit_range:
    - 0
    - 0
    description: "FLASH_OPTCR lock option configuration bit\nThe OPTLOCK bit locks the FLASH_OPTCR register as well as all _PRG registers. The correct write sequence to FLASH_OPTKEYR register unlocks this bit. If a wrong sequence is executed, or the unlock sequence to FLASH_OPTKEYR is performed twice, this bit remains locked until next system reset. \nIt is possible to set OPTLOCK by programming it to 1. When set to 1, a new unlock sequence is mandatory to unlock it. When OPTLOCK changes from 0 to 1, the others bits of FLASH_OPTCR register do not change."
  - name: OPTSTRT
    bit_range:
    - 1
    - 1
    description: |-
      Option byte start change option configuration bit
      OPTSTRT triggers an option byte change operation. The user can set OPTSTRT only when the OPTLOCK bit is cleared to 0. It is set only by Software and cleared when the option byte change is completed or an error occurs (PGSERR or OPTCHANGEERR). It is reseted at the same time as BSY bit.
      The user application cannot modify any FLASH_XXX_PRG flash interface register until the option change operation has been completed.
      Before setting this bit, the user has to write the required values in the FLASH_XXX_PRG registers. The FLASH_XXX_PRG registers are locked until the option byte change operation has been executed in nonvolatile memory.
  - name: SWAP_BANK
    bit_range:
    - 31
    - 31
    description: |-
      Bank swapping option configuration bit
      SWAP_BANK controls whether Bank1 and Bank2 are swapped or not. This bit is loaded with the SWAP_BANK bit of FLASH_OPTSR_CUR register only after reset or POR.
  side_effects: null
- id: FLASH_NSSR
  address_offset: 32
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: BSY
    bit_range:
    - 0
    - 0
    description: |-
      busy flag
      BSY flag indicates that a flash memory is busy by an operation (write, erase, option byte change, OBK operation). It is set at the beginning of a flash memory operation and cleared when the operation finishes, or an error occurs.
  - name: WBNE
    bit_range:
    - 1
    - 1
    description: "write buffer not empty flag \nWBNE flag is set when the flash interface is waiting for new data to complete the write buffer. In this state, the write buffer is not empty. WBNE is reset by hardware each time the write buffer is complete or the write buffer is emptied following one of the event below:\nthe application software forces the write operation using FW bit in FLASH_NSCR\nthe embedded flash memory detects an error that involves data loss\nThis bit cannot be reset by software writing 0 directly. To reset it, clear the write buffer by performing any of the above listed actions, or send the missing data."
  - name: DBNE
    bit_range:
    - 3
    - 3
    description: "data buffer not empty flag \nDBNE flag is set when the flash interface is processing 6-bits ECC data in dedicated buffer. This bit cannot be set to 0 by software. The hardware resets it once the buffer is free."
  - name: EOP
    bit_range:
    - 16
    - 16
    description: |-
      end of operation flag
      EOP flag is set when a operation (program/erase) completes. An interrupt is generated if the EOPIE is set to 1. It is not necessary to reset EOP before starting a new operation. EOP bit is cleared by writing 1 to CLR_EOP bit in FLASH_NSCCR register.
  - name: WRPERR
    bit_range:
    - 17
    - 17
    description: |-
      write protection error flag
      WRPERR flag is raised when a protection error occurs during a program operation. An interrupt is also generated if the WRPERRIE is set to 1. Writing 1 to CLR_WRPERR bit in FLASH_NSCCR register clears WRPERR.
  - name: PGSERR
    bit_range:
    - 18
    - 18
    description: |-
      programming sequence error flag
      PGSERR flag is raised when a sequence error occurs. An interrupt is generated if the PGSERRIE bit is set to 1. Writing 1 to CLR_PGSERR bit in FLASH_NSCCR register clears PGSERR.
  - name: STRBERR
    bit_range:
    - 19
    - 19
    description: "strobe error flag \nSTRBERR flag is raised when a strobe error occurs (when the master attempts to write several times the same byte in the write buffer). An interrupt is generated if the STRBERRIE bit is set to 1. Writing 1 to CLR_STRBERR bit in FLASH_NSCCR register clears STRBERR."
  - name: INCERR
    bit_range:
    - 20
    - 20
    description: |-
      inconsistency error flag
      NSINCERR flag is raised when a inconsistency error occurs. An interrupt is generated if INCERRIE is set to 1. Writing 1 to CLR_INCERR bit in the FLASH_NSCCR register clears NSINCERR.
  - name: OBKERR
    bit_range:
    - 21
    - 21
    description: |-
      OBK general error flag
      OBKERR flag is raised when the OBK-HDPL signal from the SBS does not match the HDPL value associated with the key slot during access to the key location. Alternatively also when the ALT_SECT is unexpectedly changed while the write buffer is being filled.
  - name: OBKWERR
    bit_range:
    - 22
    - 22
    description: |-
      OBK write error flag
      OBKWERR flag is raised when the address is not virgin on a write access to the OBK storage. Alternatively also when the OBK selector in the alternate sector is not virgin during a swap operation.
  - name: OPTCHANGEERR
    bit_range:
    - 23
    - 23
    description: "Option byte change error flag \nOPTCHANGEERR flag indicates that an error occurred during an option byte change operation. When OPTCHANGEERR is set to 1, the option byte change operation did not successfully complete. An interrupt is generated when this flag is raised if the OPTCHANGEERRIE bit of FLASH_NSCR register is set to 1. \nWriting 1 to CLR_OPTCHANGEERR of register FLASH_NSCCR clears OPTCHANGEERR.\nNote: The OPTSTRT bit in FLASH_OPTCR cannot be set while OPTCHANGEERR is set."
  side_effects: null
- id: FLASH_SECSR
  address_offset: 36
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: BSY
    bit_range:
    - 0
    - 0
    description: |-
      busy flag
      BSY flag indicates that a FLASH memory is busy (write, erase, option byte change, OBK operations). It is set at the beginning of a flash memory operation and cleared when the operation finishes or an error occurs.
  - name: WBNE
    bit_range:
    - 1
    - 1
    description: "write buffer not empty flag \nWBNE flag is set when the flash interface is waiting for new data to complete the write buffer. In this state, the write buffer is not empty. WBNE is reset by hardware each time the write buffer is complete or the write buffer is emptied following one of the event below:\nthe application software forces the write operation using FW bit in FLASH_SECCR\nthe flash interface detects an error that involves data loss\nThis bit cannot be reset by writing 0 directly by software. To reset it, clear the write buffer by performing any of the above listed actions, or send the missing data."
  - name: DBNE
    bit_range:
    - 3
    - 3
    description: "data buffer not empty flag \nDBNE flag is set when the embedded flash memory interface is processing 6-bits ECC data in dedicated buffer. This bit cannot be set to 0 by software. The hardware resets it once the buffer is free."
  - name: EOP
    bit_range:
    - 16
    - 16
    description: |-
      end of operation flag
      EOP flag is set when a operation (program/erase) completes. An interrupt is generated if the EOPIE is set to. It is not necessary to reset EOP before starting a new operation. EOP bit is cleared by writing 1 to CLR_EOP bit in FLASH_SECCCR register.
  - name: WRPERR
    bit_range:
    - 17
    - 17
    description: |-
      write protection error flag
      WRPERR flag is raised when a protection error occurs during a program operation. An interrupt is also generated if the WRPERRIE is set to 1. Writing 1 to CLR_WRPERR bit in FLASH_SECCCR register clears WRPERR.
  - name: PGSERR
    bit_range:
    - 18
    - 18
    description: |-
      programming sequence error flag
      PGSERR flag is raised when a sequence error occurs. An interrupt is generated if the PGSERRIE bit is set to 1. Writing 1 to CLR_PGSERR bit in FLASH_SECCCR register clears PGSERR.
  - name: STRBERR
    bit_range:
    - 19
    - 19
    description: "strobe error flag \nSTRBERR flag is raised when a strobe error occurs (when the master attempts to write several times the same byte in the write buffer). An interrupt is generated if the STRBERRIE bit is set to 1. Writing 1 to CLR_STRBERR bit in FLASH_SECCCR register clears STRBERR."
  - name: INCERR
    bit_range:
    - 20
    - 20
    description: |-
      inconsistency error flag
      INCERR flag is raised when a inconsistency error occurs. An interrupt is generated if INCERRIE is set to 1. Writing 1 to CLR_INCERR bit in the FLASH_SECCCR register clears INCERR.
  - name: OBKERR
    bit_range:
    - 21
    - 21
    description: |-
      OBK general error flag
      OBKERR flag is raised when the OBK-HDPL signal from the SBS does not match the HDPL value associated with the key slot during access to the key location. Alternatively also when the ALT_SECT is unexpectedly changed while the write buffer is being filled.
  - name: OBKWERR
    bit_range:
    - 22
    - 22
    description: |-
      OBK write error flag
      OBKWERR flag is raised when the address is not virgin on a write access to the OBK storage. Alternatively also when the OBK selector in the alternate sector is not virgin during a swap operation.
  side_effects: null
- id: FLASH_NSCR
  address_offset: 40
  size: 32
  access: READ_WRITE
  reset_value: 1
  fields:
  - name: LOCK
    bit_range:
    - 0
    - 0
    description: "configuration lock bit\nThis bit locks the FLASH_NSCR register. The correct write sequence to FLASH_NSKEYR register unlocks this bit. If a wrong sequence is executed, or if the unlock sequence to FLASH_NSKEYR is performed twice, this bit remains locked until the next system reset. \nLOCK can be set by programming it to 1. When set to 1, a new unlock sequence is mandatory to unlock it. When LOCK changes from 0 to 1, the other bits of FLASH_NSCR register do not change."
  - name: PG
    bit_range:
    - 1
    - 1
    description: "programming control bit\nPG can be programmed only when LOCK is cleared to 0. \nPG allows programming in Bank1 and Bank2."
  - name: SER
    bit_range:
    - 2
    - 2
    description: "sector erase request\nSetting SER bit to 1 requests a sector erase. SER can be programmed only when LOCK is cleared to 0. \nIf MER and SER are also set, a PGSERR is raised."
  - name: BER
    bit_range:
    - 3
    - 3
    description: "erase request\nSetting BER bit to 1 requests a bank erase operation (user flash memory only). BER can be programmed only when LOCK is cleared to 0. \nIf MER and SER are also set, a PGSERR is raised.\nNote: Write protection error is triggered when a bank erase is required and some sectors are protected."
  - name: FW
    bit_range:
    - 4
    - 4
    description: "write forcing control bit\nFW forces a write operation even if the write buffer is not full. In this case all bits not written are set to 1 by hardware. FW can be programmed only when LOCK is cleared to 0. \nThe embedded flash memory resets FW when the corresponding operation has been acknowledged. \nNote: Using a force-write operation prevents the application from updating later the missing bits with something else than 1, because it is likely that it leads to permanent ECC error.\nWrite forcing is effective only if the write buffer is not empty and was filled by non-secure access (in particular, FW does not start several write operations when the force-write operations are performed consecutively). \nSince there is just one write buffer, FW can force a write in bank1 or bank2."
  - name: STRT
    bit_range:
    - 5
    - 5
    description: "erase start control bit\nSTRT bit is used to start a sector erase or a bank erase operation. STRT can be programmed only when LOCK is cleared to 0. \nSTRT is reset at the end of the operation or when an error occurs. It cannot be reseted by software."
  - name: SNB
    bit_range:
    - 12
    - 6
    description: |-
      sector erase selection number
      These bits are used to select the target sector for an erase operation (they are unused otherwise). SNB can be programmed only when LOCK is cleared to 0.
      ..
  - name: MER
    bit_range:
    - 15
    - 15
    description: "Mass erase request\nSetting MER bit to 1 requests a mass erase operation (user flash memory only). MER can be programmed only when LOCK is cleared to 0. \nIf BER or SER are both set, a PGSERR is raised.\nError is triggered when a mass erase is required and some sectors are protected."
  - name: EOPIE
    bit_range:
    - 16
    - 16
    description: |-
      end of operation interrupt control bit
      Setting EOPIE bit to 1 enables the generation of an interrupt at the end of a program or erase operation. EOPIE can be programmed only when LOCK is cleared to 0.
  - name: WRPERRIE
    bit_range:
    - 17
    - 17
    description: |-
      write protection error interrupt enable bit
      When this bit is set to 1, an interrupt is generated when a protection error occurs during a program operation. WRPERRIE can be programmed only when LOCK is cleared to 0.
  - name: PGSERRIE
    bit_range:
    - 18
    - 18
    description: |-
      programming sequence error interrupt enable bit
      When this bit is set to 1, an interrupt is generated when a sequence error occurs during a program operation. PGSERRIE can be programmed only when LOCK is cleared to 0.
  - name: STRBERRIE
    bit_range:
    - 19
    - 19
    description: |-
      strobe error interrupt enable bit
      When STRBERRIE bit is set to 1, an interrupt is generated when a strobe error occurs (the master programs several times the same byte in the write buffer) during a write operation. STRBERRIE can be programmed only when LOCK is cleared to 0.
  - name: INCERRIE
    bit_range:
    - 20
    - 20
    description: |-
      inconsistency error interrupt enable bit
      When INCERRIE bit is set to 1, an interrupt is generated when an inconsistency error occurs during a write operation. INCERRIE can be programmed only when LOCK is cleared to 0.
  - name: OBKERRIE
    bit_range:
    - 21
    - 21
    description: |-
      OBK general error interrupt enable bit
      OBKERRIE enables generating an interrupt in case of OBK specific access error. This bit can be programmed only when LOCK bit is cleared to 0.
  - name: OBKWERRIE
    bit_range:
    - 22
    - 22
    description: |-
      OBK write error interrupt enable bit
      OBKWERRIE enables generation of interrupt in case of OBK specific write error. This bit can be programmed only when LOCK bit is cleared to 0.
  - name: OPTCHANGEERRIE
    bit_range:
    - 23
    - 23
    description: |-
      Option byte change error interrupt enable bit
      This bit controls if an interrupt must be generated when an error occurs during an option byte change. It can be programmed only when LOCK bit is cleared to 0.
  - name: BKSEL
    bit_range:
    - 31
    - 31
    description: |-
      Bank selector bit
      BKSEL can only be programmed when LOCK is cleared to 0. The bit selects physical bank, SWAP_BANK setting is ignored.
  side_effects: null
