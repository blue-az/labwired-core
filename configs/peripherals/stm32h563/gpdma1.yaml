- id: GPDMA_C1SR
  address_offset: 224
  size: 32
  access: READ_WRITE
  reset_value: 1
  fields:
  - name: IDLEF
    bit_range:
    - 0
    - 0
    description: |-
      idle flag
      This idle flag is de-asserted by hardware when the channel is enabled (GPDMA_CxCR.EN = 1) with a valid channel configuration (no USEF to be immediately reported).
      This idle flag is asserted after hard reset or by hardware when the channel is back in idle state (in suspended or disabled state).
  - name: TCF
    bit_range:
    - 8
    - 8
    description: |-
      transfer complete flag
      A transfer complete event is either a block transfer complete, a 2D/repeated block transfer complete, a LLI transfer complete including the upload of the next LLI if any, or the full linked-list completion, depending on the transfer complete event mode (GPDMA_CxTR2.TCEM[1:0]).
  - name: HTF
    bit_range:
    - 9
    - 9
    description: |-
      half transfer flag
      A half transfer event is either a half block transfer or a half 2D/repeated block transfer, depending on the transfer complete event mode (GPDMA_CxTR2.TCEM[1:0]).
      A half block transfer occurs when half of the bytes of the source block size (rounded up integer of GPDMA_CxBR1.BNDT[15:0]/2) has been transferred to the destination.
      A half 2D/repeated block transfer occurs when half of the repeated blocks (rounded up integer of (GPDMA_CxBR1.BRC[10:0]+1)/2)) has been transferred to the destination.
  - name: DTEF
    bit_range:
    - 10
    - 10
    description: data transfer error flag
  - name: ULEF
    bit_range:
    - 11
    - 11
    description: update link transfer error flag
  - name: USEF
    bit_range:
    - 12
    - 12
    description: user setting error flag
  - name: SUSPF
    bit_range:
    - 13
    - 13
    description: completed suspension flag
  - name: TOF
    bit_range:
    - 14
    - 14
    description: trigger overrun flag
  - name: FIFOL
    bit_range:
    - 23
    - 16
    description: |-
      monitored FIFO level
      Number of available write beats in the FIFO, in units of the programmed destination data width (see GPDMA_CxTR1.DDW_LOG2[1:0], in units of bytes, half-words, or words).
      Note: After having suspended an active transfer, the user may need to read FIFOL[7:0], additionally to GPDMA_CxBR1.BDNT[15:0] and GPDMA_CxBR1.BRC[10:0], to know how many data have been transferred to the destination. Before reading, the user may wait for the transfer to be suspended (GPDMA_CxSR.SUSPF = 1).
  side_effects: null
- id: GPDMA_C1CR
  address_offset: 228
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: EN
    bit_range:
    - 0
    - 0
    description: |-
      enable
      Writing 1 into the field RESET (bit 1) causes the hardware to de-assert this bit, whatever is written into this bit 0. Else:
      this bit is de-asserted by hardware when there is a transfer error (master bus error or user setting error) or when there is a channel transfer complete (channel ready to be configured, e.g. if LSM=1 at the end of a single execution of the LLI).
      Else, this bit can be asserted by software.
      Writing 0 into this EN bit is ignored.
  - name: RESET
    bit_range:
    - 1
    - 1
    description: |-
      reset
      This bit is write only. Writing 0 has no impact. Writing 1 implies the reset of the following: the FIFO, the channel internal state, SUSP and EN bits (whatever is written receptively in bit 2 and bit 0).
      The reset is effective when the channel is in steady state, meaning one of the following:
      - active channel in suspended state (GPDMA_CxSR.SUSPF = 1 and GPDMA_CxSR.IDLEF = GPDMA_CxCR.EN = 1)
      - channel in disabled state (GPDMA_CxSR.IDLEF = 1 and GPDMA_CxCR.EN = 0).
      After writing a RESET, to continue using this channel, the user must explicitly reconfigure the channel including the hardware-modified configuration registers (GPDMA_CxBR1, GPDMA_CxSAR and GPDMA_CxDAR) before enabling again the channel (see the programming sequence in ).
  - name: SUSP
    bit_range:
    - 2
    - 2
    description: |-
      suspend
      Writing 1 into the field RESET (bit 1) causes the hardware to de-assert this bit, whatever is written into this bit 2. Else:
      Software must write 1 in order to suspend an active channel i.e. a channel with an ongoing GPDMA transfer over its master ports.
      The software must write 0 in order to resume a suspended channel, following the programming sequence detailed in .
  - name: TCIE
    bit_range:
    - 8
    - 8
    description: transfer complete interrupt enable
  - name: HTIE
    bit_range:
    - 9
    - 9
    description: half transfer complete interrupt enable
  - name: DTEIE
    bit_range:
    - 10
    - 10
    description: data transfer error interrupt enable
  - name: ULEIE
    bit_range:
    - 11
    - 11
    description: update link transfer error interrupt enable
  - name: USEIE
    bit_range:
    - 12
    - 12
    description: user setting error interrupt enable
  - name: SUSPIE
    bit_range:
    - 13
    - 13
    description: completed suspension interrupt enable
  - name: TOIE
    bit_range:
    - 14
    - 14
    description: trigger overrun interrupt enable
  - name: LSM
    bit_range:
    - 16
    - 16
    description: |-
      Link step mode
      First the (possible 1D/repeated) block transfer is executed as defined by the current internal register file until GPDMA_CxBR1.BNDT[15:0] = 0 and GPDMA_CxBR1.BRC[10:0] = 0 if present. Secondly the next linked-list data structure is conditionally uploaded from memory as defined by GPDMA_CxLLR. Then channel execution is completed.
      Note: This bit must be written when EN=0. This bit is read-only when EN=1.
  - name: LAP
    bit_range:
    - 17
    - 17
    description: |-
      linked-list allocated port
      This bit is used to allocate the master port for the update of the GPDMA linked-list registers from the memory.
      Note: This bit must be written when EN=0. This bit is read-only when EN=1.
  - name: PRIO
    bit_range:
    - 23
    - 22
    description: |-
      priority level of the channel x GPDMA transfer versus others
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  side_effects: null
- id: GPDMA_C1TR1
  address_offset: 272
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SDW_LOG2
    bit_range:
    - 1
    - 0
    description: |-
      binary logarithm of the source data width of a burst in bytes
      Note: Setting a 8-byte data width causes a user setting error to be reported and no transfer is issued.
      A source block size must be a multiple of the source data width (GPDMA_CxBR1.BNDT[2:0] versus SDW_LOG2[1:0]). Otherwise, a user setting error is reported and no transfer is issued.
      A source burst transfer must have an aligned address with its data width (start address GPDMA_CxSAR[2:0] versus SDW_LOG2[1:0]). Otherwise, a user setting error is reported and none transfer is issued.
  - name: SINC
    bit_range:
    - 3
    - 3
    description: |-
      source incrementing burst
      The source address, pointed by GPDMA_CxSAR, is kept constant after a burst beat/single transfer or is incremented by the offset value corresponding to a contiguous data after a burst beat/single transfer.
  - name: SBL_1
    bit_range:
    - 9
    - 4
    description: |-
      source burst length minus 1, between 0 and 63
      The burst length unit is one data named beat within a burst. If SBL_1[5:0] =0 , the burst can be named as single. Each data/beat has a width defined by the destination data width SDW_LOG2[1:0].
      Note: If a burst transfer crossed a 1-Kbyte address boundary on a AHB transfer, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the AHB protocol.
      If a burst transfer is of length greater than the FIFO size of the channel x, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the FIFO size. Transfer performance is lower, with GPDMA re-arbitration between effective and lower singles/bursts, but the data integrity is guaranteed.
  - name: PAM
    bit_range:
    - 12
    - 11
    description: |-
      padding/alignment mode
      If DDW_LOG2[1:0] = SDW_LOG2[1:0]: if the data width of a burst destination transfer is equal to the data width of a burst source transfer, these bits are ignored.
      Else, in the following enumerated values, the condition PAM_1 is when destination data width is higher that source data width, and the condition PAM_2 is when destination data width is higher than source data width.
      1x: successive source data are FIFO queued and packed at the destination data width, in a left (LSB) to right (MSB) order (named little endian), before a destination transfer
      1x: source data is FIFO queued and unpacked at the destination data width, to be transferred in a left (LSB) to right (MSB) order (named little endian) to the destination
      Note: If the transfer from the source peripheral is configured with peripheral flow-control mode (SWREQ = 0 and PFREQ = 1 and DREQ = 0), and if the destination data width   the source data width, packing is not supported.
  - name: SBX
    bit_range:
    - 13
    - 13
    description: |-
      source byte exchange within the unaligned half-word of each source word
      If the source data width is shorter than a word, this bit is ignored.
      If the source data width is a word:
  - name: SAP
    bit_range:
    - 14
    - 14
    description: |-
      source allocated port
      This bit is used to allocate the master port for the source transfer
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  - name: SSEC
    bit_range:
    - 15
    - 15
    description: |-
      security attribute of the GPDMA transfer from the source
      If GPDMA_SECCFGR.SECx = 1 and the access is secure:
      This is a secure register bit. This bit can only be read by a secure software. This bit must be written by a secure software when GPDMA_SECCFGR.SECx =1 . A secure write is ignored when GPDMA_SECCFGR.SECx = 0.
      When GPDMA_SECCFGR.SECx is de-asserted, this SSEC bit is also de-asserted by hardware (on a secure reconfiguration of the channel as non-secure), and the GPDMA transfer from the source is non-secure.
  - name: DDW_LOG2
    bit_range:
    - 17
    - 16
    description: |-
      binary logarithm of the destination data width of a burst, in bytes
      Note: Setting a 8-byte data width causes a user setting error to be reported and none transfer is issued.
      A destination burst transfer must have an aligned address with its data width (start address GPDMA_CxDAR[2:0] and address offset GPDMA_CxTR3.DAO[2:0], versus DDW_LOG2[1:0]). Otherwise a user setting error is reported and no transfer is issued.
  - name: DINC
    bit_range:
    - 19
    - 19
    description: |-
      destination incrementing burst
      The destination address, pointed by GPDMA_CxDAR, is kept constant after a burst beat/single transfer, or is incremented by the offset value corresponding to a contiguous data after a burst beat/single transfer.
  - name: DBL_1
    bit_range:
    - 25
    - 20
    description: |-
      destination burst length minus 1, between 0 and 63
      The burst length unit is one data named beat within a burst. If DBL_1[5:0] =0 , the burst can be named as single. Each data/beat has a width defined by the destination data width DDW_LOG2[1:0].
      Note: If a burst transfer crossed a 1-Kbyte address boundary on a AHB transfer, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the AHB protocol.
      If a burst transfer is of length greater than the FIFO size of the channel x, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the FIFO size. Transfer performance is lower, with GPDMA re-arbitration between effective and lower singles/bursts, but the data integrity is guaranteed.
  - name: DBX
    bit_range:
    - 26
    - 26
    description: |-
      destination byte exchange
      If the destination data size is a byte, this bit is ignored.
      If the destination data size is not a byte:
  - name: DHX
    bit_range:
    - 27
    - 27
    description: |-
      destination half-word exchange
      If the destination data size is shorter than a word, this bit is ignored.
      If the destination data size is a word:
  - name: DAP
    bit_range:
    - 30
    - 30
    description: |-
      destination allocated port
      This bit is used to allocate the master port for the destination transfer
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  - name: DSEC
    bit_range:
    - 31
    - 31
    description: |-
      security attribute of the GPDMA transfer to the destination
      If GPDMA_SECCFGR.SECx = 1 and the access is secure:
      This is a secure register bit. This bit can only be read by a secure software. This bit must be written by a secure software when GPDMA_SECCFGR.SECx = 1. A secure write is ignored when GPDMA_SECCFGR.SECx = 0.
      When GPDMA_SECCFGR.SECx is de-asserted, this DSEC bit is also de-asserted by hardware (on a secure reconfiguration of the channel as non-secure), and the GPDMA transfer to the destination is non-secure.
  side_effects: null
- id: GPDMA_C1TR2
  address_offset: 276
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: REQSEL
    bit_range:
    - 7
    - 0
    description: |-
      GPDMA hardware request selection
      These bits are ignored if channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer). Else, the selected hardware request is internally taken into account as per .
      The user must not assign a same input hardware request (same REQSEL[7:0] value) to different active GPDMA channels (GPDMA_CxCR.EN = 1 and GPDMA_CxTR2.SWREQ = 0 for these channels). GPDMA is not intended to hardware support the case of simultaneous enabled channels incorrectly configured with a same hardware peripheral request signal, and there is no user setting error reporting.
  - name: SWREQ
    bit_range:
    - 9
    - 9
    description: |-
      software request
      This bit is internally taken into account when GPDMA_CxCR.EN is asserted.
  - name: DREQ
    bit_range:
    - 10
    - 10
    description: |-
      destination hardware request
      This bit is ignored if channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer). Else:
      Note: If the channel x is activated (GPDMA_CxCR.EN is asserted) with SWREQ = 0 and PFREQ = 1 (peripheral hardware request with peripheral flow-control mode), any software assertion to this DREQ bit is ignored: in peripheral flow-control mode, only a peripheral-to-memory transfer is supported.
  - name: BREQ
    bit_range:
    - 11
    - 11
    description: |-
      Block hardware request
      If the channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer), this bit is ignored. Else:
  - name: PFREQ
    bit_range:
    - 12
    - 12
    description: |-
      Hardware request in peripheral flow control mode
      Important: If a given channel x is not implemented with this feature, this bit is reserved and PFREQ is not present (see  for the list of the implemented channels with this feature.
      If the channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer), this bit is ignored. Else:
      Note: In peripheral flow control mode, there are the following restrictions:
      - no 2D/repeated block support (GPDMA_CxBR1.BRC[10:0] must be set to 0 if present)
      - the peripheral must be set as the source of the transfer (DREQ = 0).
      - data packing to a wider destination width is not supported (if destination width   source data width, GPDMA_CxTR1.PAM[1] must be set to 0).
      - GPDMA_CxBR1.BNDT[15:0] must be programmed as a multiple of the source (peripheral) burst size.
  - name: TRIGM
    bit_range:
    - 15
    - 14
    description: |-
      trigger mode
      These bits define the transfer granularity for its conditioning by the trigger.
  - name: TRIGSEL
    bit_range:
    - 21
    - 16
    description: |-
      trigger event input selection
      These bits select the trigger event input of the GPDMA transfer (as per ), with an active trigger event if TRIGPOL[1:0] different  00.
  - name: TRIGPOL
    bit_range:
    - 25
    - 24
    description: |-
      trigger event polarity
      These bits define the polarity of the selected trigger event input defined by TRIGSEL[5:0].
  - name: TCEM
    bit_range:
    - 31
    - 30
    description: |-
      transfer complete event mode
      These bits define the transfer granularity for the transfer complete and half transfer complete events generation.
      Note: If the initial LLI0 data transfer is null/void (directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] = 0), then neither the complete transfer event nor the half transfer event is generated.
      Note: If the initial LLI0 data transfer is null/void (directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] = 0), then neither the complete transfer event nor the half transfer event is generated.
      Note: If the initial LLI0 data transfer is null/void (i.e. directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] =0 ), then the half transfer event is not generated, and the transfer complete event is generated when is completed the loading of the LLI1.
  side_effects: null
- id: GPDMA_C1BR1
  address_offset: 280
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: BNDT
    bit_range:
    - 15
    - 0
    description: |-
      block number of data bytes to transfer from the source
      Block size transferred from the source. When the channel is enabled, this field becomes read-only and is decremented, indicating the remaining number of data items in the current source block to be transferred. BNDT[15:0] is programmed in number of bytes, maximum source block size is 64 Kbytes -1.
      Once the last data transfer is completed (BNDT[15:0] = 0):
      - if GPDMA_CxLLR.UB1 = 1, this field is updated by the LLI in the memory.
      - if GPDMA_CxLLR.UB1 = 0 and if there is at least one non null Uxx update bit, this field is internally restored to the programmed value.
      - if all GPDMA_CxLLR.Uxx = 0 and if GPDMA_CxLLR.LA[15:0] = 0, this field is internally restored to the programmed value (infinite/continuous last LLI).
      - if GPDMA_CxLLR = 0, this field is kept as zero following the last LLI data transfer.
      Note: A non-null source block size must be a multiple of the source data width (BNDT[2:0] versus GPDMA_CxTR1.SDW_LOG2[1:0]). Else a user setting error is reported and no transfer is issued.
      When configured in packing mode (GPDMA_CxTR1.PAM[1] = 1 and destination data width different from source data width), a non-null source block size must be a multiple of the destination data width (BNDT[2:0] versus GPDMA_CxTR1.DDW_LOG2[1:0]). Else a user setting error is reported and no transfer is issued.
  side_effects: null
- id: GPDMA_C1SAR
  address_offset: 284
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SA
    bit_range:
    - 31
    - 0
    description: |-
      source address
      This field is the pointer to the address from which the next data is read.
      During the channel activity, depending on the source addressing mode (GPDMA_CxTR1.SINC), this field is kept fixed or incremented by the data width (GPDMA_CxTR1.SDW_LOG2[1:0]) after each burst source data, reflecting the next address from which data is read.
      During the channel activity, this address is updated after each completed source burst, consequently to:
      the programmed source burst; either in fixed addressing mode or in contiguous-data incremented mode. If contiguously incremented (GPDMA_CxTR1.SINC = 1), then the additional address offset value is the programmed burst size, as defined by GPDMA_CxTR1.SBL_1[5:0] and GPDMA_CxTR1.SDW_LOG2[21:0]
      the additional source incremented/decremented offset value as programmed by GPDMA_CxBR1.SDEC and GPDMA_CxTR3.SAO[12:0]
      once/if completed source block transfer, for a channel x with 2D addressing capability (x = 12 to 15). additional block repeat source incremented/decremented offset value as programmed by GPDMA_CxBR1.BRSDEC and GPDMA_CxBR2.BRSAO[15:0]
      In linked-list mode, after a LLI data transfer is completed, this register is automatically updated by GPDMA from the memory, provided the LLI is set with GPDMA_CxLLR.USA = 1.
      Note: A source address must be aligned with the programmed data width of a source burst (SA[2:0] versus GPDMA_CxTR1.SDW_LOG2[1:0]). Else, a user setting error is reported and no transfer is issued.
      When the source block size is not a multiple of the source burst size and is a multiple of the source data width, the last programmed source burst is not completed and is internally shorten to match the block size. In this case, the additional GPDMA_CxTR3.SAO[12:0] is not applied.
  side_effects: null
- id: GPDMA_C1DAR
  address_offset: 288
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: DA
    bit_range:
    - 31
    - 0
    description: |-
      destination address
      This field is the pointer to the address from which the next data is written.
      During the channel activity, depending on the destination addressing mode (GPDMA_CxTR1.DINC), this field is kept fixed or incremented by the data width (GPDMA_CxTR1.DDW_LOG2[21:0]) after each burst destination data, reflecting the next address from which data is written.
      During the channel activity, this address is updated after each completed destination burst, consequently to:
      the programmed destination burst; either in fixed addressing mode or in contiguous-data incremented mode. If contiguously incremented (GPDMA_CxTR1.DINC = 1), then the additional address offset value is the programmed burst size, as defined by GPDMA_CxTR1.DBL_1[5:0] and GPDMA_CxTR1.DDW_LOG2[1:0]
      the additional destination incremented/decremented offset value as programmed by GPDMA_CxBR1.DDEC and GPDMA_CxTR3.DAO[12:0]
      once/if completed destination block transfer, for a channel x with 2D addressing capability (x = 12 to 15), the additional block repeat destination incremented/decremented offset value as programmed by GPDMA_CxBR1.BRDDEC and GPDMA_CxBR2.BRDAO[15:0]
      In linked-list mode, after a LLI data transfer is completed, this register is automatically updated by the GPDMA from the memory, provided the LLI is set with GPDMA_CxLLR.UDA = 1.
      Note: A destination address must be aligned with the programmed data width of a destination burst (DA[2:0] versus GPDMA_CxTR1.DDW_LOG2[1:0]). Else, a user setting error is reported and no transfer is issued.
  side_effects: null
- id: GPDMA_C1LLR
  address_offset: 332
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LA
    bit_range:
    - 15
    - 2
    description: |-
      pointer (16-bit low-significant address) to the next linked-list data structure
      If UT1 = UT2 = UB1 = USA = UDA = ULL = 0 and if LA[15:20] = 0, the current LLI is the last one. The channel transfer is completed without any update of the linked-list GPDMA register file.
      Else, this field is the pointer to the memory address offset from which the next linked-list data structure is automatically fetched from, once the data transfer is completed, in order to conditionally update the linked-list GPDMA internal register file (GPDMA_CxCTR1, GPDMA_CxTR2, GPDMA_CxBR1, GPDMA_CxSAR, GPDMA_CxDAR and GPDMA_CxLLR).
      Note: The user must program the pointer to be 32-bit aligned. The two low-significant bits are write ignored.
  - name: ULL
    bit_range:
    - 16
    - 16
    description: |-
      Update GPDMA_CxLLR register from memory
      This bit is used to control the update of GPDMA_CxLLR from the memory during the link transfer.
  - name: UDA
    bit_range:
    - 27
    - 27
    description: |-
      Update GPDMA_CxDAR register from memory
      This bit is used to control the update of GPDMA_CxDAR from the memory during the link transfer.
  - name: USA
    bit_range:
    - 28
    - 28
    description: |-
      update GPDMA_CxSAR from memory
      This bit controls the update of GPDMA_CxSAR from the memory during the link transfer.
  - name: UB1
    bit_range:
    - 29
    - 29
    description: |-
      Update GPDMA_CxBR1 from memory
      This bit controls the update of GPDMA_CxBR1 from the memory during the link transfer. If UB1 = 0 and if GPDMA_CxLLR different  0, the linked-list is not completed. GPDMA_CxBR1.BNDT[15:0] is then restored to the programmed value after data transfer is completed and before the link transfer.
  - name: UT2
    bit_range:
    - 30
    - 30
    description: |-
      Update GPDMA_CxTR2 from memory
      This bit controls the update of GPDMA_CxTR2 from the memory during the link transfer.
  - name: UT1
    bit_range:
    - 31
    - 31
    description: |-
      Update GPDMA_CxTR1 from memory
      This bit controls the update of GPDMA_CxTR1 from the memory during the link transfer.
  side_effects: null
- id: GPDMA_C2LBAR
  address_offset: 336
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LBA
    bit_range:
    - 31
    - 16
    description: linked-list base address of GPDMA channel x
  side_effects: null
- id: GPDMA_C2FCR
  address_offset: 348
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TCF
    bit_range:
    - 8
    - 8
    description: transfer complete flag clear
  - name: HTF
    bit_range:
    - 9
    - 9
    description: half transfer flag clear
  - name: DTEF
    bit_range:
    - 10
    - 10
    description: data transfer error flag clear
  - name: ULEF
    bit_range:
    - 11
    - 11
    description: update link transfer error flag clear
  - name: USEF
    bit_range:
    - 12
    - 12
    description: user setting error flag clear
  - name: SUSPF
    bit_range:
    - 13
    - 13
    description: completed suspension flag clear
  - name: TOF
    bit_range:
    - 14
    - 14
    description: trigger overrun flag clear
  side_effects: null
- id: GPDMA_C2SR
  address_offset: 352
  size: 32
  access: READ_WRITE
  reset_value: 1
  fields:
  - name: IDLEF
    bit_range:
    - 0
    - 0
    description: |-
      idle flag
      This idle flag is de-asserted by hardware when the channel is enabled (GPDMA_CxCR.EN = 1) with a valid channel configuration (no USEF to be immediately reported).
      This idle flag is asserted after hard reset or by hardware when the channel is back in idle state (in suspended or disabled state).
  - name: TCF
    bit_range:
    - 8
    - 8
    description: |-
      transfer complete flag
      A transfer complete event is either a block transfer complete, a 2D/repeated block transfer complete, a LLI transfer complete including the upload of the next LLI if any, or the full linked-list completion, depending on the transfer complete event mode (GPDMA_CxTR2.TCEM[1:0]).
  - name: HTF
    bit_range:
    - 9
    - 9
    description: |-
      half transfer flag
      A half transfer event is either a half block transfer or a half 2D/repeated block transfer, depending on the transfer complete event mode (GPDMA_CxTR2.TCEM[1:0]).
      A half block transfer occurs when half of the bytes of the source block size (rounded up integer of GPDMA_CxBR1.BNDT[15:0]/2) has been transferred to the destination.
      A half 2D/repeated block transfer occurs when half of the repeated blocks (rounded up integer of (GPDMA_CxBR1.BRC[10:0]+1)/2)) has been transferred to the destination.
  - name: DTEF
    bit_range:
    - 10
    - 10
    description: data transfer error flag
  - name: ULEF
    bit_range:
    - 11
    - 11
    description: update link transfer error flag
  - name: USEF
    bit_range:
    - 12
    - 12
    description: user setting error flag
  - name: SUSPF
    bit_range:
    - 13
    - 13
    description: completed suspension flag
  - name: TOF
    bit_range:
    - 14
    - 14
    description: trigger overrun flag
  - name: FIFOL
    bit_range:
    - 23
    - 16
    description: |-
      monitored FIFO level
      Number of available write beats in the FIFO, in units of the programmed destination data width (see GPDMA_CxTR1.DDW_LOG2[1:0], in units of bytes, half-words, or words).
      Note: After having suspended an active transfer, the user may need to read FIFOL[7:0], additionally to GPDMA_CxBR1.BDNT[15:0] and GPDMA_CxBR1.BRC[10:0], to know how many data have been transferred to the destination. Before reading, the user may wait for the transfer to be suspended (GPDMA_CxSR.SUSPF = 1).
  side_effects: null
- id: GPDMA_C2CR
  address_offset: 356
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: EN
    bit_range:
    - 0
    - 0
    description: |-
      enable
      Writing 1 into the field RESET (bit 1) causes the hardware to de-assert this bit, whatever is written into this bit 0. Else:
      this bit is de-asserted by hardware when there is a transfer error (master bus error or user setting error) or when there is a channel transfer complete (channel ready to be configured, e.g. if LSM=1 at the end of a single execution of the LLI).
      Else, this bit can be asserted by software.
      Writing 0 into this EN bit is ignored.
  - name: RESET
    bit_range:
    - 1
    - 1
    description: |-
      reset
      This bit is write only. Writing 0 has no impact. Writing 1 implies the reset of the following: the FIFO, the channel internal state, SUSP and EN bits (whatever is written receptively in bit 2 and bit 0).
      The reset is effective when the channel is in steady state, meaning one of the following:
      - active channel in suspended state (GPDMA_CxSR.SUSPF = 1 and GPDMA_CxSR.IDLEF = GPDMA_CxCR.EN = 1)
      - channel in disabled state (GPDMA_CxSR.IDLEF = 1 and GPDMA_CxCR.EN = 0).
      After writing a RESET, to continue using this channel, the user must explicitly reconfigure the channel including the hardware-modified configuration registers (GPDMA_CxBR1, GPDMA_CxSAR and GPDMA_CxDAR) before enabling again the channel (see the programming sequence in ).
  - name: SUSP
    bit_range:
    - 2
    - 2
    description: |-
      suspend
      Writing 1 into the field RESET (bit 1) causes the hardware to de-assert this bit, whatever is written into this bit 2. Else:
      Software must write 1 in order to suspend an active channel i.e. a channel with an ongoing GPDMA transfer over its master ports.
      The software must write 0 in order to resume a suspended channel, following the programming sequence detailed in .
  - name: TCIE
    bit_range:
    - 8
    - 8
    description: transfer complete interrupt enable
  - name: HTIE
    bit_range:
    - 9
    - 9
    description: half transfer complete interrupt enable
  - name: DTEIE
    bit_range:
    - 10
    - 10
    description: data transfer error interrupt enable
  - name: ULEIE
    bit_range:
    - 11
    - 11
    description: update link transfer error interrupt enable
  - name: USEIE
    bit_range:
    - 12
    - 12
    description: user setting error interrupt enable
  - name: SUSPIE
    bit_range:
    - 13
    - 13
    description: completed suspension interrupt enable
  - name: TOIE
    bit_range:
    - 14
    - 14
    description: trigger overrun interrupt enable
  - name: LSM
    bit_range:
    - 16
    - 16
    description: |-
      Link step mode
      First the (possible 1D/repeated) block transfer is executed as defined by the current internal register file until GPDMA_CxBR1.BNDT[15:0] = 0 and GPDMA_CxBR1.BRC[10:0] = 0 if present. Secondly the next linked-list data structure is conditionally uploaded from memory as defined by GPDMA_CxLLR. Then channel execution is completed.
      Note: This bit must be written when EN=0. This bit is read-only when EN=1.
  - name: LAP
    bit_range:
    - 17
    - 17
    description: |-
      linked-list allocated port
      This bit is used to allocate the master port for the update of the GPDMA linked-list registers from the memory.
      Note: This bit must be written when EN=0. This bit is read-only when EN=1.
  - name: PRIO
    bit_range:
    - 23
    - 22
    description: |-
      priority level of the channel x GPDMA transfer versus others
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  side_effects: null
- id: GPDMA_C2TR1
  address_offset: 400
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SDW_LOG2
    bit_range:
    - 1
    - 0
    description: |-
      binary logarithm of the source data width of a burst in bytes
      Note: Setting a 8-byte data width causes a user setting error to be reported and no transfer is issued.
      A source block size must be a multiple of the source data width (GPDMA_CxBR1.BNDT[2:0] versus SDW_LOG2[1:0]). Otherwise, a user setting error is reported and no transfer is issued.
      A source burst transfer must have an aligned address with its data width (start address GPDMA_CxSAR[2:0] versus SDW_LOG2[1:0]). Otherwise, a user setting error is reported and none transfer is issued.
  - name: SINC
    bit_range:
    - 3
    - 3
    description: |-
      source incrementing burst
      The source address, pointed by GPDMA_CxSAR, is kept constant after a burst beat/single transfer or is incremented by the offset value corresponding to a contiguous data after a burst beat/single transfer.
  - name: SBL_1
    bit_range:
    - 9
    - 4
    description: |-
      source burst length minus 1, between 0 and 63
      The burst length unit is one data named beat within a burst. If SBL_1[5:0] =0 , the burst can be named as single. Each data/beat has a width defined by the destination data width SDW_LOG2[1:0].
      Note: If a burst transfer crossed a 1-Kbyte address boundary on a AHB transfer, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the AHB protocol.
      If a burst transfer is of length greater than the FIFO size of the channel x, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the FIFO size. Transfer performance is lower, with GPDMA re-arbitration between effective and lower singles/bursts, but the data integrity is guaranteed.
  - name: PAM
    bit_range:
    - 12
    - 11
    description: |-
      padding/alignment mode
      If DDW_LOG2[1:0] = SDW_LOG2[1:0]: if the data width of a burst destination transfer is equal to the data width of a burst source transfer, these bits are ignored.
      Else, in the following enumerated values, the condition PAM_1 is when destination data width is higher that source data width, and the condition PAM_2 is when destination data width is higher than source data width.
      1x: successive source data are FIFO queued and packed at the destination data width, in a left (LSB) to right (MSB) order (named little endian), before a destination transfer
      1x: source data is FIFO queued and unpacked at the destination data width, to be transferred in a left (LSB) to right (MSB) order (named little endian) to the destination
      Note: If the transfer from the source peripheral is configured with peripheral flow-control mode (SWREQ = 0 and PFREQ = 1 and DREQ = 0), and if the destination data width   the source data width, packing is not supported.
  - name: SBX
    bit_range:
    - 13
    - 13
    description: |-
      source byte exchange within the unaligned half-word of each source word
      If the source data width is shorter than a word, this bit is ignored.
      If the source data width is a word:
  - name: SAP
    bit_range:
    - 14
    - 14
    description: |-
      source allocated port
      This bit is used to allocate the master port for the source transfer
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  - name: SSEC
    bit_range:
    - 15
    - 15
    description: |-
      security attribute of the GPDMA transfer from the source
      If GPDMA_SECCFGR.SECx = 1 and the access is secure:
      This is a secure register bit. This bit can only be read by a secure software. This bit must be written by a secure software when GPDMA_SECCFGR.SECx =1 . A secure write is ignored when GPDMA_SECCFGR.SECx = 0.
      When GPDMA_SECCFGR.SECx is de-asserted, this SSEC bit is also de-asserted by hardware (on a secure reconfiguration of the channel as non-secure), and the GPDMA transfer from the source is non-secure.
  - name: DDW_LOG2
    bit_range:
    - 17
    - 16
    description: |-
      binary logarithm of the destination data width of a burst, in bytes
      Note: Setting a 8-byte data width causes a user setting error to be reported and none transfer is issued.
      A destination burst transfer must have an aligned address with its data width (start address GPDMA_CxDAR[2:0] and address offset GPDMA_CxTR3.DAO[2:0], versus DDW_LOG2[1:0]). Otherwise a user setting error is reported and no transfer is issued.
  - name: DINC
    bit_range:
    - 19
    - 19
    description: |-
      destination incrementing burst
      The destination address, pointed by GPDMA_CxDAR, is kept constant after a burst beat/single transfer, or is incremented by the offset value corresponding to a contiguous data after a burst beat/single transfer.
  - name: DBL_1
    bit_range:
    - 25
    - 20
    description: |-
      destination burst length minus 1, between 0 and 63
      The burst length unit is one data named beat within a burst. If DBL_1[5:0] =0 , the burst can be named as single. Each data/beat has a width defined by the destination data width DDW_LOG2[1:0].
      Note: If a burst transfer crossed a 1-Kbyte address boundary on a AHB transfer, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the AHB protocol.
      If a burst transfer is of length greater than the FIFO size of the channel x, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the FIFO size. Transfer performance is lower, with GPDMA re-arbitration between effective and lower singles/bursts, but the data integrity is guaranteed.
  - name: DBX
    bit_range:
    - 26
    - 26
    description: |-
      destination byte exchange
      If the destination data size is a byte, this bit is ignored.
      If the destination data size is not a byte:
  - name: DHX
    bit_range:
    - 27
    - 27
    description: |-
      destination half-word exchange
      If the destination data size is shorter than a word, this bit is ignored.
      If the destination data size is a word:
  - name: DAP
    bit_range:
    - 30
    - 30
    description: |-
      destination allocated port
      This bit is used to allocate the master port for the destination transfer
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  - name: DSEC
    bit_range:
    - 31
    - 31
    description: |-
      security attribute of the GPDMA transfer to the destination
      If GPDMA_SECCFGR.SECx = 1 and the access is secure:
      This is a secure register bit. This bit can only be read by a secure software. This bit must be written by a secure software when GPDMA_SECCFGR.SECx = 1. A secure write is ignored when GPDMA_SECCFGR.SECx = 0.
      When GPDMA_SECCFGR.SECx is de-asserted, this DSEC bit is also de-asserted by hardware (on a secure reconfiguration of the channel as non-secure), and the GPDMA transfer to the destination is non-secure.
  side_effects: null
- id: GPDMA_C2TR2
  address_offset: 404
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: REQSEL
    bit_range:
    - 7
    - 0
    description: |-
      GPDMA hardware request selection
      These bits are ignored if channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer). Else, the selected hardware request is internally taken into account as per .
      The user must not assign a same input hardware request (same REQSEL[7:0] value) to different active GPDMA channels (GPDMA_CxCR.EN = 1 and GPDMA_CxTR2.SWREQ = 0 for these channels). GPDMA is not intended to hardware support the case of simultaneous enabled channels incorrectly configured with a same hardware peripheral request signal, and there is no user setting error reporting.
  - name: SWREQ
    bit_range:
    - 9
    - 9
    description: |-
      software request
      This bit is internally taken into account when GPDMA_CxCR.EN is asserted.
  - name: DREQ
    bit_range:
    - 10
    - 10
    description: |-
      destination hardware request
      This bit is ignored if channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer). Else:
      Note: If the channel x is activated (GPDMA_CxCR.EN is asserted) with SWREQ = 0 and PFREQ = 1 (peripheral hardware request with peripheral flow-control mode), any software assertion to this DREQ bit is ignored: in peripheral flow-control mode, only a peripheral-to-memory transfer is supported.
  - name: BREQ
    bit_range:
    - 11
    - 11
    description: |-
      Block hardware request
      If the channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer), this bit is ignored. Else:
  - name: PFREQ
    bit_range:
    - 12
    - 12
    description: |-
      Hardware request in peripheral flow control mode
      Important: If a given channel x is not implemented with this feature, this bit is reserved and PFREQ is not present (see  for the list of the implemented channels with this feature.
      If the channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer), this bit is ignored. Else:
      Note: In peripheral flow control mode, there are the following restrictions:
      - no 2D/repeated block support (GPDMA_CxBR1.BRC[10:0] must be set to 0 if present)
      - the peripheral must be set as the source of the transfer (DREQ = 0).
      - data packing to a wider destination width is not supported (if destination width   source data width, GPDMA_CxTR1.PAM[1] must be set to 0).
      - GPDMA_CxBR1.BNDT[15:0] must be programmed as a multiple of the source (peripheral) burst size.
  - name: TRIGM
    bit_range:
    - 15
    - 14
    description: |-
      trigger mode
      These bits define the transfer granularity for its conditioning by the trigger.
  - name: TRIGSEL
    bit_range:
    - 21
    - 16
    description: |-
      trigger event input selection
      These bits select the trigger event input of the GPDMA transfer (as per ), with an active trigger event if TRIGPOL[1:0] different  00.
  - name: TRIGPOL
    bit_range:
    - 25
    - 24
    description: |-
      trigger event polarity
      These bits define the polarity of the selected trigger event input defined by TRIGSEL[5:0].
  - name: TCEM
    bit_range:
    - 31
    - 30
    description: |-
      transfer complete event mode
      These bits define the transfer granularity for the transfer complete and half transfer complete events generation.
      Note: If the initial LLI0 data transfer is null/void (directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] = 0), then neither the complete transfer event nor the half transfer event is generated.
      Note: If the initial LLI0 data transfer is null/void (directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] = 0), then neither the complete transfer event nor the half transfer event is generated.
      Note: If the initial LLI0 data transfer is null/void (i.e. directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] =0 ), then the half transfer event is not generated, and the transfer complete event is generated when is completed the loading of the LLI1.
  side_effects: null
- id: GPDMA_C2BR1
  address_offset: 408
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: BNDT
    bit_range:
    - 15
    - 0
    description: |-
      block number of data bytes to transfer from the source
      Block size transferred from the source. When the channel is enabled, this field becomes read-only and is decremented, indicating the remaining number of data items in the current source block to be transferred. BNDT[15:0] is programmed in number of bytes, maximum source block size is 64 Kbytes -1.
      Once the last data transfer is completed (BNDT[15:0] = 0):
      - if GPDMA_CxLLR.UB1 = 1, this field is updated by the LLI in the memory.
      - if GPDMA_CxLLR.UB1 = 0 and if there is at least one non null Uxx update bit, this field is internally restored to the programmed value.
      - if all GPDMA_CxLLR.Uxx = 0 and if GPDMA_CxLLR.LA[15:0] = 0, this field is internally restored to the programmed value (infinite/continuous last LLI).
      - if GPDMA_CxLLR = 0, this field is kept as zero following the last LLI data transfer.
      Note: A non-null source block size must be a multiple of the source data width (BNDT[2:0] versus GPDMA_CxTR1.SDW_LOG2[1:0]). Else a user setting error is reported and no transfer is issued.
      When configured in packing mode (GPDMA_CxTR1.PAM[1] = 1 and destination data width different from source data width), a non-null source block size must be a multiple of the destination data width (BNDT[2:0] versus GPDMA_CxTR1.DDW_LOG2[1:0]). Else a user setting error is reported and no transfer is issued.
  side_effects: null
- id: GPDMA_C2SAR
  address_offset: 412
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SA
    bit_range:
    - 31
    - 0
    description: |-
      source address
      This field is the pointer to the address from which the next data is read.
      During the channel activity, depending on the source addressing mode (GPDMA_CxTR1.SINC), this field is kept fixed or incremented by the data width (GPDMA_CxTR1.SDW_LOG2[1:0]) after each burst source data, reflecting the next address from which data is read.
      During the channel activity, this address is updated after each completed source burst, consequently to:
      the programmed source burst; either in fixed addressing mode or in contiguous-data incremented mode. If contiguously incremented (GPDMA_CxTR1.SINC = 1), then the additional address offset value is the programmed burst size, as defined by GPDMA_CxTR1.SBL_1[5:0] and GPDMA_CxTR1.SDW_LOG2[21:0]
      the additional source incremented/decremented offset value as programmed by GPDMA_CxBR1.SDEC and GPDMA_CxTR3.SAO[12:0]
      once/if completed source block transfer, for a channel x with 2D addressing capability (x = 12 to 15). additional block repeat source incremented/decremented offset value as programmed by GPDMA_CxBR1.BRSDEC and GPDMA_CxBR2.BRSAO[15:0]
      In linked-list mode, after a LLI data transfer is completed, this register is automatically updated by GPDMA from the memory, provided the LLI is set with GPDMA_CxLLR.USA = 1.
      Note: A source address must be aligned with the programmed data width of a source burst (SA[2:0] versus GPDMA_CxTR1.SDW_LOG2[1:0]). Else, a user setting error is reported and no transfer is issued.
      When the source block size is not a multiple of the source burst size and is a multiple of the source data width, the last programmed source burst is not completed and is internally shorten to match the block size. In this case, the additional GPDMA_CxTR3.SAO[12:0] is not applied.
  side_effects: null
- id: GPDMA_C2DAR
  address_offset: 416
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: DA
    bit_range:
    - 31
    - 0
    description: |-
      destination address
      This field is the pointer to the address from which the next data is written.
      During the channel activity, depending on the destination addressing mode (GPDMA_CxTR1.DINC), this field is kept fixed or incremented by the data width (GPDMA_CxTR1.DDW_LOG2[21:0]) after each burst destination data, reflecting the next address from which data is written.
      During the channel activity, this address is updated after each completed destination burst, consequently to:
      the programmed destination burst; either in fixed addressing mode or in contiguous-data incremented mode. If contiguously incremented (GPDMA_CxTR1.DINC = 1), then the additional address offset value is the programmed burst size, as defined by GPDMA_CxTR1.DBL_1[5:0] and GPDMA_CxTR1.DDW_LOG2[1:0]
      the additional destination incremented/decremented offset value as programmed by GPDMA_CxBR1.DDEC and GPDMA_CxTR3.DAO[12:0]
      once/if completed destination block transfer, for a channel x with 2D addressing capability (x = 12 to 15), the additional block repeat destination incremented/decremented offset value as programmed by GPDMA_CxBR1.BRDDEC and GPDMA_CxBR2.BRDAO[15:0]
      In linked-list mode, after a LLI data transfer is completed, this register is automatically updated by the GPDMA from the memory, provided the LLI is set with GPDMA_CxLLR.UDA = 1.
      Note: A destination address must be aligned with the programmed data width of a destination burst (DA[2:0] versus GPDMA_CxTR1.DDW_LOG2[1:0]). Else, a user setting error is reported and no transfer is issued.
  side_effects: null
- id: GPDMA_C2LLR
  address_offset: 460
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LA
    bit_range:
    - 15
    - 2
    description: |-
      pointer (16-bit low-significant address) to the next linked-list data structure
      If UT1 = UT2 = UB1 = USA = UDA = ULL = 0 and if LA[15:20] = 0, the current LLI is the last one. The channel transfer is completed without any update of the linked-list GPDMA register file.
      Else, this field is the pointer to the memory address offset from which the next linked-list data structure is automatically fetched from, once the data transfer is completed, in order to conditionally update the linked-list GPDMA internal register file (GPDMA_CxCTR1, GPDMA_CxTR2, GPDMA_CxBR1, GPDMA_CxSAR, GPDMA_CxDAR and GPDMA_CxLLR).
      Note: The user must program the pointer to be 32-bit aligned. The two low-significant bits are write ignored.
  - name: ULL
    bit_range:
    - 16
    - 16
    description: |-
      Update GPDMA_CxLLR register from memory
      This bit is used to control the update of GPDMA_CxLLR from the memory during the link transfer.
  - name: UDA
    bit_range:
    - 27
    - 27
    description: |-
      Update GPDMA_CxDAR register from memory
      This bit is used to control the update of GPDMA_CxDAR from the memory during the link transfer.
  - name: USA
    bit_range:
    - 28
    - 28
    description: |-
      update GPDMA_CxSAR from memory
      This bit controls the update of GPDMA_CxSAR from the memory during the link transfer.
  - name: UB1
    bit_range:
    - 29
    - 29
    description: |-
      Update GPDMA_CxBR1 from memory
      This bit controls the update of GPDMA_CxBR1 from the memory during the link transfer. If UB1 = 0 and if GPDMA_CxLLR different  0, the linked-list is not completed. GPDMA_CxBR1.BNDT[15:0] is then restored to the programmed value after data transfer is completed and before the link transfer.
  - name: UT2
    bit_range:
    - 30
    - 30
    description: |-
      Update GPDMA_CxTR2 from memory
      This bit controls the update of GPDMA_CxTR2 from the memory during the link transfer.
  - name: UT1
    bit_range:
    - 31
    - 31
    description: |-
      Update GPDMA_CxTR1 from memory
      This bit controls the update of GPDMA_CxTR1 from the memory during the link transfer.
  side_effects: null
- id: GPDMA_C3LBAR
  address_offset: 464
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LBA
    bit_range:
    - 31
    - 16
    description: linked-list base address of GPDMA channel x
  side_effects: null
- id: GPDMA_C3FCR
  address_offset: 476
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TCF
    bit_range:
    - 8
    - 8
    description: transfer complete flag clear
  - name: HTF
    bit_range:
    - 9
    - 9
    description: half transfer flag clear
  - name: DTEF
    bit_range:
    - 10
    - 10
    description: data transfer error flag clear
  - name: ULEF
    bit_range:
    - 11
    - 11
    description: update link transfer error flag clear
  - name: USEF
    bit_range:
    - 12
    - 12
    description: user setting error flag clear
  - name: SUSPF
    bit_range:
    - 13
    - 13
    description: completed suspension flag clear
  - name: TOF
    bit_range:
    - 14
    - 14
    description: trigger overrun flag clear
  side_effects: null
- id: GPDMA_C3SR
  address_offset: 480
  size: 32
  access: READ_WRITE
  reset_value: 1
  fields:
  - name: IDLEF
    bit_range:
    - 0
    - 0
    description: |-
      idle flag
      This idle flag is de-asserted by hardware when the channel is enabled (GPDMA_CxCR.EN = 1) with a valid channel configuration (no USEF to be immediately reported).
      This idle flag is asserted after hard reset or by hardware when the channel is back in idle state (in suspended or disabled state).
  - name: TCF
    bit_range:
    - 8
    - 8
    description: |-
      transfer complete flag
      A transfer complete event is either a block transfer complete, a 2D/repeated block transfer complete, a LLI transfer complete including the upload of the next LLI if any, or the full linked-list completion, depending on the transfer complete event mode (GPDMA_CxTR2.TCEM[1:0]).
  - name: HTF
    bit_range:
    - 9
    - 9
    description: |-
      half transfer flag
      A half transfer event is either a half block transfer or a half 2D/repeated block transfer, depending on the transfer complete event mode (GPDMA_CxTR2.TCEM[1:0]).
      A half block transfer occurs when half of the bytes of the source block size (rounded up integer of GPDMA_CxBR1.BNDT[15:0]/2) has been transferred to the destination.
      A half 2D/repeated block transfer occurs when half of the repeated blocks (rounded up integer of (GPDMA_CxBR1.BRC[10:0]+1)/2)) has been transferred to the destination.
  - name: DTEF
    bit_range:
    - 10
    - 10
    description: data transfer error flag
  - name: ULEF
    bit_range:
    - 11
    - 11
    description: update link transfer error flag
  - name: USEF
    bit_range:
    - 12
    - 12
    description: user setting error flag
  - name: SUSPF
    bit_range:
    - 13
    - 13
    description: completed suspension flag
  - name: TOF
    bit_range:
    - 14
    - 14
    description: trigger overrun flag
  - name: FIFOL
    bit_range:
    - 23
    - 16
    description: |-
      monitored FIFO level
      Number of available write beats in the FIFO, in units of the programmed destination data width (see GPDMA_CxTR1.DDW_LOG2[1:0], in units of bytes, half-words, or words).
      Note: After having suspended an active transfer, the user may need to read FIFOL[7:0], additionally to GPDMA_CxBR1.BDNT[15:0] and GPDMA_CxBR1.BRC[10:0], to know how many data have been transferred to the destination. Before reading, the user may wait for the transfer to be suspended (GPDMA_CxSR.SUSPF = 1).
  side_effects: null
- id: GPDMA_C3CR
  address_offset: 484
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: EN
    bit_range:
    - 0
    - 0
    description: |-
      enable
      Writing 1 into the field RESET (bit 1) causes the hardware to de-assert this bit, whatever is written into this bit 0. Else:
      this bit is de-asserted by hardware when there is a transfer error (master bus error or user setting error) or when there is a channel transfer complete (channel ready to be configured, e.g. if LSM=1 at the end of a single execution of the LLI).
      Else, this bit can be asserted by software.
      Writing 0 into this EN bit is ignored.
  - name: RESET
    bit_range:
    - 1
    - 1
    description: |-
      reset
      This bit is write only. Writing 0 has no impact. Writing 1 implies the reset of the following: the FIFO, the channel internal state, SUSP and EN bits (whatever is written receptively in bit 2 and bit 0).
      The reset is effective when the channel is in steady state, meaning one of the following:
      - active channel in suspended state (GPDMA_CxSR.SUSPF = 1 and GPDMA_CxSR.IDLEF = GPDMA_CxCR.EN = 1)
      - channel in disabled state (GPDMA_CxSR.IDLEF = 1 and GPDMA_CxCR.EN = 0).
      After writing a RESET, to continue using this channel, the user must explicitly reconfigure the channel including the hardware-modified configuration registers (GPDMA_CxBR1, GPDMA_CxSAR and GPDMA_CxDAR) before enabling again the channel (see the programming sequence in ).
  - name: SUSP
    bit_range:
    - 2
    - 2
    description: |-
      suspend
      Writing 1 into the field RESET (bit 1) causes the hardware to de-assert this bit, whatever is written into this bit 2. Else:
      Software must write 1 in order to suspend an active channel i.e. a channel with an ongoing GPDMA transfer over its master ports.
      The software must write 0 in order to resume a suspended channel, following the programming sequence detailed in .
  - name: TCIE
    bit_range:
    - 8
    - 8
    description: transfer complete interrupt enable
  - name: HTIE
    bit_range:
    - 9
    - 9
    description: half transfer complete interrupt enable
  - name: DTEIE
    bit_range:
    - 10
    - 10
    description: data transfer error interrupt enable
  - name: ULEIE
    bit_range:
    - 11
    - 11
    description: update link transfer error interrupt enable
  - name: USEIE
    bit_range:
    - 12
    - 12
    description: user setting error interrupt enable
  - name: SUSPIE
    bit_range:
    - 13
    - 13
    description: completed suspension interrupt enable
  - name: TOIE
    bit_range:
    - 14
    - 14
    description: trigger overrun interrupt enable
  - name: LSM
    bit_range:
    - 16
    - 16
    description: |-
      Link step mode
      First the (possible 1D/repeated) block transfer is executed as defined by the current internal register file until GPDMA_CxBR1.BNDT[15:0] = 0 and GPDMA_CxBR1.BRC[10:0] = 0 if present. Secondly the next linked-list data structure is conditionally uploaded from memory as defined by GPDMA_CxLLR. Then channel execution is completed.
      Note: This bit must be written when EN=0. This bit is read-only when EN=1.
  - name: LAP
    bit_range:
    - 17
    - 17
    description: |-
      linked-list allocated port
      This bit is used to allocate the master port for the update of the GPDMA linked-list registers from the memory.
      Note: This bit must be written when EN=0. This bit is read-only when EN=1.
  - name: PRIO
    bit_range:
    - 23
    - 22
    description: |-
      priority level of the channel x GPDMA transfer versus others
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  side_effects: null
- id: GPDMA_C3TR1
  address_offset: 528
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SDW_LOG2
    bit_range:
    - 1
    - 0
    description: |-
      binary logarithm of the source data width of a burst in bytes
      Note: Setting a 8-byte data width causes a user setting error to be reported and no transfer is issued.
      A source block size must be a multiple of the source data width (GPDMA_CxBR1.BNDT[2:0] versus SDW_LOG2[1:0]). Otherwise, a user setting error is reported and no transfer is issued.
      A source burst transfer must have an aligned address with its data width (start address GPDMA_CxSAR[2:0] versus SDW_LOG2[1:0]). Otherwise, a user setting error is reported and none transfer is issued.
  - name: SINC
    bit_range:
    - 3
    - 3
    description: |-
      source incrementing burst
      The source address, pointed by GPDMA_CxSAR, is kept constant after a burst beat/single transfer or is incremented by the offset value corresponding to a contiguous data after a burst beat/single transfer.
  - name: SBL_1
    bit_range:
    - 9
    - 4
    description: |-
      source burst length minus 1, between 0 and 63
      The burst length unit is one data named beat within a burst. If SBL_1[5:0] =0 , the burst can be named as single. Each data/beat has a width defined by the destination data width SDW_LOG2[1:0].
      Note: If a burst transfer crossed a 1-Kbyte address boundary on a AHB transfer, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the AHB protocol.
      If a burst transfer is of length greater than the FIFO size of the channel x, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the FIFO size. Transfer performance is lower, with GPDMA re-arbitration between effective and lower singles/bursts, but the data integrity is guaranteed.
  - name: PAM
    bit_range:
    - 12
    - 11
    description: |-
      padding/alignment mode
      If DDW_LOG2[1:0] = SDW_LOG2[1:0]: if the data width of a burst destination transfer is equal to the data width of a burst source transfer, these bits are ignored.
      Else, in the following enumerated values, the condition PAM_1 is when destination data width is higher that source data width, and the condition PAM_2 is when destination data width is higher than source data width.
      1x: successive source data are FIFO queued and packed at the destination data width, in a left (LSB) to right (MSB) order (named little endian), before a destination transfer
      1x: source data is FIFO queued and unpacked at the destination data width, to be transferred in a left (LSB) to right (MSB) order (named little endian) to the destination
      Note: If the transfer from the source peripheral is configured with peripheral flow-control mode (SWREQ = 0 and PFREQ = 1 and DREQ = 0), and if the destination data width   the source data width, packing is not supported.
  - name: SBX
    bit_range:
    - 13
    - 13
    description: |-
      source byte exchange within the unaligned half-word of each source word
      If the source data width is shorter than a word, this bit is ignored.
      If the source data width is a word:
  - name: SAP
    bit_range:
    - 14
    - 14
    description: |-
      source allocated port
      This bit is used to allocate the master port for the source transfer
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  - name: SSEC
    bit_range:
    - 15
    - 15
    description: |-
      security attribute of the GPDMA transfer from the source
      If GPDMA_SECCFGR.SECx = 1 and the access is secure:
      This is a secure register bit. This bit can only be read by a secure software. This bit must be written by a secure software when GPDMA_SECCFGR.SECx =1 . A secure write is ignored when GPDMA_SECCFGR.SECx = 0.
      When GPDMA_SECCFGR.SECx is de-asserted, this SSEC bit is also de-asserted by hardware (on a secure reconfiguration of the channel as non-secure), and the GPDMA transfer from the source is non-secure.
  - name: DDW_LOG2
    bit_range:
    - 17
    - 16
    description: |-
      binary logarithm of the destination data width of a burst, in bytes
      Note: Setting a 8-byte data width causes a user setting error to be reported and none transfer is issued.
      A destination burst transfer must have an aligned address with its data width (start address GPDMA_CxDAR[2:0] and address offset GPDMA_CxTR3.DAO[2:0], versus DDW_LOG2[1:0]). Otherwise a user setting error is reported and no transfer is issued.
  - name: DINC
    bit_range:
    - 19
    - 19
    description: |-
      destination incrementing burst
      The destination address, pointed by GPDMA_CxDAR, is kept constant after a burst beat/single transfer, or is incremented by the offset value corresponding to a contiguous data after a burst beat/single transfer.
  - name: DBL_1
    bit_range:
    - 25
    - 20
    description: |-
      destination burst length minus 1, between 0 and 63
      The burst length unit is one data named beat within a burst. If DBL_1[5:0] =0 , the burst can be named as single. Each data/beat has a width defined by the destination data width DDW_LOG2[1:0].
      Note: If a burst transfer crossed a 1-Kbyte address boundary on a AHB transfer, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the AHB protocol.
      If a burst transfer is of length greater than the FIFO size of the channel x, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the FIFO size. Transfer performance is lower, with GPDMA re-arbitration between effective and lower singles/bursts, but the data integrity is guaranteed.
  - name: DBX
    bit_range:
    - 26
    - 26
    description: |-
      destination byte exchange
      If the destination data size is a byte, this bit is ignored.
      If the destination data size is not a byte:
  - name: DHX
    bit_range:
    - 27
    - 27
    description: |-
      destination half-word exchange
      If the destination data size is shorter than a word, this bit is ignored.
      If the destination data size is a word:
  - name: DAP
    bit_range:
    - 30
    - 30
    description: |-
      destination allocated port
      This bit is used to allocate the master port for the destination transfer
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  - name: DSEC
    bit_range:
    - 31
    - 31
    description: |-
      security attribute of the GPDMA transfer to the destination
      If GPDMA_SECCFGR.SECx = 1 and the access is secure:
      This is a secure register bit. This bit can only be read by a secure software. This bit must be written by a secure software when GPDMA_SECCFGR.SECx = 1. A secure write is ignored when GPDMA_SECCFGR.SECx = 0.
      When GPDMA_SECCFGR.SECx is de-asserted, this DSEC bit is also de-asserted by hardware (on a secure reconfiguration of the channel as non-secure), and the GPDMA transfer to the destination is non-secure.
  side_effects: null
- id: GPDMA_C3TR2
  address_offset: 532
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: REQSEL
    bit_range:
    - 7
    - 0
    description: |-
      GPDMA hardware request selection
      These bits are ignored if channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer). Else, the selected hardware request is internally taken into account as per .
      The user must not assign a same input hardware request (same REQSEL[7:0] value) to different active GPDMA channels (GPDMA_CxCR.EN = 1 and GPDMA_CxTR2.SWREQ = 0 for these channels). GPDMA is not intended to hardware support the case of simultaneous enabled channels incorrectly configured with a same hardware peripheral request signal, and there is no user setting error reporting.
  - name: SWREQ
    bit_range:
    - 9
    - 9
    description: |-
      software request
      This bit is internally taken into account when GPDMA_CxCR.EN is asserted.
  - name: DREQ
    bit_range:
    - 10
    - 10
    description: |-
      destination hardware request
      This bit is ignored if channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer). Else:
      Note: If the channel x is activated (GPDMA_CxCR.EN is asserted) with SWREQ = 0 and PFREQ = 1 (peripheral hardware request with peripheral flow-control mode), any software assertion to this DREQ bit is ignored: in peripheral flow-control mode, only a peripheral-to-memory transfer is supported.
  - name: BREQ
    bit_range:
    - 11
    - 11
    description: |-
      Block hardware request
      If the channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer), this bit is ignored. Else:
  - name: PFREQ
    bit_range:
    - 12
    - 12
    description: |-
      Hardware request in peripheral flow control mode
      Important: If a given channel x is not implemented with this feature, this bit is reserved and PFREQ is not present (see  for the list of the implemented channels with this feature.
      If the channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer), this bit is ignored. Else:
      Note: In peripheral flow control mode, there are the following restrictions:
      - no 2D/repeated block support (GPDMA_CxBR1.BRC[10:0] must be set to 0 if present)
      - the peripheral must be set as the source of the transfer (DREQ = 0).
      - data packing to a wider destination width is not supported (if destination width   source data width, GPDMA_CxTR1.PAM[1] must be set to 0).
      - GPDMA_CxBR1.BNDT[15:0] must be programmed as a multiple of the source (peripheral) burst size.
  - name: TRIGM
    bit_range:
    - 15
    - 14
    description: |-
      trigger mode
      These bits define the transfer granularity for its conditioning by the trigger.
  - name: TRIGSEL
    bit_range:
    - 21
    - 16
    description: |-
      trigger event input selection
      These bits select the trigger event input of the GPDMA transfer (as per ), with an active trigger event if TRIGPOL[1:0] different  00.
  - name: TRIGPOL
    bit_range:
    - 25
    - 24
    description: |-
      trigger event polarity
      These bits define the polarity of the selected trigger event input defined by TRIGSEL[5:0].
  - name: TCEM
    bit_range:
    - 31
    - 30
    description: |-
      transfer complete event mode
      These bits define the transfer granularity for the transfer complete and half transfer complete events generation.
      Note: If the initial LLI0 data transfer is null/void (directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] = 0), then neither the complete transfer event nor the half transfer event is generated.
      Note: If the initial LLI0 data transfer is null/void (directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] = 0), then neither the complete transfer event nor the half transfer event is generated.
      Note: If the initial LLI0 data transfer is null/void (i.e. directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] =0 ), then the half transfer event is not generated, and the transfer complete event is generated when is completed the loading of the LLI1.
  side_effects: null
- id: GPDMA_C3BR1
  address_offset: 536
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: BNDT
    bit_range:
    - 15
    - 0
    description: |-
      block number of data bytes to transfer from the source
      Block size transferred from the source. When the channel is enabled, this field becomes read-only and is decremented, indicating the remaining number of data items in the current source block to be transferred. BNDT[15:0] is programmed in number of bytes, maximum source block size is 64 Kbytes -1.
      Once the last data transfer is completed (BNDT[15:0] = 0):
      - if GPDMA_CxLLR.UB1 = 1, this field is updated by the LLI in the memory.
      - if GPDMA_CxLLR.UB1 = 0 and if there is at least one non null Uxx update bit, this field is internally restored to the programmed value.
      - if all GPDMA_CxLLR.Uxx = 0 and if GPDMA_CxLLR.LA[15:0] = 0, this field is internally restored to the programmed value (infinite/continuous last LLI).
      - if GPDMA_CxLLR = 0, this field is kept as zero following the last LLI data transfer.
      Note: A non-null source block size must be a multiple of the source data width (BNDT[2:0] versus GPDMA_CxTR1.SDW_LOG2[1:0]). Else a user setting error is reported and no transfer is issued.
      When configured in packing mode (GPDMA_CxTR1.PAM[1] = 1 and destination data width different from source data width), a non-null source block size must be a multiple of the destination data width (BNDT[2:0] versus GPDMA_CxTR1.DDW_LOG2[1:0]). Else a user setting error is reported and no transfer is issued.
  side_effects: null
- id: GPDMA_C3SAR
  address_offset: 540
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SA
    bit_range:
    - 31
    - 0
    description: |-
      source address
      This field is the pointer to the address from which the next data is read.
      During the channel activity, depending on the source addressing mode (GPDMA_CxTR1.SINC), this field is kept fixed or incremented by the data width (GPDMA_CxTR1.SDW_LOG2[1:0]) after each burst source data, reflecting the next address from which data is read.
      During the channel activity, this address is updated after each completed source burst, consequently to:
      the programmed source burst; either in fixed addressing mode or in contiguous-data incremented mode. If contiguously incremented (GPDMA_CxTR1.SINC = 1), then the additional address offset value is the programmed burst size, as defined by GPDMA_CxTR1.SBL_1[5:0] and GPDMA_CxTR1.SDW_LOG2[21:0]
      the additional source incremented/decremented offset value as programmed by GPDMA_CxBR1.SDEC and GPDMA_CxTR3.SAO[12:0]
      once/if completed source block transfer, for a channel x with 2D addressing capability (x = 12 to 15). additional block repeat source incremented/decremented offset value as programmed by GPDMA_CxBR1.BRSDEC and GPDMA_CxBR2.BRSAO[15:0]
      In linked-list mode, after a LLI data transfer is completed, this register is automatically updated by GPDMA from the memory, provided the LLI is set with GPDMA_CxLLR.USA = 1.
      Note: A source address must be aligned with the programmed data width of a source burst (SA[2:0] versus GPDMA_CxTR1.SDW_LOG2[1:0]). Else, a user setting error is reported and no transfer is issued.
      When the source block size is not a multiple of the source burst size and is a multiple of the source data width, the last programmed source burst is not completed and is internally shorten to match the block size. In this case, the additional GPDMA_CxTR3.SAO[12:0] is not applied.
  side_effects: null
- id: GPDMA_C3DAR
  address_offset: 544
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: DA
    bit_range:
    - 31
    - 0
    description: |-
      destination address
      This field is the pointer to the address from which the next data is written.
      During the channel activity, depending on the destination addressing mode (GPDMA_CxTR1.DINC), this field is kept fixed or incremented by the data width (GPDMA_CxTR1.DDW_LOG2[21:0]) after each burst destination data, reflecting the next address from which data is written.
      During the channel activity, this address is updated after each completed destination burst, consequently to:
      the programmed destination burst; either in fixed addressing mode or in contiguous-data incremented mode. If contiguously incremented (GPDMA_CxTR1.DINC = 1), then the additional address offset value is the programmed burst size, as defined by GPDMA_CxTR1.DBL_1[5:0] and GPDMA_CxTR1.DDW_LOG2[1:0]
      the additional destination incremented/decremented offset value as programmed by GPDMA_CxBR1.DDEC and GPDMA_CxTR3.DAO[12:0]
      once/if completed destination block transfer, for a channel x with 2D addressing capability (x = 12 to 15), the additional block repeat destination incremented/decremented offset value as programmed by GPDMA_CxBR1.BRDDEC and GPDMA_CxBR2.BRDAO[15:0]
      In linked-list mode, after a LLI data transfer is completed, this register is automatically updated by the GPDMA from the memory, provided the LLI is set with GPDMA_CxLLR.UDA = 1.
      Note: A destination address must be aligned with the programmed data width of a destination burst (DA[2:0] versus GPDMA_CxTR1.DDW_LOG2[1:0]). Else, a user setting error is reported and no transfer is issued.
  side_effects: null
- id: GPDMA_C3LLR
  address_offset: 588
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LA
    bit_range:
    - 15
    - 2
    description: |-
      pointer (16-bit low-significant address) to the next linked-list data structure
      If UT1 = UT2 = UB1 = USA = UDA = ULL = 0 and if LA[15:20] = 0, the current LLI is the last one. The channel transfer is completed without any update of the linked-list GPDMA register file.
      Else, this field is the pointer to the memory address offset from which the next linked-list data structure is automatically fetched from, once the data transfer is completed, in order to conditionally update the linked-list GPDMA internal register file (GPDMA_CxCTR1, GPDMA_CxTR2, GPDMA_CxBR1, GPDMA_CxSAR, GPDMA_CxDAR and GPDMA_CxLLR).
      Note: The user must program the pointer to be 32-bit aligned. The two low-significant bits are write ignored.
  - name: ULL
    bit_range:
    - 16
    - 16
    description: |-
      Update GPDMA_CxLLR register from memory
      This bit is used to control the update of GPDMA_CxLLR from the memory during the link transfer.
  - name: UDA
    bit_range:
    - 27
    - 27
    description: |-
      Update GPDMA_CxDAR register from memory
      This bit is used to control the update of GPDMA_CxDAR from the memory during the link transfer.
  - name: USA
    bit_range:
    - 28
    - 28
    description: |-
      update GPDMA_CxSAR from memory
      This bit controls the update of GPDMA_CxSAR from the memory during the link transfer.
  - name: UB1
    bit_range:
    - 29
    - 29
    description: |-
      Update GPDMA_CxBR1 from memory
      This bit controls the update of GPDMA_CxBR1 from the memory during the link transfer. If UB1 = 0 and if GPDMA_CxLLR different  0, the linked-list is not completed. GPDMA_CxBR1.BNDT[15:0] is then restored to the programmed value after data transfer is completed and before the link transfer.
  - name: UT2
    bit_range:
    - 30
    - 30
    description: |-
      Update GPDMA_CxTR2 from memory
      This bit controls the update of GPDMA_CxTR2 from the memory during the link transfer.
  - name: UT1
    bit_range:
    - 31
    - 31
    description: |-
      Update GPDMA_CxTR1 from memory
      This bit controls the update of GPDMA_CxTR1 from the memory during the link transfer.
  side_effects: null
- id: GPDMA_C4LBAR
  address_offset: 592
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LBA
    bit_range:
    - 31
    - 16
    description: linked-list base address of GPDMA channel x
  side_effects: null
- id: GPDMA_C4FCR
  address_offset: 604
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TCF
    bit_range:
    - 8
    - 8
    description: transfer complete flag clear
  - name: HTF
    bit_range:
    - 9
    - 9
    description: half transfer flag clear
  - name: DTEF
    bit_range:
    - 10
    - 10
    description: data transfer error flag clear
  - name: ULEF
    bit_range:
    - 11
    - 11
    description: update link transfer error flag clear
  - name: USEF
    bit_range:
    - 12
    - 12
    description: user setting error flag clear
  - name: SUSPF
    bit_range:
    - 13
    - 13
    description: completed suspension flag clear
  - name: TOF
    bit_range:
    - 14
    - 14
    description: trigger overrun flag clear
  side_effects: null
- id: GPDMA_C4SR
  address_offset: 608
  size: 32
  access: READ_WRITE
  reset_value: 1
  fields:
  - name: IDLEF
    bit_range:
    - 0
    - 0
    description: |-
      idle flag
      This idle flag is de-asserted by hardware when the channel is enabled (GPDMA_CxCR.EN = 1) with a valid channel configuration (no USEF to be immediately reported).
      This idle flag is asserted after hard reset or by hardware when the channel is back in idle state (in suspended or disabled state).
  - name: TCF
    bit_range:
    - 8
    - 8
    description: |-
      transfer complete flag
      A transfer complete event is either a block transfer complete, a 2D/repeated block transfer complete, a LLI transfer complete including the upload of the next LLI if any, or the full linked-list completion, depending on the transfer complete event mode (GPDMA_CxTR2.TCEM[1:0]).
  - name: HTF
    bit_range:
    - 9
    - 9
    description: |-
      half transfer flag
      A half transfer event is either a half block transfer or a half 2D/repeated block transfer, depending on the transfer complete event mode (GPDMA_CxTR2.TCEM[1:0]).
      A half block transfer occurs when half of the bytes of the source block size (rounded up integer of GPDMA_CxBR1.BNDT[15:0]/2) has been transferred to the destination.
      A half 2D/repeated block transfer occurs when half of the repeated blocks (rounded up integer of (GPDMA_CxBR1.BRC[10:0]+1)/2)) has been transferred to the destination.
  - name: DTEF
    bit_range:
    - 10
    - 10
    description: data transfer error flag
  - name: ULEF
    bit_range:
    - 11
    - 11
    description: update link transfer error flag
  - name: USEF
    bit_range:
    - 12
    - 12
    description: user setting error flag
  - name: SUSPF
    bit_range:
    - 13
    - 13
    description: completed suspension flag
  - name: TOF
    bit_range:
    - 14
    - 14
    description: trigger overrun flag
  - name: FIFOL
    bit_range:
    - 23
    - 16
    description: |-
      monitored FIFO level
      Number of available write beats in the FIFO, in units of the programmed destination data width (see GPDMA_CxTR1.DDW_LOG2[1:0], in units of bytes, half-words, or words).
      Note: After having suspended an active transfer, the user may need to read FIFOL[7:0], additionally to GPDMA_CxBR1.BDNT[15:0] and GPDMA_CxBR1.BRC[10:0], to know how many data have been transferred to the destination. Before reading, the user may wait for the transfer to be suspended (GPDMA_CxSR.SUSPF = 1).
  side_effects: null
- id: GPDMA_C4CR
  address_offset: 612
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: EN
    bit_range:
    - 0
    - 0
    description: |-
      enable
      Writing 1 into the field RESET (bit 1) causes the hardware to de-assert this bit, whatever is written into this bit 0. Else:
      this bit is de-asserted by hardware when there is a transfer error (master bus error or user setting error) or when there is a channel transfer complete (channel ready to be configured, e.g. if LSM=1 at the end of a single execution of the LLI).
      Else, this bit can be asserted by software.
      Writing 0 into this EN bit is ignored.
  - name: RESET
    bit_range:
    - 1
    - 1
    description: |-
      reset
      This bit is write only. Writing 0 has no impact. Writing 1 implies the reset of the following: the FIFO, the channel internal state, SUSP and EN bits (whatever is written receptively in bit 2 and bit 0).
      The reset is effective when the channel is in steady state, meaning one of the following:
      - active channel in suspended state (GPDMA_CxSR.SUSPF = 1 and GPDMA_CxSR.IDLEF = GPDMA_CxCR.EN = 1)
      - channel in disabled state (GPDMA_CxSR.IDLEF = 1 and GPDMA_CxCR.EN = 0).
      After writing a RESET, to continue using this channel, the user must explicitly reconfigure the channel including the hardware-modified configuration registers (GPDMA_CxBR1, GPDMA_CxSAR and GPDMA_CxDAR) before enabling again the channel (see the programming sequence in ).
  - name: SUSP
    bit_range:
    - 2
    - 2
    description: |-
      suspend
      Writing 1 into the field RESET (bit 1) causes the hardware to de-assert this bit, whatever is written into this bit 2. Else:
      Software must write 1 in order to suspend an active channel i.e. a channel with an ongoing GPDMA transfer over its master ports.
      The software must write 0 in order to resume a suspended channel, following the programming sequence detailed in .
  - name: TCIE
    bit_range:
    - 8
    - 8
    description: transfer complete interrupt enable
  - name: HTIE
    bit_range:
    - 9
    - 9
    description: half transfer complete interrupt enable
  - name: DTEIE
    bit_range:
    - 10
    - 10
    description: data transfer error interrupt enable
  - name: ULEIE
    bit_range:
    - 11
    - 11
    description: update link transfer error interrupt enable
  - name: USEIE
    bit_range:
    - 12
    - 12
    description: user setting error interrupt enable
  - name: SUSPIE
    bit_range:
    - 13
    - 13
    description: completed suspension interrupt enable
  - name: TOIE
    bit_range:
    - 14
    - 14
    description: trigger overrun interrupt enable
  - name: LSM
    bit_range:
    - 16
    - 16
    description: |-
      Link step mode
      First the (possible 1D/repeated) block transfer is executed as defined by the current internal register file until GPDMA_CxBR1.BNDT[15:0] = 0 and GPDMA_CxBR1.BRC[10:0] = 0 if present. Secondly the next linked-list data structure is conditionally uploaded from memory as defined by GPDMA_CxLLR. Then channel execution is completed.
      Note: This bit must be written when EN=0. This bit is read-only when EN=1.
  - name: LAP
    bit_range:
    - 17
    - 17
    description: |-
      linked-list allocated port
      This bit is used to allocate the master port for the update of the GPDMA linked-list registers from the memory.
      Note: This bit must be written when EN=0. This bit is read-only when EN=1.
  - name: PRIO
    bit_range:
    - 23
    - 22
    description: |-
      priority level of the channel x GPDMA transfer versus others
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  side_effects: null
- id: GPDMA_C4TR1
  address_offset: 656
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SDW_LOG2
    bit_range:
    - 1
    - 0
    description: |-
      binary logarithm of the source data width of a burst in bytes
      Note: Setting a 8-byte data width causes a user setting error to be reported and no transfer is issued.
      A source block size must be a multiple of the source data width (GPDMA_CxBR1.BNDT[2:0] versus SDW_LOG2[1:0]). Otherwise, a user setting error is reported and no transfer is issued.
      A source burst transfer must have an aligned address with its data width (start address GPDMA_CxSAR[2:0] versus SDW_LOG2[1:0]). Otherwise, a user setting error is reported and none transfer is issued.
  - name: SINC
    bit_range:
    - 3
    - 3
    description: |-
      source incrementing burst
      The source address, pointed by GPDMA_CxSAR, is kept constant after a burst beat/single transfer or is incremented by the offset value corresponding to a contiguous data after a burst beat/single transfer.
  - name: SBL_1
    bit_range:
    - 9
    - 4
    description: |-
      source burst length minus 1, between 0 and 63
      The burst length unit is one data named beat within a burst. If SBL_1[5:0] =0 , the burst can be named as single. Each data/beat has a width defined by the destination data width SDW_LOG2[1:0].
      Note: If a burst transfer crossed a 1-Kbyte address boundary on a AHB transfer, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the AHB protocol.
      If a burst transfer is of length greater than the FIFO size of the channel x, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the FIFO size. Transfer performance is lower, with GPDMA re-arbitration between effective and lower singles/bursts, but the data integrity is guaranteed.
  - name: PAM
    bit_range:
    - 12
    - 11
    description: |-
      padding/alignment mode
      If DDW_LOG2[1:0] = SDW_LOG2[1:0]: if the data width of a burst destination transfer is equal to the data width of a burst source transfer, these bits are ignored.
      Else, in the following enumerated values, the condition PAM_1 is when destination data width is higher that source data width, and the condition PAM_2 is when destination data width is higher than source data width.
      1x: successive source data are FIFO queued and packed at the destination data width, in a left (LSB) to right (MSB) order (named little endian), before a destination transfer
      1x: source data is FIFO queued and unpacked at the destination data width, to be transferred in a left (LSB) to right (MSB) order (named little endian) to the destination
      Note: If the transfer from the source peripheral is configured with peripheral flow-control mode (SWREQ = 0 and PFREQ = 1 and DREQ = 0), and if the destination data width   the source data width, packing is not supported.
  - name: SBX
    bit_range:
    - 13
    - 13
    description: |-
      source byte exchange within the unaligned half-word of each source word
      If the source data width is shorter than a word, this bit is ignored.
      If the source data width is a word:
  - name: SAP
    bit_range:
    - 14
    - 14
    description: |-
      source allocated port
      This bit is used to allocate the master port for the source transfer
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  - name: SSEC
    bit_range:
    - 15
    - 15
    description: |-
      security attribute of the GPDMA transfer from the source
      If GPDMA_SECCFGR.SECx = 1 and the access is secure:
      This is a secure register bit. This bit can only be read by a secure software. This bit must be written by a secure software when GPDMA_SECCFGR.SECx =1 . A secure write is ignored when GPDMA_SECCFGR.SECx = 0.
      When GPDMA_SECCFGR.SECx is de-asserted, this SSEC bit is also de-asserted by hardware (on a secure reconfiguration of the channel as non-secure), and the GPDMA transfer from the source is non-secure.
  - name: DDW_LOG2
    bit_range:
    - 17
    - 16
    description: |-
      binary logarithm of the destination data width of a burst, in bytes
      Note: Setting a 8-byte data width causes a user setting error to be reported and none transfer is issued.
      A destination burst transfer must have an aligned address with its data width (start address GPDMA_CxDAR[2:0] and address offset GPDMA_CxTR3.DAO[2:0], versus DDW_LOG2[1:0]). Otherwise a user setting error is reported and no transfer is issued.
  - name: DINC
    bit_range:
    - 19
    - 19
    description: |-
      destination incrementing burst
      The destination address, pointed by GPDMA_CxDAR, is kept constant after a burst beat/single transfer, or is incremented by the offset value corresponding to a contiguous data after a burst beat/single transfer.
  - name: DBL_1
    bit_range:
    - 25
    - 20
    description: |-
      destination burst length minus 1, between 0 and 63
      The burst length unit is one data named beat within a burst. If DBL_1[5:0] =0 , the burst can be named as single. Each data/beat has a width defined by the destination data width DDW_LOG2[1:0].
      Note: If a burst transfer crossed a 1-Kbyte address boundary on a AHB transfer, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the AHB protocol.
      If a burst transfer is of length greater than the FIFO size of the channel x, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the FIFO size. Transfer performance is lower, with GPDMA re-arbitration between effective and lower singles/bursts, but the data integrity is guaranteed.
  - name: DBX
    bit_range:
    - 26
    - 26
    description: |-
      destination byte exchange
      If the destination data size is a byte, this bit is ignored.
      If the destination data size is not a byte:
  - name: DHX
    bit_range:
    - 27
    - 27
    description: |-
      destination half-word exchange
      If the destination data size is shorter than a word, this bit is ignored.
      If the destination data size is a word:
  - name: DAP
    bit_range:
    - 30
    - 30
    description: |-
      destination allocated port
      This bit is used to allocate the master port for the destination transfer
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  - name: DSEC
    bit_range:
    - 31
    - 31
    description: |-
      security attribute of the GPDMA transfer to the destination
      If GPDMA_SECCFGR.SECx = 1 and the access is secure:
      This is a secure register bit. This bit can only be read by a secure software. This bit must be written by a secure software when GPDMA_SECCFGR.SECx = 1. A secure write is ignored when GPDMA_SECCFGR.SECx = 0.
      When GPDMA_SECCFGR.SECx is de-asserted, this DSEC bit is also de-asserted by hardware (on a secure reconfiguration of the channel as non-secure), and the GPDMA transfer to the destination is non-secure.
  side_effects: null
- id: GPDMA_C4TR2
  address_offset: 660
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: REQSEL
    bit_range:
    - 7
    - 0
    description: |-
      GPDMA hardware request selection
      These bits are ignored if channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer). Else, the selected hardware request is internally taken into account as per .
      The user must not assign a same input hardware request (same REQSEL[7:0] value) to different active GPDMA channels (GPDMA_CxCR.EN = 1 and GPDMA_CxTR2.SWREQ = 0 for these channels). GPDMA is not intended to hardware support the case of simultaneous enabled channels incorrectly configured with a same hardware peripheral request signal, and there is no user setting error reporting.
  - name: SWREQ
    bit_range:
    - 9
    - 9
    description: |-
      software request
      This bit is internally taken into account when GPDMA_CxCR.EN is asserted.
  - name: DREQ
    bit_range:
    - 10
    - 10
    description: |-
      destination hardware request
      This bit is ignored if channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer). Else:
      Note: If the channel x is activated (GPDMA_CxCR.EN is asserted) with SWREQ = 0 and PFREQ = 1 (peripheral hardware request with peripheral flow-control mode), any software assertion to this DREQ bit is ignored: in peripheral flow-control mode, only a peripheral-to-memory transfer is supported.
  - name: BREQ
    bit_range:
    - 11
    - 11
    description: |-
      Block hardware request
      If the channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer), this bit is ignored. Else:
  - name: PFREQ
    bit_range:
    - 12
    - 12
    description: |-
      Hardware request in peripheral flow control mode
      Important: If a given channel x is not implemented with this feature, this bit is reserved and PFREQ is not present (see  for the list of the implemented channels with this feature.
      If the channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer), this bit is ignored. Else:
      Note: In peripheral flow control mode, there are the following restrictions:
      - no 2D/repeated block support (GPDMA_CxBR1.BRC[10:0] must be set to 0 if present)
      - the peripheral must be set as the source of the transfer (DREQ = 0).
      - data packing to a wider destination width is not supported (if destination width   source data width, GPDMA_CxTR1.PAM[1] must be set to 0).
      - GPDMA_CxBR1.BNDT[15:0] must be programmed as a multiple of the source (peripheral) burst size.
  - name: TRIGM
    bit_range:
    - 15
    - 14
    description: |-
      trigger mode
      These bits define the transfer granularity for its conditioning by the trigger.
  - name: TRIGSEL
    bit_range:
    - 21
    - 16
    description: |-
      trigger event input selection
      These bits select the trigger event input of the GPDMA transfer (as per ), with an active trigger event if TRIGPOL[1:0] different  00.
  - name: TRIGPOL
    bit_range:
    - 25
    - 24
    description: |-
      trigger event polarity
      These bits define the polarity of the selected trigger event input defined by TRIGSEL[5:0].
  - name: TCEM
    bit_range:
    - 31
    - 30
    description: |-
      transfer complete event mode
      These bits define the transfer granularity for the transfer complete and half transfer complete events generation.
      Note: If the initial LLI0 data transfer is null/void (directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] = 0), then neither the complete transfer event nor the half transfer event is generated.
      Note: If the initial LLI0 data transfer is null/void (directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] = 0), then neither the complete transfer event nor the half transfer event is generated.
      Note: If the initial LLI0 data transfer is null/void (i.e. directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] =0 ), then the half transfer event is not generated, and the transfer complete event is generated when is completed the loading of the LLI1.
  side_effects: null
- id: GPDMA_C4BR1
  address_offset: 664
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: BNDT
    bit_range:
    - 15
    - 0
    description: |-
      block number of data bytes to transfer from the source
      Block size transferred from the source. When the channel is enabled, this field becomes read-only and is decremented, indicating the remaining number of data items in the current source block to be transferred. BNDT[15:0] is programmed in number of bytes, maximum source block size is 64 Kbytes -1.
      Once the last data transfer is completed (BNDT[15:0] = 0):
      - if GPDMA_CxLLR.UB1 = 1, this field is updated by the LLI in the memory.
      - if GPDMA_CxLLR.UB1 = 0 and if there is at least one non null Uxx update bit, this field is internally restored to the programmed value.
      - if all GPDMA_CxLLR.Uxx = 0 and if GPDMA_CxLLR.LA[15:0] = 0, this field is internally restored to the programmed value (infinite/continuous last LLI).
      - if GPDMA_CxLLR = 0, this field is kept as zero following the last LLI data transfer.
      Note: A non-null source block size must be a multiple of the source data width (BNDT[2:0] versus GPDMA_CxTR1.SDW_LOG2[1:0]). Else a user setting error is reported and no transfer is issued.
      When configured in packing mode (GPDMA_CxTR1.PAM[1] = 1 and destination data width different from source data width), a non-null source block size must be a multiple of the destination data width (BNDT[2:0] versus GPDMA_CxTR1.DDW_LOG2[1:0]). Else a user setting error is reported and no transfer is issued.
  side_effects: null
- id: GPDMA_C4SAR
  address_offset: 668
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SA
    bit_range:
    - 31
    - 0
    description: |-
      source address
      This field is the pointer to the address from which the next data is read.
      During the channel activity, depending on the source addressing mode (GPDMA_CxTR1.SINC), this field is kept fixed or incremented by the data width (GPDMA_CxTR1.SDW_LOG2[1:0]) after each burst source data, reflecting the next address from which data is read.
      During the channel activity, this address is updated after each completed source burst, consequently to:
      the programmed source burst; either in fixed addressing mode or in contiguous-data incremented mode. If contiguously incremented (GPDMA_CxTR1.SINC = 1), then the additional address offset value is the programmed burst size, as defined by GPDMA_CxTR1.SBL_1[5:0] and GPDMA_CxTR1.SDW_LOG2[21:0]
      the additional source incremented/decremented offset value as programmed by GPDMA_CxBR1.SDEC and GPDMA_CxTR3.SAO[12:0]
      once/if completed source block transfer, for a channel x with 2D addressing capability (x = 12 to 15). additional block repeat source incremented/decremented offset value as programmed by GPDMA_CxBR1.BRSDEC and GPDMA_CxBR2.BRSAO[15:0]
      In linked-list mode, after a LLI data transfer is completed, this register is automatically updated by GPDMA from the memory, provided the LLI is set with GPDMA_CxLLR.USA = 1.
      Note: A source address must be aligned with the programmed data width of a source burst (SA[2:0] versus GPDMA_CxTR1.SDW_LOG2[1:0]). Else, a user setting error is reported and no transfer is issued.
      When the source block size is not a multiple of the source burst size and is a multiple of the source data width, the last programmed source burst is not completed and is internally shorten to match the block size. In this case, the additional GPDMA_CxTR3.SAO[12:0] is not applied.
  side_effects: null
- id: GPDMA_C4DAR
  address_offset: 672
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: DA
    bit_range:
    - 31
    - 0
    description: |-
      destination address
      This field is the pointer to the address from which the next data is written.
      During the channel activity, depending on the destination addressing mode (GPDMA_CxTR1.DINC), this field is kept fixed or incremented by the data width (GPDMA_CxTR1.DDW_LOG2[21:0]) after each burst destination data, reflecting the next address from which data is written.
      During the channel activity, this address is updated after each completed destination burst, consequently to:
      the programmed destination burst; either in fixed addressing mode or in contiguous-data incremented mode. If contiguously incremented (GPDMA_CxTR1.DINC = 1), then the additional address offset value is the programmed burst size, as defined by GPDMA_CxTR1.DBL_1[5:0] and GPDMA_CxTR1.DDW_LOG2[1:0]
      the additional destination incremented/decremented offset value as programmed by GPDMA_CxBR1.DDEC and GPDMA_CxTR3.DAO[12:0]
      once/if completed destination block transfer, for a channel x with 2D addressing capability (x = 12 to 15), the additional block repeat destination incremented/decremented offset value as programmed by GPDMA_CxBR1.BRDDEC and GPDMA_CxBR2.BRDAO[15:0]
      In linked-list mode, after a LLI data transfer is completed, this register is automatically updated by the GPDMA from the memory, provided the LLI is set with GPDMA_CxLLR.UDA = 1.
      Note: A destination address must be aligned with the programmed data width of a destination burst (DA[2:0] versus GPDMA_CxTR1.DDW_LOG2[1:0]). Else, a user setting error is reported and no transfer is issued.
  side_effects: null
- id: GPDMA_C4LLR
  address_offset: 716
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LA
    bit_range:
    - 15
    - 2
    description: |-
      pointer (16-bit low-significant address) to the next linked-list data structure
      If UT1 = UT2 = UB1 = USA = UDA = ULL = 0 and if LA[15:20] = 0, the current LLI is the last one. The channel transfer is completed without any update of the linked-list GPDMA register file.
      Else, this field is the pointer to the memory address offset from which the next linked-list data structure is automatically fetched from, once the data transfer is completed, in order to conditionally update the linked-list GPDMA internal register file (GPDMA_CxCTR1, GPDMA_CxTR2, GPDMA_CxBR1, GPDMA_CxSAR, GPDMA_CxDAR and GPDMA_CxLLR).
      Note: The user must program the pointer to be 32-bit aligned. The two low-significant bits are write ignored.
  - name: ULL
    bit_range:
    - 16
    - 16
    description: |-
      Update GPDMA_CxLLR register from memory
      This bit is used to control the update of GPDMA_CxLLR from the memory during the link transfer.
  - name: UDA
    bit_range:
    - 27
    - 27
    description: |-
      Update GPDMA_CxDAR register from memory
      This bit is used to control the update of GPDMA_CxDAR from the memory during the link transfer.
  - name: USA
    bit_range:
    - 28
    - 28
    description: |-
      update GPDMA_CxSAR from memory
      This bit controls the update of GPDMA_CxSAR from the memory during the link transfer.
  - name: UB1
    bit_range:
    - 29
    - 29
    description: |-
      Update GPDMA_CxBR1 from memory
      This bit controls the update of GPDMA_CxBR1 from the memory during the link transfer. If UB1 = 0 and if GPDMA_CxLLR different  0, the linked-list is not completed. GPDMA_CxBR1.BNDT[15:0] is then restored to the programmed value after data transfer is completed and before the link transfer.
  - name: UT2
    bit_range:
    - 30
    - 30
    description: |-
      Update GPDMA_CxTR2 from memory
      This bit controls the update of GPDMA_CxTR2 from the memory during the link transfer.
  - name: UT1
    bit_range:
    - 31
    - 31
    description: |-
      Update GPDMA_CxTR1 from memory
      This bit controls the update of GPDMA_CxTR1 from the memory during the link transfer.
  side_effects: null
- id: GPDMA_C5LBAR
  address_offset: 720
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LBA
    bit_range:
    - 31
    - 16
    description: linked-list base address of GPDMA channel x
  side_effects: null
- id: GPDMA_C5FCR
  address_offset: 732
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TCF
    bit_range:
    - 8
    - 8
    description: transfer complete flag clear
  - name: HTF
    bit_range:
    - 9
    - 9
    description: half transfer flag clear
  - name: DTEF
    bit_range:
    - 10
    - 10
    description: data transfer error flag clear
  - name: ULEF
    bit_range:
    - 11
    - 11
    description: update link transfer error flag clear
  - name: USEF
    bit_range:
    - 12
    - 12
    description: user setting error flag clear
  - name: SUSPF
    bit_range:
    - 13
    - 13
    description: completed suspension flag clear
  - name: TOF
    bit_range:
    - 14
    - 14
    description: trigger overrun flag clear
  side_effects: null
- id: GPDMA_C5SR
  address_offset: 736
  size: 32
  access: READ_WRITE
  reset_value: 1
  fields:
  - name: IDLEF
    bit_range:
    - 0
    - 0
    description: |-
      idle flag
      This idle flag is de-asserted by hardware when the channel is enabled (GPDMA_CxCR.EN = 1) with a valid channel configuration (no USEF to be immediately reported).
      This idle flag is asserted after hard reset or by hardware when the channel is back in idle state (in suspended or disabled state).
  - name: TCF
    bit_range:
    - 8
    - 8
    description: |-
      transfer complete flag
      A transfer complete event is either a block transfer complete, a 2D/repeated block transfer complete, a LLI transfer complete including the upload of the next LLI if any, or the full linked-list completion, depending on the transfer complete event mode (GPDMA_CxTR2.TCEM[1:0]).
  - name: HTF
    bit_range:
    - 9
    - 9
    description: |-
      half transfer flag
      A half transfer event is either a half block transfer or a half 2D/repeated block transfer, depending on the transfer complete event mode (GPDMA_CxTR2.TCEM[1:0]).
      A half block transfer occurs when half of the bytes of the source block size (rounded up integer of GPDMA_CxBR1.BNDT[15:0]/2) has been transferred to the destination.
      A half 2D/repeated block transfer occurs when half of the repeated blocks (rounded up integer of (GPDMA_CxBR1.BRC[10:0]+1)/2)) has been transferred to the destination.
  - name: DTEF
    bit_range:
    - 10
    - 10
    description: data transfer error flag
  - name: ULEF
    bit_range:
    - 11
    - 11
    description: update link transfer error flag
  - name: USEF
    bit_range:
    - 12
    - 12
    description: user setting error flag
  - name: SUSPF
    bit_range:
    - 13
    - 13
    description: completed suspension flag
  - name: TOF
    bit_range:
    - 14
    - 14
    description: trigger overrun flag
  - name: FIFOL
    bit_range:
    - 23
    - 16
    description: |-
      monitored FIFO level
      Number of available write beats in the FIFO, in units of the programmed destination data width (see GPDMA_CxTR1.DDW_LOG2[1:0], in units of bytes, half-words, or words).
      Note: After having suspended an active transfer, the user may need to read FIFOL[7:0], additionally to GPDMA_CxBR1.BDNT[15:0] and GPDMA_CxBR1.BRC[10:0], to know how many data have been transferred to the destination. Before reading, the user may wait for the transfer to be suspended (GPDMA_CxSR.SUSPF = 1).
  side_effects: null
- id: GPDMA_C5CR
  address_offset: 740
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: EN
    bit_range:
    - 0
    - 0
    description: |-
      enable
      Writing 1 into the field RESET (bit 1) causes the hardware to de-assert this bit, whatever is written into this bit 0. Else:
      this bit is de-asserted by hardware when there is a transfer error (master bus error or user setting error) or when there is a channel transfer complete (channel ready to be configured, e.g. if LSM=1 at the end of a single execution of the LLI).
      Else, this bit can be asserted by software.
      Writing 0 into this EN bit is ignored.
  - name: RESET
    bit_range:
    - 1
    - 1
    description: |-
      reset
      This bit is write only. Writing 0 has no impact. Writing 1 implies the reset of the following: the FIFO, the channel internal state, SUSP and EN bits (whatever is written receptively in bit 2 and bit 0).
      The reset is effective when the channel is in steady state, meaning one of the following:
      - active channel in suspended state (GPDMA_CxSR.SUSPF = 1 and GPDMA_CxSR.IDLEF = GPDMA_CxCR.EN = 1)
      - channel in disabled state (GPDMA_CxSR.IDLEF = 1 and GPDMA_CxCR.EN = 0).
      After writing a RESET, to continue using this channel, the user must explicitly reconfigure the channel including the hardware-modified configuration registers (GPDMA_CxBR1, GPDMA_CxSAR and GPDMA_CxDAR) before enabling again the channel (see the programming sequence in ).
  - name: SUSP
    bit_range:
    - 2
    - 2
    description: |-
      suspend
      Writing 1 into the field RESET (bit 1) causes the hardware to de-assert this bit, whatever is written into this bit 2. Else:
      Software must write 1 in order to suspend an active channel i.e. a channel with an ongoing GPDMA transfer over its master ports.
      The software must write 0 in order to resume a suspended channel, following the programming sequence detailed in .
  - name: TCIE
    bit_range:
    - 8
    - 8
    description: transfer complete interrupt enable
  - name: HTIE
    bit_range:
    - 9
    - 9
    description: half transfer complete interrupt enable
  - name: DTEIE
    bit_range:
    - 10
    - 10
    description: data transfer error interrupt enable
  - name: ULEIE
    bit_range:
    - 11
    - 11
    description: update link transfer error interrupt enable
  - name: USEIE
    bit_range:
    - 12
    - 12
    description: user setting error interrupt enable
  - name: SUSPIE
    bit_range:
    - 13
    - 13
    description: completed suspension interrupt enable
  - name: TOIE
    bit_range:
    - 14
    - 14
    description: trigger overrun interrupt enable
  - name: LSM
    bit_range:
    - 16
    - 16
    description: |-
      Link step mode
      First the (possible 1D/repeated) block transfer is executed as defined by the current internal register file until GPDMA_CxBR1.BNDT[15:0] = 0 and GPDMA_CxBR1.BRC[10:0] = 0 if present. Secondly the next linked-list data structure is conditionally uploaded from memory as defined by GPDMA_CxLLR. Then channel execution is completed.
      Note: This bit must be written when EN=0. This bit is read-only when EN=1.
  - name: LAP
    bit_range:
    - 17
    - 17
    description: |-
      linked-list allocated port
      This bit is used to allocate the master port for the update of the GPDMA linked-list registers from the memory.
      Note: This bit must be written when EN=0. This bit is read-only when EN=1.
  - name: PRIO
    bit_range:
    - 23
    - 22
    description: |-
      priority level of the channel x GPDMA transfer versus others
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  side_effects: null
- id: GPDMA_C5TR1
  address_offset: 784
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SDW_LOG2
    bit_range:
    - 1
    - 0
    description: |-
      binary logarithm of the source data width of a burst in bytes
      Note: Setting a 8-byte data width causes a user setting error to be reported and no transfer is issued.
      A source block size must be a multiple of the source data width (GPDMA_CxBR1.BNDT[2:0] versus SDW_LOG2[1:0]). Otherwise, a user setting error is reported and no transfer is issued.
      A source burst transfer must have an aligned address with its data width (start address GPDMA_CxSAR[2:0] versus SDW_LOG2[1:0]). Otherwise, a user setting error is reported and none transfer is issued.
  - name: SINC
    bit_range:
    - 3
    - 3
    description: |-
      source incrementing burst
      The source address, pointed by GPDMA_CxSAR, is kept constant after a burst beat/single transfer or is incremented by the offset value corresponding to a contiguous data after a burst beat/single transfer.
  - name: SBL_1
    bit_range:
    - 9
    - 4
    description: |-
      source burst length minus 1, between 0 and 63
      The burst length unit is one data named beat within a burst. If SBL_1[5:0] =0 , the burst can be named as single. Each data/beat has a width defined by the destination data width SDW_LOG2[1:0].
      Note: If a burst transfer crossed a 1-Kbyte address boundary on a AHB transfer, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the AHB protocol.
      If a burst transfer is of length greater than the FIFO size of the channel x, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the FIFO size. Transfer performance is lower, with GPDMA re-arbitration between effective and lower singles/bursts, but the data integrity is guaranteed.
  - name: PAM
    bit_range:
    - 12
    - 11
    description: |-
      padding/alignment mode
      If DDW_LOG2[1:0] = SDW_LOG2[1:0]: if the data width of a burst destination transfer is equal to the data width of a burst source transfer, these bits are ignored.
      Else, in the following enumerated values, the condition PAM_1 is when destination data width is higher that source data width, and the condition PAM_2 is when destination data width is higher than source data width.
      1x: successive source data are FIFO queued and packed at the destination data width, in a left (LSB) to right (MSB) order (named little endian), before a destination transfer
      1x: source data is FIFO queued and unpacked at the destination data width, to be transferred in a left (LSB) to right (MSB) order (named little endian) to the destination
      Note: If the transfer from the source peripheral is configured with peripheral flow-control mode (SWREQ = 0 and PFREQ = 1 and DREQ = 0), and if the destination data width   the source data width, packing is not supported.
  - name: SBX
    bit_range:
    - 13
    - 13
    description: |-
      source byte exchange within the unaligned half-word of each source word
      If the source data width is shorter than a word, this bit is ignored.
      If the source data width is a word:
  - name: SAP
    bit_range:
    - 14
    - 14
    description: |-
      source allocated port
      This bit is used to allocate the master port for the source transfer
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  - name: SSEC
    bit_range:
    - 15
    - 15
    description: |-
      security attribute of the GPDMA transfer from the source
      If GPDMA_SECCFGR.SECx = 1 and the access is secure:
      This is a secure register bit. This bit can only be read by a secure software. This bit must be written by a secure software when GPDMA_SECCFGR.SECx =1 . A secure write is ignored when GPDMA_SECCFGR.SECx = 0.
      When GPDMA_SECCFGR.SECx is de-asserted, this SSEC bit is also de-asserted by hardware (on a secure reconfiguration of the channel as non-secure), and the GPDMA transfer from the source is non-secure.
  - name: DDW_LOG2
    bit_range:
    - 17
    - 16
    description: |-
      binary logarithm of the destination data width of a burst, in bytes
      Note: Setting a 8-byte data width causes a user setting error to be reported and none transfer is issued.
      A destination burst transfer must have an aligned address with its data width (start address GPDMA_CxDAR[2:0] and address offset GPDMA_CxTR3.DAO[2:0], versus DDW_LOG2[1:0]). Otherwise a user setting error is reported and no transfer is issued.
  - name: DINC
    bit_range:
    - 19
    - 19
    description: |-
      destination incrementing burst
      The destination address, pointed by GPDMA_CxDAR, is kept constant after a burst beat/single transfer, or is incremented by the offset value corresponding to a contiguous data after a burst beat/single transfer.
  - name: DBL_1
    bit_range:
    - 25
    - 20
    description: |-
      destination burst length minus 1, between 0 and 63
      The burst length unit is one data named beat within a burst. If DBL_1[5:0] =0 , the burst can be named as single. Each data/beat has a width defined by the destination data width DDW_LOG2[1:0].
      Note: If a burst transfer crossed a 1-Kbyte address boundary on a AHB transfer, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the AHB protocol.
      If a burst transfer is of length greater than the FIFO size of the channel x, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the FIFO size. Transfer performance is lower, with GPDMA re-arbitration between effective and lower singles/bursts, but the data integrity is guaranteed.
  - name: DBX
    bit_range:
    - 26
    - 26
    description: |-
      destination byte exchange
      If the destination data size is a byte, this bit is ignored.
      If the destination data size is not a byte:
  - name: DHX
    bit_range:
    - 27
    - 27
    description: |-
      destination half-word exchange
      If the destination data size is shorter than a word, this bit is ignored.
      If the destination data size is a word:
  - name: DAP
    bit_range:
    - 30
    - 30
    description: |-
      destination allocated port
      This bit is used to allocate the master port for the destination transfer
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  - name: DSEC
    bit_range:
    - 31
    - 31
    description: |-
      security attribute of the GPDMA transfer to the destination
      If GPDMA_SECCFGR.SECx = 1 and the access is secure:
      This is a secure register bit. This bit can only be read by a secure software. This bit must be written by a secure software when GPDMA_SECCFGR.SECx = 1. A secure write is ignored when GPDMA_SECCFGR.SECx = 0.
      When GPDMA_SECCFGR.SECx is de-asserted, this DSEC bit is also de-asserted by hardware (on a secure reconfiguration of the channel as non-secure), and the GPDMA transfer to the destination is non-secure.
  side_effects: null
- id: GPDMA_C5TR2
  address_offset: 788
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: REQSEL
    bit_range:
    - 7
    - 0
    description: |-
      GPDMA hardware request selection
      These bits are ignored if channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer). Else, the selected hardware request is internally taken into account as per .
      The user must not assign a same input hardware request (same REQSEL[7:0] value) to different active GPDMA channels (GPDMA_CxCR.EN = 1 and GPDMA_CxTR2.SWREQ = 0 for these channels). GPDMA is not intended to hardware support the case of simultaneous enabled channels incorrectly configured with a same hardware peripheral request signal, and there is no user setting error reporting.
  - name: SWREQ
    bit_range:
    - 9
    - 9
    description: |-
      software request
      This bit is internally taken into account when GPDMA_CxCR.EN is asserted.
  - name: DREQ
    bit_range:
    - 10
    - 10
    description: |-
      destination hardware request
      This bit is ignored if channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer). Else:
      Note: If the channel x is activated (GPDMA_CxCR.EN is asserted) with SWREQ = 0 and PFREQ = 1 (peripheral hardware request with peripheral flow-control mode), any software assertion to this DREQ bit is ignored: in peripheral flow-control mode, only a peripheral-to-memory transfer is supported.
  - name: BREQ
    bit_range:
    - 11
    - 11
    description: |-
      Block hardware request
      If the channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer), this bit is ignored. Else:
  - name: PFREQ
    bit_range:
    - 12
    - 12
    description: |-
      Hardware request in peripheral flow control mode
      Important: If a given channel x is not implemented with this feature, this bit is reserved and PFREQ is not present (see  for the list of the implemented channels with this feature.
      If the channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer), this bit is ignored. Else:
      Note: In peripheral flow control mode, there are the following restrictions:
      - no 2D/repeated block support (GPDMA_CxBR1.BRC[10:0] must be set to 0 if present)
      - the peripheral must be set as the source of the transfer (DREQ = 0).
      - data packing to a wider destination width is not supported (if destination width   source data width, GPDMA_CxTR1.PAM[1] must be set to 0).
      - GPDMA_CxBR1.BNDT[15:0] must be programmed as a multiple of the source (peripheral) burst size.
  - name: TRIGM
    bit_range:
    - 15
    - 14
    description: |-
      trigger mode
      These bits define the transfer granularity for its conditioning by the trigger.
  - name: TRIGSEL
    bit_range:
    - 21
    - 16
    description: |-
      trigger event input selection
      These bits select the trigger event input of the GPDMA transfer (as per ), with an active trigger event if TRIGPOL[1:0] different  00.
  - name: TRIGPOL
    bit_range:
    - 25
    - 24
    description: |-
      trigger event polarity
      These bits define the polarity of the selected trigger event input defined by TRIGSEL[5:0].
  - name: TCEM
    bit_range:
    - 31
    - 30
    description: |-
      transfer complete event mode
      These bits define the transfer granularity for the transfer complete and half transfer complete events generation.
      Note: If the initial LLI0 data transfer is null/void (directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] = 0), then neither the complete transfer event nor the half transfer event is generated.
      Note: If the initial LLI0 data transfer is null/void (directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] = 0), then neither the complete transfer event nor the half transfer event is generated.
      Note: If the initial LLI0 data transfer is null/void (i.e. directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] =0 ), then the half transfer event is not generated, and the transfer complete event is generated when is completed the loading of the LLI1.
  side_effects: null
- id: GPDMA_C5BR1
  address_offset: 792
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: BNDT
    bit_range:
    - 15
    - 0
    description: |-
      block number of data bytes to transfer from the source
      Block size transferred from the source. When the channel is enabled, this field becomes read-only and is decremented, indicating the remaining number of data items in the current source block to be transferred. BNDT[15:0] is programmed in number of bytes, maximum source block size is 64 Kbytes -1.
      Once the last data transfer is completed (BNDT[15:0] = 0):
      - if GPDMA_CxLLR.UB1 = 1, this field is updated by the LLI in the memory.
      - if GPDMA_CxLLR.UB1 = 0 and if there is at least one non null Uxx update bit, this field is internally restored to the programmed value.
      - if all GPDMA_CxLLR.Uxx = 0 and if GPDMA_CxLLR.LA[15:0] = 0, this field is internally restored to the programmed value (infinite/continuous last LLI).
      - if GPDMA_CxLLR = 0, this field is kept as zero following the last LLI data transfer.
      Note: A non-null source block size must be a multiple of the source data width (BNDT[2:0] versus GPDMA_CxTR1.SDW_LOG2[1:0]). Else a user setting error is reported and no transfer is issued.
      When configured in packing mode (GPDMA_CxTR1.PAM[1] = 1 and destination data width different from source data width), a non-null source block size must be a multiple of the destination data width (BNDT[2:0] versus GPDMA_CxTR1.DDW_LOG2[1:0]). Else a user setting error is reported and no transfer is issued.
  side_effects: null
- id: GPDMA_C5SAR
  address_offset: 796
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SA
    bit_range:
    - 31
    - 0
    description: |-
      source address
      This field is the pointer to the address from which the next data is read.
      During the channel activity, depending on the source addressing mode (GPDMA_CxTR1.SINC), this field is kept fixed or incremented by the data width (GPDMA_CxTR1.SDW_LOG2[1:0]) after each burst source data, reflecting the next address from which data is read.
      During the channel activity, this address is updated after each completed source burst, consequently to:
      the programmed source burst; either in fixed addressing mode or in contiguous-data incremented mode. If contiguously incremented (GPDMA_CxTR1.SINC = 1), then the additional address offset value is the programmed burst size, as defined by GPDMA_CxTR1.SBL_1[5:0] and GPDMA_CxTR1.SDW_LOG2[21:0]
      the additional source incremented/decremented offset value as programmed by GPDMA_CxBR1.SDEC and GPDMA_CxTR3.SAO[12:0]
      once/if completed source block transfer, for a channel x with 2D addressing capability (x = 12 to 15). additional block repeat source incremented/decremented offset value as programmed by GPDMA_CxBR1.BRSDEC and GPDMA_CxBR2.BRSAO[15:0]
      In linked-list mode, after a LLI data transfer is completed, this register is automatically updated by GPDMA from the memory, provided the LLI is set with GPDMA_CxLLR.USA = 1.
      Note: A source address must be aligned with the programmed data width of a source burst (SA[2:0] versus GPDMA_CxTR1.SDW_LOG2[1:0]). Else, a user setting error is reported and no transfer is issued.
      When the source block size is not a multiple of the source burst size and is a multiple of the source data width, the last programmed source burst is not completed and is internally shorten to match the block size. In this case, the additional GPDMA_CxTR3.SAO[12:0] is not applied.
  side_effects: null
- id: GPDMA_C5DAR
  address_offset: 800
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: DA
    bit_range:
    - 31
    - 0
    description: |-
      destination address
      This field is the pointer to the address from which the next data is written.
      During the channel activity, depending on the destination addressing mode (GPDMA_CxTR1.DINC), this field is kept fixed or incremented by the data width (GPDMA_CxTR1.DDW_LOG2[21:0]) after each burst destination data, reflecting the next address from which data is written.
      During the channel activity, this address is updated after each completed destination burst, consequently to:
      the programmed destination burst; either in fixed addressing mode or in contiguous-data incremented mode. If contiguously incremented (GPDMA_CxTR1.DINC = 1), then the additional address offset value is the programmed burst size, as defined by GPDMA_CxTR1.DBL_1[5:0] and GPDMA_CxTR1.DDW_LOG2[1:0]
      the additional destination incremented/decremented offset value as programmed by GPDMA_CxBR1.DDEC and GPDMA_CxTR3.DAO[12:0]
      once/if completed destination block transfer, for a channel x with 2D addressing capability (x = 12 to 15), the additional block repeat destination incremented/decremented offset value as programmed by GPDMA_CxBR1.BRDDEC and GPDMA_CxBR2.BRDAO[15:0]
      In linked-list mode, after a LLI data transfer is completed, this register is automatically updated by the GPDMA from the memory, provided the LLI is set with GPDMA_CxLLR.UDA = 1.
      Note: A destination address must be aligned with the programmed data width of a destination burst (DA[2:0] versus GPDMA_CxTR1.DDW_LOG2[1:0]). Else, a user setting error is reported and no transfer is issued.
  side_effects: null
- id: GPDMA_C5LLR
  address_offset: 844
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LA
    bit_range:
    - 15
    - 2
    description: |-
      pointer (16-bit low-significant address) to the next linked-list data structure
      If UT1 = UT2 = UB1 = USA = UDA = ULL = 0 and if LA[15:20] = 0, the current LLI is the last one. The channel transfer is completed without any update of the linked-list GPDMA register file.
      Else, this field is the pointer to the memory address offset from which the next linked-list data structure is automatically fetched from, once the data transfer is completed, in order to conditionally update the linked-list GPDMA internal register file (GPDMA_CxCTR1, GPDMA_CxTR2, GPDMA_CxBR1, GPDMA_CxSAR, GPDMA_CxDAR and GPDMA_CxLLR).
      Note: The user must program the pointer to be 32-bit aligned. The two low-significant bits are write ignored.
  - name: ULL
    bit_range:
    - 16
    - 16
    description: |-
      Update GPDMA_CxLLR register from memory
      This bit is used to control the update of GPDMA_CxLLR from the memory during the link transfer.
  - name: UDA
    bit_range:
    - 27
    - 27
    description: |-
      Update GPDMA_CxDAR register from memory
      This bit is used to control the update of GPDMA_CxDAR from the memory during the link transfer.
  - name: USA
    bit_range:
    - 28
    - 28
    description: |-
      update GPDMA_CxSAR from memory
      This bit controls the update of GPDMA_CxSAR from the memory during the link transfer.
  - name: UB1
    bit_range:
    - 29
    - 29
    description: |-
      Update GPDMA_CxBR1 from memory
      This bit controls the update of GPDMA_CxBR1 from the memory during the link transfer. If UB1 = 0 and if GPDMA_CxLLR different  0, the linked-list is not completed. GPDMA_CxBR1.BNDT[15:0] is then restored to the programmed value after data transfer is completed and before the link transfer.
  - name: UT2
    bit_range:
    - 30
    - 30
    description: |-
      Update GPDMA_CxTR2 from memory
      This bit controls the update of GPDMA_CxTR2 from the memory during the link transfer.
  - name: UT1
    bit_range:
    - 31
    - 31
    description: |-
      Update GPDMA_CxTR1 from memory
      This bit controls the update of GPDMA_CxTR1 from the memory during the link transfer.
  side_effects: null
- id: GPDMA_C6LBAR
  address_offset: 848
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LBA
    bit_range:
    - 31
    - 16
    description: linked-list base address of GPDMA channel x
  side_effects: null
- id: GPDMA_C6FCR
  address_offset: 860
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TCF
    bit_range:
    - 8
    - 8
    description: transfer complete flag clear
  - name: HTF
    bit_range:
    - 9
    - 9
    description: half transfer flag clear
  - name: DTEF
    bit_range:
    - 10
    - 10
    description: data transfer error flag clear
  - name: ULEF
    bit_range:
    - 11
    - 11
    description: update link transfer error flag clear
  - name: USEF
    bit_range:
    - 12
    - 12
    description: user setting error flag clear
  - name: SUSPF
    bit_range:
    - 13
    - 13
    description: completed suspension flag clear
  - name: TOF
    bit_range:
    - 14
    - 14
    description: trigger overrun flag clear
  side_effects: null
- id: GPDMA_C6SR
  address_offset: 864
  size: 32
  access: READ_WRITE
  reset_value: 1
  fields:
  - name: IDLEF
    bit_range:
    - 0
    - 0
    description: |-
      idle flag
      This idle flag is de-asserted by hardware when the channel is enabled (GPDMA_CxCR.EN = 1) with a valid channel configuration (no USEF to be immediately reported).
      This idle flag is asserted after hard reset or by hardware when the channel is back in idle state (in suspended or disabled state).
  - name: TCF
    bit_range:
    - 8
    - 8
    description: |-
      transfer complete flag
      A transfer complete event is either a block transfer complete, a 2D/repeated block transfer complete, a LLI transfer complete including the upload of the next LLI if any, or the full linked-list completion, depending on the transfer complete event mode (GPDMA_CxTR2.TCEM[1:0]).
  - name: HTF
    bit_range:
    - 9
    - 9
    description: |-
      half transfer flag
      A half transfer event is either a half block transfer or a half 2D/repeated block transfer, depending on the transfer complete event mode (GPDMA_CxTR2.TCEM[1:0]).
      A half block transfer occurs when half of the bytes of the source block size (rounded up integer of GPDMA_CxBR1.BNDT[15:0]/2) has been transferred to the destination.
      A half 2D/repeated block transfer occurs when half of the repeated blocks (rounded up integer of (GPDMA_CxBR1.BRC[10:0]+1)/2)) has been transferred to the destination.
  - name: DTEF
    bit_range:
    - 10
    - 10
    description: data transfer error flag
  - name: ULEF
    bit_range:
    - 11
    - 11
    description: update link transfer error flag
  - name: USEF
    bit_range:
    - 12
    - 12
    description: user setting error flag
  - name: SUSPF
    bit_range:
    - 13
    - 13
    description: completed suspension flag
  - name: TOF
    bit_range:
    - 14
    - 14
    description: trigger overrun flag
  - name: FIFOL
    bit_range:
    - 23
    - 16
    description: |-
      monitored FIFO level
      Number of available write beats in the FIFO, in units of the programmed destination data width (see GPDMA_CxTR1.DDW_LOG2[1:0], in units of bytes, half-words, or words).
      Note: After having suspended an active transfer, the user may need to read FIFOL[7:0], additionally to GPDMA_CxBR1.BDNT[15:0] and GPDMA_CxBR1.BRC[10:0], to know how many data have been transferred to the destination. Before reading, the user may wait for the transfer to be suspended (GPDMA_CxSR.SUSPF = 1).
  side_effects: null
- id: GPDMA_C6CR
  address_offset: 868
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: EN
    bit_range:
    - 0
    - 0
    description: |-
      enable
      Writing 1 into the field RESET (bit 1) causes the hardware to de-assert this bit, whatever is written into this bit 0. Else:
      this bit is de-asserted by hardware when there is a transfer error (master bus error or user setting error) or when there is a channel transfer complete (channel ready to be configured, e.g. if LSM=1 at the end of a single execution of the LLI).
      Else, this bit can be asserted by software.
      Writing 0 into this EN bit is ignored.
  - name: RESET
    bit_range:
    - 1
    - 1
    description: |-
      reset
      This bit is write only. Writing 0 has no impact. Writing 1 implies the reset of the following: the FIFO, the channel internal state, SUSP and EN bits (whatever is written receptively in bit 2 and bit 0).
      The reset is effective when the channel is in steady state, meaning one of the following:
      - active channel in suspended state (GPDMA_CxSR.SUSPF = 1 and GPDMA_CxSR.IDLEF = GPDMA_CxCR.EN = 1)
      - channel in disabled state (GPDMA_CxSR.IDLEF = 1 and GPDMA_CxCR.EN = 0).
      After writing a RESET, to continue using this channel, the user must explicitly reconfigure the channel including the hardware-modified configuration registers (GPDMA_CxBR1, GPDMA_CxSAR and GPDMA_CxDAR) before enabling again the channel (see the programming sequence in ).
  - name: SUSP
    bit_range:
    - 2
    - 2
    description: |-
      suspend
      Writing 1 into the field RESET (bit 1) causes the hardware to de-assert this bit, whatever is written into this bit 2. Else:
      Software must write 1 in order to suspend an active channel i.e. a channel with an ongoing GPDMA transfer over its master ports.
      The software must write 0 in order to resume a suspended channel, following the programming sequence detailed in .
  - name: TCIE
    bit_range:
    - 8
    - 8
    description: transfer complete interrupt enable
  - name: HTIE
    bit_range:
    - 9
    - 9
    description: half transfer complete interrupt enable
  - name: DTEIE
    bit_range:
    - 10
    - 10
    description: data transfer error interrupt enable
  - name: ULEIE
    bit_range:
    - 11
    - 11
    description: update link transfer error interrupt enable
  - name: USEIE
    bit_range:
    - 12
    - 12
    description: user setting error interrupt enable
  - name: SUSPIE
    bit_range:
    - 13
    - 13
    description: completed suspension interrupt enable
  - name: TOIE
    bit_range:
    - 14
    - 14
    description: trigger overrun interrupt enable
  - name: LSM
    bit_range:
    - 16
    - 16
    description: |-
      Link step mode
      First the (possible 1D/repeated) block transfer is executed as defined by the current internal register file until GPDMA_CxBR1.BNDT[15:0] = 0 and GPDMA_CxBR1.BRC[10:0] = 0 if present. Secondly the next linked-list data structure is conditionally uploaded from memory as defined by GPDMA_CxLLR. Then channel execution is completed.
      Note: This bit must be written when EN=0. This bit is read-only when EN=1.
  - name: LAP
    bit_range:
    - 17
    - 17
    description: |-
      linked-list allocated port
      This bit is used to allocate the master port for the update of the GPDMA linked-list registers from the memory.
      Note: This bit must be written when EN=0. This bit is read-only when EN=1.
  - name: PRIO
    bit_range:
    - 23
    - 22
    description: |-
      priority level of the channel x GPDMA transfer versus others
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  side_effects: null
- id: GPDMA_C6TR1
  address_offset: 912
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SDW_LOG2
    bit_range:
    - 1
    - 0
    description: |-
      binary logarithm of the source data width of a burst in bytes
      Note: Setting a 8-byte data width causes a user setting error to be reported and no transfer is issued.
      A source block size must be a multiple of the source data width (GPDMA_CxBR1.BNDT[2:0] versus SDW_LOG2[1:0]). Otherwise, a user setting error is reported and no transfer is issued.
      A source burst transfer must have an aligned address with its data width (start address GPDMA_CxSAR[2:0] versus SDW_LOG2[1:0]). Otherwise, a user setting error is reported and none transfer is issued.
  - name: SINC
    bit_range:
    - 3
    - 3
    description: |-
      source incrementing burst
      The source address, pointed by GPDMA_CxSAR, is kept constant after a burst beat/single transfer or is incremented by the offset value corresponding to a contiguous data after a burst beat/single transfer.
  - name: SBL_1
    bit_range:
    - 9
    - 4
    description: |-
      source burst length minus 1, between 0 and 63
      The burst length unit is one data named beat within a burst. If SBL_1[5:0] =0 , the burst can be named as single. Each data/beat has a width defined by the destination data width SDW_LOG2[1:0].
      Note: If a burst transfer crossed a 1-Kbyte address boundary on a AHB transfer, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the AHB protocol.
      If a burst transfer is of length greater than the FIFO size of the channel x, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the FIFO size. Transfer performance is lower, with GPDMA re-arbitration between effective and lower singles/bursts, but the data integrity is guaranteed.
  - name: PAM
    bit_range:
    - 12
    - 11
    description: |-
      padding/alignment mode
      If DDW_LOG2[1:0] = SDW_LOG2[1:0]: if the data width of a burst destination transfer is equal to the data width of a burst source transfer, these bits are ignored.
      Else, in the following enumerated values, the condition PAM_1 is when destination data width is higher that source data width, and the condition PAM_2 is when destination data width is higher than source data width.
      1x: successive source data are FIFO queued and packed at the destination data width, in a left (LSB) to right (MSB) order (named little endian), before a destination transfer
      1x: source data is FIFO queued and unpacked at the destination data width, to be transferred in a left (LSB) to right (MSB) order (named little endian) to the destination
      Note: If the transfer from the source peripheral is configured with peripheral flow-control mode (SWREQ = 0 and PFREQ = 1 and DREQ = 0), and if the destination data width   the source data width, packing is not supported.
  - name: SBX
    bit_range:
    - 13
    - 13
    description: |-
      source byte exchange within the unaligned half-word of each source word
      If the source data width is shorter than a word, this bit is ignored.
      If the source data width is a word:
  - name: SAP
    bit_range:
    - 14
    - 14
    description: |-
      source allocated port
      This bit is used to allocate the master port for the source transfer
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  - name: SSEC
    bit_range:
    - 15
    - 15
    description: |-
      security attribute of the GPDMA transfer from the source
      If GPDMA_SECCFGR.SECx = 1 and the access is secure:
      This is a secure register bit. This bit can only be read by a secure software. This bit must be written by a secure software when GPDMA_SECCFGR.SECx =1 . A secure write is ignored when GPDMA_SECCFGR.SECx = 0.
      When GPDMA_SECCFGR.SECx is de-asserted, this SSEC bit is also de-asserted by hardware (on a secure reconfiguration of the channel as non-secure), and the GPDMA transfer from the source is non-secure.
  - name: DDW_LOG2
    bit_range:
    - 17
    - 16
    description: |-
      binary logarithm of the destination data width of a burst, in bytes
      Note: Setting a 8-byte data width causes a user setting error to be reported and none transfer is issued.
      A destination burst transfer must have an aligned address with its data width (start address GPDMA_CxDAR[2:0] and address offset GPDMA_CxTR3.DAO[2:0], versus DDW_LOG2[1:0]). Otherwise a user setting error is reported and no transfer is issued.
  - name: DINC
    bit_range:
    - 19
    - 19
    description: |-
      destination incrementing burst
      The destination address, pointed by GPDMA_CxDAR, is kept constant after a burst beat/single transfer, or is incremented by the offset value corresponding to a contiguous data after a burst beat/single transfer.
  - name: DBL_1
    bit_range:
    - 25
    - 20
    description: |-
      destination burst length minus 1, between 0 and 63
      The burst length unit is one data named beat within a burst. If DBL_1[5:0] =0 , the burst can be named as single. Each data/beat has a width defined by the destination data width DDW_LOG2[1:0].
      Note: If a burst transfer crossed a 1-Kbyte address boundary on a AHB transfer, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the AHB protocol.
      If a burst transfer is of length greater than the FIFO size of the channel x, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the FIFO size. Transfer performance is lower, with GPDMA re-arbitration between effective and lower singles/bursts, but the data integrity is guaranteed.
  - name: DBX
    bit_range:
    - 26
    - 26
    description: |-
      destination byte exchange
      If the destination data size is a byte, this bit is ignored.
      If the destination data size is not a byte:
  - name: DHX
    bit_range:
    - 27
    - 27
    description: |-
      destination half-word exchange
      If the destination data size is shorter than a word, this bit is ignored.
      If the destination data size is a word:
  - name: DAP
    bit_range:
    - 30
    - 30
    description: |-
      destination allocated port
      This bit is used to allocate the master port for the destination transfer
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  - name: DSEC
    bit_range:
    - 31
    - 31
    description: |-
      security attribute of the GPDMA transfer to the destination
      If GPDMA_SECCFGR.SECx = 1 and the access is secure:
      This is a secure register bit. This bit can only be read by a secure software. This bit must be written by a secure software when GPDMA_SECCFGR.SECx = 1. A secure write is ignored when GPDMA_SECCFGR.SECx = 0.
      When GPDMA_SECCFGR.SECx is de-asserted, this DSEC bit is also de-asserted by hardware (on a secure reconfiguration of the channel as non-secure), and the GPDMA transfer to the destination is non-secure.
  side_effects: null
- id: GPDMA_C6TR2
  address_offset: 916
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: REQSEL
    bit_range:
    - 7
    - 0
    description: |-
      GPDMA hardware request selection
      These bits are ignored if channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer). Else, the selected hardware request is internally taken into account as per .
      The user must not assign a same input hardware request (same REQSEL[7:0] value) to different active GPDMA channels (GPDMA_CxCR.EN = 1 and GPDMA_CxTR2.SWREQ = 0 for these channels). GPDMA is not intended to hardware support the case of simultaneous enabled channels incorrectly configured with a same hardware peripheral request signal, and there is no user setting error reporting.
  - name: SWREQ
    bit_range:
    - 9
    - 9
    description: |-
      software request
      This bit is internally taken into account when GPDMA_CxCR.EN is asserted.
  - name: DREQ
    bit_range:
    - 10
    - 10
    description: |-
      destination hardware request
      This bit is ignored if channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer). Else:
      Note: If the channel x is activated (GPDMA_CxCR.EN is asserted) with SWREQ = 0 and PFREQ = 1 (peripheral hardware request with peripheral flow-control mode), any software assertion to this DREQ bit is ignored: in peripheral flow-control mode, only a peripheral-to-memory transfer is supported.
  - name: BREQ
    bit_range:
    - 11
    - 11
    description: |-
      Block hardware request
      If the channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer), this bit is ignored. Else:
  - name: PFREQ
    bit_range:
    - 12
    - 12
    description: |-
      Hardware request in peripheral flow control mode
      Important: If a given channel x is not implemented with this feature, this bit is reserved and PFREQ is not present (see  for the list of the implemented channels with this feature.
      If the channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer), this bit is ignored. Else:
      Note: In peripheral flow control mode, there are the following restrictions:
      - no 2D/repeated block support (GPDMA_CxBR1.BRC[10:0] must be set to 0 if present)
      - the peripheral must be set as the source of the transfer (DREQ = 0).
      - data packing to a wider destination width is not supported (if destination width   source data width, GPDMA_CxTR1.PAM[1] must be set to 0).
      - GPDMA_CxBR1.BNDT[15:0] must be programmed as a multiple of the source (peripheral) burst size.
  - name: TRIGM
    bit_range:
    - 15
    - 14
    description: |-
      trigger mode
      These bits define the transfer granularity for its conditioning by the trigger.
  - name: TRIGSEL
    bit_range:
    - 21
    - 16
    description: |-
      trigger event input selection
      These bits select the trigger event input of the GPDMA transfer (as per ), with an active trigger event if TRIGPOL[1:0] different  00.
  - name: TRIGPOL
    bit_range:
    - 25
    - 24
    description: |-
      trigger event polarity
      These bits define the polarity of the selected trigger event input defined by TRIGSEL[5:0].
  - name: TCEM
    bit_range:
    - 31
    - 30
    description: |-
      transfer complete event mode
      These bits define the transfer granularity for the transfer complete and half transfer complete events generation.
      Note: If the initial LLI0 data transfer is null/void (directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] = 0), then neither the complete transfer event nor the half transfer event is generated.
      Note: If the initial LLI0 data transfer is null/void (directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] = 0), then neither the complete transfer event nor the half transfer event is generated.
      Note: If the initial LLI0 data transfer is null/void (i.e. directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] =0 ), then the half transfer event is not generated, and the transfer complete event is generated when is completed the loading of the LLI1.
  side_effects: null
- id: GPDMA_C6BR1
  address_offset: 920
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: BNDT
    bit_range:
    - 15
    - 0
    description: |-
      block number of data bytes to transfer from the source
      Block size transferred from the source. When the channel is enabled, this field becomes read-only and is decremented, indicating the remaining number of data items in the current source block to be transferred. BNDT[15:0] is programmed in number of bytes, maximum source block size is 64 Kbytes -1.
      Once the last data transfer is completed (BNDT[15:0] = 0):
      - if GPDMA_CxLLR.UB1 = 1, this field is updated by the LLI in the memory.
      - if GPDMA_CxLLR.UB1 = 0 and if there is at least one not null Uxx update bit, this field is internally restored to the programmed value.
      - if all GPDMA_CxLLR.Uxx = 0 and if GPDMA_CxLLR.LA[15:0] different  0, this field is internally restored to the programmed value (infinite/continuous last LLI).
      - if GPDMA_CxLLR = 0, this field is kept as zero following the last LLI data transfer.
      Note: A non-null source block size must be a multiple of the source data width (BNDT[2:0] versus GPDMA_CxTR1.SDW_LOG2[1:0]). Else a user setting error is reported and no transfer is issued.
      When configured in packing mode (GPDMA_CxTR1.PAM[1]=1 and destination data width different from source data width), a non-null source block size must be a multiple of the destination data width (BNDT[2:0] versus GPDMA_CxTR1.DDW_LOG2[1:0]). Else a user setting error is reported and no transfer is issued.
  - name: BRC
    bit_range:
    - 26
    - 16
    description: |-
      Block repeat counter
      This field contains the number of repetitions of the current block (0 to 2047).
      When the channel is enabled, this field becomes read-only. After decrements, this field indicates the remaining number of blocks, excluding the current one. This counter is hardware decremented for each completed block transfer.
      Once the last block transfer is completed (BRC[10:0] = BNDT[15:0] = 0):
      If GPDMA_CxLLR.UB1 = 1, all GPDMA_CxBR1 fields are updated by the next LLI in the memory.
      If GPDMA_CxLLR.UB1 = 0 and if there is at least one not null Uxx update bit, this field is internally restored to the programmed value.
      if all GPDMA_CxLLR.Uxx = 0 and if GPDMA_CxLLR.LA[15:0] different  0, this field is internally restored to the programmed value (infinite/continuous last LLI).
      if GPDMA_CxLLR = 0, this field is kept as zero following the last LLI and data transfer.
  - name: SDEC
    bit_range:
    - 28
    - 28
    description: source address decrement
  - name: DDEC
    bit_range:
    - 29
    - 29
    description: destination address decrement
  - name: BRSDEC
    bit_range:
    - 30
    - 30
    description: |-
      Block repeat source address decrement
      Note: On top of this increment/decrement (depending on BRSDEC), GPDMA_CxSAR is in the same time also updated by the increment/decrement (depending on SDEC) of the GPDMA_CxTR3.SAO value, as it is done after any programmed burst transfer.
  - name: BRDDEC
    bit_range:
    - 31
    - 31
    description: |-
      Block repeat destination address decrement
      Note: On top of this increment/decrement (depending on BRDDEC), GPDMA_CxDAR is in the same time also updated by the increment/decrement (depending on DDEC) of the GPDMA_CxTR3.DAO value, as it is usually done at the end of each programmed burst transfer.
  side_effects: null
- id: GPDMA_C6SAR
  address_offset: 924
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SA
    bit_range:
    - 31
    - 0
    description: |-
      source address
      This field is the pointer to the address from which the next data is read.
      During the channel activity, depending on the source addressing mode (GPDMA_CxTR1.SINC), this field is kept fixed or incremented by the data width (GPDMA_CxTR1.SDW_LOG2[1:0]) after each burst source data, reflecting the next address from which data is read.
      During the channel activity, this address is updated after each completed source burst, consequently to:
      the programmed source burst; either in fixed addressing mode or in contiguous-data incremented mode. If contiguously incremented (GPDMA_CxTR1.SINC = 1), then the additional address offset value is the programmed burst size, as defined by GPDMA_CxTR1.SBL_1[5:0] and GPDMA_CxTR1.SDW_LOG2[21:0]
      the additional source incremented/decremented offset value as programmed by GPDMA_CxBR1.SDEC and GPDMA_CxTR3.SAO[12:0]
      once/if completed source block transfer, for a channel x with 2D addressing capability (x = 12 to 15). additional block repeat source incremented/decremented offset value as programmed by GPDMA_CxBR1.BRSDEC and GPDMA_CxBR2.BRSAO[15:0]
      In linked-list mode, after a LLI data transfer is completed, this register is automatically updated by GPDMA from the memory, provided the LLI is set with GPDMA_CxLLR.USA = 1.
      Note: A source address must be aligned with the programmed data width of a source burst (SA[2:0] versus GPDMA_CxTR1.SDW_LOG2[1:0]). Else, a user setting error is reported and no transfer is issued.
      When the source block size is not a multiple of the source burst size and is a multiple of the source data width, the last programmed source burst is not completed and is internally shorten to match the block size. In this case, the additional GPDMA_CxTR3.SAO[12:0] is not applied.
  side_effects: null
- id: GPDMA_C6DAR
  address_offset: 928
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: DA
    bit_range:
    - 31
    - 0
    description: |-
      destination address
      This field is the pointer to the address from which the next data is written.
      During the channel activity, depending on the destination addressing mode (GPDMA_CxTR1.DINC), this field is kept fixed or incremented by the data width (GPDMA_CxTR1.DDW_LOG2[21:0]) after each burst destination data, reflecting the next address from which data is written.
      During the channel activity, this address is updated after each completed destination burst, consequently to:
      the programmed destination burst; either in fixed addressing mode or in contiguous-data incremented mode. If contiguously incremented (GPDMA_CxTR1.DINC = 1), then the additional address offset value is the programmed burst size, as defined by GPDMA_CxTR1.DBL_1[5:0] and GPDMA_CxTR1.DDW_LOG2[1:0]
      the additional destination incremented/decremented offset value as programmed by GPDMA_CxBR1.DDEC and GPDMA_CxTR3.DAO[12:0]
      once/if completed destination block transfer, for a channel x with 2D addressing capability (x = 12 to 15), the additional block repeat destination incremented/decremented offset value as programmed by GPDMA_CxBR1.BRDDEC and GPDMA_CxBR2.BRDAO[15:0]
      In linked-list mode, after a LLI data transfer is completed, this register is automatically updated by the GPDMA from the memory, provided the LLI is set with GPDMA_CxLLR.UDA = 1.
      Note: A destination address must be aligned with the programmed data width of a destination burst (DA[2:0] versus GPDMA_CxTR1.DDW_LOG2[1:0]). Else, a user setting error is reported and no transfer is issued.
  side_effects: null
- id: GPDMA_C6TR3
  address_offset: 932
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SAO
    bit_range:
    - 12
    - 0
    description: |-
      source address offset increment
      The source address, pointed by GPDMA_CxSAR, is incremented or decremented (depending on GPDMA_CxBR1.SDEC) by this offset SAO[12:0] for each programmed source burst. This offset is not including and is added to the programmed burst size when the completed burst is addressed in incremented mode (GPDMA_CxTR1.SINC = 1).
      Note: A source address offset must be aligned with the programmed data width of a source burst (SAO[2:0] versus GPDMA_CxTR1.SDW_LOG2[1:0]). Else a user setting error is reported and none transfer is issued.
      When the source block size is not a multiple of the destination burst size and is a multiple of the source data width, then the last programmed source burst is not completed and is internally shorten to match the block size. In this case, the additional GPDMA_CxTR3.SAO[12:0] is not applied.
  - name: DAO
    bit_range:
    - 28
    - 16
    description: |-
      destination address offset increment
      The destination address, pointed by GPDMA_CxDAR, is incremented or decremented (depending on GPDMA_CxBR1.DDEC) by this offset DAO[12:0] for each programmed destination burst. This offset is not including and is added to the programmed burst size when the completed burst is addressed in incremented mode (GPDMA_CxTR1.DINC = 1).
      Note: A destination address offset must be aligned with the programmed data width of a destination burst (DAO[2:0] versus GPDMA_CxTR1.DDW_LOG2[1:0]). Else, a user setting error is reported and no transfer is issued.
  side_effects: null
- id: GPDMA_C6BR2
  address_offset: 936
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: BRSAO
    bit_range:
    - 15
    - 0
    description: |-
      Block repeated source address offset
      For a channel with 2D addressing capability, this field is used to update (by addition or subtraction depending on GPDMA_CxBR1.BRSDEC) the current source address (GPDMA_CxSAR) at the end of a block transfer.
      Note: A block repeated source address offset must be aligned with the programmed data width of a source burst (BRSAO[2:0] versus GPDMA_CxTR1.SDW_LOG2[1:0]). Else a user setting error is reported and no transfer is issued.
      BRSAO[15:0] must be set to 0 in peripheral flow-control mode (if GPDMA_CxTR2.PFREQ = 1).
  - name: BRDAO
    bit_range:
    - 31
    - 16
    description: |-
      Block repeated destination address offset
      For a channel with 2D addressing capability, this field is used to update (by addition or subtraction depending on GPDMA_CxBR1.BRDDEC) the current destination address (GPDMA_CxDAR) at the end of a block transfer.
      Note: A block repeated destination address offset must be aligned with the programmed data width of a destination burst (BRDAO[2:0] versus GPDMA_CxTR1.DDW_LOG2[1:0]). Else a user setting error is reported and no transfer is issued.
      BRDAO[15:0] must be set to 0 in peripheral flow-control mode (if GPDMA_CxTR2.PFREQ = 1).
  side_effects: null
- id: GPDMA_C6LLR
  address_offset: 972
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LA
    bit_range:
    - 15
    - 2
    description: |-
      pointer (16-bit low-significant address) to the next linked-list data structure
      If UT1 = UT2 = UB1 = USA = UDA = ULL = 0 and if LA[15:20] = 0, the current LLI is the last one. The channel transfer is completed without any update of the linked-list GPDMA register file.
      Else, this field is the pointer to the memory address offset from which the next linked-list data structure is automatically fetched from, once the data transfer is completed, in order to conditionally update the linked-list GPDMA internal register file (GPDMA_CxCTR1, GPDMA_CxTR2, GPDMA_CxBR1, GPDMA_CxSAR, GPDMA_CxDAR and GPDMA_CxLLR).
      Note: The user must program the pointer to be 32-bit aligned. The two low-significant bits are write ignored.
  - name: ULL
    bit_range:
    - 16
    - 16
    description: |-
      Update GPDMA_CxLLR register from memory
      This bit is used to control the update of GPDMA_CxLLR from the memory during the link transfer.
  - name: UB2
    bit_range:
    - 25
    - 25
    description: |-
      Update GPDMA_CxBR2 from memory
      This bit controls the update of GPDMA_CxBR2 from the memory during the link transfer.
  - name: UT3
    bit_range:
    - 26
    - 26
    description: |-
      Update GPDMA_CxTR3 from memory
      This bit controls the update of GPDMA_CxTR3 from the memory during the link transfer.
  - name: UDA
    bit_range:
    - 27
    - 27
    description: |-
      Update GPDMA_CxDAR register from memory
      This bit is used to control the update of GPDMA_CxDAR from the memory during the link transfer.
  - name: USA
    bit_range:
    - 28
    - 28
    description: |-
      update GPDMA_CxSAR from memory
      This bit controls the update of GPDMA_CxSAR from the memory during the link transfer.
  - name: UB1
    bit_range:
    - 29
    - 29
    description: |-
      Update GPDMA_CxBR1 from memory
      This bit controls the update of GPDMA_CxBR1 from the memory during the link transfer. If UB1 = 0 and if GPDMA_CxLLR different  0, the linked-list is not completed. GPDMA_CxBR1.BNDT[15:0] is then restored to the programmed value after data transfer is completed and before the link transfer.
  - name: UT2
    bit_range:
    - 30
    - 30
    description: |-
      Update GPDMA_CxTR2 from memory
      This bit controls the update of GPDMA_CxTR2 from the memory during the link transfer.
  - name: UT1
    bit_range:
    - 31
    - 31
    description: |-
      Update GPDMA_CxTR1 from memory
      This bit controls the update of GPDMA_CxTR1 from the memory during the link transfer.
  side_effects: null
- id: GPDMA_C7LBAR
  address_offset: 976
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LBA
    bit_range:
    - 31
    - 16
    description: linked-list base address of GPDMA channel x
  side_effects: null
- id: GPDMA_C7FCR
  address_offset: 988
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TCF
    bit_range:
    - 8
    - 8
    description: transfer complete flag clear
  - name: HTF
    bit_range:
    - 9
    - 9
    description: half transfer flag clear
  - name: DTEF
    bit_range:
    - 10
    - 10
    description: data transfer error flag clear
  - name: ULEF
    bit_range:
    - 11
    - 11
    description: update link transfer error flag clear
  - name: USEF
    bit_range:
    - 12
    - 12
    description: user setting error flag clear
  - name: SUSPF
    bit_range:
    - 13
    - 13
    description: completed suspension flag clear
  - name: TOF
    bit_range:
    - 14
    - 14
    description: trigger overrun flag clear
  side_effects: null
- id: GPDMA_C7SR
  address_offset: 992
  size: 32
  access: READ_WRITE
  reset_value: 1
  fields:
  - name: IDLEF
    bit_range:
    - 0
    - 0
    description: |-
      idle flag
      This idle flag is de-asserted by hardware when the channel is enabled (GPDMA_CxCR.EN = 1) with a valid channel configuration (no USEF to be immediately reported).
      This idle flag is asserted after hard reset or by hardware when the channel is back in idle state (in suspended or disabled state).
  - name: TCF
    bit_range:
    - 8
    - 8
    description: |-
      transfer complete flag
      A transfer complete event is either a block transfer complete, a 2D/repeated block transfer complete, a LLI transfer complete including the upload of the next LLI if any, or the full linked-list completion, depending on the transfer complete event mode (GPDMA_CxTR2.TCEM[1:0]).
  - name: HTF
    bit_range:
    - 9
    - 9
    description: |-
      half transfer flag
      A half transfer event is either a half block transfer or a half 2D/repeated block transfer, depending on the transfer complete event mode (GPDMA_CxTR2.TCEM[1:0]).
      A half block transfer occurs when half of the bytes of the source block size (rounded up integer of GPDMA_CxBR1.BNDT[15:0]/2) has been transferred to the destination.
      A half 2D/repeated block transfer occurs when half of the repeated blocks (rounded up integer of (GPDMA_CxBR1.BRC[10:0]+1)/2)) has been transferred to the destination.
  - name: DTEF
    bit_range:
    - 10
    - 10
    description: data transfer error flag
  - name: ULEF
    bit_range:
    - 11
    - 11
    description: update link transfer error flag
  - name: USEF
    bit_range:
    - 12
    - 12
    description: user setting error flag
  - name: SUSPF
    bit_range:
    - 13
    - 13
    description: completed suspension flag
  - name: TOF
    bit_range:
    - 14
    - 14
    description: trigger overrun flag
  - name: FIFOL
    bit_range:
    - 23
    - 16
    description: |-
      monitored FIFO level
      Number of available write beats in the FIFO, in units of the programmed destination data width (see GPDMA_CxTR1.DDW_LOG2[1:0], in units of bytes, half-words, or words).
      Note: After having suspended an active transfer, the user may need to read FIFOL[7:0], additionally to GPDMA_CxBR1.BDNT[15:0] and GPDMA_CxBR1.BRC[10:0], to know how many data have been transferred to the destination. Before reading, the user may wait for the transfer to be suspended (GPDMA_CxSR.SUSPF = 1).
  side_effects: null
- id: GPDMA_C7CR
  address_offset: 996
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: EN
    bit_range:
    - 0
    - 0
    description: |-
      enable
      Writing 1 into the field RESET (bit 1) causes the hardware to de-assert this bit, whatever is written into this bit 0. Else:
      this bit is de-asserted by hardware when there is a transfer error (master bus error or user setting error) or when there is a channel transfer complete (channel ready to be configured, e.g. if LSM=1 at the end of a single execution of the LLI).
      Else, this bit can be asserted by software.
      Writing 0 into this EN bit is ignored.
  - name: RESET
    bit_range:
    - 1
    - 1
    description: |-
      reset
      This bit is write only. Writing 0 has no impact. Writing 1 implies the reset of the following: the FIFO, the channel internal state, SUSP and EN bits (whatever is written receptively in bit 2 and bit 0).
      The reset is effective when the channel is in steady state, meaning one of the following:
      - active channel in suspended state (GPDMA_CxSR.SUSPF = 1 and GPDMA_CxSR.IDLEF = GPDMA_CxCR.EN = 1)
      - channel in disabled state (GPDMA_CxSR.IDLEF = 1 and GPDMA_CxCR.EN = 0).
      After writing a RESET, to continue using this channel, the user must explicitly reconfigure the channel including the hardware-modified configuration registers (GPDMA_CxBR1, GPDMA_CxSAR and GPDMA_CxDAR) before enabling again the channel (see the programming sequence in ).
  - name: SUSP
    bit_range:
    - 2
    - 2
    description: |-
      suspend
      Writing 1 into the field RESET (bit 1) causes the hardware to de-assert this bit, whatever is written into this bit 2. Else:
      Software must write 1 in order to suspend an active channel i.e. a channel with an ongoing GPDMA transfer over its master ports.
      The software must write 0 in order to resume a suspended channel, following the programming sequence detailed in .
  - name: TCIE
    bit_range:
    - 8
    - 8
    description: transfer complete interrupt enable
  - name: HTIE
    bit_range:
    - 9
    - 9
    description: half transfer complete interrupt enable
  - name: DTEIE
    bit_range:
    - 10
    - 10
    description: data transfer error interrupt enable
  - name: ULEIE
    bit_range:
    - 11
    - 11
    description: update link transfer error interrupt enable
  - name: USEIE
    bit_range:
    - 12
    - 12
    description: user setting error interrupt enable
  - name: SUSPIE
    bit_range:
    - 13
    - 13
    description: completed suspension interrupt enable
  - name: TOIE
    bit_range:
    - 14
    - 14
    description: trigger overrun interrupt enable
  - name: LSM
    bit_range:
    - 16
    - 16
    description: |-
      Link step mode
      First the (possible 1D/repeated) block transfer is executed as defined by the current internal register file until GPDMA_CxBR1.BNDT[15:0] = 0 and GPDMA_CxBR1.BRC[10:0] = 0 if present. Secondly the next linked-list data structure is conditionally uploaded from memory as defined by GPDMA_CxLLR. Then channel execution is completed.
      Note: This bit must be written when EN=0. This bit is read-only when EN=1.
  - name: LAP
    bit_range:
    - 17
    - 17
    description: |-
      linked-list allocated port
      This bit is used to allocate the master port for the update of the GPDMA linked-list registers from the memory.
      Note: This bit must be written when EN=0. This bit is read-only when EN=1.
  - name: PRIO
    bit_range:
    - 23
    - 22
    description: |-
      priority level of the channel x GPDMA transfer versus others
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  side_effects: null
- id: GPDMA_C7TR1
  address_offset: 1040
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SDW_LOG2
    bit_range:
    - 1
    - 0
    description: |-
      binary logarithm of the source data width of a burst in bytes
      Note: Setting a 8-byte data width causes a user setting error to be reported and no transfer is issued.
      A source block size must be a multiple of the source data width (GPDMA_CxBR1.BNDT[2:0] versus SDW_LOG2[1:0]). Otherwise, a user setting error is reported and no transfer is issued.
      A source burst transfer must have an aligned address with its data width (start address GPDMA_CxSAR[2:0] versus SDW_LOG2[1:0]). Otherwise, a user setting error is reported and none transfer is issued.
  - name: SINC
    bit_range:
    - 3
    - 3
    description: |-
      source incrementing burst
      The source address, pointed by GPDMA_CxSAR, is kept constant after a burst beat/single transfer or is incremented by the offset value corresponding to a contiguous data after a burst beat/single transfer.
  - name: SBL_1
    bit_range:
    - 9
    - 4
    description: |-
      source burst length minus 1, between 0 and 63
      The burst length unit is one data named beat within a burst. If SBL_1[5:0] =0 , the burst can be named as single. Each data/beat has a width defined by the destination data width SDW_LOG2[1:0].
      Note: If a burst transfer crossed a 1-Kbyte address boundary on a AHB transfer, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the AHB protocol.
      If a burst transfer is of length greater than the FIFO size of the channel x, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the FIFO size. Transfer performance is lower, with GPDMA re-arbitration between effective and lower singles/bursts, but the data integrity is guaranteed.
  - name: PAM
    bit_range:
    - 12
    - 11
    description: |-
      padding/alignment mode
      If DDW_LOG2[1:0] = SDW_LOG2[1:0]: if the data width of a burst destination transfer is equal to the data width of a burst source transfer, these bits are ignored.
      Else, in the following enumerated values, the condition PAM_1 is when destination data width is higher that source data width, and the condition PAM_2 is when destination data width is higher than source data width.
      1x: successive source data are FIFO queued and packed at the destination data width, in a left (LSB) to right (MSB) order (named little endian), before a destination transfer
      1x: source data is FIFO queued and unpacked at the destination data width, to be transferred in a left (LSB) to right (MSB) order (named little endian) to the destination
      Note: If the transfer from the source peripheral is configured with peripheral flow-control mode (SWREQ = 0 and PFREQ = 1 and DREQ = 0), and if the destination data width   the source data width, packing is not supported.
  - name: SBX
    bit_range:
    - 13
    - 13
    description: |-
      source byte exchange within the unaligned half-word of each source word
      If the source data width is shorter than a word, this bit is ignored.
      If the source data width is a word:
  - name: SAP
    bit_range:
    - 14
    - 14
    description: |-
      source allocated port
      This bit is used to allocate the master port for the source transfer
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  - name: SSEC
    bit_range:
    - 15
    - 15
    description: |-
      security attribute of the GPDMA transfer from the source
      If GPDMA_SECCFGR.SECx = 1 and the access is secure:
      This is a secure register bit. This bit can only be read by a secure software. This bit must be written by a secure software when GPDMA_SECCFGR.SECx =1 . A secure write is ignored when GPDMA_SECCFGR.SECx = 0.
      When GPDMA_SECCFGR.SECx is de-asserted, this SSEC bit is also de-asserted by hardware (on a secure reconfiguration of the channel as non-secure), and the GPDMA transfer from the source is non-secure.
  - name: DDW_LOG2
    bit_range:
    - 17
    - 16
    description: |-
      binary logarithm of the destination data width of a burst, in bytes
      Note: Setting a 8-byte data width causes a user setting error to be reported and none transfer is issued.
      A destination burst transfer must have an aligned address with its data width (start address GPDMA_CxDAR[2:0] and address offset GPDMA_CxTR3.DAO[2:0], versus DDW_LOG2[1:0]). Otherwise a user setting error is reported and no transfer is issued.
  - name: DINC
    bit_range:
    - 19
    - 19
    description: |-
      destination incrementing burst
      The destination address, pointed by GPDMA_CxDAR, is kept constant after a burst beat/single transfer, or is incremented by the offset value corresponding to a contiguous data after a burst beat/single transfer.
  - name: DBL_1
    bit_range:
    - 25
    - 20
    description: |-
      destination burst length minus 1, between 0 and 63
      The burst length unit is one data named beat within a burst. If DBL_1[5:0] =0 , the burst can be named as single. Each data/beat has a width defined by the destination data width DDW_LOG2[1:0].
      Note: If a burst transfer crossed a 1-Kbyte address boundary on a AHB transfer, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the AHB protocol.
      If a burst transfer is of length greater than the FIFO size of the channel x, the GPDMA modifies and shortens the programmed burst into singles or bursts of lower length, to be compliant with the FIFO size. Transfer performance is lower, with GPDMA re-arbitration between effective and lower singles/bursts, but the data integrity is guaranteed.
  - name: DBX
    bit_range:
    - 26
    - 26
    description: |-
      destination byte exchange
      If the destination data size is a byte, this bit is ignored.
      If the destination data size is not a byte:
  - name: DHX
    bit_range:
    - 27
    - 27
    description: |-
      destination half-word exchange
      If the destination data size is shorter than a word, this bit is ignored.
      If the destination data size is a word:
  - name: DAP
    bit_range:
    - 30
    - 30
    description: |-
      destination allocated port
      This bit is used to allocate the master port for the destination transfer
      Note: This bit must be written when EN = 0. This bit is read-only when EN = 1.
  - name: DSEC
    bit_range:
    - 31
    - 31
    description: |-
      security attribute of the GPDMA transfer to the destination
      If GPDMA_SECCFGR.SECx = 1 and the access is secure:
      This is a secure register bit. This bit can only be read by a secure software. This bit must be written by a secure software when GPDMA_SECCFGR.SECx = 1. A secure write is ignored when GPDMA_SECCFGR.SECx = 0.
      When GPDMA_SECCFGR.SECx is de-asserted, this DSEC bit is also de-asserted by hardware (on a secure reconfiguration of the channel as non-secure), and the GPDMA transfer to the destination is non-secure.
  side_effects: null
- id: GPDMA_C7TR2
  address_offset: 1044
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: REQSEL
    bit_range:
    - 7
    - 0
    description: |-
      GPDMA hardware request selection
      These bits are ignored if channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer). Else, the selected hardware request is internally taken into account as per .
      The user must not assign a same input hardware request (same REQSEL[7:0] value) to different active GPDMA channels (GPDMA_CxCR.EN = 1 and GPDMA_CxTR2.SWREQ = 0 for these channels). GPDMA is not intended to hardware support the case of simultaneous enabled channels incorrectly configured with a same hardware peripheral request signal, and there is no user setting error reporting.
  - name: SWREQ
    bit_range:
    - 9
    - 9
    description: |-
      software request
      This bit is internally taken into account when GPDMA_CxCR.EN is asserted.
  - name: DREQ
    bit_range:
    - 10
    - 10
    description: |-
      destination hardware request
      This bit is ignored if channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer). Else:
      Note: If the channel x is activated (GPDMA_CxCR.EN is asserted) with SWREQ = 0 and PFREQ = 1 (peripheral hardware request with peripheral flow-control mode), any software assertion to this DREQ bit is ignored: in peripheral flow-control mode, only a peripheral-to-memory transfer is supported.
  - name: BREQ
    bit_range:
    - 11
    - 11
    description: |-
      Block hardware request
      If the channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer), this bit is ignored. Else:
  - name: PFREQ
    bit_range:
    - 12
    - 12
    description: |-
      Hardware request in peripheral flow control mode
      Important: If a given channel x is not implemented with this feature, this bit is reserved and PFREQ is not present (see  for the list of the implemented channels with this feature.
      If the channel x is activated (GPDMA_CxCR.EN asserted) with SWREQ = 1 (software request for a memory-to-memory transfer), this bit is ignored. Else:
      Note: In peripheral flow control mode, there are the following restrictions:
      - no 2D/repeated block support (GPDMA_CxBR1.BRC[10:0] must be set to 0 if present)
      - the peripheral must be set as the source of the transfer (DREQ = 0).
      - data packing to a wider destination width is not supported (if destination width   source data width, GPDMA_CxTR1.PAM[1] must be set to 0).
      - GPDMA_CxBR1.BNDT[15:0] must be programmed as a multiple of the source (peripheral) burst size.
  - name: TRIGM
    bit_range:
    - 15
    - 14
    description: |-
      trigger mode
      These bits define the transfer granularity for its conditioning by the trigger.
  - name: TRIGSEL
    bit_range:
    - 21
    - 16
    description: |-
      trigger event input selection
      These bits select the trigger event input of the GPDMA transfer (as per ), with an active trigger event if TRIGPOL[1:0] different  00.
  - name: TRIGPOL
    bit_range:
    - 25
    - 24
    description: |-
      trigger event polarity
      These bits define the polarity of the selected trigger event input defined by TRIGSEL[5:0].
  - name: TCEM
    bit_range:
    - 31
    - 30
    description: |-
      transfer complete event mode
      These bits define the transfer granularity for the transfer complete and half transfer complete events generation.
      Note: If the initial LLI0 data transfer is null/void (directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] = 0), then neither the complete transfer event nor the half transfer event is generated.
      Note: If the initial LLI0 data transfer is null/void (directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] = 0), then neither the complete transfer event nor the half transfer event is generated.
      Note: If the initial LLI0 data transfer is null/void (i.e. directly programmed by the internal register file with GPDMA_CxBR1.BNDT[15:0] =0 ), then the half transfer event is not generated, and the transfer complete event is generated when is completed the loading of the LLI1.
  side_effects: null
- id: GPDMA_C7BR1
  address_offset: 1048
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: BNDT
    bit_range:
    - 15
    - 0
    description: |-
      block number of data bytes to transfer from the source
      Block size transferred from the source. When the channel is enabled, this field becomes read-only and is decremented, indicating the remaining number of data items in the current source block to be transferred. BNDT[15:0] is programmed in number of bytes, maximum source block size is 64 Kbytes -1.
      Once the last data transfer is completed (BNDT[15:0] = 0):
      - if GPDMA_CxLLR.UB1 = 1, this field is updated by the LLI in the memory.
      - if GPDMA_CxLLR.UB1 = 0 and if there is at least one not null Uxx update bit, this field is internally restored to the programmed value.
      - if all GPDMA_CxLLR.Uxx = 0 and if GPDMA_CxLLR.LA[15:0] different  0, this field is internally restored to the programmed value (infinite/continuous last LLI).
      - if GPDMA_CxLLR = 0, this field is kept as zero following the last LLI data transfer.
      Note: A non-null source block size must be a multiple of the source data width (BNDT[2:0] versus GPDMA_CxTR1.SDW_LOG2[1:0]). Else a user setting error is reported and no transfer is issued.
      When configured in packing mode (GPDMA_CxTR1.PAM[1]=1 and destination data width different from source data width), a non-null source block size must be a multiple of the destination data width (BNDT[2:0] versus GPDMA_CxTR1.DDW_LOG2[1:0]). Else a user setting error is reported and no transfer is issued.
  - name: BRC
    bit_range:
    - 26
    - 16
    description: |-
      Block repeat counter
      This field contains the number of repetitions of the current block (0 to 2047).
      When the channel is enabled, this field becomes read-only. After decrements, this field indicates the remaining number of blocks, excluding the current one. This counter is hardware decremented for each completed block transfer.
      Once the last block transfer is completed (BRC[10:0] = BNDT[15:0] = 0):
      If GPDMA_CxLLR.UB1 = 1, all GPDMA_CxBR1 fields are updated by the next LLI in the memory.
      If GPDMA_CxLLR.UB1 = 0 and if there is at least one not null Uxx update bit, this field is internally restored to the programmed value.
      if all GPDMA_CxLLR.Uxx = 0 and if GPDMA_CxLLR.LA[15:0] different  0, this field is internally restored to the programmed value (infinite/continuous last LLI).
      if GPDMA_CxLLR = 0, this field is kept as zero following the last LLI and data transfer.
  - name: SDEC
    bit_range:
    - 28
    - 28
    description: source address decrement
  - name: DDEC
    bit_range:
    - 29
    - 29
    description: destination address decrement
  - name: BRSDEC
    bit_range:
    - 30
    - 30
    description: |-
      Block repeat source address decrement
      Note: On top of this increment/decrement (depending on BRSDEC), GPDMA_CxSAR is in the same time also updated by the increment/decrement (depending on SDEC) of the GPDMA_CxTR3.SAO value, as it is done after any programmed burst transfer.
  - name: BRDDEC
    bit_range:
    - 31
    - 31
    description: |-
      Block repeat destination address decrement
      Note: On top of this increment/decrement (depending on BRDDEC), GPDMA_CxDAR is in the same time also updated by the increment/decrement (depending on DDEC) of the GPDMA_CxTR3.DAO value, as it is usually done at the end of each programmed burst transfer.
  side_effects: null
- id: GPDMA_C7SAR
  address_offset: 1052
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SA
    bit_range:
    - 31
    - 0
    description: |-
      source address
      This field is the pointer to the address from which the next data is read.
      During the channel activity, depending on the source addressing mode (GPDMA_CxTR1.SINC), this field is kept fixed or incremented by the data width (GPDMA_CxTR1.SDW_LOG2[1:0]) after each burst source data, reflecting the next address from which data is read.
      During the channel activity, this address is updated after each completed source burst, consequently to:
      the programmed source burst; either in fixed addressing mode or in contiguous-data incremented mode. If contiguously incremented (GPDMA_CxTR1.SINC = 1), then the additional address offset value is the programmed burst size, as defined by GPDMA_CxTR1.SBL_1[5:0] and GPDMA_CxTR1.SDW_LOG2[21:0]
      the additional source incremented/decremented offset value as programmed by GPDMA_CxBR1.SDEC and GPDMA_CxTR3.SAO[12:0]
      once/if completed source block transfer, for a channel x with 2D addressing capability (x = 12 to 15). additional block repeat source incremented/decremented offset value as programmed by GPDMA_CxBR1.BRSDEC and GPDMA_CxBR2.BRSAO[15:0]
      In linked-list mode, after a LLI data transfer is completed, this register is automatically updated by GPDMA from the memory, provided the LLI is set with GPDMA_CxLLR.USA = 1.
      Note: A source address must be aligned with the programmed data width of a source burst (SA[2:0] versus GPDMA_CxTR1.SDW_LOG2[1:0]). Else, a user setting error is reported and no transfer is issued.
      When the source block size is not a multiple of the source burst size and is a multiple of the source data width, the last programmed source burst is not completed and is internally shorten to match the block size. In this case, the additional GPDMA_CxTR3.SAO[12:0] is not applied.
  side_effects: null
- id: GPDMA_C7DAR
  address_offset: 1056
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: DA
    bit_range:
    - 31
    - 0
    description: |-
      destination address
      This field is the pointer to the address from which the next data is written.
      During the channel activity, depending on the destination addressing mode (GPDMA_CxTR1.DINC), this field is kept fixed or incremented by the data width (GPDMA_CxTR1.DDW_LOG2[21:0]) after each burst destination data, reflecting the next address from which data is written.
      During the channel activity, this address is updated after each completed destination burst, consequently to:
      the programmed destination burst; either in fixed addressing mode or in contiguous-data incremented mode. If contiguously incremented (GPDMA_CxTR1.DINC = 1), then the additional address offset value is the programmed burst size, as defined by GPDMA_CxTR1.DBL_1[5:0] and GPDMA_CxTR1.DDW_LOG2[1:0]
      the additional destination incremented/decremented offset value as programmed by GPDMA_CxBR1.DDEC and GPDMA_CxTR3.DAO[12:0]
      once/if completed destination block transfer, for a channel x with 2D addressing capability (x = 12 to 15), the additional block repeat destination incremented/decremented offset value as programmed by GPDMA_CxBR1.BRDDEC and GPDMA_CxBR2.BRDAO[15:0]
      In linked-list mode, after a LLI data transfer is completed, this register is automatically updated by the GPDMA from the memory, provided the LLI is set with GPDMA_CxLLR.UDA = 1.
      Note: A destination address must be aligned with the programmed data width of a destination burst (DA[2:0] versus GPDMA_CxTR1.DDW_LOG2[1:0]). Else, a user setting error is reported and no transfer is issued.
  side_effects: null
- id: GPDMA_C7TR3
  address_offset: 1060
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SAO
    bit_range:
    - 12
    - 0
    description: |-
      source address offset increment
      The source address, pointed by GPDMA_CxSAR, is incremented or decremented (depending on GPDMA_CxBR1.SDEC) by this offset SAO[12:0] for each programmed source burst. This offset is not including and is added to the programmed burst size when the completed burst is addressed in incremented mode (GPDMA_CxTR1.SINC = 1).
      Note: A source address offset must be aligned with the programmed data width of a source burst (SAO[2:0] versus GPDMA_CxTR1.SDW_LOG2[1:0]). Else a user setting error is reported and none transfer is issued.
      When the source block size is not a multiple of the destination burst size and is a multiple of the source data width, then the last programmed source burst is not completed and is internally shorten to match the block size. In this case, the additional GPDMA_CxTR3.SAO[12:0] is not applied.
  - name: DAO
    bit_range:
    - 28
    - 16
    description: |-
      destination address offset increment
      The destination address, pointed by GPDMA_CxDAR, is incremented or decremented (depending on GPDMA_CxBR1.DDEC) by this offset DAO[12:0] for each programmed destination burst. This offset is not including and is added to the programmed burst size when the completed burst is addressed in incremented mode (GPDMA_CxTR1.DINC = 1).
      Note: A destination address offset must be aligned with the programmed data width of a destination burst (DAO[2:0] versus GPDMA_CxTR1.DDW_LOG2[1:0]). Else, a user setting error is reported and no transfer is issued.
  side_effects: null
- id: GPDMA_C7BR2
  address_offset: 1064
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: BRSAO
    bit_range:
    - 15
    - 0
    description: |-
      Block repeated source address offset
      For a channel with 2D addressing capability, this field is used to update (by addition or subtraction depending on GPDMA_CxBR1.BRSDEC) the current source address (GPDMA_CxSAR) at the end of a block transfer.
      Note: A block repeated source address offset must be aligned with the programmed data width of a source burst (BRSAO[2:0] versus GPDMA_CxTR1.SDW_LOG2[1:0]). Else a user setting error is reported and no transfer is issued.
      BRSAO[15:0] must be set to 0 in peripheral flow-control mode (if GPDMA_CxTR2.PFREQ = 1).
  - name: BRDAO
    bit_range:
    - 31
    - 16
    description: |-
      Block repeated destination address offset
      For a channel with 2D addressing capability, this field is used to update (by addition or subtraction depending on GPDMA_CxBR1.BRDDEC) the current destination address (GPDMA_CxDAR) at the end of a block transfer.
      Note: A block repeated destination address offset must be aligned with the programmed data width of a destination burst (BRDAO[2:0] versus GPDMA_CxTR1.DDW_LOG2[1:0]). Else a user setting error is reported and no transfer is issued.
      BRDAO[15:0] must be set to 0 in peripheral flow-control mode (if GPDMA_CxTR2.PFREQ = 1).
  side_effects: null
- id: GPDMA_C7LLR
  address_offset: 1100
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LA
    bit_range:
    - 15
    - 2
    description: |-
      pointer (16-bit low-significant address) to the next linked-list data structure
      If UT1 = UT2 = UB1 = USA = UDA = ULL = 0 and if LA[15:20] = 0, the current LLI is the last one. The channel transfer is completed without any update of the linked-list GPDMA register file.
      Else, this field is the pointer to the memory address offset from which the next linked-list data structure is automatically fetched from, once the data transfer is completed, in order to conditionally update the linked-list GPDMA internal register file (GPDMA_CxCTR1, GPDMA_CxTR2, GPDMA_CxBR1, GPDMA_CxSAR, GPDMA_CxDAR and GPDMA_CxLLR).
      Note: The user must program the pointer to be 32-bit aligned. The two low-significant bits are write ignored.
  - name: ULL
    bit_range:
    - 16
    - 16
    description: |-
      Update GPDMA_CxLLR register from memory
      This bit is used to control the update of GPDMA_CxLLR from the memory during the link transfer.
  - name: UB2
    bit_range:
    - 25
    - 25
    description: |-
      Update GPDMA_CxBR2 from memory
      This bit controls the update of GPDMA_CxBR2 from the memory during the link transfer.
  - name: UT3
    bit_range:
    - 26
    - 26
    description: |-
      Update GPDMA_CxTR3 from memory
      This bit controls the update of GPDMA_CxTR3 from the memory during the link transfer.
  - name: UDA
    bit_range:
    - 27
    - 27
    description: |-
      Update GPDMA_CxDAR register from memory
      This bit is used to control the update of GPDMA_CxDAR from the memory during the link transfer.
  - name: USA
    bit_range:
    - 28
    - 28
    description: |-
      update GPDMA_CxSAR from memory
      This bit controls the update of GPDMA_CxSAR from the memory during the link transfer.
  - name: UB1
    bit_range:
    - 29
    - 29
    description: |-
      Update GPDMA_CxBR1 from memory
      This bit controls the update of GPDMA_CxBR1 from the memory during the link transfer. If UB1 = 0 and if GPDMA_CxLLR different  0, the linked-list is not completed. GPDMA_CxBR1.BNDT[15:0] is then restored to the programmed value after data transfer is completed and before the link transfer.
  - name: UT2
    bit_range:
    - 30
    - 30
    description: |-
      Update GPDMA_CxTR2 from memory
      This bit controls the update of GPDMA_CxTR2 from the memory during the link transfer.
  - name: UT1
    bit_range:
    - 31
    - 31
    description: |-
      Update GPDMA_CxTR1 from memory
      This bit controls the update of GPDMA_CxTR1 from the memory during the link transfer.
  side_effects: null
