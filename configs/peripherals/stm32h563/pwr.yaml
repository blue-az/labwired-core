peripheral: PWR
version: 0.1.0
registers:
- id: PWR_PMCR
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 12
  fields:
  - name: LPMS
    bit_range:
    - 0
    - 0
    description: |-
      low-power mode selection
      This bit defines the Deepsleep mode.
  - name: SVOS
    bit_range:
    - 3
    - 2
    description: |-
      system Stop mode voltage scaling selection
      These bits control the Vsub CORE/sub  voltage level in system Stop mode, to obtain the best trade-off between power consumption and performance.
  - name: CSSF
    bit_range:
    - 7
    - 7
    description: |-
      clear Standby and Stop flags (always read as 0)
      This bit is cleared to 0 by hardware.
  - name: FLPS
    bit_range:
    - 9
    - 9
    description: |-
      Flash memory low-power mode in Stop mode
      This bit is used to obtain the best trade-off between low-power consumption and restart time when exiting from Stop mode.
      When it is set, the Flash memory enters low-power mode when the CPU domain is in Stop mode.
      Note: When system enters stop mode with SVOS5 enabled, Flash memory is automatically forced in low-power mode.
  - name: BOOSTE
    bit_range:
    - 12
    - 12
    description: |-
      analog switch Vsub BOOST/sub  control
      This bit enables the booster to guarantee the analog switch AC performance when the Vsub DD/sub  supply voltage is below 2.7 V (reduction of the total harmonic distortion to have the same switch performance over the full supply voltage range) The Vsub DD/sub  supply voltage can be monitored through the PVD and the PLS bits.
  - name: AVD_READY
    bit_range:
    - 13
    - 13
    description: "analog voltage ready\nThis bit is only used when the analog switch boost needs to be enabled (see BOOSTE bit).\nIt must be set by software when the expected Vsub DDA/sub  analog supply level is available.\nThe correct analog supply level is indicated by the AVDO bit (PWR_VMSR register) after setting the AVDEN bit (PWR_VMCR register) and selecting the supply level to be monitored \t(ALS bits)."
  - name: ETHERNETSO
    bit_range:
    - 16
    - 16
    description: ETHERNET RAM shut-off in Stop mode.
  - name: SRAM3SO
    bit_range:
    - 23
    - 23
    description: AHB SRAM3 shut-off in Stop mode.
  - name: SRAM2_16SO
    bit_range:
    - 24
    - 24
    description: AHB SRAM2 16-Kbyte shut-off in Stop mode.
  - name: SRAM2_48SO
    bit_range:
    - 25
    - 25
    description: AHB SRAM2 48-Kbyte shut-off in Stop mode.
  - name: SRAM1SO
    bit_range:
    - 26
    - 26
    description: AHB SRAM1 shut-off in Stop mode
  side_effects: null
- id: PWR_PMSR
  address_offset: 4
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: STOPF
    bit_range:
    - 5
    - 5
    description: |-
      Stop flag
      This bit is set by hardware and cleared only by any reset or by setting the CSSF bit.
  - name: SBF
    bit_range:
    - 6
    - 6
    description: |-
      System standby flag
      This bit is set by hardware and cleared only by a POR or by setting the CSSF bit.
  side_effects: null
- id: PWR_VOSCR
  address_offset: 16
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: VOS
    bit_range:
    - 5
    - 4
    description: |-
      voltage scaling selection according to performance
      These bits control the Vsub CORE/sub  voltage level and allow to obtain the best trade-off between power consumption and performance:
      - In bypass mode, these bits must also be set according to the external provided core voltage level and related performance.
      - When increasing the performance, the voltage scaling must be changed before increasing the system frequency.
      - When decreasing performance, the system frequency must first be decreased before changing the voltage scaling.
  side_effects: null
- id: PWR_VOSSR
  address_offset: 20
  size: 32
  access: READ_WRITE
  reset_value: 8
  fields:
  - name: VOSRDY
    bit_range:
    - 3
    - 3
    description: Ready bit for Vsub CORE/sub  voltage scaling output selection.
  - name: ACTVOSRDY
    bit_range:
    - 13
    - 13
    description: Voltage level ready for currently used VOS
  - name: ACTVOS
    bit_range:
    - 15
    - 14
    description: "voltage output scaling currently applied to Vsub CORE/sub \nThis field provides the last VOS value."
  side_effects: null
- id: PWR_BDCR
  address_offset: 32
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: BREN
    bit_range:
    - 0
    - 0
    description: "Backup RAM retention in Standby and Vsub BAT/sub  modes\nWhen this bit set, the backup regulator (used to maintain the backup RAM content in Standby and Vsub BAT/sub  modes) is enabled.\nIf BREN is cleared, the backup regulator is switched off. The backup RAM can still be used in \tRun and Stop modes. However its content is lost in Standby and Vsub BAT/sub  modes.\nIf BREN is set, the application must wait till the backup regulator ready flag (BRRDY) is set to indicate that the data written into the SRAM is maintained in Standby and Vsub BAT/sub  modes."
  - name: MONEN
    bit_range:
    - 1
    - 1
    description: Backup domain voltage and temperature monitoring enable
  - name: VBE
    bit_range:
    - 8
    - 8
    description: |-
      Vsub BAT/sub  charging enable
      Note: Reset only by POR,.
  - name: VBRS
    bit_range:
    - 9
    - 9
    description: Vsub BAT/sub  charging resistor selection
  side_effects: null
- id: PWR_DBPCR
  address_offset: 36
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: DBP
    bit_range:
    - 0
    - 0
    description: "Disable Backup domain write protection\nIn reset state, all registers and SRAM in Backup domain are protected against parasitic write \taccess. This bit must be set to enable write access to these registers."
  side_effects: null
- id: PWR_BDSR
  address_offset: 40
