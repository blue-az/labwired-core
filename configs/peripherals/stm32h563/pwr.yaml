    bit_range:
    - 24
    - 24
    description: Vsub DDUSB/sub  voltage level detector enable
  - name: USB33SV
    bit_range:
    - 25
    - 25
    description: |-
      independent USB supply valid
      This bit is used to validate the Vsub DDUSB/sub  supply for electrical and logical isolation purpose. Setting this bit is mandatory to use the USBFS peripheral. If Vsub DDUSB/sub  is not always present in the application, the Vsub DDUSB/sub  voltage monitor can be used to determine whether this supply is ready or not.
  side_effects: null
- id: PWR_VMSR
  address_offset: 60
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: AVDO
    bit_range:
    - 19
    - 19
    description: "analog voltage detector output on Vsub DDA/sub \nThis bit is set and cleared by hardware. It is valid only if AVD on VDDA is enabled by the AVDEN bit.\nNote: Since the AVD is disabled in Standby mode, this bit is equal to 0 after standby or reset until the AVDEN bit is set."
  - name: VDDIO2RDY
    bit_range:
    - 20
    - 20
    description: "voltage detector output on Vsub DDIO2/sub \nThis bit is set and cleared by hardware."
  - name: PVDO
    bit_range:
    - 22
    - 22
    description: |-
      programmable voltage detect output
      This bit is set and cleared by hardware. It is valid only if the PVD has been enabled by the PVDE bit.
      Note: Since the PVD is disabled in Standby mode, this bit is equal to 0 after Standby or reset until the PVDE bit is set.
  - name: USB33RDY
    bit_range:
    - 24
    - 24
    description: Vsub DDUSB/sub  ready
  side_effects: null
