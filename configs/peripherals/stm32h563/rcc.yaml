peripheral: RCC
version: 0.1.0
registers:
- id: RCC_CR
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 35
  fields:
  - name: HSION
    bit_range:
    - 0
    - 0
    description: |-
      HSI clock enable
      Set and cleared by software.
      Set by hardware to force the HSI to ON when the product leaves Stop mode, if STOPWUCK = 1 or STOPKERWUCK = 1.
      Set by hardware to force the HSI to ON when the product leaves Standby mode or in case of a failure of the HSE which is used as the system clock source.
      This bit cannot be cleared if the HSI is used directly (via SW mux) as system clock, or if the HSI is selected as reference clock for PLL1 with PLL1 enabled (PLL1ON bit set to 1).
  - name: HSIRDY
    bit_range:
    - 1
    - 1
    description: |-
      HSI clock ready flag
      Set by hardware to indicate that the HSI oscillator is stable.
  - name: HSIKERON
    bit_range:
    - 2
    - 2
    description: |-
      HSI clock enable in Stop mode
      Set and reset by software to force the HSI to ON, even in Stop mode, in order to be quickly available as kernel clock for peripherals. This bit has no effect on the value of HSION.
  - name: HSIDIV
    bit_range:
    - 4
    - 3
    description: |-
      HSI clock divider
      Set and reset by software.
      These bits allow selecting a division ratio in order to configure the wanted HSI clock frequency. The
      HSIDIV cannot be changed if the HSI is selected as reference clock for at least one enabled PLL (PLLxON bit set to 1). In that case, the new HSIDIV value is ignored.
  - name: HSIDIVF
    bit_range:
    - 5
    - 5
    description: |-
      HSI divider flag
      Set and reset by hardware.
      As a write operation to HSIDIV has not an immediate effect on the frequency, this flag indicates the
      current status of the HSI divider. HSIDIVF goes immediately to 0 when HSIDIV value is changed, and is set back to 1 when the output frequency matches the value programmed into HSIDIV.
  - name: CSION
    bit_range:
    - 8
    - 8
    description: |-
      CSI clock enable
      Set and reset by software to enable/disable CSI clock for system and/or peripheral.
      Set by hardware to force the CSI to ON when the system leaves Stop mode, if STOPWUCK = 1 or STOPKERWUCK = 1.
      This bit cannot be cleared if the CSI is used directly (via SW mux) as system clock, or if the CSI is selected as reference clock for PLL1 with PLL1 enabled (PLL1ON bit set to 1).
  - name: CSIRDY
    bit_range:
    - 9
    - 9
    description: |-
      CSI clock ready flag
      Set by hardware to indicate that the CSI oscillator is stable. This bit is activated only if the RC is enabled by CSION (it is not activated if the CSI is enabled by CSIKERON or by a peripheral request).
  - name: CSIKERON
    bit_range:
    - 10
    - 10
    description: |-
      CSI clock enable in Stop mode
      Set and reset by software to force the CSI to ON, even in Stop mode, in order to be quickly available as kernel clock for some peripherals. This bit has no effect on the value of CSION.
  - name: HSI48ON
    bit_range:
    - 12
    - 12
    description: |-
      HSI48 clock enable
      Set by software and cleared by software or by the hardware when the system enters to Stop
      or Standby mode.
  - name: HSI48RDY
    bit_range:
    - 13
    - 13
    description: |-
      HSI48 clock ready flag
      Set by hardware to indicate that the HSI48 oscillator is stable.
  - name: HSEON
    bit_range:
    - 16
    - 16
    description: |-
      HSE clock enable
      Set and cleared by software.
      Cleared by hardware to stop the HSE when entering Stop or Standby mode.
      This bit cannot be cleared if the HSE is used directly (via SW mux) as system clock, or if the
      HSE is selected as reference clock for PLL1 with PLL1 enabled (PLL1ON bit set to 1).
  - name: HSERDY
    bit_range:
    - 17
    - 17
    description: |-
      HSE clock ready flag
      Set by hardware to indicate that the HSE oscillator is stable.
  - name: HSEBYP
    bit_range:
    - 18
    - 18
    description: |-
      HSE clock bypass
      Set and cleared by software to bypass the oscillator with an external clock. The external clock must be enabled with the HSEON bit to be used by the device.
      The HSEBYP bit can be written only if the HSE oscillator is disabled.
  - name: HSECSSON
    bit_range:
    - 19
    - 19
    description: |-
      HSE clock security system enable
      Set by software to enable clock security system on HSE.
      This bit is 'set only' (disabled by a system reset or when the system enters in Standby mode). When HSECSSON is set, the clock detector is enabled by hardware when the HSE is ready and disabled by hardware if an oscillator failure is detected.
  - name: HSEEXT
    bit_range:
    - 20
    - 20
    description: |-
      external high speed clock type in Bypass mode
      Set and reset by software to select the external clock type (analog or digital).
      The external clock must be enabled with the HSEON bit to be used by the device. The HSEEXT bit can be written only if the HSE oscillator is disabled.
  - name: PLL1ON
    bit_range:
    - 24
    - 24
    description: |-
      PLL1 enable
      Set and cleared by software to enable PLL1.
      Cleared by hardware when entering Stop or Standby mode. Note that the hardware prevents
      writing this bit to 0, if the PLL1 output is used as the system clock.
  - name: PLL1RDY
    bit_range:
    - 25
    - 25
    description: |-
      PLL1 clock ready flag
      Set by hardware to indicate that the PLL1 is locked.
  - name: PLL2ON
    bit_range:
    - 26
    - 26
    description: |-
      PLL2 enable
      Set and cleared by software to enable PLL2.
      Cleared by hardware when entering Stop or Standby mode.
  - name: PLL2RDY
    bit_range:
    - 27
    - 27
    description: |-
      PLL2 clock ready flag
      Set by hardware to indicate that the PLL is locked.
  - name: PLL3ON
    bit_range:
    - 28
    - 28
    description: |-
      PLL3 enable
      Set and cleared by software to enable PLL3.
      Cleared by hardware when entering Stop or Standby mode.
  - name: PLL3RDY
    bit_range:
    - 29
    - 29
    description: |-
      PLL3 clock ready flag
      Set by hardware to indicate that the PLL3 is locked.
  side_effects: null
- id: RCC_HSICFGR
  address_offset: 16
  size: 32
  access: READ_WRITE
  reset_value: 4194304
  fields:
  - name: HSICAL
    bit_range:
    - 11
    - 0
    description: |-
      HSI clock calibration
      Set by hardware by option byte loading during system reset nreset. Adjusted by software through trimming bits HSITRIM.
      This field represents the sum of engineering option byte calibration value and HSITRIM bits value.
  - name: HSITRIM
    bit_range:
    - 22
    - 16
    description: |-
      HSI clock trimming
      Set by software to adjust calibration.
      HSITRIM field is added to the engineering option bytes loaded during reset phase (FLASH_HSI_OPT) in order to form the calibration trimming value.
      HSICAL = HSITRIM + FLASH_HSI_OPT.
      After a change of HSITRIM it takes one system clock cycle before the new HSITRIM value is updated
      Note: The reset value of the field is 0x40.
  side_effects: null
- id: RCC_CRRCR
  address_offset: 20
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: HSI48CAL
    bit_range:
    - 9
    - 0
    description: |-
      Internal RC 48 MHz clock calibration
      Set by hardware by option-byte loading during system reset NRESET. Read-only.
  side_effects: null
- id: RCC_CSICFGR
  address_offset: 24
  size: 32
  access: READ_WRITE
  reset_value: 2097152
  fields:
  - name: CSICAL
    bit_range:
    - 7
    - 0
    description: |-
      CSI clock calibration
      Set by hardware by option byte loading during system reset NRESET. Adjusted by software through trimming bits CSITRIM.
      This field represents the sum of engineering option byte calibration value and CSITRIM bits value.
  - name: CSITRIM
    bit_range:
    - 21
    - 16
    description: |-
      CSI clock trimming
      Set by software to adjust calibration.
      CSITRIM field is added to the engineering option bytes loaded during reset phase (FLASH_CSI_OPT) in order to form the calibration trimming value.
      CSICAL = CSITRIM + FLASH_CSI_OPT.
      Note: The reset value of the field is 0x20.
  side_effects: null
- id: RCC_CFGR1
  address_offset: 28
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SW
    bit_range:
    - 2
    - 0
    description: "system clock and trace clock switch\nSet and reset by software to select system clock and trace clock sources (sys_ck).\nSet by hardware in order to:\n-\tforce the selection of the HSI or CSI (depending on STOPWUCK selection) when leaving a system Stop mode\n-\tforce the selection of the HSI in case of failure of the HSE when used directly or indirectly as system clock\nothers: reserved"
  - name: SWS
    bit_range:
    - 5
    - 3
    description: |-
      system clock switch status
      Set and reset by hardware to indicate which clock source is used as system clock. 000: HSI used as system clock (hsi_ck) (default after reset).
      others: reserved
  - name: STOPWUCK
    bit_range:
    - 6
    - 6
    description: |-
      system clock selection after a wakeup from system Stop
      Set and reset by software to select the system wakeup clock from system Stop.
      The selected clock is also used as emergency clock for the clock security system (CSS) on HSE. 0: HSI selected as wakeup clock from system Stop (default after reset)
      STOPWUCK must not be modified when CSS is enabled (by HSECSSON bit) and the system clock is HSE (SWS = 10) or a switch on HSE is requested (SW =10).
  - name: STOPKERWUCK
    bit_range:
    - 7
    - 7
    description: |-
      kernel clock selection after a wakeup from system Stop
      Set and reset by software to select the kernel wakeup clock from system Stop.
  - name: RTCPRE
    bit_range:
    - 13
    - 8
    description: |-
      HSE division factor for RTC clock
      Set and cleared by software to divide the HSE to generate a clock for RTC.
      Caution: The software must set these bits correctly to ensure that the clock supplied to the RTC is lower than 1 MHz. These bits must be configured if needed before selecting the RTC clock source.
      ...
  - name: TIMPRE
    bit_range:
    - 15
    - 15
    description: |-
      timers clocks prescaler selection
      This bit is set and reset by software to control the clock frequency of all the timers connected to APB1 and APB2 domains.
  - name: MCO1PRE
    bit_range:
    - 21
    - 18
    description: |-
      MCO1 prescaler
      Set and cleared by software to configure the prescaler of the MCO1. Modification of this prescaler may generate glitches on MCO1. It is highly recommended to change this prescaler only after reset, before enabling the external oscillators and the PLLs.
      ...
  - name: MCO1SEL
    bit_range:
    - 24
    - 22
    description: |-
      Microcontroller clock output 1
      Set and cleared by software. Clock source selection may generate glitches on MCO1.
      It is highly recommended to configure these bits only after reset, before enabling the external oscillators and the PLLs.
      others: reserved
  - name: MCO2PRE
    bit_range:
    - 28
    - 25
    description: |-
      MCO2 prescaler
      Set and cleared by software to configure the prescaler of the MCO2. Modification of this prescaler may generate glitches on MCO2. It is highly recommended to change this prescaler only after reset, before enabling the external oscillators and the PLLs.
      ...
  - name: MCO2SEL
    bit_range:
    - 31
    - 29
    description: |-
      microcontroller clock output 2
      Set and cleared by software. Clock source selection may generate glitches on MCO2.
      It is highly recommended to configure these bits only after reset, before enabling the external oscillators and the PLLs.
      others: reserved
  side_effects: null
- id: RCC_CFGR2
  address_offset: 32
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: HPRE
    bit_range:
    - 3
    - 0
    description: |-
      AHB prescaler
      Set and reset by software to control the division factor of rcc_hclk. Changing
      this division ratio has an impact on the frequency of all bus matrix clocks
      0xxx: rcc_hclk = sys_ck (default after reset)
  - name: PPRE1
    bit_range:
    - 6
    - 4
    description: |-
      APB low-speed prescaler (APB1)
      Set and reset by software to control the division factor of rcc_pclk1.
      The clock is divided by the new prescaler factor from 1 to 16 cycles of rcc_hclk after PPRE write.
      0xx: rcc_pclk1 = rcc_hclk1 (default after reset)
  - name: PPRE2
    bit_range:
    - 10
    - 8
    description: |-
      APB high-speed prescaler (APB2)
      Set and reset by software to control APB high-speed clocks division factor.
      The clocks are divided with the new prescaler factor from 1 to 16 APB cycles after PPRE2 write.
      0xx: rcc_pclk2 = rcc_hclk1
  - name: PPRE3
    bit_range:
    - 14
    - 12
    description: |-
      APB low-speed prescaler (APB3)
      Set and reset by software to control APB low-speed clocks division factor.
      The clocks are divided with the new prescaler factor from 1 to 16 APB cycles after PPRE3 write.
      0xx: rcc_pclk3 = rcc_hclk1
  - name: AHB1DIS
    bit_range:
    - 16
    - 16
    description: |-
      AHB1 clock disable
      This bit can be set in order to further reduce power consumption, when none of the AHB1
      peripherals from RCC_AHB1ENR are used and when their clocks are disabled in
      RCC_AHB1ENR. When this bit is set, all the AHB1 peripherals clocks from
      RCC_AHB1ENR are off.
      enable control bits
  - name: AHB2DIS
    bit_range:
    - 17
    - 17
    description: |-
      AHB2 clock disable
      This bit can be set in order to further reduce power consumption, when none of the AHB2
      peripherals from RCC_AHB2ENR are used and when their clocks are disabled in
      RCC_AHB2ENR. When this bit is set, all the AHB2 peripherals clocks from
      RCC_AHB2ENR are off.
      enable control bits
  - name: AHB4DIS
    bit_range:
    - 19
    - 19
    description: |-
      AHB4 clock disable
      This bit can be set in order to further reduce power consumption, when none of the AHB4
      peripherals from RCC_AHB4ENR are used and when their clocks are disabled in
      RCC_AHB4ENR. When this bit is set, all the AHB4 peripherals clocks from
      RCC_AHB4ENR are off.
      enable control bits
  - name: APB1DIS
    bit_range:
    - 20
    - 20
    description: |-
      APB1 clock disable value
      This bit can be set in order to further reduce power consumption, when none of the APB1
      peripherals (except IWDG) are used and when their clocks are disabled in RCC_APB1ENR.
      When this bit is set, all the APB1 peripherals clocks are off, except for IWDG.
      control bits
  - name: APB2DIS
    bit_range:
    - 21
    - 21
    description: |-
      APB2 clock disable value
      This bit can be set in order to further reduce power consumption, when none of the APB2
      peripherals are used and when their clocks are disabled in RCC_APB2ENR. When this bit is
      set, all the APB2 peripherals clocks are off.
      control bits
  - name: APB3DIS
    bit_range:
    - 22
    - 22
    description: |-
      APB3 clock disable value.Set and cleared by software
      This bit can be set in order to further reduce power consumption, when none of the APB3
      peripherals are used and when their clocks are disabled in RCC_APB3ENR. When this bit is
      set, all the APB3 peripherals clocks are off.
      control bits
  side_effects: null
- id: RCC_PLL1CFGR
  address_offset: 40
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: PLL1SRC
    bit_range:
    - 1
    - 0
    description: |-
      DIVMx and PLLs clock source selection
      Set and reset by software to select the PLL clock source. These bits can be written only when all PLLs are disabled.
      In order to save power, when no PLL is used, the value of PLL1SRC must be set to '00'. 00: no clock send to DIVMx divider and PLLs (default after reset).
  - name: PLL1RGE
    bit_range:
    - 3
    - 2
    description: |-
      PLL1 input frequency range
      Set and reset by software to select the proper reference frequency range used for PLL1. This bit must be written before enabling the PLL1.
  - name: PLL1FRACEN
    bit_range:
    - 4
    - 4
    description: |-
      PLL1 fractional latch enable
      Set and reset by software to latch the content of FRACN1 into the sigma-delta modulator.
      In order to latch the FRACN1 value into the sigma-delta modulator, PLL1FRACEN must be set to 0, then set to 1. The transition 0 to 1 transfers the content of FRACN1 into the modulator.
  - name: PLL1VCOSEL
    bit_range:
    - 5
    - 5
    description: |-
      PLL1 VCO selection
      Set and reset by software to select the proper VCO frequency range used for PLL1. This bit must be written before enabling the PLL1.
  - name: DIVM1
    bit_range:
    - 13
    - 8
    description: |-
      prescaler for PLL1
      Set and cleared by software to configure the prescaler of the PLL1.
      The hardware does not allow any modification of this prescaler when PLL1 is enabled (PLL1ON = 1 or PLL1RDY = 1).
      In order to save power when PLL1 is not used, the value of DIVM1 must be set to 0.
      ...
      ...
  - name: PLL1PEN
    bit_range:
    - 16
    - 16
    description: |-
      PLL1 DIVP divider output enable
      Set and reset by software to enable the pll1_p_ck output of the PLL1.
      This bit can be written only when the PLL1 is disabled (PLL1ON = 0 and PLL1RDY = 0).
      In order to save power, when the pll1_p_ck output of the PLL1 is not used, the pll1_p_ck must be disabled.
  - name: PLL1QEN
    bit_range:
    - 17
    - 17
    description: |-
      PLL1 DIVQ divider output enable
      Set and reset by software to enable the pll1_q_ck output of the PLL1.
      In order to save power, when the pll1_q_ck output of the PLL1 is not used, the pll1_q_ck must be disabled.
      This bit can be written only when the PLL1 is disabled (PLL1ON = 0 and PLL1RDY = 0).
  - name: PLL1REN
    bit_range:
    - 18
    - 18
    description: |-
      PLL1 DIVR divider output enable
      Set and reset by software to enable the pll1_r_ck output of the PLL1.
      To save power, DIVR1EN and DIVR1 bits must be set to 0 when the pll1_r_ck is not used. This bit can be written only when the PLL1 is disabled (PLL1ON = 0 and PLL1RDY = 0).
  side_effects: null
- id: RCC_PLL2CFGR
  address_offset: 44
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: PLL2SRC
    bit_range:
    - 1
    - 0
    description: |-
      DIVMx and PLLs clock source selection
      Set and reset by software to select the PLL clock source.
      These bits can be written only when all PLLs are disabled.
      In order to save power, when no PLL is used, the value of PLL2SRC must be set to '00'.
  - name: PLL2RGE
    bit_range:
    - 3
    - 2
    description: |-
      PLL2 input frequency range
      Set and reset by software to select the proper reference frequency range used for PLL2. These bits must be written before enabling the PLL2.
  - name: PLL2FRACEN
    bit_range:
    - 4
    - 4
    description: |-
      PLL2 fractional latch enable
      Set and reset by software to enable the pll2_p_ck output of the PLL2.
      To save power, when the pll2_p_ck output of the PLL2 is not used, the pll2_p_ck must be disabled.
  - name: PLL2VCOSEL
    bit_range:
    - 5
    - 5
    description: |-
      PLL2 VCO selection
      Set and reset by software to select the proper VCO frequency range used for PLL2.
      This bit must be written before enabling the PLL2.
  - name: DIVM2
    bit_range:
    - 13
    - 8
    description: |-
      prescaler for PLL2
      Set and cleared by software to configure the prescaler of the PLL2.
      The hardware does not allow any modification of this prescaler when PLL2 is enabled (PLL2ON = 1 or PLL2RDY = 1).
      In order to save power when PLL2 is not used, the value of DIVM2 must be set to 0.
      ...
      ...
  - name: PLL2PEN
    bit_range:
    - 16
    - 16
    description: |-
      PLL2 DIVP divider output enable
      Set and reset by software to enable the pll2_p_ck output of the PLL2.
      To save power, when the pll2_p_ck output of the PLL2 is not used, the pll2_p_ck must be disabled.
  - name: PLL2QEN
    bit_range:
    - 17
    - 17
    description: |-
      PLL2 DIVQ divider output enable
      Set and reset by software to enable the pll2_q_ck output of the PLL2.
      To save power, when the pll2_q_ck output of the PLL2 is not used, the pll2_q_ck must be disabled.
  - name: PLL2REN
    bit_range:
    - 18
    - 18
    description: |-
      PLL2 DIVR divider output enable
      Set and reset by software to enable the pll2_r_ck output of the PLL2.
      To save power, DIVR2EN and DIVR2 bits must be set to 0 when the pll2_r_ck is not used.
  side_effects: null
- id: RCC_PLL3CFGR
  address_offset: 48
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: PLL3SRC
    bit_range:
    - 1
    - 0
    description: |-
      DIVMx and PLLs clock source selection
      Set and reset by software to select the PLL clock source. These bits can be written only
      when all PLLs are disabled.
      In order to save power, when no PLL is used, the value of PLL3SRC must be set to '00'.
  - name: PLL3RGE
