- id: RNG_ISR
  address_offset: 260
  size: 32
  access: READ_ONLY
  reset_value: 0
  fields:
  - name: EHR_VALID_INT
    bit_range:
    - 0
    - 0
    description: 192-bits have been collected and are ready to be read.
  - name: AUTOCORR_ERR_INT
    bit_range:
    - 1
    - 1
    description: Autocorrelation error. Failure occurs when autocorrelation test has failed four times in a row. Once set, the TRNG ceases to function until next reset.
  - name: CRNGT_ERR_INT
    bit_range:
    - 2
    - 2
    description: Continuous random number generator test error. Failure occurs when two consecutive blocks of 16 collected bits are equal.
  - name: VNC_ERR_INT
    bit_range:
    - 3
    - 3
    description: von Neumann corrector error. Failure occurs if 32 consecutive collected bits are identical, ZERO, or ONE.
  - name: WATCHDOG_INT
    bit_range:
    - 4
    - 4
    description: Maximum number of CPU clock cycles per sample have been exceeded. See RNG_WATCHDOG_VAL for more information.
  - name: DMA_DONE_INT
    bit_range:
    - 5
    - 5
    description: RNG DMA to SRAM is completed.
  side_effects: null
- id: RNG_ICR
  address_offset: 264
  size: 32
  access: WRITE_ONLY
  reset_value: 0
  fields:
  - name: EHR_VALID_CLEAR
    bit_range:
    - 0
    - 0
    description: Writing value '1' clears corresponding bit in RNG_ISR
  - name: AUTOCORR_ERR_CLEAR
    bit_range:
    - 1
    - 1
    description: Cannot be cleared by software! Only RNG reset clears this bit.
  - name: CRNGT_ERR_CLEAR
    bit_range:
    - 2
