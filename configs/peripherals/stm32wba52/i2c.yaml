peripheral: I2C
version: 0.1.0
registers:
- id: I2C_CR1
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: PE
    bit_range:
    - 0
    - 0
    description: |-
      Peripheral enable
      Note: When PE = 0, the I2C SCL and SDA lines are released. Internal state machines and status bits are put back to their reset value. When cleared, PE must be kept low for at least 3 APB clock cycles.
  - name: TXIE
    bit_range:
    - 1
    - 1
    description: TX Interrupt enable
  - name: RXIE
    bit_range:
    - 2
    - 2
    description: RX Interrupt enable
  - name: ADDRIE
    bit_range:
    - 3
    - 3
    description: Address match Interrupt enable (slave only)
  - name: NACKIE
    bit_range:
    - 4
    - 4
    description: Not acknowledge received Interrupt enable
  - name: STOPIE
    bit_range:
    - 5
    - 5
    description: Stop detection Interrupt enable
  - name: TCIE
    bit_range:
    - 6
    - 6
    description: "Transfer Complete interrupt enable \nNote: Any of these events generate an interrupt:\nNote: Transfer Complete (TC)\nNote: Transfer Complete Reload (TCR)"
  - name: ERRIE
    bit_range:
    - 7
    - 7
    description: |-
      Error interrupts enable
      Note: Any of these errors generate an interrupt:
      Note: Arbitration Loss (ARLO)
      Note: Bus Error detection (BERR)
      Note: Overrun/Underrun (OVR)
      Note: Timeout detection (TIMEOUT)
      Note: PEC error detection (PECERR)
      Note: Alert pin event detection (ALERT)
  - name: DNF
    bit_range:
    - 11
    - 8
    description: "Digital noise filter\nThese bits are used to configure the digital noise filter on SDA and SCL input. The digital filter, filters spikes with a length of up to DNF[3:0] * tsubI2CCLK/sub\nsub.../sub\nNote: If the analog filter is also enabled, the digital filter is added to the analog filter. \nNote: This filter can only be programmed when the I2C is disabled (PE = 0)."
  - name: ANFOFF
    bit_range:
    - 12
    - 12
    description: |-
      Analog noise filter OFF
      Note: This bit can only be programmed when the I2C is disabled (PE = 0).
  - name: TXDMAEN
    bit_range:
    - 14
    - 14
    description: DMA transmission requests enable
  - name: RXDMAEN
    bit_range:
    - 15
    - 15
    description: DMA reception requests enable
  - name: SBC
    bit_range:
    - 16
    - 16
    description: |-
      Slave byte control
      This bit is used to enable hardware byte control in slave mode.
  - name: NOSTRETCH
    bit_range:
    - 17
    - 17
    description: "Clock stretching disable \nThis bit is used to disable clock stretching in slave mode. It must be kept cleared in master mode.\nNote: This bit can only be programmed when the I2C is disabled (PE = 0)."
  - name: WUPEN
    bit_range:
    - 18
    - 18
    description: |-
      Wakeup from Stop mode enable
      Note: If the Wakeup from Stop mode feature is not supported, this bit is reserved and forced by hardware to '0'. Refer to Section 52.3: FMPI2C implementation.
      Note: WUPEN can be set only when DNF = '0000'
  - name: GCEN
    bit_range:
    - 19
    - 19
    description: General call enable
  - name: SMBHEN
    bit_range:
    - 20
    - 20
    description: |-
      SMBus host address enable
      Note: If the SMBus feature is not supported, this bit is reserved and forced by hardware to '0'. Refer to Section 52.3: FMPI2C implementation.
  - name: SMBDEN
    bit_range:
    - 21
    - 21
    description: |-
      SMBus device default address enable
      Note: If the SMBus feature is not supported, this bit is reserved and forced by hardware to '0'. Refer to Section 52.3: FMPI2C implementation.
  - name: ALERTEN
    bit_range:
    - 22
    - 22
    description: |-
      SMBus alert enable
      Note: When ALERTEN=0, the SMBA pin can be used as a standard GPIO.
      Note: If the SMBus feature is not supported, this bit is reserved and forced by hardware to '0'. Refer to Section 52.3: FMPI2C implementation.
  - name: PECEN
    bit_range:
    - 23
    - 23
    description: |-
      PEC enable
      Note: If the SMBus feature is not supported, this bit is reserved and forced by hardware to '0'. Refer to Section 52.3: FMPI2C implementation.
  - name: FMP
    bit_range:
    - 24
    - 24
    description: Fast-mode Plus 20 mA drive enable
  - name: ADDRACLR
    bit_range:
    - 30
    - 30
    description: Address match flag (ADDR) automatic clear
  - name: STOPFACLR
    bit_range:
    - 31
    - 31
    description: STOP detection flag (STOPF) automatic clear
  side_effects: null
- id: I2C_CR2
  address_offset: 4
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SADD
    bit_range:
    - 9
    - 0
    description: |-
      Slave address (master mode)
      In 7-bit addressing mode (ADD10 = 0):
      SADD[7:1] should be written with the 7-bit slave address to be sent. The bits SADD[9], SADD[8] and SADD[0] are don't care.
      In 10-bit addressing mode (ADD10 = 1):
      SADD[9:0] should be written with the 10-bit slave address to be sent.
      Note: Changing these bits when the START bit is set is not allowed.
  - name: RD_WRN
    bit_range:
    - 10
    - 10
    description: |-
      Transfer direction (master mode)
      Note: Changing this bit when the START bit is set is not allowed.
  - name: ADD10
    bit_range:
    - 11
    - 11
    description: |-
      10-bit addressing mode (master mode)
      Note: Changing this bit when the START bit is set is not allowed.
  - name: HEAD10R
    bit_range:
    - 12
    - 12
    description: |-
      10-bit address header only read direction (master receiver mode)
      Note: Changing this bit when the START bit is set is not allowed.
  - name: START
    bit_range:
    - 13
    - 13
    description: "Start generation\nThis bit is set by software, and cleared by hardware after the Start followed by the address sequence is sent, by an arbitration loss, by an address matched in slave mode, by a timeout error detection, or when PE = 0.\nIf the I2C is already in master mode with AUTOEND = 0, setting this bit generates a Repeated Start condition when RELOAD=0, after the end of the NBYTES transfer. \nOtherwise setting this bit generates a START condition once the bus is free.\nNote: Writing '0' to this bit has no effect.\nNote: The START bit can be set even if the bus is BUSY or I2C is in slave mode.\nNote: This bit has no effect when RELOAD is set."
  - name: STOP
    bit_range:
    - 14
    - 14
    description: |-
      Stop generation (master mode)
      The bit is set by software, cleared by hardware when a STOP condition is detected, or when PE = 0.
      In Master Mode:
      Note: Writing '0' to this bit has no effect.
  - name: NACK
    bit_range:
    - 15
    - 15
    description: |-
      NACK generation (slave mode)
      The bit is set by software, cleared by hardware when the NACK is sent, or when a STOP condition or an Address matched is received, or when PE = 0.
      Note: Writing '0' to this bit has no effect.
      Note: This bit is used in slave mode only: in master receiver mode, NACK is automatically generated after last byte preceding STOP or RESTART condition, whatever the NACK bit value.
      Note: When an overrun occurs in slave receiver NOSTRETCH mode, a NACK is automatically generated whatever the NACK bit value.
      Note: When hardware PEC checking is enabled (PECBYTE=1), the PEC acknowledge value does not depend on the NACK value.
  - name: NBYTES
    bit_range:
    - 23
    - 16
    description: |-
      Number of bytes
      The number of bytes to be transmitted/received is programmed there. This field is don't care in slave mode with SBC=0.
      Note: Changing these bits when the START bit is set is not allowed.
  - name: RELOAD
    bit_range:
    - 24
    - 24
    description: |-
      NBYTES reload mode
      This bit is set and cleared by software.
  - name: AUTOEND
    bit_range:
    - 25
    - 25
    description: |-
      Automatic end mode (master mode)
      This bit is set and cleared by software.
      Note: This bit has no effect in slave mode or when the RELOAD bit is set.
  - name: PECBYTE
    bit_range:
    - 26
    - 26
    description: |-
      Packet error checking byte
      This bit is set by software, and cleared by hardware when the PEC is transferred, or when a STOP condition or an Address matched is received, also when PE = 0.
      Note: Writing '0' to this bit has no effect.
      Note: This bit has no effect when RELOAD is set.
      Note: This bit has no effect is slave mode when SBC=0.
      Note: If the SMBus feature is not supported, this bit is reserved and forced by hardware to '0'. Refer to Section 52.3: FMPI2C implementation.
  side_effects: null
- id: I2C_OAR1
  address_offset: 8
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: OA1
    bit_range:
    - 9
    - 0
    description: "Interface own slave address\n7-bit addressing mode: OA1[7:1] contains the 7-bit own slave address. The bits OA1[9], OA1[8] and OA1[0] are don't care. \n10-bit addressing mode: OA1[9:0] contains the 10-bit own slave address.\nNote: These bits can be written only when OA1EN=0."
  - name: OA1MODE
    bit_range:
    - 10
    - 10
    description: |-
      Own Address 1 10-bit mode
      Note: This bit can be written only when OA1EN=0.
  - name: OA1EN
    bit_range:
    - 15
    - 15
    description: Own Address 1 enable
  side_effects: null
- id: I2C_OAR2
  address_offset: 12
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: OA2
    bit_range:
    - 7
    - 1
    description: |-
      Interface address
      7-bit addressing mode: 7-bit address
      Note: These bits can be written only when OA2EN=0.
  - name: OA2MSK
    bit_range:
    - 10
    - 8
    description: |-
      Own Address 2 masks
      Note: These bits can be written only when OA2EN=0.
      Note: As soon as OA2MSK is not equal to 0, the reserved I2C addresses (0b0000xxx and 0b1111xxx) are not acknowledged even if the comparison matches.
  - name: OA2EN
    bit_range:
    - 15
    - 15
    description: Own Address 2 enable
  side_effects: null
- id: I2C_TIMINGR
  address_offset: 16
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SCLL
    bit_range:
    - 7
    - 0
    description: |-
      SCL low period (master mode)
      This field is used to generate the SCL low period in master mode.
      tsubSCLL /sub= (SCLL+1) x tsubPRESC/sub
      Note: SCLL is also used to generate tsubBUF /suband tsubSU:STA /subtimings.
  - name: SCLH
    bit_range:
    - 15
    - 8
    description: |-
      SCL high period (master mode)
      This field is used to generate the SCL high period in master mode.
      tsubSCLH /sub= (SCLH+1) x tsubPRESC/sub
      Note: SCLH is also used to generate tsubSU:STO /suband tsubHD:STA /subtiming.
  - name: SDADEL
    bit_range:
    - 19
    - 16
    description: |-
      Data hold time
      This field is used to generate the delay tsubSDADEL /subbetween SCL falling edge and SDA edge. In master mode and in slave mode with NOSTRETCH = 0, the SCL line is stretched low during tsubSDADEL/sub.
      tsubSDADEL/sub= SDADEL x tsubPRESC/sub
      Note: SDADEL is used to generate tsubHD:DAT /subtiming.
  - name: SCLDEL
    bit_range:
    - 23
    - 20
    description: |-
      Data setup time
      This field is used to generate a delay tsubSCLDEL /subbetween SDA edge and SCL rising edge. In master mode and in slave mode with NOSTRETCH = 0, the SCL line is stretched low during tsubSCLDEL/sub.
      tsubSCLDEL /sub= (SCLDEL+1) x tsubPRESC/sub
      Note: tsubSCLDEL/sub is used to generate tsubSU:DAT /subtiming.
  - name: PRESC
    bit_range:
    - 31
    - 28
    description: |-
      Timing prescaler
      This field is used to prescale i2c_ker_ck in order to generate the clock period tsubPRESC /subused for data setup and hold counters (refer to FMPI2C timings on page 1928) and for SCL high and low level counters (refer to FMPI2C master initialization on page 1951).
      tsubPRESC /sub= (PRESC+1) x tsubI2CCLK/sub
  side_effects: null
- id: I2C_TIMEOUTR
  address_offset: 20
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TIMEOUTA
    bit_range:
    - 11
    - 0
    description: "Bus Timeout A\nThis field is used to configure:\nThe SCL low timeout condition tsubTIMEOUT/sub when TIDLE=0\ntsubTIMEOUT/sub= (TIMEOUTA+1) x 2048 x tsubI2CCLK/sub\nThe bus idle condition (both SCL and SDA high) when TIDLE=1 \ntsubIDLE/sub= (TIMEOUTA+1) x 4 x tsubI2CCLK/sub\nNote: These bits can be written only when TIMOUTEN=0."
  - name: TIDLE
    bit_range:
    - 12
    - 12
    description: "Idle clock timeout detection \nNote: This bit can be written only when TIMOUTEN=0."
  - name: TIMOUTEN
    bit_range:
    - 15
    - 15
    description: Clock timeout enable
  - name: TIMEOUTB
    bit_range:
    - 27
    - 16
    description: |-
      Bus timeout B
      This field is used to configure the cumulative clock extension timeout:
      In master mode, the master cumulative clock low extend time (tsubLOW:MEXT/sub) is detected
      In slave mode, the slave cumulative clock low extend time (tsubLOW:SEXT/sub) is detected
      tsubLOW:EXT/sub= (TIMEOUTB+1) x 2048 x tsubI2CCLK/sub
      Note: These bits can be written only when TEXTEN=0.
  - name: TEXTEN
    bit_range:
    - 31
    - 31
    description: Extended clock timeout enable
  side_effects: null
- id: I2C_ISR
  address_offset: 24
  size: 32
  access: READ_WRITE
  reset_value: 1
  fields:
  - name: TXE
    bit_range:
    - 0
    - 0
    description: "Transmit data register empty (transmitters) \nThis bit is set by hardware when the I2C_TXDR register is empty. It is cleared when the next data to be sent is written in the I2C_TXDR register. \nThis bit can be written to '1' by software in order to flush the transmit data register I2C_TXDR.\nNote: This bit is set by hardware when PE = 0."
  - name: TXIS
    bit_range:
    - 1
    - 1
    description: "Transmit interrupt status (transmitters) \nThis bit is set by hardware when the I2C_TXDR register is empty and the data to be transmitted must be written in the I2C_TXDR register. It is cleared when the next data to be sent is written in the I2C_TXDR register. \nThis bit can be written to '1' by software when NOSTRETCH = 1 only, in order to generate a TXIS event (interrupt if TXIE=1 or DMA request if TXDMAEN = 1).\nNote: This bit is cleared by hardware when PE = 0."
  - name: RXNE
    bit_range:
    - 2
    - 2
    description: "Receive data register not empty (receivers)\nThis bit is set by hardware when the received data is copied into the I2C_RXDR register, and is ready to be read. It is cleared when I2C_RXDR is read. \nNote: This bit is cleared by hardware when PE = 0."
  - name: ADDR
    bit_range:
    - 3
    - 3
    description: |-
      Address matched (slave mode)
      This bit is set by hardware as soon as the received slave address matched with one of the enabled slave addresses. It is cleared by software by setting ADDRCF bit.
      Note: This bit is cleared by hardware when PE = 0.
  - name: NACKF
    bit_range:
    - 4
    - 4
    description: "Not Acknowledge received flag \nThis flag is set by hardware when a NACK is received after a byte transmission. It is cleared by software by setting the NACKCF bit.\nNote: This bit is cleared by hardware when PE = 0."
  - name: STOPF
    bit_range:
    - 5
    - 5
    description: |-
      Stop detection flag
      This flag is set by hardware when a STOP condition is detected on the bus and the peripheral is involved in this transfer:
      either as a master, provided that the STOP condition is generated by the peripheral.
      or as a slave, provided that the peripheral has been addressed previously during this transfer.
      It is cleared by software by setting the STOPCF bit.
      Note: This bit is cleared by hardware when PE = 0.
  - name: TC
    bit_range:
    - 6
    - 6
    description: |-
      Transfer Complete (master mode)
      This flag is set by hardware when RELOAD=0, AUTOEND=0 and NBYTES data have been transferred. It is cleared by software when START bit or STOP bit is set.
      Note: This bit is cleared by hardware when PE = 0.
  - name: TCR
    bit_range:
    - 7
    - 7
    description: |-
      Transfer Complete Reload
      This flag is set by hardware when RELOAD=1 and NBYTES data have been transferred. It is cleared by software when NBYTES is written to a non-zero value.
      Note: This bit is cleared by hardware when PE = 0.
      Note: This flag is only for master mode, or for slave mode when the SBC bit is set.
  - name: BERR
    bit_range:
    - 8
    - 8
    description: "Bus error \nThis flag is set by hardware when a misplaced Start or STOP condition is detected whereas the peripheral is involved in the transfer. The flag is not set during the address phase in slave mode. It is cleared by software by setting BERRCF bit.\nNote: This bit is cleared by hardware when PE = 0."
  - name: ARLO
    bit_range:
    - 9
    - 9
    description: "Arbitration lost \nThis flag is set by hardware in case of arbitration loss. It is cleared by software by setting the ARLOCF bit.\nNote: This bit is cleared by hardware when PE = 0."
  - name: OVR
    bit_range:
    - 10
    - 10
    description: |-
      Overrun/Underrun (slave mode)
      This flag is set by hardware in slave mode with NOSTRETCH = 1, when an overrun/underrun error occurs. It is cleared by software by setting the OVRCF bit.
      Note: This bit is cleared by hardware when PE = 0.
  - name: PECERR
    bit_range:
    - 11
    - 11
    description: |-
      PEC Error in reception
      This flag is set by hardware when the received PEC does not match with the PEC register content. A NACK is automatically sent after the wrong PEC reception. It is cleared by software by setting the PECCF bit.
      Note: This bit is cleared by hardware when PE = 0.
      Note: If the SMBus feature is not supported, this bit is reserved and forced by hardware to '0'. Refer to Section 52.3: FMPI2C implementation.
  - name: TIMEOUT
    bit_range:
    - 12
    - 12
    description: |-
      Timeout or tsubLOW/sub detection flag
      This flag is set by hardware when a timeout or extended clock timeout occurred. It is cleared by software by setting the TIMEOUTCF bit.
      Note: This bit is cleared by hardware when PE = 0.
      Note: If the SMBus feature is not supported, this bit is reserved and forced by hardware to '0'. Refer to Section 52.3: FMPI2C implementation.
  - name: ALERT
    bit_range:
    - 13
    - 13
    description: "SMBus alert \nThis flag is set by hardware when SMBHEN=1 (SMBus host configuration), ALERTEN=1 and a SMBALERT event (falling edge) is detected on SMBA pin. It is cleared by software by setting the ALERTCF bit.\nNote: This bit is cleared by hardware when PE = 0.\nNote: If the SMBus feature is not supported, this bit is reserved and forced by hardware to '0'. Refer to Section 52.3: FMPI2C implementation."
  - name: BUSY
    bit_range:
    - 15
    - 15
    description: |-
      Bus busy
      This flag indicates that a communication is in progress on the bus. It is set by hardware when a START condition is detected. It is cleared by hardware when a STOP condition is detected, or when PE = 0.
  - name: DIR
    bit_range:
    - 16
    - 16
    description: |-
      Transfer direction (Slave mode)
      This flag is updated when an address match event occurs (ADDR = 1).
  - name: ADDCODE
    bit_range:
    - 23
    - 17
    description: "Address match code (Slave mode) \nThese bits are updated with the received address when an address match event occurs (ADDR = 1).\nIn the case of a 10-bit address, ADDCODE provides the 10-bit header followed by the 2 MSBs of the address."
  side_effects: null
- id: I2C_ICR
  address_offset: 28
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: ADDRCF
    bit_range:
    - 3
    - 3
    description: "Address matched flag clear \nWriting 1 to this bit clears the ADDR flag in the I2C_ISR register. Writing 1 to this bit also clears the START bit in the I2C_CR2 register."
  - name: NACKCF
    bit_range:
    - 4
    - 4
    description: |-
      Not Acknowledge flag clear
      Writing 1 to this bit clears the NACKF flag in I2C_ISR register.
  - name: STOPCF
    bit_range:
    - 5
    - 5
    description: "STOP detection flag clear \nWriting 1 to this bit clears the STOPF flag in the I2C_ISR register."
  - name: BERRCF
    bit_range:
    - 8
    - 8
    description: |-
      Bus error flag clear
      Writing 1 to this bit clears the BERRF flag in the I2C_ISR register.
  - name: ARLOCF
    bit_range:
    - 9
    - 9
    description: |-
      Arbitration lost flag clear
      Writing 1 to this bit clears the ARLO flag in the I2C_ISR register.
  - name: OVRCF
    bit_range:
    - 10
    - 10
    description: |-
      Overrun/Underrun flag clear
      Writing 1 to this bit clears the OVR flag in the I2C_ISR register.
  - name: PECCF
    bit_range:
    - 11
    - 11
    description: |-
      PEC Error flag clear
      Writing 1 to this bit clears the PECERR flag in the I2C_ISR register.
      Note: If the SMBus feature is not supported, this bit is reserved and forced by hardware to '0'. Refer to Section 52.3: FMPI2C implementation.
  - name: TIMOUTCF
    bit_range:
    - 12
    - 12
    description: |-
      Timeout detection flag clear
      Writing 1 to this bit clears the TIMEOUT flag in the I2C_ISR register.
      Note: If the SMBus feature is not supported, this bit is reserved and forced by hardware to '0'. Refer to Section 52.3: FMPI2C implementation.
  - name: ALERTCF
    bit_range:
    - 13
    - 13
    description: |-
      Alert flag clear
      Writing 1 to this bit clears the ALERT flag in the I2C_ISR register.
      Note: If the SMBus feature is not supported, this bit is reserved and forced by hardware to '0'. Refer to Section 52.3: FMPI2C implementation.
  side_effects: null
- id: I2C_PECR
  address_offset: 32
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: PEC
    bit_range:
    - 7
    - 0
    description: |-
      Packet error checking register
      This field contains the internal PEC when PECEN=1.
      The PEC is cleared by hardware when PE = 0.
  side_effects: null
- id: I2C_RXDR
  address_offset: 36
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: RXDATA
    bit_range:
    - 7
    - 0
    description: |-
      8-bit receive data
      Data byte received from the Isup2/supC bus
  side_effects: null
- id: I2C_TXDR
  address_offset: 40
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TXDATA
    bit_range:
    - 7
    - 0
    description: |-
      8-bit transmit data
      Data byte to be transmitted to the Isup2/supC bus
      Note: These bits can be written only when TXE = 1.
  side_effects: null
- id: I2C_AUTOCR
  address_offset: 44
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TCDMAEN
    bit_range:
    - 6
    - 6
    description: DMA request enable on Transfer Complete event
  - name: TCRDMAEN
    bit_range:
    - 7
    - 7
    description: DMA request enable on Transfer Complete Reload event
  - name: TRIGSEL
    bit_range:
    - 19
    - 16
    description: |-
      Trigger selection (refer to Section 52.4.3: FMPI2C pins and internal signals I2C interconnections tables).
      ...
      Note: This bit can be written only when PE = 0
  - name: TRIGPOL
    bit_range:
    - 20
    - 20
    description: |-
      Trigger polarity
      Note: This bit can be written only when PE = 0
  - name: TRIGEN
    bit_range:
    - 21
    - 21
    description: |-
      Trigger enable
      When a trigger is detected, a START condition is sent and the transfer is launched as defined in I2C_CR2.
  side_effects: null
interrupts:
  I2C1_ER: 44
  I2C1_EV: 43
timing: null
