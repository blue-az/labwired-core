  reset_value: 0
  fields:
  - name: KEY
    bit_range:
    - 7
    - 0
    description: |-
      Write protection key
      This byte is written by software.
      Reading this byte always returns 0x00.
      Refer to RTC register write protection for a description of how to unlock RTC register write protection.
  side_effects: null
- id: RTC_CALR
  address_offset: 40
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: CALM
    bit_range:
    - 8
    - 0
    description: |-
      Calibration minus
      The frequency of the calendar is reduced by masking CALM out of 2sup20/sup RTCCLK pulses (32seconds if the input frequency is 32768Hz). This decreases the frequency of the calendar with a resolution of 0.9537ppm.
      To increase the frequency of the calendar, this feature should be used in conjunction with CALP. See Section74.3.16: RTC smooth digital calibration on page4278.
  - name: LPCAL
    bit_range:
    - 12
    - 12
    description: RTC low-power mode
  - name: CALW16
    bit_range:
    - 13
    - 13
    description: |-
      Use a 16-second calibration cycle period
      When CALW16 is set to 1, the 16-second calibration cycle period is selected. This bit must not be set to 1 if CALW8 = 1.
      Note: CALM[0] is stuck at 0 when CALW16 = 1. Refer to Section74.3.16: RTC smooth digital calibration.
  - name: CALW8
    bit_range:
    - 14
    - 14
    description: |-
      Use an 8-second calibration cycle period
      When CALW8 is set to 1, the 8-second calibration cycle period is selected.
      Note: CALM[1:0] are stuck at 00 when CALW8 = 1. Refer to Section74.3.16: RTC smooth digital calibration.
  - name: CALP
    bit_range:
    - 15
    - 15
    description: |-
      Increase frequency of RTC by 488.5ppm. This feature is intended to be used in conjunction with CALM, which lowers the frequency of the calendar with a fine resolution. if the input frequency is 32768 Hz, the number of RTCCLK pulses added during a 32 second window is calculated as follows: (512 * CALP)  CALM.
      Refer to Section74.3.16: RTC smooth digital calibration.
  side_effects: null
- id: RTC_SHIFTR
  address_offset: 44
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SUBFS
    bit_range:
    - 14
    - 0
    description: |-
      Subtract a fraction of a second
      These bits are write only and is always read as zero. Writing to this bit has no effect when a shift operation is pending (when SHPF = 1, in RTC_ICSR).
      The value which is written to SUBFS is added to the synchronous prescaler counter. Since this counter counts down, this operation effectively subtracts from (delays) the clock by:
      Delay (seconds) = SUBFS / (PREDIV_S + 1)
      A fraction of a second can effectively be added to the clock (advancing the clock) when the ADD1S function is used in conjunction with SUBFS, effectively advancing the clock by:
      Advance (seconds) = (1 - (SUBFS / (PREDIV_S + 1))).
      In mixed BCD-binary mode (BIN=10 or 11), the SUBFS[14:BCDU+8] must be written with 0.
      Note: Writing to SUBFS causes RSF to be cleared. Software can then wait until RSF = 1 to be sure that the shadow registers have been updated with the shifted time.
  - name: ADD1S
    bit_range:
    - 31
    - 31
    description: |-
      Add one second
      This bit is write only and is always read as zero. Writing to this bit has no effect when a shift operation is pending (when SHPF = 1, in RTC_ICSR).
      This function is intended to be used with SUBFS (see description below) in order to effectively add a fraction of a second to the clock in an atomic operation.
  side_effects: null
