peripheral: LPUART1
version: 0.1.0
registers:
- id: LPUART_CR1
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: UE
    bit_range:
    - 0
    - 0
    description: "LPUART enable\n\nWhen this bit is cleared, the LPUART prescalers and outputs are stopped immediately, and current operations are discarded. The configuration of the LPUART is kept, but all the status flags, in the LPUART_ISR are reset. This bit is set and cleared by software.\n\nNote: To enter low-power mode without generating errors on the line, the TE bit must be reset before and the software must wait for the TC bit in the LPUART_ISR to be set before resetting the UE bit. \n\nNote: The DMA requests are also reset when UE = 0 so the DMA channel must be disabled before resetting the UE bit."
  - name: UESM
    bit_range:
    - 1
    - 1
    description: "LPUART enable in low-power mode \n\nWhen this bit is cleared, the LPUART cannot request its kernel clock and is not functional in low-power mode.\n\nWhen this bit is set, the LPUART can wake up the MCU from low-power mode.\n\nThis bit is set and cleared by software.\n\nNote: The UESM bit must be set at the initialization phase. \n\nNote: If the LPUART does not support the Wakeup from low-power mode, this bit is reserved and must be kept at reset value. Refer to Section 79.3: LPUART implementation on page 4652."
  - name: RE
    bit_range:
    - 2
    - 2
    description: |-
      Receiver enable

      This bit enables the receiver. It is set and cleared by software.
  - name: TE
    bit_range:
    - 3
    - 3
    description: "Transmitter enable\n\nThis bit enables the transmitter. When the Autonomous mode is not used, TE bit is set and cleared by software. When the Autonomous mode is used, TE bit becomes a status bit, which is set and cleared by hardware. \n\nNote: During transmission, a low pulse on the TE bit (0 followed by 1) sends a preamble (idle line) after the current word, except in Smartcard mode. In order to generate an idle character, the TE must not be immediately written to 1. To ensure the required duration, the software can poll the TEACK bit in the USART_ISR register.\n\nNote: In Smartcard mode, when TE is set, there is a 1 bit-time delay before the transmission starts."
  - name: IDLEIE
    bit_range:
    - 4
    - 4
    description: |-
      IDLE interrupt enable

      This bit is set and cleared by software.
  - name: RXFNEIE
    bit_range:
    - 5
    - 5
    description: |-
      RXFIFO not empty interrupt enable

      This bit is set and cleared by software.
  - name: TCIE
    bit_range:
    - 6
    - 6
    description: |-
      Transmission complete interrupt enable

      This bit is set and cleared by software.
  - name: TXFNFIE
    bit_range:
    - 7
    - 7
    description: |-
      TXFIFO not full interrupt enable

      This bit is set and cleared by software.
  - name: PEIE
    bit_range:
    - 8
    - 8
    description: |-
      PE interrupt enable

      This bit is set and cleared by software.
  - name: PS
    bit_range:
    - 9
    - 9
    description: |-
      Parity selection

      This bit selects the odd or even parity when the parity generation/detection is enabled (PCE bit set). It is set and cleared by software. The parity is selected after the current byte.

      This bitfield can only be written when the LPUART is disabled (UE=0).
  - name: PCE
    bit_range:
    - 10
    - 10
    description: |-
      Parity control enable

      This bit selects the hardware parity control (generation and detection). When the parity control is enabled, the computed parity is inserted at the MSB position (9th bit if M=1; 8th bit if M=0) and parity is checked on the received data. This bit is set and cleared by software. Once it is set, PCE is active after the current byte (in reception and in transmission).

      This bitfield can only be written when the LPUART is disabled (UE=0).
  - name: WAKE
    bit_range:
    - 11
    - 11
    description: "Receiver wakeup method\n\nThis bit determines the LPUART wakeup method from Mute mode. It is set or cleared by software.\t\n\nThis bitfield can only be written when the LPUART is disabled (UE=0)."
  - name: M0
    bit_range:
    - 12
    - 12
    description: |-
      Word length

      This bit is used in conjunction with bit 28 (M1) to determine the word length. It is set or cleared by software (refer to bit 28 (M1) description).

      This bit can only be written when the LPUART is disabled (UE=0).
  - name: MME
    bit_range:
    - 13
    - 13
    description: |-
      Mute mode enable

      This bit activates the Mute mode function of the LPUART. When set, the LPUART can switch between the active and Mute modes, as defined by the WAKE bit. It is set and cleared by software.
  - name: CMIE
    bit_range:
    - 14
    - 14
    description: |-
      Character match interrupt enable

      This bit is set and cleared by software.
  - name: DEDT
    bit_range:
    - 20
    - 16
    description: |-
      Driver Enable deassertion time

      This 5-bit value defines the time between the end of the last stop bit, in a transmitted message, and the de-activation of the DE (Driver Enable) signal.It is expressed in lpuart_ker_ck clock cycles. For more details, refer Section 79.4.14: RS232 Hardware flow control and RS485 Driver Enable.

      If the LPUART_TDR register is written during the DEDT time, the new data is transmitted only when the DEDT and DEAT times have both elapsed.

      This bitfield can only be written when the LPUART is disabled (UE=0).
  - name: DEAT
    bit_range:
    - 25
    - 21
    description: |-
      Driver Enable assertion time

      This 5-bit value defines the time between the activation of the DE (Driver Enable) signal and the beginning of the start bit. It is expressed in lpuart_ker_ck clock cycles. For more details, refer Section 78.5.21: RS232 Hardware flow control and RS485 Driver Enable.

      This bitfield can only be written when the LPUART is disabled (UE=0).
  - name: M1
    bit_range:
    - 28
    - 28
    description: |-
      Word length

      This bit must be used in conjunction with bit 12 (M0) to determine the word length. It is set or cleared by software.

      M[1:0] = 00: 1 Start bit, 8 Data bits, n Stop bit

      M[1:0] = 01: 1 Start bit, 9 Data bits, n Stop bit

      M[1:0] = '10: 1 Start bit, 7 Data bits, n Stop bit

      This bit can only be written when the LPUART is disabled (UE=0).

      Note: In 7-bit data length mode, the Smartcard mode, LIN master mode and auto baud rate (0x7F and 0x55 frames detection) are not supported.
  - name: FIFOEN
    bit_range:
    - 29
    - 29
    description: |-
      FIFO mode enable

      This bit is set and cleared by software.
  - name: TXFEIE
    bit_range:
    - 30
    - 30
    description: |-
      TXFIFO empty interrupt enable

      This bit is set and cleared by software.
  - name: RXFFIE
    bit_range:
    - 31
    - 31
    description: |-
      RXFIFO Full interrupt enable

      This bit is set and cleared by software.
  side_effects: null
- id: LPUART_CR1_ALTERNATE1
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: UE
    bit_range:
    - 0
    - 0
    description: "LPUART enable\n\nWhen this bit is cleared, the LPUART prescalers and outputs are stopped immediately, and current operations are discarded. The configuration of the LPUART is kept, but all the status flags, in the LPUART_ISR are reset. This bit is set and cleared by software.\n\nNote: To enter low-power mode without generating errors on the line, the TE bit must be reset before and the software must wait for the TC bit in the LPUART_ISR to be set before resetting the UE bit. \n\nNote: The DMA requests are also reset when UE = 0 so the DMA channel must be disabled before resetting the UE bit."
  - name: UESM
    bit_range:
    - 1
    - 1
    description: "LPUART enable in low-power mode \n\nWhen this bit is cleared, the LPUART cannot request its kernel clock and is not functional in low-power mode.\n\nWhen this bit is set, the LPUART can wake up the MCU from low-power mode.\n\nThis bit is set and cleared by software.\n\nNote: The UESM bit must be set at the initialization phase. \n\nNote: If the LPUART does not support the Wakeup from low-power mode, this bit is reserved and must be kept at reset value. Refer to Section 79.3: LPUART implementation on page 4652."
  - name: RE
    bit_range:
    - 2
    - 2
    description: |-
      Receiver enable

      This bit enables the receiver. It is set and cleared by software.
  - name: TE
    bit_range:
    - 3
    - 3
    description: "Transmitter enable\n\nThis bit enables the transmitter. When the Autonomous mode is disabled, TE bit is set and cleared by software. When the Autonomous mode is enabled, TE bit becomes a status bit, which is set and cleared by hardware. \n\nNote: During transmission, a low pulse on the TE bit (0 followed by 1) sends a preamble (idle line) after the current word, except in Smartcard mode. In order to generate an idle character, the TE must not be immediately written to 1. To ensure the required duration, the software can poll the TEACK bit in the LPUART_ISR register.\n\nNote: In Smartcard mode, when TE is set, there is a 1 bit-time delay before the transmission starts."
  - name: IDLEIE
    bit_range:
    - 4
    - 4
    description: |-
      IDLE interrupt enable

      This bit is set and cleared by software.
  - name: RXNEIE
    bit_range:
    - 5
    - 5
    description: |-
      Receive data register not empty

      This bit is set and cleared by software.
  - name: TCIE
    bit_range:
    - 6
    - 6
    description: |-
      Transmission complete interrupt enable

      This bit is set and cleared by software.
  - name: TXEIE
    bit_range:
    - 7
    - 7
    description: |-
      Transmit data register empty

      This bit is set and cleared by software.
  - name: PEIE
    bit_range:
    - 8
    - 8
    description: |-
      PE interrupt enable

      This bit is set and cleared by software.
  - name: PS
    bit_range:
    - 9
    - 9
    description: |-
      Parity selection

      This bit selects the odd or even parity when the parity generation/detection is enabled (PCE bit set). It is set and cleared by software. The parity is selected after the current byte.

      This bitfield can only be written when the LPUART is disabled (UE=0).
  - name: PCE
    bit_range:
    - 10
    - 10
    description: |-
      Parity control enable

      This bit selects the hardware parity control (generation and detection). When the parity control is enabled, the computed parity is inserted at the MSB position (9th bit if M=1; 8th bit if M=0) and parity is checked on the received data. This bit is set and cleared by software. Once it is set, PCE is active after the current byte (in reception and in transmission).

      This bitfield can only be written when the LPUART is disabled (UE=0).
  - name: WAKE
    bit_range:
    - 11
    - 11
    description: "Receiver wakeup method\n\nThis bit determines the LPUART wakeup method from Mute mode. It is set or cleared by software.\t\n\nThis bitfield can only be written when the LPUART is disabled (UE=0)."
  - name: M0
    bit_range:
    - 12
    - 12
    description: |-
      Word length

      This bit is used in conjunction with bit 28 (M1) to determine the word length. It is set or cleared by software (refer to bit 28 (M1) description).

      This bit can only be written when the LPUART is disabled (UE=0).
  - name: MME
    bit_range:
    - 13
    - 13
    description: |-
      Mute mode enable

      This bit activates the Mute mode function of the LPUART. When set, the LPUART can switch between the active and Mute modes, as defined by the WAKE bit. It is set and cleared by software.
  - name: CMIE
    bit_range:
    - 14
    - 14
    description: |-
      Character match interrupt enable

      This bit is set and cleared by software.
  - name: DEDT
    bit_range:
    - 20
    - 16
    description: |-
      Driver Enable deassertion time

      This 5-bit value defines the time between the end of the last stop bit, in a transmitted message, and the de-activation of the DE (Driver Enable) signal.It is expressed in lpuart_ker_ck clock cycles. For more details, refer Section 79.4.14: RS232 Hardware flow control and RS485 Driver Enable.

      If the LPUART_TDR register is written during the DEDT time, the new data is transmitted only when the DEDT and DEAT times have both elapsed.

      This bitfield can only be written when the LPUART is disabled (UE=0).
  - name: DEAT
    bit_range:
    - 25
    - 21
    description: |-
      Driver Enable assertion time

      This 5-bit value defines the time between the activation of the DE (Driver Enable) signal and the beginning of the start bit. It is expressed in lpuart_ker_ck clock cycles. For more details, refer Section 78.5.21: RS232 Hardware flow control and RS485 Driver Enable.

      This bitfield can only be written when the LPUART is disabled (UE=0).
  - name: M1
    bit_range:
    - 28
    - 28
    description: |-
      Word length

      This bit must be used in conjunction with bit 12 (M0) to determine the word length. It is set or cleared by software.

      M[1:0] = 00: 1 Start bit, 8 Data bits, n Stop bit

      M[1:0] = 01: 1 Start bit, 9 Data bits, n Stop bit

      M[1:0] = '10: 1 Start bit, 7 Data bits, n Stop bit

      This bit can only be written when the LPUART is disabled (UE=0).

      Note: In 7-bit data length mode, the Smartcard mode, LIN master mode and auto baud rate (0x7F and 0x55 frames detection) are not supported.
  - name: FIFOEN
    bit_range:
    - 29
    - 29
    description: |-
      FIFO mode enable

      This bit is set and cleared by software.
  side_effects: null
- id: LPUART_CR2
  address_offset: 4
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: ADDM7
    bit_range:
    - 4
    - 4
    description: "7-bit Address Detection/4-bit Address Detection\n\nThis bit is for selection between 4-bit address detection or 7-bit address detection. \n\nThis bit can only be written when the LPUART is disabled (UE=0)\n\nNote: In 7-bit and 9-bit data modes, the address detection is done on 6-bit and 8-bit address (ADD[5:0] and ADD[7:0]) respectively."
  - name: STOP
    bit_range:
    - 13
    - 12
    description: |-
      STOP bits

      These bits are used for programming the stop bits.

      This bitfield can only be written when the LPUART is disabled (UE=0).
  - name: SWAP
    bit_range:
    - 15
    - 15
    description: |-
      Swap TX/RX pins

      This bit is set and cleared by software.

      This bitfield can only be written when the LPUART is disabled (UE=0).
  - name: RXINV
    bit_range:
    - 16
    - 16
    description: "RX pin active level inversion\n\nThis bit is set and cleared by software.\n\nThis enables the use of an external inverter on the RX line. \n\nThis bitfield can only be written when the LPUART is disabled (UE=0)."
  - name: TXINV
    bit_range:
    - 17
    - 17
    description: "TX pin active level inversion\n\nThis bit is set and cleared by software.\n\nThis enables the use of an external inverter on the TX line. \n\nThis bitfield can only be written when the LPUART is disabled (UE=0)."
  - name: DATAINV
    bit_range:
    - 18
    - 18
    description: |-
      Binary data inversion

      This bit is set and cleared by software.

      This bitfield can only be written when the LPUART is disabled (UE=0).
  - name: MSBFIRST
    bit_range:
    - 19
    - 19
    description: |-
      Most significant bit first

      This bit is set and cleared by software.

      This bitfield can only be written when the LPUART is disabled (UE=0).
  - name: ADD
    bit_range:
    - 31
    - 24
    description: "Address of the LPUART node \n\nThese bits give the address of the LPUART node in Mute mode or a character code to be recognized in low-power or Run mode:\n\nIn Mute mode: they are used in multiprocessor communication to wakeup from Mute mode with 4-bit/7-bit address mark detection. The MSB of the character sent by the transmitter should be equal to 1. In 4-bit address mark detection, only ADD[3:0] bits are used.\n\nIn low-power mode: they are used for wake up from low-power mode on character match.\n\nWhen a character, received during low-power mode, corresponds to the character programmed through ADD[7:0] bitfield, the CMF flag is set and wakes up the device from low-power mode if the corresponding interrupt is enabled by setting CMIE bit. \n\nIn Run mode with Mute mode inactive (for example, end-of-block detection in ModBus protocol): the whole received character (8 bits) is compared to ADD[7:0] value and CMF flag is set on match. An interrupt is generated if the CMIE bit is set.\n\nThese bits can only be written when the reception is disabled (RE = 0) or when the USART is disabled (UE = 0)."
  side_effects: null
- id: LPUART_CR3
  address_offset: 8
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: EIE
    bit_range:
    - 0
    - 0
    description: |-
      Error interrupt enable

      Error Interrupt Enable Bit is required to enable interrupt generation in case of a framing error, overrun error or noise flag (FE=1 or ORE=1 or NE=1 in the LPUART_ISR register).
  - name: HDSEL
    bit_range:
    - 3
    - 3
    description: "Half-duplex selection\n\nSelection of Single-wire Half-duplex mode \n\nThis bit can only be written when the LPUART is disabled (UE=0)."
  - name: DMAR
    bit_range:
    - 6
    - 6
    description: |-
      DMA enable receiver

      This bit is set/reset by software
  - name: DMAT
    bit_range:
    - 7
    - 7
    description: |-
      DMA enable transmitter

      This bit is set/reset by software
  - name: RTSE
    bit_range:
    - 8
    - 8
    description: |-
      RTS enable

      This bit can only be written when the LPUART is disabled (UE=0).
  - name: CTSE
    bit_range:
    - 9
    - 9
    description: |-
      CTS enable

      This bit can only be written when the LPUART is disabled (UE=0)
  - name: CTSIE
    bit_range:
    - 10
    - 10
    description: CTS interrupt enable
  - name: OVRDIS
    bit_range:
    - 12
    - 12
    description: "Overrun Disable\n\nThis bit is used to disable the receive overrun detection. \n\nthe ORE flag is not set and the new received data overwrites the previous content of the LPUART_RDR register.\n\nThis bit can only be written when the LPUART is disabled (UE=0).\n\nNote: This control bit enables checking the communication flow w/o reading the data."
  - name: DDRE
    bit_range:
    - 13
    - 13
    description: |-
      DMA Disable on Reception Error

      This bit can only be written when the LPUART is disabled (UE=0).

      Note: The reception errors are: parity error, framing error or noise error.
  - name: DEM
    bit_range:
    - 14
    - 14
    description: "Driver enable mode \n\nThis bit enables the user to activate the external transceiver control, through the DE signal. \n\nThis bit can only be written when the LPUART is disabled (UE=0)."
  - name: DEP
    bit_range:
    - 15
    - 15
    description: |-
      Driver enable polarity selection

      This bit can only be written when the LPUART is disabled (UE=0).
  - name: TXFTIE
    bit_range:
    - 23
    - 23
    description: |-
      TXFIFO threshold interrupt enable

      This bit is set and cleared by software.
  - name: RXFTCFG
    bit_range:
    - 27
    - 25
    description: |-
      Receive FIFO threshold configuration

      Remaining combinations: Reserved.
  - name: RXFTIE
    bit_range:
    - 28
    - 28
    description: |-
      RXFIFO threshold interrupt enable

      This bit is set and cleared by software.
  - name: TXFTCFG
    bit_range:
    - 31
    - 29
    description: |-
      TXFIFO threshold configuration

      Remaining combinations: Reserved.
  side_effects: null
- id: LPUART_BRR
  address_offset: 12
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: BRR
    bit_range:
    - 19
    - 0
    description: LPUART baud rate division (LPUARTDIV)
  side_effects: null
- id: LPUART_RQR
  address_offset: 24
  size: 32
  access: WRITE_ONLY
  reset_value: 0
  fields:
  - name: SBKRQ
    bit_range:
    - 1
    - 1
    description: |-
      Send break request

      Writing 1 to this bit sets the SBKF flag and request to send a BREAK on the line, as soon as the transmit machine is available.

      Note: If the application needs to send the break character following all previously inserted data, including the ones not yet transmitted, the software should wait for the TXE flag assertion before setting the SBKRQ bit.
  - name: MMRQ
    bit_range:
    - 2
    - 2
    description: |-
      Mute mode request

      Writing 1 to this bit puts the LPUART in Mute mode and resets the RWU flag.
  - name: RXFRQ
    bit_range:
    - 3
    - 3
    description: "Receive data flush request\n\nWriting 1 to this bit clears the RXNE flag. \n\nThis enables discarding the received data without reading it, and avoid an overrun condition."
  - name: TXFRQ
    bit_range:
    - 4
    - 4
    description: "Transmit data flush request\n\nThis bit is used when FIFO mode is enabled. TXFRQ bit is set to flush the whole FIFO. This sets the flag TXFE (TXFIFO empty, bit 23 in the LPUART_ISR register). \n\nNote: In FIFO mode, the TXFNF flag is reset during the flush request until TxFIFO is empty in order to ensure that no data are written in the data register."
  side_effects: null
- id: LPUART_ISR
  address_offset: 28
  size: 32
  access: READ_ONLY
  reset_value: 8388800
  fields:
  - name: PE
    bit_range:
    - 0
    - 0
    description: "Parity error\n\nThis bit is set by hardware when a parity error occurs in Reception mode. It is cleared by software, writing 1 to the PECF in the LPUART_ICR register. \n\nAn interrupt is generated if PEIE = 1 in the LPUART_CR1 register.\n\nNote: This error is associated with the character in the LPUART_RDR."
  - name: FE
    bit_range:
    - 1
    - 1
    description: |-
      Framing error

      This bit is set by hardware when a de-synchronization, excessive noise or a break character is detected. It is cleared by software, writing 1 to the FECF bit in the LPUART_ICR register.

      When transmitting data in Smartcard mode, this bit is set when the maximum number of transmit attempts is reached without success (the card NACKs the data frame).

      An interrupt is generated if EIE = 1 in the LPUART_CR1 register.

      Note: This error is associated with the character in the LPUART_RDR.
  - name: NE
    bit_range:
    - 2
    - 2
    description: |-
      Start bit noise detection flag

      This bit is set by hardware when noise is detected on the start bit of a received frame. It is cleared by software, writing 1 to the NFCF bit in the LPUART_ICR register.

      Note: This bit does not generate an interrupt as it appears at the same time as the RXFNE bit which itself generates an interrupt. An interrupt is generated when the NE flag is set during multi buffer communication if the EIE bit is set.

      Note: This error is associated with the character in the LPUART_RDR.
  - name: ORE
    bit_range:
    - 3
    - 3
    description: |-
      Overrun error

      This bit is set by hardware when the data currently being received in the shift register is

      ready to be transferred into the LPUART_RDR register while RXFF = 1. It is cleared by a software, writing 1 to the ORECF, in the LPUART_ICR register.

      An interrupt is generated if RXFNEIE=1 or EIE = 1 in the LPUART_CR1 register.

      Note: When this bit is set, the LPUART_RDR register content is not lost but the shift register is overwritten. An interrupt is generated if the ORE flag is set during multi buffer communication if the EIE bit is set.

      Note: This bit is permanently forced to 0 (no overrun detection) when the bit OVRDIS is set in the LPUART_CR3 register.
  - name: IDLE
    bit_range:
    - 4
    - 4
    description: "Idle line detected\n\nThis bit is set by hardware when an Idle line is detected. An interrupt is generated if IDLEIE=1 in the LPUART_CR1 register. It is cleared by software, writing 1 to the IDLECF in the LPUART_ICR register. \n\nNote: The IDLE bit is not set again until the RXFNE bit has been set (i.e. a new idle line occurs).\n\nNote: If Mute mode is enabled (MME=1), IDLE is set if the LPUART is not mute (RWU=0), whatever the Mute mode selected by the WAKE bit. If RWU=1, IDLE is not set."
  - name: RXFNE
    bit_range:
    - 5
    - 5
    description: "RXFIFO not empty\n\nRXFNE bit is set by hardware when the RXFIFO is not empty, and so data can be read from the LPUART_RDR register. Every read of the LPUART_RDR frees a location in the RXFIFO. It is cleared when the RXFIFO is empty. \n\nThe RXFNE flag can also be cleared by writing 1 to the RXFRQ in the LPUART_RQR register. \n\nAn interrupt is generated if RXFNEIE=1 in the LPUART_CR1 register."
  - name: TC
    bit_range:
    - 6
    - 6
    description: "Transmission complete\n\nThis bit indicates that the last data written in the LPUART_TDR has been transmitted out of the shift register. The TC flag behaves as follows:\n\nWhen TDN = 0, the TC flag is set when the transmission of a frame containing data is complete and when TXFE is set.\n\nWhen TDN is equal to the number of data in the TXFIFO, the TC flag is set when TXFIFO is empty and TDN is reached.\n\nWhen TDN is greater than the number of data in the TXFIFO, TC remains cleared until the TXFIFO is filled again to reach the programmed number of data to be transferred. \n\nWhen TDN is less than the number of data in the TXFIFO, TC is set when TDN is reached even if the TXFIFO is not empty.\n\nAn interrupt is generated if TCIE=1 in the LPUART_CR1 register.\n\nTC bit is cleared by software by writing 1 to the TCCF in the LPUART_ICR register or by writing to the LPUART_TDR register."
  - name: TXFNF
    bit_range:
    - 7
    - 7
    description: "TXFIFO not full\n\nTXFNF is set by hardware when TXFIFO is not full, and so data can be written in the LPUART_TDR. Every write in the LPUART_TDR places the data in the TXFIFO. This flag remains set until the TXFIFO is full. When the TXFIFO is full, this flag is cleared indicating that data can not be written into the LPUART_TDR. \n\nThe TXFNF is kept reset during the flush request until TXFIFO is empty. After sending the flush request (by setting TXFRQ bit), the flag TXFNF should be checked prior to writing in TXFIFO (TXFNF and TXFE are set at the same time).\n\nAn interrupt is generated if the TXFNFIE bit =1 in the LPUART_CR1 register. \n\nNote: This bit is used during single buffer transmission."
  - name: CTSIF
    bit_range:
    - 9
    - 9
    description: "CTS interrupt flag\n\nThis bit is set by hardware when the CTS input toggles, if the CTSE bit is set. It is cleared by software, by writing 1 to the CTSCF bit in the LPUART_ICR register. \n\nAn interrupt is generated if CTSIE=1 in the LPUART_CR3 register.\n\nNote: If the hardware flow control feature is not supported, this bit is reserved and kept at reset value."
  - name: CTS
    bit_range:
    - 10
    - 10
    description: "CTS flag\n\nThis bit is set/reset by hardware. It is an inverted copy of the status of the CTS input pin. \n\nNote: If the hardware flow control feature is not supported, this bit is reserved and kept at reset value."
  - name: BUSY
    bit_range:
    - 16
    - 16
    description: |-
      Busy flag

      This bit is set and reset by hardware. It is active when a communication is ongoing on the RX line (successful start bit detected). It is reset at the end of the reception (successful or not).
  - name: CMF
    bit_range:
    - 17
    - 17
    description: "Character match flag\n\nThis bit is set by hardware, when a the character defined by ADD[7:0] is received. It is cleared by software, writing 1 to the CMCF in the LPUART_ICR register. \n\nAn interrupt is generated if CMIE=1in the LPUART_CR1 register."
  - name: SBKF
    bit_range:
    - 18
    - 18
    description: |-
      Send break flag

      This bit indicates that a send break character was requested. It is set by software, by writing 1 to the SBKRQ bit in the LPUART_CR3 register. It is automatically reset by hardware during the stop bit of break transmission.
  - name: RWU
    bit_range:
    - 19
    - 19
    description: "Receiver wakeup from Mute mode\n\nThis bit indicates if the LPUART is in Mute mode. It is cleared/set by hardware when a wakeup/mute sequence is recognized. The Mute mode control sequence (address or IDLE) is selected by the WAKE bit in the LPUART_CR1 register.\n\nWhen wakeup on IDLE mode is selected, this bit can only be set by software, writing 1 to the MMRQ bit in the LPUART_RQR register. \n\nNote: If the LPUART does not support the wakeup from Stop feature, this bit is reserved and kept at reset value."
  - name: TEACK
    bit_range:
    - 21
    - 21
    description: "Transmit enable acknowledge flag \n\nThis bit is set/reset by hardware, when the Transmit Enable value is taken into account by the LPUART. \n\nIt can be used when an idle frame request is generated by writing TE=0, followed by TE=1 in the LPUART_CR1 register, in order to respect the TE=0 minimum period."
  - name: REACK
    bit_range:
    - 22
    - 22
    description: "Receive enable acknowledge flag \n\nThis bit is set/reset by hardware, when the Receive Enable value is taken into account by the LPUART. \n\nIt can be used to verify that the LPUART is ready for reception before entering low-power mode.\n\nNote: If the LPUART does not support the wakeup from Stop feature, this bit is reserved and kept at reset value."
  - name: TXFE
    bit_range:
    - 23
    - 23
    description: |-
      TXFIFO Empty

      This bit is set by hardware when TXFIFO is Empty. When the TXFIFO contains at least one data, this flag is cleared. The TXFE flag can also be set by writing 1 to the bit TXFRQ (bit 4) in the LPUART_RQR register.

      An interrupt is generated if the TXFEIE bit =1 (bit 30) in the LPUART_CR1 register.
  - name: RXFF
    bit_range:
    - 24
    - 24
    description: "RXFIFO Full\n\nThis bit is set by hardware when the number of received data corresponds to RXFIFO size + 1 (RXFIFO full + 1 data in the LPUART_RDR register. \n\nAn interrupt is generated if the RXFFIE bit =1 in the LPUART_CR1 register."
  - name: RXFT
    bit_range:
    - 26
    - 26
    description: |-
      RXFIFO threshold flag

      This bit is set by hardware when the RXFIFO reaches the threshold programmed in RXFTCFG in LPUART_CR3 register i.e. the Receive FIFO contains RXFTCFG data. An interrupt is generated if the RXFTIE bit =1 (bit 27) in the LPUART_CR3 register.
  - name: TXFT
    bit_range:
    - 27
    - 27
    description: |-
      TXFIFO threshold flag

      This bit is set by hardware when the TXFIFO reaches the threshold programmed in TXFTCFG in LPUART_CR3 register i.e. the TXFIFO contains TXFTCFG empty locations. An interrupt is generated if the TXFTIE bit =1 (bit 31) in the LPUART_CR3 register.
  side_effects: null
- id: LPUART_ISR_ALTERNATE1
  address_offset: 28
  size: 32
  access: READ_ONLY
  reset_value: 192
  fields:
  - name: PE
    bit_range:
    - 0
    - 0
    description: "Parity error\n\nThis bit is set by hardware when a parity error occurs in Reception mode. It is cleared by software, writing 1 to the PECF in the LPUART_ICR register. \n\nAn interrupt is generated if PEIE = 1 in the LPUART_CR1 register.\n\nNote: In FIFO mode, this error is associated with the character in the LPUART_RDR."
  - name: FE
    bit_range:
    - 1
    - 1
    description: |-
      Framing error

      This bit is set by hardware when a de-synchronization, excessive noise or a break character is detected. It is cleared by software, writing 1 to the FECF bit in the LPUART_ICR register.

      When transmitting data in Smartcard mode, this bit is set when the maximum number of transmit attempts is reached without success (the card NACKs the data frame).

      An interrupt is generated if EIE = 1 in the LPUART_CR1 register.

      Note: In FIFO mode, this error is associated with the character in the LPUART_RDR.
  - name: NE
    bit_range:
    - 2
    - 2
    description: |-
      Start bit noise detection flag

      This bit is set by hardware when noise is detected on the start bit of a received frame. It is cleared by software, writing 1 to the NFCF bit in the LPUART_ICR register.

      Note: This bit does not generate an interrupt as it appears at the same time as the RXNE/RXFNE bit which itself generates an interrupt. An interrupt is generated when the NE flag is set during multi buffer communication if the EIE bit is set.

      Note: In FIFO mode, this error is associated with the character in the LPUART_RDR.
  - name: ORE
    bit_range:
    - 3
    - 3
    description: |-
      Overrun error

      This bit is set by hardware when the data currently being received in the shift register is

      ready to be transferred into the LPUART_RDR register while RXNE=1 (RXFF = 1 in case FIFO mode is enabled). It is cleared by a software, writing 1 to the ORECF, in the LPUART_ICR register.

      An interrupt is generated if RXNEIE=1 or EIE = 1 in the LPUART_CR1 register.

      Note: When this bit is set, the LPUART_RDR register content is not lost but the shift register is overwritten. An interrupt is generated if the ORE flag is set during multi buffer communication if the EIE bit is set.

      Note: This bit is permanently forced to 0 (no overrun detection) when the bit OVRDIS is set in the LPUART_CR3 register.
  - name: IDLE
    bit_range:
    - 4
    - 4
    description: "Idle line detected\n\nThis bit is set by hardware when an Idle Line is detected. An interrupt is generated if IDLEIE=1 in the LPUART_CR1 register. It is cleared by software, writing 1 to the IDLECF in the LPUART_ICR register. \n\nNote: The IDLE bit is not set again until the RXNE bit has been set (i.e. a new idle line occurs).\n\nNote: If Mute mode is enabled (MME=1), IDLE is set if the LPUART is not mute (RWU=0), whatever the Mute mode selected by the WAKE bit. If RWU=1, IDLE is not set."
  - name: RXNE
    bit_range:
    - 5
    - 5
    description: "Read data register not empty\n\nRXNE bit is set by hardware when the content of the LPUART_RDR shift register has been transferred to the LPUART_RDR register. It is cleared by a read to the LPUART_RDR register. The\n\nRXNE flag can also be cleared by writing 1 to the RXFRQ in the LPUART_RQR register.\n\nThe RXFNE flag can also be cleared by writing 1 to the RXFRQ in the LPUART_RQR register. \n\nAn interrupt is generated if RXNEIE=1 in the LPUART_CR1 register."
  - name: TC
    bit_range:
    - 6
    - 6
    description: |-
      Transmission complete

      This bit indicates that the last data written in the USART_TDR has been transmitted out of the shift register. The TC flag is set when the transmission of a frame containing data is complete and when TXE is set.

      An interrupt is generated if TCIE=1 in the USART_CR1 register.

      TC bit is cleared by software by writing 1 to the TCCF in the USART_ICR register or by writing to the USART_TDR register.
  - name: TXE
    bit_range:
    - 7
    - 7
    description: "Transmit data register empty\n\nTXE is set by hardware when the content of the LPUART_TDR register has been transferred into the shift register. It is cleared by a write to the LPUART_TDR register. \n\nAn interrupt is generated if the TXEIE bit =1 in the LPUART_CR1 register. \n\nNote: This bit is used during single buffer transmission."
  - name: CTSIF
    bit_range:
    - 9
    - 9
    description: "CTS interrupt flag\n\nThis bit is set by hardware when the CTS input toggles, if the CTSE bit is set. It is cleared by software, by writing 1 to the CTSCF bit in the LPUART_ICR register. \n\nAn interrupt is generated if CTSIE=1 in the LPUART_CR3 register.\n\nNote: If the hardware flow control feature is not supported, this bit is reserved and kept at reset value."
  - name: CTS
    bit_range:
    - 10
    - 10
    description: "CTS flag\n\nThis bit is set/reset by hardware. It is an inverted copy of the status of the CTS input pin. \n\nNote: If the hardware flow control feature is not supported, this bit is reserved and kept at reset value."
  - name: BUSY
    bit_range:
    - 16
    - 16
    description: |-
      Busy flag

      This bit is set and reset by hardware. It is active when a communication is ongoing on the RX line (successful start bit detected). It is reset at the end of the reception (successful or not).
  - name: CMF
    bit_range:
    - 17
    - 17
    description: "Character match flag\n\nThis bit is set by hardware, when a the character defined by ADD[7:0] is received. It is cleared by software, writing 1 to the CMCF in the LPUART_ICR register. \n\nAn interrupt is generated if CMIE=1in the LPUART_CR1 register."
  - name: SBKF
    bit_range:
    - 18
    - 18
    description: |-
      Send break flag

      This bit indicates that a send break character was requested. It is set by software, by writing 1 to the SBKRQ bit in the LPUART_CR3 register. It is automatically reset by hardware during the stop bit of break transmission.
  - name: RWU
    bit_range:
    - 19
    - 19
    description: "Receiver wakeup from Mute mode\n\nThis bit indicates if the LPUART is in Mute mode. It is cleared/set by hardware when a wakeup/mute sequence is recognized. The Mute mode control sequence (address or IDLE) is selected by the WAKE bit in the LPUART_CR1 register.\n\nWhen wakeup on IDLE mode is selected, this bit can only be set by software, writing 1 to the MMRQ bit in the LPUART_RQR register. \n\nNote: If the LPUART does not support the wakeup from Stop feature, this bit is reserved and kept at reset value."
  - name: TEACK
    bit_range:
    - 21
    - 21
    description: "Transmit enable acknowledge flag \n\nThis bit is set/reset by hardware, when the Transmit Enable value is taken into account by the LPUART. \n\nIt can be used when an idle frame request is generated by writing TE=0, followed by TE=1 in the LPUART_CR1 register, in order to respect the TE=0 minimum period."
  - name: REACK
    bit_range:
    - 22
    - 22
    description: "Receive enable acknowledge flag \n\nThis bit is set/reset by hardware, when the Receive Enable value is taken into account by the LPUART. \n\nIt can be used to verify that the LPUART is ready for reception before entering low-power mode.\n\nNote: If the LPUART does not support the wakeup from Stop feature, this bit is reserved and kept at reset value."
  side_effects: null
- id: LPUART_ICR
  address_offset: 32
  size: 32
  access: WRITE_ONLY
  reset_value: 0
  fields:
  - name: PECF
    bit_range:
    - 0
    - 0
    description: |-
      Parity error clear flag

      Writing 1 to this bit clears the PE flag in the LPUART_ISR register.
  - name: FECF
    bit_range:
    - 1
    - 1
    description: |-
      Framing error clear flag

      Writing 1 to this bit clears the FE flag in the LPUART_ISR register.
  - name: NECF
    bit_range:
    - 2
    - 2
    description: |-
      Noise detected clear flag

      Writing 1 to this bit clears the NE flag in the LPUART_ISR register.
  - name: ORECF
    bit_range:
    - 3
    - 3
    description: |-
      Overrun error clear flag

      Writing 1 to this bit clears the ORE flag in the LPUART_ISR register.
  - name: IDLECF
    bit_range:
    - 4
    - 4
    description: |-
      Idle line detected clear flag

      Writing 1 to this bit clears the IDLE flag in the LPUART_ISR register.
  - name: TCCF
    bit_range:
    - 6
    - 6
    description: |-
      Transmission complete clear flag

      Writing 1 to this bit clears the TC flag in the LPUART_ISR register.
  - name: CTSCF
    bit_range:
    - 9
    - 9
    description: |-
      CTS clear flag

      Writing 1 to this bit clears the CTSIF flag in the LPUART_ISR register.
  - name: CMCF
    bit_range:
    - 17
    - 17
    description: |-
      Character match clear flag

      Writing 1 to this bit clears the CMF flag in the LPUART_ISR register.
  side_effects: null
- id: LPUART_RDR
  address_offset: 36
  size: 32
  access: READ_ONLY
  reset_value: 0
  fields:
  - name: RDR
    bit_range:
    - 8
    - 0
    description: |-
      Receive data value

      Contains the received data character.

      The RDR register provides the parallel interface between the input shift register and the internal bus (see Figure 952).

      When receiving with the parity enabled, the value read in the MSB bit is the received parity bit.
  side_effects: null
- id: LPUART_TDR
  address_offset: 40
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: TDR
    bit_range:
    - 8
    - 0
    description: |-
      Transmit data value

      Contains the data character to be transmitted.

      The TDR register provides the parallel interface between the internal bus and the output shift register (see Figure 952).

      When transmitting with the parity enabled (PCE bit set to 1 in the LPUART_CR1 register), the value written in the MSB (bit 7 or bit 8 depending on the data length) has no effect because it is replaced by the parity.

      Note: This register must be written only when TXE/TXFNF=1.
  side_effects: null
- id: LPUART_PRESC
  address_offset: 44
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: PRESCALER
    bit_range:
    - 3
    - 0
    description: |-
      Clock prescaler

      The LPUART input clock can be divided by a prescaler:

      Remaining combinations: Reserved.

      Note: When PRESCALER is programmed with a value different of the allowed ones, programmed prescaler value is equal to 1011 i.e. input clock divided by 256.
  side_effects: null
- id: LPUART_AUTOCR
  address_offset: 48
  size: 32
  access: READ_WRITE
  reset_value: 2147483648
  fields:
  - name: TDN
    bit_range:
    - 15
    - 0
    description: |-
      TDC transmission data number

      This bitfield enables the programming of the number of data to be transmitted. It can be written only when UE is cleared in LPUART_CR1.
  - name: TRIGPOL
    bit_range:
    - 16
    - 16
    description: |-
      Trigger polarity bit

      This bitfield can be written only when the UE bit is cleared in LPUART_CR1 register.
  - name: TRIGEN
    bit_range:
    - 17
    - 17
    description: "Trigger enable bit \n\nNote: This bitfield can be written only when the UE bit of USART_CR1 register is cleared. \n\nNote: When a trigger is detected, TE is set to 1 in LPUART_CR1 and the data transfer is launched."
  - name: IDLEDIS
    bit_range:
    - 18
    - 18
    description: |-
      Idle frame transmission disable bit after enabling the transmitter

      Note: This bitfield can be written only when the UE bit of USART_CR1 register is cleared.
  - name: TRIGSEL
    bit_range:
    - 22
    - 19
    description: "Trigger selection bits \n\nRefer to Section : Description LPUART interconnections.\n\nThis bitfield can be written only when the UE bit is cleared in LPUART_CR1 register.\n\n...\n\nNote: This bitfield can be written only when the UE bit of USART_CR1 register is cleared."
  side_effects: null
