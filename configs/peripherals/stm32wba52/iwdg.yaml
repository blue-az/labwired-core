peripheral: IWDG
version: 0.1.0
registers:
- id: IWDG_KR
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: KEY
    bit_range:
    - 15
    - 0
    description: |-
      Key value (write only, read 0x0000)
      These bits must be written by software at regular intervals with the key value 0xAAAA, otherwise the watchdog generates a reset when the counter reaches 0.
      Writing the key value 0x5555 to enable access to the IWDG_PR, IWDG_RLR and IWDG_WINR registers (see Section 29.4.6: Register access protection)
      Writing the key value 0xCCCC starts the watchdog (except if the hardware watchdog option is selected)
  side_effects: null
- id: IWDG_PR
  address_offset: 4
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: PR
    bit_range:
    - 3
    - 0
    description: "Prescaler divider \nThese bits are write access protected see Section 29.4.6: Register access protection. They are written by software to select the prescaler divider feeding the counter clock. PVU bit of the IWDG status register (IWDG_SR) must be reset in order to be able to change the prescaler divider.\nOthers: divider / 1024\nNote: Reading this register returns the prescaler value from the VsubDD/sub voltage domain. This value may not be up to date/valid if a write operation to this register is ongoing. For this reason the value read from this register is valid only when the PVU bit in the IWDG status register (IWDG_SR) is reset."
  side_effects: null
- id: IWDG_RLR
  address_offset: 8
  size: 32
  access: READ_WRITE
  reset_value: 4095
  fields:
  - name: RL
    bit_range:
    - 11
    - 0
    description: "Watchdog counter reload value \nThese bits are write access protected see Register access protection. They are written by software to define the value to be loaded in the watchdog counter each time the value 0xAAAA is written in the IWDG key register (IWDG_KR). The watchdog counter counts down from this value. The timeout period is a function of this value and the prescaler.clock. It is not recommended to set RL[11:0] to a value lower than 2.\nThe RVU bit in the IWDG status register (IWDG_SR) must be reset to be able to change the reload value.\nNote: Reading this register returns the reload value from the VsubDD/sub voltage domain. This value may not be up to date/valid if a write operation to this register is ongoing on it. For this reason the value read from this register is valid only when the RVU bit in the IWDG status register (IWDG_SR) is reset."
  side_effects: null
- id: IWDG_SR
  address_offset: 12
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: PVU
    bit_range:
    - 0
    - 0
    description: |-
      Watchdog prescaler value update
      This bit is set by hardware to indicate that an update of the prescaler value is ongoing. It is reset by hardware when the prescaler update operation is completed in the VsubDD/sub voltage domain (takes up to three periods of the IWDG kernel clock iwdg_ker_ck).
      The prescaler value can be updated only when PVU bit is reset.
  - name: RVU
    bit_range:
    - 1
    - 1
    description: |-
      Watchdog counter reload value update
      This bit is set by hardware to indicate that an update of the reload value is ongoing. It is reset by hardware when the reload value update operation is completed in the VsubDD/sub voltage domain (takes up to three periods of the IWDG kernel clock iwdg_ker_ck).
      The reload value can be updated only when RVU bit is reset.
  - name: WVU
    bit_range:
    - 2
    - 2
    description: |-
      Watchdog counter window value update
      This bit is set by hardware to indicate that an update of the window value is ongoing. It is reset by hardware when the reload value update operation is completed in the VsubDD/sub voltage domain (takes up to three periods of the IWDG kernel clock iwdg_ker_ck).
      The window value can be updated only when WVU bit is reset.
      This bit is generated only if generic 'window' = 1
  - name: EWU
    bit_range:
    - 3
    - 3
    description: "Watchdog interrupt comparator value update \nThis bit is set by hardware to indicate that an update of the interrupt comparator value (EWIT[11:0]) or an update of the EWIE is ongoing. It is reset by hardware when the update operation is completed in the VsubDD/sub voltage domain (takes up to three periods of the IWDG kernel clock iwdg_ker_ck).\nThe EWIT[11:0] and EWIE fields can be updated only when EWU bit is reset."
  - name: ONF
    bit_range:
    - 8
    - 8
    description: |-
      Watchdog enable status bit
      Set to '1' by hardware as soon as the IWDG is started, remains to '1' until the IWDG is reset.
  - name: EWIF
    bit_range:
    - 14
    - 14
    description: |-
      Watchdog early interrupt flag
      This bit is set to '1' by hardware in order to indicate that an early interrupt is pending. This bit must be cleared by the software by writing the bit EWIC of IWDG_EWCR register to '1'.
  side_effects: null
- id: IWDG_WINR
  address_offset: 16
  size: 32
  access: READ_WRITE
  reset_value: 4095
  fields:
  - name: WIN
    bit_range:
    - 11
    - 0
    description: "Watchdog counter window value \nThese bits are write access protected, see Section 29.4.6, they contain the high limit of the window value to be compared with the downcounter.\nTo prevent a reset, the IWDCNT downcounter must be reloaded when its value is lower than WIN[11:0]+1 and greater than 1.\nThe WVU bit in the IWDG status register (IWDG_SR) must be reset to be able to change the reload value.\nNote: Reading this register returns the reload value from the VsubDD/sub voltage domain. This value may not be valid if a write operation to this register is ongoing. For this reason the value read from this register is valid only when the WVU bit in the IWDG status register (IWDG_SR) is reset."
  side_effects: null
- id: IWDG_EWCR
  address_offset: 20
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: EWIT
    bit_range:
    - 11
    - 0
    description: "Watchdog counter window value \nThese bits are write access protected (see Section 29.4.6). They are written by software to define at which position of the IWDCNT down-counter the early wakeup interrupt must be generated. The early interrupt is generated when the IWDCNT is lower or equal to EWIT[11:0] - 1.\nEWIT[11:0] must be bigger than 1.\nAn interrupt is generated only if EWIE = 1.\nThe EWU bit in the IWDG status register (IWDG_SR) must be reset to be able to change the reload value.\nNote: Reading this register returns the Early wakeup comparator value and the Interrupt enable bit from the VsubDD/sub voltage domain. This value may not be up to date/valid if a write operation to this register is ongoing, hence the value read from this register is valid only when the EWU bit in the IWDG status register (IWDG_SR) is reset."
  - name: EWIC
    bit_range:
    - 14
    - 14
    description: "Watchdog early interrupt acknowledge \nThe software must write a 1 into this bit in order to acknowledge the early wakeup interrupt and to clear the EWIF flag. Writing 0 has not effect, reading this flag returns a 0."
  - name: EWIE
    bit_range:
    - 15
    - 15
    description: |-
      Watchdog early interrupt enable
      Set and reset by software.
      The EWU bit in the IWDG status register (IWDG_SR) must be reset to be able to change the value of this bit.
  side_effects: null
interrupts: null
timing: null
