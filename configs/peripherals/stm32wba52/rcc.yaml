    - 16
    description: |-
      2.4 GHz RADIO bus clock enable and HSE32 oscillator enable by 2.4 GHz RADIO sleep timer wakeup event
      Set by hardware on a 2.4 GHz RADIO sleep timer wakeup event.
      Cleared by software writing zero to this bit.
      Note: Before accessing the 2.4 GHz RADIO registers the RADIOCLKRDY bit must be checked.
  - name: RADIOCLKRDY
    bit_range:
