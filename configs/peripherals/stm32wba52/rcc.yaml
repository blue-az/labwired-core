peripheral: RCC
version: 0.1.0
registers:
- id: RCC_CR
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 1280
  fields:
  - name: HSION
    bit_range:
    - 8
    - 8
    description: "HSI16 clock enable\nSet and cleared by software.\nCleared by hardware when entering Stop and Standby modes. \nSet by hardware to force the HSI16 oscillator on when exiting Stop and Standby modes.\nSet by hardware to force the HSI16 oscillator on in case of clock security failure of the HSE32 crystal oscillator.\nThis bit is set by hardware if the HSI16 is used directly or indirectly as system clock.\nAccess to the bit can be secured by RCC HSISEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV."
  - name: HSIKERON
    bit_range:
    - 9
    - 9
    description: "HSI16 enable for some peripheral kernels\nSet and cleared by software to force HSI16 oscillator on even in Stop modes. \nKeeping the HSI16 oscillator on in Stop modes allows the communication speed not to be reduced by the HSI16 oscillator startup time. This bit has no effect on register bit HSION value.\nCleared by hardware when entering Standby modes. \nRefer to Peripherals clock gating and autonomous mode for more details.\nAccess to the bit can be secured by RCC HSISEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV."
  - name: HSIRDY
    bit_range:
    - 10
    - 10
    description: |-
      HSI16 clock ready flag
      Set by hardware to indicate that HSI16 oscillator is stable. This bit is set only when HSI16 is enabled by software by setting HSION.
      Access to the bit can be secured by RCC HSISEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
      Note: Once the HSION bit is cleared, HSIRDY goes low after six HSI16 clock cycles.
  - name: HSEON
    bit_range:
    - 16
    - 16
    description: |-
      HSE32 clock enable
      Set and cleared by software.
      Cleared by hardware to stop the HSE32 clock for the CPU when entering Stop and Standby modes and on a HSECSS failure.
      When the HSE32 is used as 2.4 GHz RADIO kernel clock, enabled by RADIOEN and RADIOSMEN and the 2.4 GHz RADIO is active, HSEON is not be cleared when entering low power mode. In this case only Stop 0 mode is entered as low power mode.
      This bit cannot be reset if the HSE32 oscillator is used directly or indirectly as the system clock.
      Access to the bit can be secured by RCC HSESEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: HSERDY
    bit_range:
    - 17
    - 17
    description: |-
      HSE32 clock ready flag
      Set by hardware to indicate that the HSE32 oscillator is stable. This bit is set both when HSE32 is enabled by software by setting HSEON and when requested as kernel clock by the 2.4 GHz RADIO.
      Access to the bit can be secured by RCC HSESEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: HSECSSON
    bit_range:
    - 19
    - 19
    description: |-
      HSE32 clock security system enable
      Set by software to enable the HSE32 clock security system. When HSECSSON is set, the clock detector is enabled by hardware when the HSE32 oscillator is ready and disabled by hardware if a HSE32 clock failure is detected. This bit is set only and is cleared by reset.
      Access to the bit can be secured by RCC HSESEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: HSEPRE
    bit_range:
    - 20
    - 20
    description: |-
      HSE32 clock for SYSCLK prescaler
      Set and cleared by software to control the division factor of the HSE32 clock for SYSCLK.
      Access to the bit can be secured by RCC HSESEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: PLL1ON
    bit_range:
    - 24
    - 24
    description: |-
      PLL1 enable
      Set and cleared by software to enable the main PLL.
      Cleared by hardware when entering Stop or Standby modes and when PLL1 on HSE32 is selected as sysclk, on a HSECSS failure.
      This bit cannot be reset if the PLL1 clock is used as the system clock.
      Access to the bit can be secured by RCC PLL1SEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: PLL1RDY
    bit_range:
    - 25
    - 25
    description: |-
      PLL1 clock ready flag
      Set by hardware to indicate that the PLL1 is locked.
      Access to the bit can be secured by RCC PLL1SEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  side_effects: null
- id: RCC_ICSCR3
  address_offset: 16
  size: 32
  access: READ_WRITE
  reset_value: 1048576
  fields:
  - name: HSICAL
    bit_range:
    - 11
    - 0
    description: |-
      HSI16 clock calibration
      These bits are initialized at startup with the factory-programmed HSI16 calibration value. When HSITRIM[4:0] is written, HSICAL[11:0] is updated with the sum of HSITRIM[4:0] and the initial factory trim value.
  - name: HSITRIM
    bit_range:
    - 20
    - 16
    description: "HSI16 clock trimming \nThese bits provide an additional user-programmable trimming value that is added to the HSICAL[11:0] bits. It can be programmed to adjust to voltage and temperature variations that influence the frequency of the HSI16."
  side_effects: null
- id: RCC_CFGR1
  address_offset: 28
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SW
    bit_range:
    - 1
    - 0
    description: |-
      system clock switch
      Set and cleared by software to select system clock source (SYSCLK).
      Cleared by hardware when entering Stop and Standby modes
      When selecting HSE32 directly or indirectly as system clock and HSE32 oscillator clock security fails, cleared by hardware.
  - name: SWS
    bit_range:
    - 3
    - 2
    description: |-
      system clock switch status
      Set and cleared by hardware to indicate which clock source is used as system clock.
  - name: MCOSEL
    bit_range:
    - 27
    - 24
    description: |-
      microcontroller clock output
      Set and cleared by software.
      others: reserved
      Note: This clock output may have some truncated cycles at startup or during MCO clock source switching.
  - name: MCOPRE
    bit_range:
    - 30
    - 28
    description: |-
      microcontroller clock output prescaler
      Set and cleared by software.
      It is highly recommended to change this prescaler before MCO output is enabled.
      others: not allowed
  side_effects: null
- id: RCC_CFGR2
  address_offset: 32
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: HPRE
    bit_range:
    - 2
    - 0
    description: |-
      AHB1, AHB2 and AHB4 prescaler
      Set and cleared by software to control the division factor of the AHB1, AHB2 and AHB4 clock (hclk1).
      The software must limit the incremental frequency step by setting these bits correctly to ensure that the hclk1 maximum incremental frequency step does not exceed the maximum allowed incremental frequency step (for more details, refer to Table99: SYSCLK and bus maximum frequency). After a write operation to these bits and before decreasing the voltage range, this register must be read to be sure that the new value is taken into account.
      0xx: hclk1 = SYSCLK not divided
  - name: PPRE1
    bit_range:
    - 6
    - 4
    description: |-
      APB1 prescaler
      Set and cleared by software to control the division factor of the APB1 clock (pclk1).
      0xx: pclk1 = hclk1 not divided
  - name: PPRE2
    bit_range:
    - 10
    - 8
    description: |-
      APB2 prescaler
      Set and cleared by software to control the division factor of the APB2 clock (pclk2).
      0xx: pclk2 = hclk1 not divided
  side_effects: null
- id: RCC_CFGR3
  address_offset: 36
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: PPRE7
    bit_range:
    - 6
    - 4
    description: |-
      APB7 prescaler
      Set and cleared by software to control the division factor of the APB7 clock (pclk7).
      0xx: hclk1 not divided
  side_effects: null
- id: RCC_PLL1CFGR
  address_offset: 40
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: PLL1SRC
    bit_range:
    - 1
    - 0
    description: "PLL1 entry clock source\nSet and cleared by software to select PLL1 clock source. These bits can be written only when the PLL1 is disabled.\nCleared by hardware when entering Stop or Standby modes. \nNote: In order to save power, when no PLL1 clock is used, the value of PLL1SRC must be 0."
  - name: PLL1RGE
    bit_range:
    - 3
    - 2
    description: |-
      PLL1 input frequency range
      Set and reset by software to select the proper reference frequency range used for PLL1.
      This bit must be written before enabling the PLL1.
      00-01-10: PLL1 input (ref1_ck) clock range frequency between 4 and 8 MHz
  - name: PLL1FRACEN
    bit_range:
    - 4
    - 4
    description: |-
      PLL1 fractional latch enable
      Set and reset by software to latch the content of PLL1FRACN into the  modulator.
      In order to latch the PLL1FRACN value into the  modulator, PLL1FRACEN must be set to 0, then set to 1: the transition 0 to 1 transfers the content of PLL1FRACN into the modulator (see PLL1 initialization phase for details).
  - name: PLL1M
    bit_range:
    - 10
    - 8
    description: "Prescaler for PLL1\nSet and cleared by software to configure the prescaler of the PLL1. The VCO1 input frequency is PLL1 input clock frequency/PLL1M.\nThis bit can be written only when the PLL1 is disabled (PLL1ON = 0 and PLL1RDY = 0). \n..."
  - name: PLL1PEN
    bit_range:
    - 16
    - 16
    description: "PLL1 DIVP divider output enable\nSet and reset by software to enable the pll1pclk output of the PLL1.\nTo save power, PLL1PEN and PLL1P bits must be set to 0 when the pll1pclk is not used. \nThis bit can be written only when the PLL1 is disabled (PLL1ON = 0 and PLL1RDY = 0)."
  - name: PLL1QEN
    bit_range:
    - 17
    - 17
    description: "PLL1 DIVQ divider output enable\nSet and reset by software to enable the pll1qclk output of the PLL1.\nTo save power, PLL1QEN and PLL1Q bits must be set to 0 when the pll1qclk is not used. \nThis bit can be written only when the PLL1 is disabled (PLL1ON = 0 and PLL1RDY = 0)."
  - name: PLL1REN
    bit_range:
    - 18
    - 18
    description: |-
      PLL1 DIVR divider output enable
      Set and cleared by software to enable the pll1rclk output of the PLL1.
      To save power, PLL1REN and PLL1R bits must be set to 0 when the pll1rclk is not used.
      This bit can be written only when the PLL1 is disabled (PLL1ON = 0 and PLL1RDY = 0).
  - name: PLL1RCLKPRE
    bit_range:
    - 20
    - 20
    description: |-
      pll1rclk clock for SYSCLK prescaler division enable
      Set and cleared by software to control the division of the pll1rclk clock for SYSCLK.
  - name: PLL1RCLKPRESTEP
    bit_range:
    - 21
    - 21
    description: |-
      pll1rclk clock for SYSCLK prescaler division step selection
      Set and cleared by software to control the division step of the pll1rclk clock for SYSCLK.
  - name: PLL1RCLKPRERDY
    bit_range:
    - 22
    - 22
    description: |-
      pll1rclkpre not divided ready.
      Set by hardware after PLL1RCLKPRE has been set from divided to not divide, to indicate that the pll1rclk not divided is available on sysclkpre.
  side_effects: null
- id: RCC_PLL1DIVR
  address_offset: 52
  size: 32
  access: READ_WRITE
  reset_value: 16843392
  fields:
  - name: PLL1N
    bit_range:
    - 8
    - 0
    description: "Multiplication factor for PLL1 VCO\nSet and reset by software to control the multiplication factor of the VCO.\nThese bits can be written only when the PLL1 is disabled (PLL1ON = 0 and PLL1RDY = 0).\n...\n...\nothers: reserved\nVCO output frequency = Fsubref1_ck/sub x multiplication factor for PLL1 VCO, when fractional value 0 has been loaded into PLL1FRACN, with: \nMultiplication factor for PLL1 VCO between 4 and 512\ninput frequency Fsubref1_ck/sub between 4 and 16MHz"
  - name: PLL1P
    bit_range:
    - 15
    - 9
    description: |-
      PLL1 DIVP division factor
      Set and reset by software to control the frequency of the pll1pclk clock.
      These bits can be written only when the PLL1 is disabled (PLL1ON = 0 and PLL1RDY = 0).
      Note that odd division factors are not allowed.
      ...
  - name: PLL1Q
    bit_range:
    - 22
    - 16
    description: |-
      PLL1 DIVQ division factor
      Set and reset by software to control the frequency of the PLl1QCLK clock.
      These bits can be written only when the PLL1 is disabled (PLL1ON = 0 and PLL1RDY = 0).
      ...
  - name: PLL1R
    bit_range:
    - 30
    - 24
    description: |-
      PLL1 DIVR division factor
      Set and reset by software to control the frequency of the pll1rclk clock.
      These bits can be written only when the PLL1 is disabled (PLL1ON = 0 and PLL1RDY = 0).
      ...
  side_effects: null
- id: RCC_PLL1FRACR
  address_offset: 56
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: PLL1FRACN
    bit_range:
    - 15
    - 3
    description: "Fractional part of the multiplication factor for PLL1 VCO\nSet and reset by software to control the fractional part of the multiplication factor of the VCO.\nThese bits can be written at any time, allowing dynamic fine-tuning of the PLL1 VCO.\nVCO output frequency = Fsubref1_ck/sub x [multiplication factor for PLL1 VCO + (PLL1FRACN / 2sup13/sup)], with: \nMultiplication factor for PLL1 VCO must be between 4 and 512.\nPLL1FRACN can be between 0 and 2sup13/sup- 1.\nThe input frequency Fsubref1_ck/sub must be between 4 and 16 MHz. \nTo change the used fractional value on-the-fly even if the PLL1 is enabled, the application must proceed as follows:\nSet the bit PLL1FRACEN to 0. \nWrite the new fractional value into PLL1FRACN. \nSet the bit PLL1FRACEN to 1."
  side_effects: null
- id: RCC_CIER
  address_offset: 80
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LSI1RDYIE
    bit_range:
    - 0
    - 0
    description: |-
      LSI1 ready interrupt enable
      Set and cleared by software to enable/disable interrupt caused by the LSI1 oscillator stabilization.
      Access to the bit can be secured by RCC LSISEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: LSERDYIE
    bit_range:
    - 1
    - 1
    description: |-
      LSE ready interrupt enable
      Set and cleared by software to enable/disable interrupt caused by the LSE oscillator stabilization.
      Access to the bit can be secured by RCC LSESEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: HSIRDYIE
    bit_range:
    - 3
    - 3
    description: |-
      HSI16 ready interrupt enable
      Set and cleared by software to enable/disable interrupt caused by the HSI16 oscillator stabilization.
      Access to the bit can be secured by RCC HSISEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: HSERDYIE
    bit_range:
    - 4
    - 4
    description: |-
      HSE32 ready interrupt enable
      Set and cleared by software to enable/disable interrupt caused by the HSE32 oscillator stabilization.
      Access to the bit can be secured by RCC HSESEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: PLL1RDYIE
    bit_range:
    - 6
    - 6
    description: |-
      PLL1 ready interrupt enable
      Set and cleared by software to enable/disable interrupt caused by PLL1 lock.
      Access to the bit can be secured by RCC PLL1SEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  side_effects: null
- id: RCC_CIFR
  address_offset: 84
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LSI1RDYF
    bit_range:
    - 0
    - 0
    description: |-
      LSI1 ready interrupt flag
      Set by hardware when the LSI1 clock becomes stable and LSI1RDYIE is set.
      Cleared by software setting the LSI1RDYC bit.
      Access to the bit can be secured by RCC LSISEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: LSERDYF
    bit_range:
    - 1
    - 1
    description: |-
      LSE ready interrupt flag
      Set by hardware when the LSE clock becomes stable and LSERDYIE is set.
      Cleared by software setting the LSERDYC bit.
      Access to the bit can be secured by RCC LSESEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: HSIRDYF
    bit_range:
    - 3
    - 3
    description: |-
      HSI16 ready interrupt flag
      Set by hardware when the HSI16 clock becomes stable and HSIRDYIE is set in a response to setting the HSION (see RCC_CR). When HSION is not set but the HSI16 oscillator is enabled by the peripheral through a clock request, this bit is not set and no interrupt is generated.
      Access to the bit can be secured by RCC HSISEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
      Cleared by software setting the HSIRDYC bit.
  - name: HSERDYF
    bit_range:
    - 4
    - 4
    description: |-
      HSE32 ready interrupt flag
      Set by hardware when the HSE32 clock becomes stable and HSERDYIE is set.
      Cleared by software setting the HSERDYC bit.
      Access to the bit can be secured by RCC HSESEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: PLL1RDYF
    bit_range:
    - 6
    - 6
    description: |-
      PLL1 ready interrupt flag
      Set by hardware when the PLL1 locks and PLL1RDYIE is set.
      Cleared by software setting the PLL1RDYC bit.
      Access to the bit can be secured by RCC PLL1SEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: HSECSSF
    bit_range:
    - 10
    - 10
    description: |-
      HSE32 clock security system interrupt flag
      Set by hardware when a clock security failure is detected in the HSE32 oscillator.
      Cleared by software setting the HSECSSC bit.
      Access to the bit can be secured by RCC HSESEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  side_effects: null
- id: RCC_CICR
  address_offset: 88
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LSI1RDYC
    bit_range:
    - 0
    - 0
    description: |-
      LSI1 ready interrupt clear
      Writing this bit to 1 clears the LSI1RDYF flag. Writing 0 has no effect.
      Access to the bit can be secured by RCC LSISEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: LSERDYC
    bit_range:
    - 1
    - 1
    description: |-
      LSE ready interrupt clear
      Writing this bit to 1 clears the LSERDYF flag. Writing 0 has no effect.
      Access to the bit can be secured by RCC LSESEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: HSIRDYC
    bit_range:
    - 3
    - 3
    description: |-
      HSI16 ready interrupt clear
      Writing this bit to 1 clears the HSIRDYF flag. Writing 0 has no effect.
      Access to the bit can be secured by RCC HSISEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: HSERDYC
    bit_range:
    - 4
    - 4
    description: |-
      HSE32 ready interrupt clear
      Writing this bit to 1 clears the HSERDYF flag. Writing 0 has no effect.
      Access to the bit can be secured by RCC HSESEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: PLL1RDYC
    bit_range:
    - 6
    - 6
    description: |-
      PLL1 ready interrupt clear
      Writing this bit to 1 clears the PLL1RDYF flag. Writing 0 has no effect.
      Access to the bit can be secured by RCC PLL1SEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: HSECSSC
    bit_range:
    - 10
    - 10
    description: |-
      High speed external clock security system interrupt clear
      Writing this bit to 1 clears the HSECSSF flag. Writing 0 has no effect.
      Access to the bit can be secured by RCC HSESEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  side_effects: null
- id: RCC_AHB1RSTR
  address_offset: 96
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: GPDMA1RST
    bit_range:
    - 0
    - 0
    description: |-
      GPDMA1 reset
      Set and cleared by software.
      Access can be secured by GPDMA1 SECx. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: CRCRST
    bit_range:
    - 12
    - 12
    description: |-
      CRC reset
      Set and cleared by software.
      Access can be secured by GTZC_TZSC CRCSEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: TSCRST
    bit_range:
    - 16
    - 16
    description: |-
      TSC reset
      Set and cleared by software.
      Access can be secured by GTZC_TZSC TSCSEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  side_effects: null
- id: RCC_AHB2RSTR
  address_offset: 100
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: GPIOARST
    bit_range:
    - 0
    - 0
    description: |-
      IO port A reset
      Set and cleared by software.
      Access can be secured by GPIOA SECx. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: GPIOBRST
    bit_range:
    - 1
    - 1
    description: |-
      IO port B reset
      Set and cleared by software.
      Access can be secured by GPIOB SECx. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with RCC SPRIV or when non-secure with RCC NSPRIV.
  - name: GPIOCRST
    bit_range:
    - 2
    - 2
    description: |-
      IO port C reset
