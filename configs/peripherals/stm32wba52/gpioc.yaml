  fields:
  - name: LCK13
    bit_range:
    - 13
    - 13
    description: |-
      Port C lock I/O pin y
      These bits are read/write but can only be written when the LCKK bit is 0
      Access can be protected by GPIOC SECy.
  - name: LCK14
    bit_range:
    - 14
    - 14
    description: |-
      Port C lock I/O pin y
      These bits are read/write but can only be written when the LCKK bit is 0
      Access can be protected by GPIOC SECy.
  - name: LCK15
    bit_range:
    - 15
    - 15
    description: |-
      Port C lock I/O pin y
      These bits are read/write but can only be written when the LCKK bit is 0
      Access can be protected by GPIOC SECy.
  - name: LCKK
    bit_range:
    - 16
    - 16
    description: |-
      Lock key
      This bit can be read any time. It can only be modified using the lock key write sequence.
      Access is protected by any GPIOC SECy.
      - LOCK key write sequence:
      WR LCKR[16] = 1 + LCKR[15:13]
      WR LCKR[16] = 0 + LCKR[15:13]
      WR LCKR[16] = 1 + LCKR[15:13]
      - LOCK key read
      RD LCKR[16] = 1 (this read operation is optional but it confirms that the lock is active)
      Note: During the LOCK key write sequence, the value of LCK[15:13] must not change.
      Note: Any error in the lock sequence aborts the LOCK.
      Note: After the first LOCK sequence on any bit of the port, any read access on the LCKK bit returns 1 until the next MCU reset or peripheral reset.
  side_effects: null
