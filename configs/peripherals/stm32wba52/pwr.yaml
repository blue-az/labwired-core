  reset_value: 0
  fields:
  - name: SPRIV
    bit_range:
    - 0
    - 0
    description: |-
      PWR secure functions privilege configuration
      This bit is set and reset by software.
      It can be written only by a secure privileged access.
  - name: NSPRIV
    bit_range:
    - 1
    - 1
    description: |-
      PWR non-secure functions privilege configuration
      This bit is set and reset by software.
      It can be written only by privileged access, secure or non-secure.
  side_effects: null
- id: PWR_SR
  address_offset: 56
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: CSSF
    bit_range:
    - 0
    - 0
    description: |-
      Clear Stop and Standby flags
      Access can be secured by PWR LPMSEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with PWR SPRIV or when non-secure with PWR NSPRIV.
      Writing 1 to this bit clears the STOPF and SBF flags.
  - name: STOPF
    bit_range:
    - 1
    - 1
    description: |-
      Stop flag
      This bit is set by hardware when the device enters a Stop or Standby mode at the same time as the sysclk has been set by hardware to select HSI16. It's cleared by software by writing 1 to the CSSF bit and by hardware when SBF is set.
  - name: SBF
    bit_range:
    - 2
    - 2
    description: |-
      Standby flag
      This bit is set by hardware when the device enters the Standby mode and the CPU restart from its reset vector. It's cleared by writing 1 to the CSSF bit, or by a power-on reset. It is not cleared by the system reset.
  side_effects: null
