  reset_value: 32768
  fields:
  - name: VOSRDY
    bit_range:
    - 15
    - 15
    description: |-
      Ready bit for VsubCORE/sub voltage scaling output selection
      Set and cleared by hardware. When decreasing the voltage scaling range, VOSRDY must be one before increasing the SYSCLK frequency.
  - name: VOS
    bit_range:
    - 16
    - 16
    description: |-
      Voltage scaling range selection
      Set a and cleared by software.
      Cleared by hardware when entering Stop 1 mode.
      Access can be secured by RCC SYSCLKSEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with PWR SPRIV or when non-secure with PWR NSPRIV.
  side_effects: null
