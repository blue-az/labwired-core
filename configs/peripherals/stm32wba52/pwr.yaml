registers:
- id: PWR_CR1
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: LPMS
    bit_range:
    - 2
    - 0
    description: |-
      Low-power mode selection
      These bits select the low-power mode entered when the CPU enters the SleepDeep mode.
      10x: Standby mode
      others reserved
  - name: R2RSB1
    bit_range:
    - 5
    - 5
    description: |-
      SRAM2 retention in Standby mode
      This bit is used to keep the SRAM2 content in Standby retention mode.
  - name: ULPMEN
    bit_range:
    - 7
    - 7
    description: "BOR0 ultra-low-power mode. \nThis bit is used to reduce the consumption by configuring the BOR0 in discontinuous mode for Stop 1 and Standby modes. Discontinuous mode is only available when BOR levels 1 to 4 and PVD are disabled.\nNote: This bit must be set to reach the lowest power consumption in the low-power modes.\nNote: This bit must not be set together with autonomous peripherals using HSI16 as kernel clock.\nNote: When BOR level 1 to 4 or PVD is enabled continuous mode applies independent from ULPMEN."
  - name: RADIORSB
    bit_range:
    - 9
    - 9
    description: |-
      2.4 GHz RADIO SRAMs (RXTXRAM and Sequence RAM) and Sleep clock retention in Standby mode.
      This bit is used to keep the 2.4 GHz RADIO SRAMs content in Standby retention mode and the 2.4 GHz RADIO sleep timer counter operational.
  - name: R1RSB1
    bit_range:
    - 12
    - 12
    description: |-
      SRAM1 retention in Standby mode
      This bit is used to keep the SRAM1 content in Standby retention mode.
  side_effects: null
- id: PWR_CR2
  address_offset: 4
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SRAM1PDS1
    bit_range:
    - 0
    - 0
    description: |-
      SRAM1 power-down in Stop modes (Stop 0, 1)
      Note: The SRAM1 retention in Standby mode is controlled by R1RSB1 bit in PWR_CR1.
  - name: SRAM2PDS1
    bit_range:
    - 4
    - 4
    description: |-
      SRAM2 power-down in Stop modes (Stop 0, 1)
      Note: The SRAM2 retention in Standby mode is controlled by R2RSB1 bit in PWR_CR1.
  - name: ICRAMPDS
    bit_range:
    - 8
    - 8
    description: ICACHE SRAM power-down in Stop modes (Stop 0, 1)
  - name: FLASHFWU
    bit_range:
    - 14
    - 14
    description: |-
      Flash memory fast wakeup from Stop modes (Stop 0, 1)
      This bit is used to obtain the best trade-off between low-power consumption and wakeup time when exiting the Stop 0 or Stop 1 modes.
      When this bit is set, the Flash memory remains in normal mode in Stop 0 and Stop 1 modes, which offers a faster startup time with higher consumption.
  side_effects: null
