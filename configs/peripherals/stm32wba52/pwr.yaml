    bit_range:
    - 0
    - 0
    description: |-
      Wakeup and interrupt pending flag 1
      This bit is set when a wakeup event is detected on WKUP1 pin. This bit is cleared by writing 1 in the CWUF1 bit of PWR_WUSCR or by hardware when WUPEN1 = 0.
  - name: WUF2
    bit_range:
    - 1
    - 1
    description: |-
      Wakeup and interrupt pending flag 2
      This bit is set when a wakeup event is detected on WKUP2 pin. This bit is cleared by writing 1 in the CWUF2 bit of PWR_WUSCR or by hardware when WUPEN2 = 0.
  - name: WUF3
