  - name: BWR
    bit_range:
    - 14
    - 14
    description: |-
      Secure burst write programming mode
      When set, this bit selects the burst write programming mode.
  - name: STRT
    bit_range:
    - 16
    - 16
    description: "Secure start \nThis bit triggers a secure erase operation when set. If MER and PER bits are reset and the STRT bit is set, the PGSERR in the FLASH_SECSR is set (this condition is forbidden).\nThis bit is set only by software and is cleared when the BSY bit is cleared in FLASH_SECSR."
  - name: EOPIE
    bit_range:
    - 24
    - 24
    description: |-
      Secure End of operation interrupt enable
      This bit enables the interrupt generation when the EOP bit in FLASH_SECSR is set to 1.
  - name: ERRIE
    bit_range:
    - 25
    - 25
    description: |-
      Secure error interrupt enable
      This bit enables the interrupt generation when the OPERR bit in FLASH_SECSR is set to 1.
  - name: INV
    bit_range:
    - 29
    - 29
    description: |-
      Flash memory security state invert
      This bit inverts the Flash memory security state.
  - name: LOCK
    bit_range:
    - 31
    - 31
    description: |-
      Secure lock
      This bit is set only. When set, the FLASH_SECCR1 register is locked. It is cleared by hardware after detecting the unlock sequence in FLASH_SECKEYR register.
      In case of an unsuccessful unlock operation, this bit remains set until the next system reset.
  side_effects: null
- id: FLASH_ECCR
  address_offset: 48
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: ADDR_ECC
    bit_range:
    - 19
    - 0
    description: |-
      ECC fail address
      This field indicates which address is concerned by the ECC error correction or by the double ECC error detection. The address is given relative to Flash base address, from offset 0x00000 to 0xFFFF0.
      Note that bit 19 is reserved on STM32WBAxEx devices.
  - name: SYSF_ECC
    bit_range:
    - 22
    - 22
    description: |-
      System Flash memory ECC fail
      This bit indicates that the ECC error correction or double ECC error detection is located in the system Flash memory.
  - name: ECCIE
    bit_range:
    - 24
    - 24
    description: |-
      ECC correction interrupt enable
      This bit enables the interrupt generation when the ECCC bit in the FLASH_ECCR register is set.
  - name: ECCC
    bit_range:
    - 30
    - 30
    description: |-
      ECC correction
      This bit is set by hardware when one ECC error has been detected and corrected (only if ECCC and ECCD were previously cleared). An interrupt is generated if ECCIE is set. This bit is cleared by writing 1.
  - name: ECCD
    bit_range:
    - 31
    - 31
    description: |-
      ECC detection
      This bit is set by hardware when two ECC errors have been detected (only if ECCC and ECCD were previously cleared). When this bit is set, a NMI is generated. This bit is cleared by writing 1.
  side_effects: null
- id: FLASH_OPSR
  address_offset: 52
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: ADDR_OP
    bit_range:
    - 19
    - 0
    description: |-
      Interrupted operation address
      This field indicates which address in the Flash memory was accessed when reset occurred. The address is given relative to the Flash base address, from offset 0x00000 to 0xFFFF0.
      Note that bit 19 is reserved on STM32WBAxEx devices.
  - name: SYSF_OP
    bit_range:
    - 22
    - 22
    description: |-
      Operation in system Flash memory interrupted
      This bit indicates that the reset occurred during an operation in the system Flash memory.
  - name: CODE_OP
    bit_range:
    - 31
    - 29
    description: |-
      Flash memory operation code
      This field indicates which Flash memory operation has been interrupted by a system reset:
  side_effects: null
