peripheral: FLASH
version: 0.1.0
registers:
- id: FLASH_ACR
  address_offset: 0
  size: 32
  access: READ_WRITE
  reset_value: 1
  fields:
  - name: LATENCY
    bit_range:
    - 3
    - 0
    description: |-
      Latency
      These bits represent the ratio between the AHB hclk1 clock period and the Flash memory access time.
      Access to the bit can be secured by RCC SYSCLKSEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with FLASH SPRIV or when non-secure with FLASH NSPRIV.
      ...
      Note: Before entering Stop 1 mode software must set FLASH wait state latency to at least 1.
  - name: PRFTEN
    bit_range:
    - 8
    - 8
    description: |-
      Prefetch enable
      This bit enables the prefetch buffer in the embedded Flash memory.
      This bit can be protected against unprivileged access by FLASH NSPRIV.
  - name: LPM
    bit_range:
    - 11
    - 11
    description: |-
      Low-power read mode
      This bit puts the Flash memory in low-power read mode.
      Access to the bit can be secured by PWR LPMSEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with FLASH SPRIV or when non-secure with FLASH NSPRIV.
      This bit can't be written when a Flash program or erase operation is busy (BSY = 1) or when the write buffer is not empty (WDW = 1). Changing this bit while a Flash program or erase operation is busy (BSY = 1) is rejected.
  - name: PDREQ
    bit_range:
    - 12
    - 12
    description: "Flash power-down mode request\nThis bit requests Flash to enter power-down mode. When Flash enters power-down mode, this bit is cleared by hardware and the PDKEYR is locked.\nThis bit is write-protected with FLASH_PDKEYR. \nAccess to the bit can be secured by PWR LPMSEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with FLASH SPRIV or when non-secure with FLASH NSPRIV."
  - name: SLEEP_PD
    bit_range:
    - 14
    - 14
    description: |-
      Flash memory power-down mode during Sleep mode
      This bit determines whether the Flash memory is in power-down mode or Idle mode when the device is in Sleep mode.
      Access to the bit can be secured by PWR LPMSEC. When secure, a non-secure read/write access is RAZ/WI. It does not generate an illegal access interrupt. This bit can be protected against unprivileged access when secure with FLASH SPRIV or when non-secure with FLASH NSPRIV.
      The Flash must not be put in power-down while a program or an erase operation is ongoing.
  side_effects: null
- id: FLASH_NSKEYR
  address_offset: 8
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: NSKEY
    bit_range:
    - 31
    - 0
    description: |-
      Flash memory non-secure key
      The following values must be written consecutively to unlock the FLASH_NSCR1 register, allowing the Flash memory non-secure programming/erasing operations:
      KEY1: 0x45670123
      KEY2: 0xCDEF89AB
  side_effects: null
- id: FLASH_SECKEYR
  address_offset: 12
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: SECKEY
    bit_range:
    - 31
    - 0
    description: |-
      Flash memory secure key
      The following values must be written consecutively to unlock the FLASH_SECCR1 register, allowing the Flash memory secure programming/erasing operations:
      KEY1: 0x45670123
      KEY2: 0xCDEF89AB
  side_effects: null
- id: FLASH_OPTKEYR
  address_offset: 16
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: OPTKEY
    bit_range:
    - 31
    - 0
    description: |-
      Option byte key
      The LOCK bit in the FLASH_NSCR1 must be cleared before doing the unlock sequence for OPTLOCK bit. The following values must be written consecutively to unlock the FLASH_NSCR1.OPTSTRT and OBL_LAUNCH register bits concerning user option operations:
      KEY1: 0x08192A3B
      KEY2: 0x4C5D6E7F
  side_effects: null
- id: FLASH_PDKEYR
  address_offset: 24
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: PDKEY1
    bit_range:
    - 31
    - 0
    description: |-
      Flash power-down key
      The following values must be written consecutively to unlock the PDREQ bit in FLASH_ACR:
      PDKEY_1: 0x04152637
      PDKEY_2: 0xFAFBFCFD
  side_effects: null
- id: FLASH_NSSR
  address_offset: 32
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: EOP
    bit_range:
    - 0
    - 0
    description: |-
      Non-secure end of operation
      This bit is set by hardware when one or more Flash memory non-secure operation (program/erase) has been completed successfully. This bit is set only if the non-secure end of operation interrupts are enabled (EOPIE = 1 in FLASH_NSCR1). This bit is cleared by writing1.
  - name: OPERR
    bit_range:
    - 1
    - 1
    description: |-
      Non-secure operation error
      This bit is set by hardware when a Flash memory non-secure operation (program/erase) completes unsuccessfully. This bit is set only if non-secure error interrupts are enabled (NSERRIE = 1). This bit is cleared by writing 1.
  - name: PROGERR
    bit_range:
    - 3
    - 3
    description: |-
      Non-secure programming error
      This bit is set by hardware when a non-secure quad-word address to be programmed contains a value different from all 1 before programming, except if the data to write is all 0. This bit is cleared by writing 1.
  - name: WRPERR
    bit_range:
    - 4
    - 4
    description: |-
      Non-secure write protection error
      This bit is set by hardware when a non-secure address to be erased/programmed belongs to a write-protected part (by WRP or HDP) of the Flash memory. This bit is cleared by writing 1.
      Refer to Section7.3.10: Flash memory errors flags for full conditions of error flag setting.
  - name: PGAERR
    bit_range:
    - 5
    - 5
    description: |-
      Non-secure programming alignment error
      This bit is set by hardware when the first word to be programmed is not aligned with a quad-word address, or the second, third or forth word does not belong to the same quad-word address. This bit is cleared by writing 1.
  - name: SIZERR
    bit_range:
    - 6
    - 6
    description: |-
      Non-secure size error
      This bit is set by hardware when the size of the access is a byte or half-word during a non-secure program sequence. Only quad-word programming is allowed by means of successive word accesses. This bit is cleared by writing 1.
  - name: PGSERR
    bit_range:
    - 7
    - 7
    description: |-
      Non-secure programming sequence error
      This bit is set by hardware when programming sequence is not correct. It is cleared by writing 1.
      Refer to Section7.3.10: Flash memory errors flags for full conditions of error flag setting.
  - name: OPTWERR
    bit_range:
    - 13
    - 13
    description: "Option write error \nThis bit is set by hardware when the options bytes are written with an invalid configuration or when modifying options in RDP level 2.. It is cleared by writing 1.\nRefer to Section7.3.10: Flash memory errors flags for full conditions of error flag setting."
  - name: BSY
    bit_range:
    - 16
    - 16
    description: |-
      Non-secure busy
      This indicates that a Flash memory secure or non-secure operation is in progress. This bit is set at the beginning of a Flash operation and reset when the operation finishes or when an error occurs.
  - name: WDW
    bit_range:
    - 17
    - 17
    description: |-
      Non-secure wait data to write
      This bit indicates that the Flash memory write buffer has been written by a secure or non-secure operation. It is set when the first data is stored in the buffer and cleared when the write is performed in the Flash memory.
  - name: OEM1LOCK
    bit_range:
    - 18
    - 18
    description: |-
      OEM1 key RDP lock
      This bit indicates that the OEM1 key read during the OBL is not virgin. When set, the OEM1 key RDP lock mechanism is active.
  - name: OEM2LOCK
    bit_range:
    - 19
    - 19
    description: |-
      OEM2 key RDP lock
      This bit indicates that the OEM2 key read during the OBL is not virgin. When set, the OEM2 key RDP lock mechanism is active.
  - name: PD
    bit_range:
    - 20
    - 20
    description: |-
      Flash in power-down mode
      This bit indicates that the Flash memory is in power-down state. It is reset when Flash is in normal mode or being awaken.
  side_effects: null
- id: FLASH_SECSR
  address_offset: 36
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: EOP
    bit_range:
    - 0
    - 0
    description: |-
      Secure end of operation
      This bit is set by hardware when one or more Flash memory secure operation (program/erase) has been completed successfully. This bit is set only if the secure end of operation interrupts are enabled (EOPIE = 1 in FLASH_SECCR1). This bit is cleared by writing1.
  - name: OPERR
    bit_range:
    - 1
    - 1
    description: |-
      Secure operation error
      This bit is set by hardware when a Flash memory secure operation (program/erase) completes unsuccessfully. This bit is set only if secure error interrupts are enabled (SECERRIE = 1). This bit is cleared by writing 1.
  - name: PROGERR
    bit_range:
    - 3
    - 3
    description: |-
      Secure programming error
      This bit is set by hardware when a secure quad-word address to be programmed contains a value different from all 1 before programming, except if the data to write is all 0. This bit is cleared by writing 1.
  - name: WRPERR
    bit_range:
    - 4
    - 4
    description: |-
      Secure write protection error
      This bit is set by hardware when an secure address to be erased/programmed belongs to a write-protected part (by WRP or HDP) of the Flash memory. This bit is cleared by writing 1.
      Refer to Section7.3.10: Flash memory errors flags for full conditions of error flag setting.
  - name: PGAERR
    bit_range:
    - 5
    - 5
    description: |-
      Secure programming alignment error
      This bit is set by hardware when the first word to be programmed is not aligned with a quad-word address, or the second, third or forth word does not belong to the same quad-word address.This bit is cleared by writing 1.
  - name: SIZERR
    bit_range:
    - 6
    - 6
    description: |-
      Secure size error
      This bit is set by hardware when the size of the access is a byte or half-word during a secure program sequence. Only quad-word programming is allowed by means of successive word accesses.This bit is cleared by writing 1.
  - name: PGSERR
    bit_range:
    - 7
    - 7
    description: |-
      Secure programming sequence error
      This bit is set by hardware when programming sequence is not correct. It is cleared by writing 1.
      Refer to Section7.3.10: Flash memory errors flags for full conditions of error flag setting.
  - name: BSY
    bit_range:
    - 16
    - 16
    description: |-
      Secure busy
      This bit indicates that a Flash memory secure or non-secure operation is in progress. This is set on the beginning of a Flash operation and reset when the operation finishes or when an error occurs.
  - name: WDW
    bit_range:
    - 17
    - 17
    description: |-
      Secure wait data to write
      This bit indicates that the Flash memory write buffer has been written by a secure or non-secure operation. It is set when the first data is stored in the buffer and cleared when the write is performed in the Flash memory.
  side_effects: null
- id: FLASH_NSCR1
  address_offset: 40
  size: 32
  access: READ_WRITE
  reset_value: 3221225472
  fields:
  - name: PG
    bit_range:
    - 0
    - 0
    description: Non-secure programming
  - name: PER
    bit_range:
    - 1
    - 1
    description: Non-secure page erase
  - name: MER
    bit_range:
    - 2
    - 2
    description: |-
      Non-secure Flash mass erase
      This bit triggers the Flash non-secure mass erase (all Flash user pages) when set.
  - name: PNB
    bit_range:
    - 9
    - 3
    description: |-
      Non-secure page number selection
      These bits select the page to erase.
      ...
      Note that bit 9 is reserved on STM32WBA5xEx devices.
  - name: BWR
    bit_range:
    - 14
    - 14
    description: |-
      Non-secure burst write programming mode
      When set, this bit selects the burst write programming mode.
  - name: STRT
    bit_range:
    - 16
    - 16
    description: "Non-secure operation start \nThis bit triggers a non-secure erase operation when set. If MER and PER bits are reset and the STRT bit is set, the PGSERR bit in FLASH_NSSR is set (this condition is forbidden).\nThis bit is set only by software and is cleared when the BSY bit is cleared in FLASH_NSSR."
  - name: OPTSTRT
    bit_range:
    - 17
    - 17
    description: |-
      Options modification start
      This bit triggers an option bytes erase and program operation when set. This bit is write-protected with OPTLOCK.. This bit is set only by software, and is cleared when the BSY bit is cleared in FLASH_NSSR.
  - name: EOPIE
    bit_range:
    - 24
    - 24
    description: |-
      Non-secure end of operation interrupt enable
      This bit enables the interrupt generation when the EOP bit in the FLASH_NSSR is set to 1.
  - name: ERRIE
    bit_range:
    - 25
    - 25
    description: |-
      Non-secure error interrupt enable
      This bit enables the interrupt generation when the OPERR bit in the FLASH_NSSR is set to 1.
  - name: OBL_LAUNCH
    bit_range:
    - 27
    - 27
    description: |-
      Force the option byte loading
      When set to 1, this bit forces the option byte reloading. This bit is cleared only when the option byte loading is complete. This bit is write-protected with OPTLOCK.
      Note: The LSE oscillator must be disabled, LSEON = 0 and LSERDY = 0, before starting OBL_LAUNCH.
  - name: OPTLOCK
    bit_range:
    - 30
    - 30
    description: |-
      Option lock
      This bit is set only. When set, the FLASH_NSCR1.OPTSRT and OBL_LAUNCH bits concerning user options write access is locked. This bit is cleared by hardware after detecting the unlock sequence in FLASH_OPTKEYR. The FLASH_NSCR1.LOCK bit must be cleared before doing the FLASH_OPTKEYR unlock sequence.
      In case of an unsuccessful unlock operation, this bit remains set until the next reset.
  - name: LOCK
    bit_range:
    - 31
    - 31
    description: |-
      Non-secure lock
      This bit is set only.
      When set, the FLASH_NSCR1 register write access is locked. This bit is cleared by hardware after detecting the unlock sequence in FLASH_NSKEYR.
      In case of an unsuccessful unlock operation, this bit remains set until the next system reset.
  side_effects: null
- id: FLASH_SECCR1
  address_offset: 44
  size: 32
  access: READ_WRITE
  reset_value: 2147483648
  fields:
  - name: PG
    bit_range:
    - 0
    - 0
