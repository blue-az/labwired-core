- id: FLASH_NSBOOTADD0R
  address_offset: 68
  size: 32
  access: READ_WRITE
  reset_value: 15
  fields:
  - name: NSBOOTADD0
    bit_range:
    - 31
    - 7
    description: |-
      Non-secure boot base address 0
      This address is only used when TZEN = 0.
      The non-secure boot memory address can be programmed to any address in the valid address range (see Table 28: Boot space versus RDP protection) with a granularity of 128 bytes. These bits correspond to address [31:7]. The NSBOOTADD0 option bytes are selected following the BOOT0 pin or NSWBOOT0 state.
      Examples:
      NSBOOTADD0[24:0] = 0x0100000: Boot from Flash memory (0x0800 0000)
      NSBOOTADD0[24:0] = 0x017F100: Boot from system memory bootloader (0x0BF8 8000)
      NSBOOTADD0[24:0] = 0x0400200: Boot from SRAM2 on S-Bus (0x2001 0000)
  side_effects: null
- id: FLASH_NSBOOTADD1R
  address_offset: 72
  size: 32
  access: READ_WRITE
  reset_value: 15
  fields:
  - name: NSBOOTADD1
    bit_range:
    - 31
    - 7
    description: "Non-secure boot address 1\nThis address is only used when TZEN = 0.\nThe non-secure boot memory address can be programmed to any address in the valid address range (see Table 28: Boot space versus RDP protection) with a granularity of 128 bytes. These bits correspond to address [31:7]. The NSBOOTADD0 option bytes are selected following the BOOT0 pin or NSWBOOT0 state. \nExamples:\nNSBOOTADD1[24:0] = 0x0100000: Boot from Flash memory (0x0800 0000)\nNSBOOTADD1[24:0] = 0x017F100: Boot from system memory bootloader (0x0BF8 8000)\nNSBOOTADD1[24:0] = 0x0400200: Boot from SRAM2 (0x2001 0000)"
  side_effects: null
- id: FLASH_SECBOOTADD0R
  address_offset: 76
  size: 32
  access: READ_WRITE
  reset_value: 0
  fields:
  - name: BOOT_LOCK
    bit_range:
    - 0
    - 0
    description: |-
      Boot lock
      This lock is only used when TZEN = 0.
      When set, the boot is always forced to base address value programmed in SECBOOTADD0[24:0] option bytes whatever the boot selection option. When set, this bit can only be cleared by an RDP regression level 1 to level 0.
  - name: SECBOOTADD0
    bit_range:
    - 31
    - 7
    description: "Secure boot base address 0\nThis address is only used when TZEN = 1.\nThe secure boot memory address can be programmed to any address in the valid address range (see Table28: Boot space versus RDP protection) with a granularity of 128 bytes. This bits correspond to address [31:7] The SECBOOTADD0 option bytes are selected following the BOOT0 pin or NSWBOOT0 state. \nExamples:\nSECBOOTADD0[24:0] = 0x018 0000: Boot from secure user Flash memory (0x0C00 0000)\nSECBOOTADD0[24:0] = 0x01F F000: Boot from RSS system Flash memory (0x0FF8 0000)\nSECBOOTADD0[24:0] = 0x060 0000: Boot from secure SRAM1 on S-Bus (0x3000 0000)"
  side_effects: null
