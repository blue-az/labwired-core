- id: IFTIMING_RXDELAY
  address_offset: 1452
  size: 32
  access: READ_WRITE
  reset_value: 2
  fields:
  - name: RXDELAY
    bit_range:
    - 2
    - 0
    description: Sample delay for input serial data on SDI. The value specifies the number of SPIM core clock cycles delay from the the sampling edge of SCK (leading edge for CONFIG.CPHA = 0, trailing edge for CONFIG.CPHA = 1) until the input serial data is sampled. As en example, if RXDELAY = 0 and CONFIG.CPHA = 0, the input serial data is sampled on the rising edge of SCK.
