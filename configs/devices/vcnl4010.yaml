# Vishay VCNL4010 proximity + ambient-light sensor — declarative I²C
# register-pointer device.
#
# The master writes a 1-byte register pointer, then reads/writes the register.
# The VCNL4010's pointers live at 0x80..0x8F (the full byte is decoded, so the
# default `pointer_mask: 0xFF` is correct — this part does NOT alias like the
# TMP102's two-bit pointer). Datasheet (VCNL4010, Vishay, rev 1.6) map:
#
#   0x80      COMMAND         measurement enable / data-ready flags
#   0x81      PRODUCT_ID      product 0x2 : revision 0x1
#   0x82      PROX_RATE       proximity measurement rate                (rw)
#   0x83      IR_LED_CURRENT  IR LED drive, 10 mA per LSB               (rw)
#   0x84      AMBI_PARAM      ambient averaging / auto-offset / rate    (rw)
#   0x85,0x86 AMBI_DATA       ambient result, 16-bit BIG-endian         (r)
#   0x87,0x88 PROX_DATA       proximity result, 16-bit BIG-endian       (r)
#   0x89      INT_CONTROL     interrupt config                          (rw)
#   0x8A,0x8B LOW_THRESHOLD   interrupt low threshold                   (rw)
#   0x8C,0x8D HIGH_THRESHOLD  interrupt high threshold                  (rw)
#   0x8E      INT_STATUS      interrupt flags, write-1-to-clear         (rw)
#   0x8F      MOD_TIMING      proximity modulator timing adjustment     (rw)
#
# ── Why COMMAND is read-only with both ready bits latched ──────────────────
#
# `Adafruit_VCNL4010::readProximity()` sets the measure bit and then spins:
#
#     write8(COMMAND, 0x08);
#     while (1) { if (read8(COMMAND) & 0x20) return read16(PROX_DATA); delay(1); }
#
# There is no timeout and no error path. Modelled as plain `rw` storage the
# register would echo back the written 0x08, `prox_data_rdy` would never
# appear, and the firmware would hang inside vendor library code — which the
# simulator can only report as a step-budget exhaustion somewhere in the
# driver, indistinguishable from a genuine infinite loop in the user's own
# sketch. So COMMAND is `access: r` and reads 0xE0:
#
#     0x80 config_lock  — read-only on real silicon, reads 1
#     0x40 als_data_rdy — an ambient result is available
#     0x20 prox_data_rdy— a proximity result is available
#
# The enable bits written by firmware are absorbed and ignored (`access: r`),
# so the model says "a measurement is always ready". That is a deliberate
# simplification of conversion TIMING, not of the data path: the value read is
# whatever the `proximity` / `ambient` input channels currently hold. Optical
# distance response and conversion latency are out of scope — this part exists
# to inject representative proximity-count sequences deterministically.
#
# Both result registers are raw counts (0..65535) taken straight from their
# input channel with no scaling, because the count IS the datasheet's unit —
# the mapping from counts to millimetres depends on the reflector and is not
# something a simulator can invent.
#
# Address 0x13 is FIXED on the VCNL4010 — there are no strap pins. Several of
# them on one bus therefore require a TCA9548A bus switch, one per channel;
# see `configs/devices` siblings and `peripherals/components/tca9548a.rs`.
type: vcnl4010

behavior:
  primitive: i2c_device
  i2c:
    default_address: 0x13
    registers:
      # Command: enables are absorbed, both data-ready flags always read set.
      - { name: COMMAND, addr: 0x80, width: 1, endian: be, access: r, reset: 0xE0 }
      # Product 0x2, revision 0x1. Adafruit's begin() rejects the part unless
      # (id & 0xF0) == 0x20, so this value is load-bearing for enumeration.
      - { name: PRODUCT_ID, addr: 0x81, width: 1, endian: be, access: r, reset: 0x21 }
      # Configuration storage — echoed back exactly as firmware wrote it.
      - { name: PROX_RATE, addr: 0x82, width: 1, endian: be, access: rw, reset: 0x00 }
      - { name: IR_LED_CURRENT, addr: 0x83, width: 1, endian: be, access: rw, reset: 0x00 }
      - { name: AMBI_PARAM, addr: 0x84, width: 1, endian: be, access: rw, reset: 0x00 }
      # Ambient result: raw count, big-endian, driven by the `ambient` channel.
      - { name: AMBI_DATA, addr: 0x85, width: 2, endian: be, access: r, source: ambient }
      # Proximity result: raw count, big-endian, driven by the `proximity`
      # channel. This is the register Ryan-style bay-occupancy firmware polls.
      - { name: PROX_DATA, addr: 0x87, width: 2, endian: be, access: r, source: proximity }
      - { name: INT_CONTROL, addr: 0x89, width: 1, endian: be, access: rw, reset: 0x00 }
      - { name: LOW_THRESHOLD, addr: 0x8A, width: 2, endian: be, access: rw, reset: 0x0000 }
      - { name: HIGH_THRESHOLD, addr: 0x8C, width: 2, endian: be, access: rw, reset: 0x0000 }
      # Interrupt status: rw because the driver read-modify-writes it to clear.
      - { name: INT_STATUS, addr: 0x8E, width: 1, endian: be, access: rw, reset: 0x00 }
      # Modulator timing: 0x81 = 390.625 kHz, delay 0, dead time 1.
      - { name: MOD_TIMING, addr: 0x8F, width: 1, endian: be, access: rw, reset: 0x81 }

metadata:
  label: "Vishay VCNL4010 Proximity"
  summary: "Proximity + ambient-light sensor over I2C (fixed address 0x13)."
  detail: "Vishay VCNL4010 at its fixed address 0x13, a register-pointer device with 16-bit big-endian result words. Reports raw proximity and ambient counts driven by the `proximity` and `ambient` input channels; counts-to-distance depends on the reflector and is deliberately not modelled. Both data-ready flags read set, so a driver's ready-poll always terminates. Because the address is fixed, several VCNL4010s on one bus need a TCA9548A switch — one sensor per channel."
  category: i2c
  config_keys:
    - name: i2c_address
      ty: int
      doc: "7-bit slave address. Defaults to the VCNL4010 fixed address 0x13."
    - name: proximity
      ty: float
      doc: "Initial proximity count. Default 2000 (nothing in front of the sensor). Drive it at runtime with the `proximity` input channel."
    - name: ambient
      ty: float
      doc: "Initial ambient-light count. Default 1000. Drive it at runtime with the `ambient` input channel."
  inputs:
    - { key: proximity, label: "Proximity", unit: counts, min: 0, max: 65535, default: 2000 }
    - { key: ambient, label: "Ambient", unit: counts, min: 0, max: 65535, default: 1000 }
